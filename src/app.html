<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
		/>
		<script>
			// Apply saved settings before first paint so there is no theme flash.
			(function () {
				try {
					var root = document.documentElement;
					var pref = localStorage.getItem('folio:theme') || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					root.dataset.theme = dark ? 'dark' : 'light';
					if (localStorage.getItem('folio:grid') === 'off') root.dataset.grid = 'off';
					var scale = parseFloat(localStorage.getItem('folio:text-scale') || '1');
					if (scale) root.style.setProperty('--text-scale', String(scale));
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
