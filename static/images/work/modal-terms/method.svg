<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f7f4"/><line x1="266" y1="0" x2="266" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="532" y1="0" x2="532" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="798" y1="0" x2="798" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="1064" y1="0" x2="1064" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="1330" y1="0" x2="1330" y2="1000" stroke="#00000008" stroke-width="1.5"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">FAZZ · EXPERIENCE TEAM · TERMS OF MODAL · METHOD</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">01</text><rect x="58" y="98" width="360" height="66" fill="#1d3f80"/><text x="70" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="50" font-weight="900" fill="#ffffff" text-anchor="start" font-style="italic" textLength="334" lengthAdjust="spacingAndGlyphs">Survey setup</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">Standardise Modal’s terms around the words users already understand.</text><rect x="0" y="990" width="1600" height="10" fill="#3b82d6"/><rect x="64" y="236" width="470" height="330" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">BACKGROUND</text><text x="96" y="324" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Modal’s screens mixed finance jargon —</text><text x="96" y="351" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Tenor, Sisa Plafon — that agents don’t</text><text x="96" y="378" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">use. We wanted one vocabulary, chosen by</text><text x="96" y="405" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">users, for every stakeholder.</text><rect x="560" y="236" width="470" height="330" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="592" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">METHOD &amp; TARGET</text><text x="592" y="324" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Quantitative survey sent as an in-app</text><text x="592" y="351" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">notification in Payfazz, with help from</text><text x="592" y="378" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">marketing. Target: all active PMA users of</text><text x="592" y="405" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Modal Agen, including Modal as payment on</text><text x="592" y="432" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Grosir.</text><rect x="1056" y="236" width="480" height="330" rx="18" fill="#1d3f80"/><text x="1088" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#f2c400" text-anchor="start" letter-spacing="1.4">RESPONSES</text><path d="M1206 320A100 100 0 1 1 1180.5 323.3L1190.7 362A60 60 0 1 0 1206 360Z" fill="#f2c400"/><path d="M1180.5 323.3A100 100 0 0 1 1206 320L1206 360A60 60 0 0 0 1190.7 362Z" fill="#ffffff44"/><text x="1206" y="430" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="40" font-weight="900" fill="#1d1b18" text-anchor="middle">816</text><text x="1206" y="450" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle">valid</text><text x="1340" y="400" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="start">851</text><text x="1340" y="428" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#cfdcf2" text-anchor="start">responses</text><text x="1340" y="480" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="900" fill="#f2c400" text-anchor="start">95.9%</text><text x="1340" y="506" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#cfdcf2" text-anchor="start">had used Modal</text><rect x="64" y="592" width="1472" height="340" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="96" y="636" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">TIMELINE · OCTOBER W4 → NOVEMBER W1, 2022</text><text x="384" y="676" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#6f6a60" text-anchor="start">Oct 26</text><line x1="380" y1="686" x2="380" y2="900" stroke="#dcdfe6" stroke-width="1"/><text x="472" y="676" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-