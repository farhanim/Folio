ders</text><text x="1160" y="406" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">same-day, within 3 days</text><text x="1160" y="440" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">Rp 250K average order</text><text x="1160" y="474" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">Word spread to 30</text><text x="1160" y="508" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">existing retailers</text><rect x="1136" y="600" width="400" height="330" rx="18" fill="#ffffff" stroke="#1d1b18" stroke-width="2.5"/><rect x="1136" y="600" width="400" height="70" rx="18" fill="#ffd23f"/><rect x="1136" y="650" width="400" height="20" fill="#ffd23f"/><text x="1160" y="646" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="900" fill="#1d1b18" text-anchor="start">Onboarded Mon, 2 Mar</text><text x="1160" y="730" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="40" font-weight="900" fill="#1d1b18" text-anchor="start">3 orders</text><text x="1160" y="776" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">within half a shift</text><text x="1160" y="810" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">Rp 250K average order</text><text x="1160" y="844" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="start">110 retailers within 2 km</text><text x="1160" y="878" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#