"'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1b18" text-anchor="start">from a store they know</text><rect x="64" y="720" width="1040" height="210" rx="18" fill="#dce6f2" stroke="#1d1b18" stroke-width="2"/><circle cx="130" cy="826" r="40" fill="#1f4e8c"/><text x="130" y="846" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">!</text><text x="196" y="780" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Challenges to fix</text><text x="196" y="826" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Price fitness for medium-size retailers</text><text x="196" y="862" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">A special order for the delivery line, so small retailers</text><text x="196" y="890" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">don’t queue behind big orders</text></svg>