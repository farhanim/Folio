<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f6f2"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">WARUNG PINTAR · GROSIR PINTAR</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">01</text><rect x="58" y="96" width="232.4" height="66" fill="#ffd23f"/><text x="64" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start" textLength="218.4" lengthAdjust="spacingAndGlyphs">Current</text><text x="306.4" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start">condition</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">Retailers restock from wholesalers they trust — and they choose on price first.</text><rect x="64" y="236" width="360" height="210" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="92" y="282" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Small retailer</text><text x="92" y="310" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Warung, most frequent</text><text x="92" y="354" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Resupply</text><text x="396" y="354" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="end">up to 3× daily</text><text x="92" y="388" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Order value</text><text x="396" y="388" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="end">Rp 150K</text><text x="92" y="422" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Monthly GMV</text><text x="396" y="422" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="end">Rp 12 jt</text><rect x="64" y="466" width="360" height="210" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="92" y="512" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Medium retailer</text><text x="92" y="540" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Early adopters</text><text x="92" y="584" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Resupply</text><text x="396" y="584" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="end">up to 4× weekly</text><text x="92" y="618" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Order value</text><text x="396" y="618" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="end">Rp 2 jt</text><text x="92" y="652" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">Monthly GMV</text><text x="396" y="652" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="end">Rp 32 jt</text><line x1="432" y1="456" x2="488" y2="456" stroke="#1d1b18" stroke-width="4" stroke-linecap="round"/><path d="M484 447L500 456L484 465Z" fill="#1d1b18"/><rect x="510" y="236" width="440" height="440" rx="18" fill="#1d1b18"/><text x="538" y="282" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#ffd23f" text-anchor="start">Wholesaler</text><text x="538" y="310" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Their “downline” of retailers</text><text x="538" y="354" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Monthly GMV</text><text x="922" y="354" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">Rp 200 jt – 1.5 M</text><text x="538" y="388" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Retailers</text><text x="922" y="388" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">25 – 200</text><text x="538" y="422" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Repeat rate</text><text x="922" y="422" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">up to 80%</text><text x="538" y="456" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Margin · cigarettes</text><text x="922" y="456" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">0.3–0.5%</text><text x="538" y="490" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Margin · FMCG</text><text x="922" y="490" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">1–3%</text><text x="538" y="524" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Margin · sembako</text><text x="922" y="524" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">8–12%</text><text x="538" y="558" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Cash cycle</text><text x="922" y="558" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">3–5 days</text><text x="538" y="592" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#a8a296" text-anchor="start">Open</text><text x="922" y="592" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">05.00–12.30 · 17–22</text><rect x="980" y="236" width="556" height="440" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="1008" y="278" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.3">SUPPLY SOURCE · DECIDING FACTORS</text><text x="1210" y="321" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Price competitiveness</text><rect x="1222" y="306" width="280" height="22" rx="4" fill="#ffd23f" stroke="#1d1b18" stroke-width="1.5"/><text x="1510" y="323" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">50</text><text x="1210" y="361" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Variance</text><rect x="1222" y="346" width="207.2" height="22" rx="4" fill="#ffd23f" stroke="#1d1b18" stroke-width="1.5"/><text x="1437.2" y="363" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">37</text><text x="1210" y="401" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Instant delivery / stop &amp; go</text><rect x="1222" y="386" width="173.6" height="22" rx="4" fill="#1f4e8c" stroke="#1d1b18" stroke-width="1.5"/><text x="1403.6" y="403" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">31</text><text x="1210" y="441" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Relationship</text><rect x="1222" y="426" width="39.2" height="22" rx="4" fill="#17a2c4" stroke="#1d1b18" stroke-width="1.5"/><text x="1269.2" y="443" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">7</text><text x="1210" y="481" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">WhatsApp ordering</text><rect x="1222" y="466" width="39.2" height="22" rx="4" fill="#e56be0" stroke="#1d1b18" stroke-width="1.5"/><text x="1269.2" y="483" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">7</text><text x="1210" y="521" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Pay later</text><rect x="1222" y="506" width="33.6" height="22" rx="4" fill="#e89a9a" stroke="#1d1b18" stroke-width="1.5"/><text x="1263.6" y="523" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">6</text><text x="1210" y="561" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Loyalty program</text><rect x="1222" y="546" width="28" height="22" rx="4" fill="#e0442b" stroke="#1d1b18" stroke-width="1.5"/><text x="1258" y="563" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">5</text><text x="1210" y="601" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Open hours</text><rect x="1222" y="586" width="16.8" height="22" rx="4" fill="#6b1d10" stroke="#1d1b18" stroke-width="1.5"/><text x="1246.8" y="603" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">3</text><text x="1210" y="641" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1d1b18" text-anchor="end">Nice service</text><rect x="1222" y="626" width="11.2" height="22" rx="4" fill="#1d1b18" stroke="#1d1b18" stroke-width="1.5"/><text x="1241.2" y="643" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start">2</text><rect x="64" y="700" width="1472" height="230" rx="18" fill="#ffd23f"/><text x="100" y="748" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start" letter-spacing="1.4">GAP FOR US TO SOLVE</text><text x="100" y="796" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">Retailers need a one-stop shop with same-day</text><text x="100" y="825" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">delivery down to their alley — the deciding factor</text><text x="100" y="854" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">after price.</text><line x1="700" y1="820" x2="880" y2="820" stroke="#1d1b18" stroke-width="3" stroke-dasharray="10 10"/><circle cx="700" cy="820" r="8" fill="#1d1b18"/><circle cx="880" cy="820" r="8" fill="#1d1b18"/><text x="920" y="796" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">Small wholesalers have no logistics, so their market</text><text x="920" y="825" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">stops where their customers can ride to.</text><text x="100" y="904" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">Interviews: 60 retailers (10% of the two densest areas in Surabaya) · 21 wholesalers (2% of the city’s wholesalers)</text></svg>