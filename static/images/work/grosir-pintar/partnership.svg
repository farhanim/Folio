<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f6f2"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">WARUNG PINTAR · GROSIR PINTAR</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">05</text><rect x="58" y="96" width="263.6" height="66" fill="#ffd23f"/><text x="64" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start" textLength="249.6" lengthAdjust="spacingAndGlyphs">Logistic</text><text x="337.6" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start">partnership</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">Wholesalers keep their customers; Warung Pintar restocks them and delivers for them.</text><line x1="160" y1="570" x2="290" y2="400" stroke="#1d1b18" stroke-width="4"/><rect x="83.4" y="467" width="143.2" height="30" rx="4" fill="#ffd23f"/><text x="155" y="488" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">Order as usual</text><line x1="370" y1="400" x2="500" y2="570" stroke="#1d1b18" stroke-width="4"/><rect x="454.2" y="467" width="81.6" height="30" rx="4" fill="#ffd23f"/><text x="495" y="488" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">Restock</text><line x1="204" y1="640" x2="456" y2="640" stroke="#1d1b18" stroke-width="4"/><rect x="201.2" y="684" width="257.6" height="30" rx="4" fill="#ffd23f"/