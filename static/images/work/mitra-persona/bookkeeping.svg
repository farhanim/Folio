ll="#1d1b18" text-anchor="middle">✓</text><text x="130" y="710" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Wants simple, guided steps</text><text x="510" y="308" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d1b18" text-anchor="end">Paper book</text><rect x="560" y="228" width="476" height="520" rx="20" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><rect x="560" y="228" width="476" height="150" rx="20" fill="#ffd23f"/><rect x="560" y="348" width="476" height="30" fill="#ffd23f"/><clipPath id="av11"><circle cx="646" cy="378" r="60"/></clipPath><circle cx="646" cy="378" r="60" fill="#ffffff"/><g clip-path="url(#av11)"><ellipse cx="646" cy="435" rx="43.2" ry="33" fill="#3d7be0"/><rect x="638.8" y="384" width="14.4" height="18" fill="#a8704a"/><circle cx="646" cy="370.8" r="20.4" fill="#a8704a"/><path d="M624.4 373.2Q623.2 346.8 646 348Q668.8 346.8 667.6 372Q652 358.8 624.4 373.2Z" fill="#1d1b18"/><path d="M623.2 364.8Q646 334.8 668.8 364.8Z" fill="#e05a47"/><rect x="646" y="362.4" width="30" height="4.8" rx="3" fill="#e05a47"/></g><text x="590" y="478" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" font-weight="800" fill="#1d1b18" text-anchor="start">The Overconfident Manager</text><text x="590" y="518" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start" font-style="italic">“It’s all in my head — I only write down</text><text x="590" y="545" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start" font-style="italic">who owes me.”</text><rect x="590" y="608" width="22" height="22" rx="6" fill="#ffd23f"/><text x="601" y="625" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">✓</text><text x="626" y="626" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Relies on memory for daily sales</text><rect x="590" y="650" width="22" height="22" rx="6" fill="#ffd23f"/><text x="601" y="667" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">✓</text><text x="626" y="668" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Debt is the one thing recorded</text><rect x="590" y="692" width="22" height="22" rx="6" fill="#ffd23f"/><text x="601" y="709" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">✓</text><text x="626" y="710" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Sees little value in logging every sale</text><text x="1006" y="308" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d1b18" text-anchor="end">Debt only</text><rect x="1056" y="228" width="476" height="520" rx="20" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><rect x="1056" y="228" width="476" height="150" rx="20" fill="#1d1b18"/><rect x="1056" y="348" width="476" height="30" fill="#1d1b18"/><clipPath id="av12"><circle cx="1142" cy="378" r="60"/></clipPath><circle cx="1142" cy="378" r="60" fill="#ffffff"/><g clip-path="url(#av12)"><ellipse cx="1142" cy="435" rx="43.2" ry="33" fill="#e05a47"/><rect x="1134.8" y="384" width="14.4" height="18" fill="#e0ac85"/><circle cx="1142" cy="370.8" r="20.4" fill="#e0ac85"/><path d="M1120.4 373.2Q1119.2 346.8 1142 348Q1164.8 346.8 1163.6 372Q1148 358.8 1120.4 373.2Z" fill="#1d1b18"/></g><text x="1086" y="478" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="27" font-weight="800" fill="#1d1b18" text-anchor="start">The Commander</text><text x="1086" y="518" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start" font-style="italic">“My helpers run the counter. I need to</text><text x="1086" y="545" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start" font-style="italic">see what happened today.”</text><rect x="1086" y="608" width="22" height="22" rx="6" fill="#ffd23f"/><text x="1097" y="625" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">✓</text><text x="1122" y="626" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Runs the shop through helpers</text><rect x="1086" y="650" width="22" height="22" rx="6" fill="#ffd23f"/><text x="1097" y="667" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">✓</text><text x="1122" y="668" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Needs records others can fill in</text><rect x="1086" y="692" width="22" height="22" rx="6" fill="#ffd23f"/><text x="1097" y="709" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d1b18" text-anchor="middle">✓</text><text x="1122" y="710" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Wants an end-of-day recap</text><text x="1502" y="308" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffd23f" text-anchor="end">Team books</text><rect x="64" y="772" width="1472" height="160" rx="20" fill="#1d1b18"/><text x="96" y="812" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffd23f" text-anchor="start" letter-spacing="1.5">KEY INSIGHTS</text><text x="96" y="856" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffd23f" text-anchor="start">01</text><text x="146" y="846" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">Debt is the one thing everyone records —</text><text x="146" y="871" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">unpaid debt is a loss.</text><text x="582" y="856" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffd23f" text-anchor="start">02</text><text x="632" y="846" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">Paper wins: a phone is personal, and</text><text x="632" y="871" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">helpers can’t share it.</text><text x="1068" y="856" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffd23f" text-anchor="start">03</text><text x="1118" y="846" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">Logging every sale only feels worth it</text><text x="1118" y="871" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">with an end-of-day recap.</text></svg>