-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d1b18" text-anchor="middle">Start</text><line x1="554" y1="300" x2="554" y2="900" stroke="#ddd8cc" stroke-width="1.5" stroke-dasharray="3 8"/><path d="M792 228H1022L1038 256L1022 284H792L808 256Z" fill="#6f6a60"/><text x="915" y="263" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Learn</text><line x1="800" y1="300" x2="800" y2="900" stroke="#ddd8cc" stroke-width="1.5" stroke-dasharray="3 8"/><path d="M1038 228H1268L1284 256L1268 284H1038L1054 256Z" fill="#3a3732"/><text x="1161" y="263" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Reflect</text><line x1="1046" y1="300" x2="1046" y2="900" stroke="#ddd8cc" stroke-width="1.5" stroke-dasharray="3 8"/><path d="M1284 228H1514L1530 256L1514 284H1284L1300 256Z" fill="#1d1b18"/><text x="1407" y="263" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Implement</text><line x1="1292" y1="300" x2="1292" y2="900" stroke="#ddd8cc" stroke-width="1.5" stroke-dasharray="3 8"/><rect x="64" y="316" width="1472" height="132" rx="14" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.2"/><clipPath id="av6"><circle cx="116" cy="382" r="40"/></clipPath><circle cx="116" cy="382" r="40" fill="#f3f0e8"/><g clip-path="url(#av6)"><ellipse cx="116" cy="420" rx="28.8" ry="22" fill="#3a3732"/><rect x="111.2" y="386" width="9.6" height="12" fill="#8d5a3b"/><circle cx="116" cy="377.2" r="13.6" fill="#8d5a3b"/><path d="M101.6 378.8Q100.8 361.2 116 362Q131.2 361.2 130.4 378Q120 369.2 101.6 378.8Z" fill="#a8a296"/></g><text x="170" y="390" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">The Sustainer</text><line x1="330" y1="382" x2="423" y2="382" stroke="#f2b400" stroke-width="4" stroke-linecap="round"/><circle cx="423" cy="382" r="16" fill="#e05a47" stroke="#ffffff" stroke-width="4"/><text x="423" y="388" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><text x="459" y="368" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Content with how things are — doesn’t see why learning would help the</text><text x="459" y="392" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">shop.</text><rect x="459" y="400" width="235" height="31" rx="15.5" fill="#ffd23f"/><text x="576.5" y="419" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1b18" text-anchor="middle">→ Design for motivation</text><rect x="64" y="466" width="1472" height="132" rx="14" fill="#fbfaf7" stroke="#ddd8cc" stroke-width="1.2"/><clipPath id="av7"><circle cx="116" cy="532" r="40"/></clipPath><circle cx="116" cy="532" r="40" fill="#ffffff"/><g clip-path="url(#av7)"><ellipse cx="116" cy="570" rx="28.8" ry="22" fill="#3d7be0"/><rect x="111.2" y="536" width="9.6" height="12" fill="#c98d63"/><circle cx="116" cy="527.2" r="13.6" fill="#c98d63"/><path d="M99.2 544Q96 507.2 116 508Q136 507.2 132.8 544L128 548.8Q116 540 104 548.8Z" fill="#1d1b18"/><circle cx="116" cy="528.8" r="10" fill="#c98d63"/></g><text x="170" y="540" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">The Busy Bee</text><line x1="330" y1="532" x2="669" y2="532" stroke="#f2b400" stroke-width="4" stroke-linecap="round"/><circle cx="669" cy="532" r="16" fill="#e05a47" stroke="#ffffff" stroke-width="4"/><text x="669" y="538" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><text x="705" y="518" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">No time to begin; learning loses to serving the next customer.</text><rect x="705" y="550" width="307" height="31" rx="15.5" fill="#ffd23f"/><text x="858.5" y="569" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1d1b18" text-anchor="middle">→ Design for habit &amp; stickiness</text><rect x="64" y="616" width="1472" height="132" rx="14" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.2"/><clipPath id="av8"><circle cx="116" cy="682" r="40"/></clipPath><circle cx="116" cy="682" r="40" fill="#ffd23f"/><g clip-path="url(#av8)"><ellipse cx="116" cy="720" rx="28.8" ry="22" fill="#e05a47"/><rect x="111.2" y="686" width="9.6" height="12" fill="#e0ac85"/><circle cx="116" cy="677.2" r="13.6" fill="#e0ac85"/><path d="M99.2 694Q96 657.2 116 658Q136 657.2 132.8 694L128 698.8Q116 690 104 698.8Z" fill="#3a3732"/><circle cx="116" cy="678.8" r="10" fill="#e0ac85"/></g><text x="170" y="690" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#1d1b18" text-anchor="start">The Diva</text><line x1="330" y1="682" x2="915" y2="682" stroke="#f2b400" stroke-width="4" stroke-linecap="round"/><circle cx="915" cy="682" r="16" fill="#e05a47" stroke="#ffffff" stroke-width="4"/><text x="915" y="688" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">!</text><text x="951" y="668" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Can’t find content that matches her specific goal.</text><rect x="951" y="700" width="226" height="31" rx="15.5" fill="#ffd23f"/><text x="1064" y="719" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#