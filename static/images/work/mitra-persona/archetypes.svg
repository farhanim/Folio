 fill="#f3f0e8"/><text x="221" y="520" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Semi-wholesaler</text><rect x="599" y="240" width="470" height="320" rx="18" fill="#1d1b18"/><clipPath id="av14"><circle cx="665" cy="308" r="40"/></clipPath><circle cx="665" cy="308" r="40" fill="#3a3732"/><g clip-path="url(#av14)"><ellipse cx="665" cy="346" rx="28.8" ry="22" fill="#2f9e6b"/><rect x="660.2" y="312" width="9.6" height="12" fill="#a8704a"/><circle cx="665" cy="303.2" r="13.6" fill="#a8704a"/><path d="M650.6 304.8Q649.8 287.2 665 288Q680.2 287.2 679.4 304Q669 295.2 650.6 304.8Z" fill="#1d1b18"/><path d="M649.8 299.2Q665 279.2 680.2 299.2Z" fill="#f2b400"/><rect x="665" y="297.6" width="20" height="3.2" rx="3" fill="#f2b400"/></g><text x="721" y="318" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="start">Nimble Old Player</text><text x="629" y="390" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ddd8cc" text-anchor="start">Experienced and established. Adopts tools</text><text x="629" y="415" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#ddd8cc" text-anchor="start">that clearly pay off.</text><rect x="629" y="462" width="103.6" height="30" rx="15" fill="#3a3732"/><text x="680.8" y="480" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">App-savvy</text><rect x="742.6" y="462" width="145.6" height="30" rx="15" fill="#3a3732"/><text x="815.4" y="480" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Grosir visitor</text><rect x="629" y="502" width="154" height="30" rx="15" fill="#3a3732"/><text x="706" y="520" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Semi-wholesaler</text><rect x="793" y="502" width="154" height="30" rx="15" fill="#3a3732"/><text x="870" y="520" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Price-sensitive</text><rect x="114" y="580" width="470" height="320" rx="18" fill="#f3f0e8"/><clipPath id="av15"><circle cx="180" cy="648" r="40"/></clipPath><circle cx="180" cy="648" r="40" fill="#ffffff"/><g clip-path="url(#av15)"><ellipse cx="180" cy="686" rx="28.8" ry="22" fill="#e05a47"/><rect x="175.2" y="652" width="9.6" height="12" fill="#e0ac85"/><circle cx="180" cy="643.2" r="13.6" fill="#e0ac85"/><path d="M163.2 660Q160 623.2 180 624Q200 623.2 196.8 660L192 664.8Q180 656 168 664.8Z" fill="#1d1b18"/><circle cx="180" cy="644.8" r="10" fill="#e0ac85"/></g><text x="236" y="658" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="800" fill="#1d1b18" text-anchor="start">Struggle Survivalist</text><text x="144" y="730" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Low revenue, new to the trade. Every</text><text x="144" y="755" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">rupiah counts.</text><rect x="144" y="802" width="154" height="30" rx="15" fill="#ffffff"/><text x="221" y="820" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Price-sensitive</text><rect x="308" y="802" width="128.8" height="30" rx="15" fill="#ffffff"/><text x="372.4" y="820" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Shops around</text><rect x="144" y="842" width="162.4" height="30" rx="15" fill="#ffffff"/><text x="225.2" y="860" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Social butterfly</text><rect x="599" y="580" width="470" height="320" rx="18" fill="#ffd23f"/><clipPath id="av16"><circle cx="665" cy="648" r="40"/></clipPath><circle cx="665" cy="648" r="40" fill="#ffffff"/><g clip-path="url(#av16)"><ellipse cx="665" cy="686" rx="28.8" ry="22" fill="#3a3732"/><rect x="660.2" y="652" width="9.6" height="12" fill="#8d5a3b"/><circle cx="665" cy="643.2" r="13.6" fill="#8d5a3b"/><path d="M648.2 660Q645 623.2 665 624Q685 623.2 681.8 660L677 664.8Q665 656 653 664.8Z" fill="#1d1b18"/><circle cx="665" cy="644.8" r="10" fill="#8d5a3b"/></g><text x="721" y="658" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="800" fill="#1d1b18" text-anchor="start">Slow Bloomer Retailer</text><text x="629" y="730" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Experienced, steady and careful. Grows</text><text x="629" y="755" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">slowly but loyally.</text><rect x="629" y="802" width="145.6" height="30" rx="15" fill="#ffffff"/><text x="701.8" y="820" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Grosir visitor</text><rect x="784.6" y="802" width="154" height="30" rx="15" fill="#ffffff"/><text x="861.6" y="820" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Price-sensitive</text><rect x="629" y="842" width="179.2" height="30" rx="15" fill="#ffffff"/><text x="718.6" y="860" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="middle">Loyal to suppliers</text><rect x="1110" y="230" width="426" height="400" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="1140" y="276" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#6f6a60" text-anchor="start" letter-spacing="1.5">WHO THEY REALLY WERE</text><text x="1140" y="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1b18" text-anchor="start">Semi-wholesalers</text><text x="1506" y="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="800" fill="#1d1b18" text-anchor="end">20 / 31</text><rect x="1140" y="346" width="366" height="18" rx="9" fill="#f3f0e8"/><rect x="1140" y="346" width="236.1" height="18" rx="9" fill="#1d1b18"/><text x="1140" y="422" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1b18" text-anchor="start">Retailers</text><text x="1506" y="422" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="800" fill="#1d1b18" text-anchor="end">9 / 31</text><rect x="1140" y="438" width="366" height="18" rx="9" fill="#f3f0e8"/><rect x="1140" y="438" width="106.3" height="18" rx="9" fill="#f2b400"/><text x="1140" y="514" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="600" fill="#1d1b18" text-anchor="start">Traders</text><text x="1506" y="514" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="800" fill="#1d1b18" text-anchor="end">2 / 31</text><rect x="1140" y="530" width="366" height="18" rx="9" fill="#f3f0e8"/><rect x="1140" y="530" width="23.6" height="18" rx="9" fill="#a8a296"/><text x="1140" y="600" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#6f6a60" text-anchor="start">We expected big retailers. Most were</text><text x="1140" y="620" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#6f6a60" text-anchor="start">selling to other warung.</text><rect x="1110" y="650" width="426" height="260" rx="18" fill="#ffd23f"/><text x="1140" y="740" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="64" font-weight="800" fill="#1d1b18" text-anchor="start">&lt; 20%</text><text x="1140" y="784" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">of their stock budget was spent with</text><text x="1140" y="809" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">Warung Pintar — far more GMV potential</text><text x="1140" y="834" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="#3a3732" text-anchor="start">than we assumed.</text></svg>