s','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="start">relevant answers</text><text x="1210" y="426" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#cfd8ff" text-anchor="start">rated 1–4, with an open answer</text><rect x="64" y="520" width="700" height="420" rx="16" fill="#ffffff" stroke="#dde1ea" stroke-width="1.5"/><text x="96" y="564" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6b6f80" text-anchor="start" letter-spacing="1.4">TIMELINE · 2023</text><text x="96" y="618" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Preparation</text><text x="732" y="618" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f2547" text-anchor="end">Jan 31 – Feb 1</text><line x1="96" y1="640" x2="732" y2="640" stroke="#dde1ea" stroke-width="1.5"/><text x="96" y="682" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Survey script &amp; data request</text><text x="732" y="682" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f2547" text-anchor="end">Feb 1 – 3</text><line x1="96" y1="704" x2="732" y2="704" stroke="#dde1ea" stroke-width="1.5"/><text x="96" y="746" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Survey distribution</text><text x="732" y="746" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f2547" text-anchor="end">Feb 5</text><line x1="96" y1="768" x2="732" y2="768" stroke="#dde1ea" stroke-width="1.5"/><text x="96" y="810" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Data analysis</text><text x="732" y="810" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f2547" text-anchor="end">Feb 6 – 20</text><line x1="96" y1="832" x2="732" y2="832" stroke="#dde1ea" stroke-width="1.5"/><text x="96" y="874" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Reporting</text><text x="732" y="874" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f2547" text-anchor="end">Feb 21 – 27</text><rect x="796" y="520" width="740" height="420" rx="16" fill="#ffffff" stroke="#dde1ea" stroke-width="1.5"/><text x="828" y="564" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6b6f80" text-anchor="start" letter-spacing="1.4">METHODS</text><circle cx="840" cy="616" r="16" fill="#0b25d9" stroke="#ffffff" stroke-width="3"/><text x="840" y="621.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16.8" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="872" y="622" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#1f2547" text-anchor="start">Survey</text><text x="872" y="650" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6b6f80" text-anchor="start">Typeform, sent as a push notification — quantitative</text><circle cx="840" cy="696" r="16" fill="#0b25d9" stroke="#ffffff" stroke-width="3"/><text x="840" y="701.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16.8" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="872" y="702" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#1f2547" text-anchor="start">Competitor analysis</text><text x="872" y="730" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6b6f80" text-anchor="start">Data pages in Mitra Bukalapak, Mitra Tokopedia, DANA, MyTelkomsel</text><circle cx="840" cy="776" r="16" fill="#0b25d9" stroke="#ffffff" stroke-width="3"/><text x="840" y="781.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16.8" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="872" y="782" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#1f2547" text-anchor="start">SE interviews</text><text x="872" y="810" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6b6f80" text-anchor="start">Three sales executives, from earlier qualitative research</text><circle cx="840" cy="856" r="16" fill="#0b25d9" stroke="#ffffff" stroke-width="3"/><text x="840" y="861.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16.8" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="872" y="862" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#1f2547" text-anchor="start">Scope</text><text x="872" y="890" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6b6f80" text-anchor="start">Data first — Pulsa shares the same design, so fixes carry over</text></svg>