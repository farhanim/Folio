<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#fbfbfd"/><rect x="64" y="56" width="270" height="44" fill="#0b25d9"/><text x="199" y="85" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Research Methodology</text><text x="1536" y="84" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6b6f80" text-anchor="end" letter-spacing="1.6">01</text><text x="64" y="170" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="46" font-weight="500" fill="#1f2547" text-anchor="start" letter-spacing="-1">From 623 answers to 70 that explain the problem</text><text x="64" y="212" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#6b6f80" text-anchor="start">Survey by push notification (Typeform), backed by competitor analysis and three sales-executive interviews.</text><rect x="0" y="964" width="1600" height="36" fill="#1f2547"/><text x="800" y="988" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#c9cde0" text-anchor="middle" letter-spacing="1.4">FAZZ AGEN · DATA &amp; PULSA IMPROVEMENTS · DISCOVERY RESEARCH · FEB 2023</text><rect x="64" y="260" width="356" height="230" rx="16" fill="#ffffff" stroke="#dde1ea" stroke-width="1.5"/><text x="94" y="350" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="72" font-weight="600" fill="#1f2547" text-anchor="start">623</text><text x="94" y="392" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#1f2547" text-anchor="start">responses</text><text x="94" y="426" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6b6f80" text-anchor="start">Payfazz, Master Agen and Fazz Agen</text><line x1="412" y1