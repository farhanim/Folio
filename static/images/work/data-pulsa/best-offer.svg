<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#fbfbfd"/><rect x="64" y="56" width="201" height="44" fill="#0b25d9"/><text x="164.5" y="85" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Survey Results</text><text x="1536" y="84" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6b6f80" text-anchor="end" letter-spacing="1.6">05</text><text x="64" y="170" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="46" font-weight="500" fill="#1f2547" text-anchor="start" letter-spacing="-1">Penawaran Terbaik is used — just not by everyone</text><text x="64" y="212" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#6b6f80" text-anchor="start">Sales said the “best offer” section confused agents. The survey said most agents rely on it.</text><rect x="0" y="964" width="1600" height="36" fill="#1f2547"/><text x="800" y="988" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#c9cde0" text-anchor="middle" letter-spacing="1.4">FAZZ AGEN · DATA &amp; PULSA IMPROVEMENTS · DISCOVERY RESEARCH · FEB 2023</text><rect x="64" y="250" width="470" height="690" rx="16" fill="#ffffff" stroke="#dde1ea" stroke-width="1.5"/><text x="96" y="294" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6b6f80" text-anchor="start" letter-spacing="1.4">EVER PICKED A “BEST OFFER”? · 389</text><path d="M299 340A140 140 0 1 1 159 483.5L215 482.1A84 84 0 1 0 299 396Z" fill="#0b25d9"/><path d="M159 483.5A140 140 0 0 1 299 340L299 396A84 84 0 0 0 215 482.1Z" fill="#cfdcf8"/><text x="299" y="488" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="50.4" font-weight="800" fill="#1f2547" text-anchor="middle">74.6%</text><text x="299" y="514" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#6b6f80" text-anchor="middle">have used it</text><rect x="110" y="680" width="16" height="16" rx="4" fill="#0b25d9"/><text x="136" y="694" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3a44" text-anchor="start">Yes · 290 agents</text><rect x="110" y="720" width="16" height="16" rx="4" fill="#cfdcf8"/><text x="136" y="734" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3a44" text-anchor="start">Not yet · 99 agents</text><text x="96" y="830" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#1f2547" text-anchor="start">Of those 290:</text><rect x="96" y="850" width="300.8" height="40" rx="6" fill="#0b25d9"/><text x="110" y="877" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="start">1–3×/week 74.1%</text><rect x="400.8" y="850" width="101.2" height="40" rx="6" fill="#7fa6f2"/><text x="498" y="877" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="end">&gt;3× 25.9%</text><rect x="560" y="250" width="976" height="420" rx="16" fill="#ffffff" stroke="#dde1ea" stroke-width="1.5"/><text x="592" y="294" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6b6f80" text-anchor="start" letter-spacing="1.4">WHY THE OTHER 99 HAVEN’T USED IT</text><text x="820" y="354" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3a44" text-anchor="end">Didn’t know it exists</text><rect x="832" y="330" width="590" height="32" rx="4" fill="#e7eefc"/><rect x="832" y="330" width="505.9" height="32" rx="4" fill="#0b25d9"/><text x="1347.9" y="354.3" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start">34.3% · 34</text><text x="820" y="416" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3a44" text-anchor="end">No customer demand</text><rect x="832" y="392" width="590" height="32" rx="4" fill="#e7eefc"/><rect x="832" y="392" width="402.7" height="32" rx="4" fill="#7fa6f2"/><text x="1244.7" y="416.3" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start">27.3% · 27</text><text x="820" y="478" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3a44" text-anchor="end">Not used to it yet</text><rect x="832" y="454" width="590" height="32" rx="4" fill="#e7eefc"/><rect x="832" y="454" width="297.9" height="32" rx="4" fill="#7fa6f2"/><text x="1140" y="478.3" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start">20.2% · 20</text><text x="820" y="540" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3a44" text-anchor="end">No clear reason</text><rect x="832" y="516" width="590" height="32" rx="4" fill="#e7eefc"/><rect x="832" y="516" width="149" height="32" rx="4" fill="#7fa6f2"/><text x="991" y="540.3" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start">10.1% · 10</text><text x="820" y="602" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3a44" text-anchor="end">Price doesn’t suit</text><rect x="832" y="578" width="590" height="32" rx="4" fill="#e7eefc"/><rect x="832" y="578" width="119.5" height="32" rx="4" fill="#7fa6f2"/><text x="961.5" y="602.3" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start">8.1% · 8</text><rect x="560" y="694" width="976" height="246" rx="16" fill="#1f2547"/><text x="592" y="738" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#cfd8ff" text-anchor="start" letter-spacing="1.4">WHAT IT MEANS</text><text x="592" y="790" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="start">The problem isn’t the offer — it’s awareness and display. One in three</text><text x="592" y="822" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="start">non-users had never noticed it; some thought it depended on their Fazz Level,</text><text x="592" y="854" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="start">which it doesn’t.</text></svg>