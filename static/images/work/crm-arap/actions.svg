<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f8f6"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · CRM AR/AP</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">03</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Issues &amp; action plan</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">Most friction is operational: double entry, late vendor bills, weak signal in the field.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="720" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#e24b3b" text-anchor="start" letter-spacing="1.4">ISSUES FOUND</text><circle cx="104" cy="326" r="6" fill="#e24b3b"/><text x="124" y="332" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Settlement often takes a long time</text><circle cx="104" cy="378" r="6" fill="#e24b3b"/><text x="124" y="384" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Weak network — the CRM is used in the field</text><circle cx="104" cy="430" r="6" fill="#e24b3b"/><text x="124" y="436" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Vendor bills come out late, so sheets are filled manually</text><circle cx="104" cy="482" r="6" fill="#e24b3b"/><text x="124" y="488" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Vendor bills only appear after payment completes</text><rect x="816" y="236" width="720" height="330" rx="16" fill="#fde3df"/><text x="848" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#e24b3b" text-anchor="start" letter-spacing="1.4">TODAY’S FLOW</text><rect x="848" y="320" width="190" height="70" rx="12" fill="#fff" stroke="#e24b3b" stroke-width="2"/><text x="943" y="362" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1d1b18" text-anchor="middle">GForms</text><line x1="1040" y1="355" x2="1054" y2="355" stroke="#e24b3b" stroke-width="3" stroke-linecap="round"/><path d="M1050 346L1066 355L1050 364Z" fill="#e24b3b"/><rect x="1068" y="320" width="190" height="70" rx="12" fill="#fff" stroke="#e24b3b" stroke-width="2"/><text x="1163" y="362" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1d1b18" text-anchor="middle">GSheet AR/AP</text><line x1="1260" y1="355" x2="1274" y2="355" stroke="#e24b3b" stroke-width="3" stroke-linecap="round"/><path d="M1270 346L1286 355L1270 364Z" fill="#e24b3b"/><rect x="1288" y="320" width="190" height="70" rx="12" fill="#fff" stroke="#e24b3b" stroke-width="2"/><text x="1383" y="362" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="800" fill="#1d1b18" text-anchor="middle">CRM</text><text x="848" y="440" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start">Much of the same data is typed twice; vendor-bill delays (with no ETA)</text><text x="848" y="465" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start">stall input and raise the risk of mistakes.</text><rect x="64" y="590" width="1472" height="342" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="634" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="1.4">ACTION ITEMS</text><circle cx="110" cy="678" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="683.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140" y="684" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Simplify input from GForms straight into CRM AR/AP</text><rect x="1300" y="664" width="116.5" height="27" rx="13.5" fill="#eef9f4"/><text x="1358.2" y="682.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#12392c" text-anchor="middle">Sales &amp; FBDC</text><circle cx="110" cy="728" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="733.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="140" y="734" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Show an ETA for vendor bills (e.g. 1×24h) with “report issue” after it</text><rect x="1300" y="714" width="108.9" height="27" rx="13.5" fill="#eef9f4"/><text x="1354.5" y="732.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#12392c" text-anchor="middle">FAT → Sales</text><circle cx="110" cy="778" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="783.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="140" y="784" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Announce every CRM improvement and new feature</text><rect x="1300" y="764" width="124" height="27" rx="13.5" fill="#eef9f4"/><text x="1362" y="782.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#12392c" text-anchor="middle">All CRM users</text><circle cx="110" cy="828" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="833.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="140" y="834" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Faster data loading for weak field networks</text><rect x="1300" y="814" width="101.4" height="27" rx="13.5" fill="#eef9f4"/><text x="1350.7" y="832.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#12392c" text-anchor="middle">Sales team</text><circle cx="110" cy="878" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="883.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="140" y="884" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Simpler search and filters; tables less wide</text><rect x="1300" y="864" width="124" height="27" rx="13.5" fill="#eef9f4"/><text x="1362" y="882.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#12392c" text-anchor="middle">All CRM users</text></svg>