<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f8f6"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · CRM AR/AP</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">02</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">How AR/AP settlement feels</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">Of the 59% who settle AR/AP in the CRM — what they use and how they rate it.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="470" height="400" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">FEATURES USED</text><path d="M299 330A120 120 0 1 1 247.2 341.7L267.9 385A72 72 0 1 0 299 378Z" fill="#4aa8be"/><path d="M247.2 341.7A120 120 0 0 1 299 330L299 378A72 72 0 0 0 267.9 385Z" fill="#6a6bd0"/><text x="299" y="458" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="38.4" font-weight="800" fill="#12392c" text-anchor="middle">92.9%</text><text x="299" y="482" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#66706a" text-anchor="middle">all three</text><text x="96" y="610" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-