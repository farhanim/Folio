ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="1088" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">IN THEIR WORDS</text><text x="1296" y="400" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="56" font-weight="800" fill="#12392c" text-anchor="middle">cukup mudah</text><text x="1296" y="330" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="800" fill="#2a4f86" text-anchor="middle">proses sangat mudah</text><text x="1296" y="460" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="800" fill="#f29a2e" text-anchor="middle">tidak rumit dan simpel</text><text x="1296" y="510" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#f29a2e" text-anchor="middle">lama menunggu vendor bill</text><text x="1296" y="556" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#f29a2e" text-anchor="middle">kadang error</text><text x="1296" y="600" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#2a4f86" text-anchor="middle">membantu arap dan execute</text><rect x="64" y="660" width="1472" height="272" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="704" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">SATISFACTION, 1–10 · HALF THE USERS SCORED 8</text><rect x="140" y="833.8" width="120" height="56.3" rx="8" fill="#4fc7a0"/><text x="200" y="823.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="900" fill="#1d1b18" text-anchor="middle">3</text><text x="200" y="916" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-