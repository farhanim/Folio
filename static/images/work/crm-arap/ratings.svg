start">mostly about RMP, not AR/AP settlement</text><text x="1080" y="812" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#39403c" text-anchor="start">itself.</text></svg>