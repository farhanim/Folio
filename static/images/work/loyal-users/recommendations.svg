3732" text-anchor="start">each. Validate the name, then announce it.</text><rect x="910" y="718" width="626" height="214" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="942" y="762" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">04</text><text x="942" y="804" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="900" fill="#1d3f80" text-anchor="start">Expose the advantages on the website</text><text x="942" y="840" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3732" text-anchor="start">The website is what convinced agents prices are cheap. Keep it</text><text x="942" y="863" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3732" text-anchor="start">maintained and keep saying it.</text></svg>