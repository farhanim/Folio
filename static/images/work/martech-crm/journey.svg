 x="128" y="852" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="900" fill="#12392c" text-anchor="start">Focus on “who handles which customer”</text><text x="128" y="882" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">One journey replaces the spreadsheet hand-offs between marketing, telesales and field sales.</text></svg>