<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#fff"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · ENTERPRISE PAYMENT</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">04</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Learnings &amp; roadmap</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">What helped, what blocked, and what came next for payment in and out.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><circle cx="130" cy="290" r="56" fill="#e6f23a"/><text x="130" y="284" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="middle" font-style="italic">Payment</text><text x="130" y="301" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="middle" font-style="italic">gateway</text><text x="220" y="270" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start">Driver</text><text x="220" y="296" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Close collaboration with product teams from quarterly</text><text x="220" y="317" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">planning on</text><text x="800" y="270" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#e24b3b" text-anchor="start">Blocker</text><text x="800" y="296" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Virtual accounts need order data first; new channels depend on third-party SLAs</text><circle cx="130" cy="418" r="56" fill="#e6f23a"/><text x="130" y="412" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="middle" font-style="italic">Disbursement</text><text x="220" y="398" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start">Driver</text><text x="220" y="424" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Product + third-party provider support for the API</text><text x="800" y="398" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#e24b3b" text-anchor="start">Blocker</text><text x="800" y="424" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Valid beneficiary account data is hard to find; provider APIs are limited</text><circle cx="130" cy="546" r="56" fill="#e6f23a"/><text x="130" y="540" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="middle" font-style="italic">Bank</text><text x="130" y="557" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="middle" font-style="italic">reconciliation</text><text x="220" y="526" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start">Driver</text><text x="220" y="552" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">All eFishery statements in the FAT App moves work off sheets</text><text x="800" y="526" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#e24b3b" text-anchor="start">Blocker</text><text x="800" y="552" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Only BNI and BRI could be fetched automatically; some fetch errors</text><rect x="64" y="636" width="1472" height="88" rx="44" fill="#0f6b44"/><circle cx="108" cy="680" r="40" fill="#17945e"/><text x="108" y="688" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">Q1</text><text x="170" y="674" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#e6f23a" text-anchor="start">In</text><text x="200" y="674" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Auto reconciliation Midtrans · Bank statements via Brankas · VA BCA and more channels</text><text x="170" y="702" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#e6f23a" text-anchor="start">Out</text><text x="200" y="702" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Payout status visibility · Auto reconciliation IRIS</text><rect x="64" y="736" width="1472" height="88" rx="44" fill="#0f6b44"/><circle cx="108" cy="780" r="40" fill="#17945e"/><text x="108" y="788" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">Q2</text><text x="170" y="774" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#e6f23a" text-anchor="start">In</text><text x="200" y="774" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Bank statement reconciliation · PG for shrimp &amp; fish units · Payment page redesign</text><text x="170" y="802" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#e6f23a" text-anchor="start">Out</text><text x="200" y="802" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Payment receipt data · Disbursement in FAT App · Odoo 2.0 adjustment</text><rect x="64" y="836" width="1472" height="88" rx="44" fill="#0f6b44"/><circle cx="108" cy="880" r="40" fill="#17945e"/><text x="108" y="888" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">Q3</text><text x="170" y="874" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#e6f23a" text-anchor="start">In</text><text x="200" y="874" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Feedhub payment integration · Customised PG dashboard · B2B checkout for shrimp</text><text x="170" y="902" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="12" font-weight="800" fill="#e6f23a" text-anchor="start">Out</text><text x="200" y="902" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Auto reconciliation Durianpay · Disbursement phase 2</text></svg>