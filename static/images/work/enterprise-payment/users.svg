<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#fff"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · ENTERPRISE PAYMENT</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">01</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Who we were serving</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">Finance and product teams, each blocked by a payment system that didn’t scale.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="728" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><circle cx="134" cy="310" r="42" fill="#ef6a9a"/><circle cx="134" cy="298" r="16" fill="#f6d2b0"/><path d="M108 344a26 22 0 0 1 52 0z" fill="#333"/><text x="194" y="304" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#f29a2e" text-anchor="start">Accounts receivable</text><text x="194" y="332" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#66706a" text-anchor="start">Persona</text><text x="96" y="392" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">“Payments arrive 24/7, even on weekends. With limited people and manual</text><text x="96" y="417" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">steps, we hit our capacity to process them on time.”</text><rect x="96" y="486" width="664" height="56" rx="10" fill="#fff4e3"/><text x="112" y="520" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1b1f1d" text-anchor="start">Needs: Process every payment on time so farmers’ billing updates and they can buy again.</text><rect x="808" y="236" width="728" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><circle cx="878" cy="310" r="42" fill="#3b9ad6"/><circle cx="878" cy="298" r="16" fill="#f6d2b0"/><path d="M852 344a26 22 0 0 1 52 0z" fill="#333"/><text x="938" y="304" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#f29a2e" text-anchor="start">Accounts payable</text><text x="938" y="332" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#66706a" text-anchor="start">Persona</text><text x="840" y="392" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">“About 200 records a day from each BU, all processed manually — and not</text><text x="840" y="417" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">all of the data is valid.”</text><rect x="840" y="486" width="664" height="56" rx="10" fill="#fff4e3"/><text x="856" y="520" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1b1f1d" text-anchor="start">Needs: Pay farmers, agents and vendors the same day.</text><rect x="64" y="586" width="728" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><circle cx="134" cy="660" r="42" fill="#8cbf2e"/><circle cx="134" cy="648" r="16" fill="#f6d2b0"/><path d="M108 694a26 22 0 0 1 52 0z" fill="#333"/><text x="194" y="654" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#f29a2e" text-anchor="start">Treasury</text><text x="194" y="682" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#66706a" text-anchor="start">Persona</text><text x="96" y="742" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">“Every day we pull statements from ~18 accounts, recap them in a sheet,</text><text x="96" y="767" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">match payment numbers and upload to Odoo.”</text><rect x="96" y="836" width="664" height="56" rx="10" fill="#fff4e3"/><text x="112" y="870" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1b1f1d" text-anchor="start">Needs: Reconcile without manual matching.</text><rect x="808" y="586" width="728" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><circle cx="878" cy="660" r="42" fill="#5cb53a"/><circle cx="878" cy="648" r="16" fill="#f6d2b0"/><path d="M852 694a26 22 0 0 1 52 0z" fill="#333"/><text x="938" y="654" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#f29a2e" text-anchor="start">Product manager</text><text x="938" y="682" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#66706a" text-anchor="start">Persona</text><text x="840" y="742" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">“We want farmers to pay by themselves, but a conventional transfer took a</text><text x="840" y="767" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start" font-style="italic">long time to process.”</text><rect x="840" y="836" width="664" height="56" rx="10" fill="#fff4e3"/><text x="856" y="870" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1b1f1d" text-anchor="start">Needs: A reliable payment system farmers trust.</text></svg>