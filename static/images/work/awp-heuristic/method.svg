<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f6f2"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">WARUNG PINTAR · HEURISTIC EVALUATION</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">01</text><rect x="58" y="96" width="138.8" height="66" fill="#ffd23f"/><text x="64" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start" textLength="124.8" lengthAdjust="spacingAndGlyphs">What</text><text x="212.8" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start">is heuristic evaluation</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">A usability inspection: evaluators judge the interface against recognised principles.</text><text x="64" y="262" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#3a3732" text-anchor="start">Three evaluators walked the new AWP ordering flow screen by screen. Each</text><text x="64" y="291" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#3a3732" text-anchor="start">finding got a problem weight and a fix weight (0–4) and was tied to one of</text><text x="64" y="320" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#3a3732" text-anchor="start">Nielsen’s ten heuristics, so the worst problems got the most attention.</text><rect x="64" y="370" width="840" height="280" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="96" y="412" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">10 USABILITY HEURISTICS · JAKOB NIELSEN</text><text x="96" y="452" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">01</text><text x="132" y="452" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Visibility of system status</text><text x="96" y="492" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">02</text><text x="132" y="492" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Match system &amp; real world</text><text x="96" y="532" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">03</text><text x="132" y="532" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">User control &amp; freedom</text><text x="96" y="572" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">04</text><text x="132" y="572" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Consistency &amp; standards</text><text x="96" y="612" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">05</text><text x="132" y="612" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Error prevention</text><text x="496" y="452" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">06</text><text x="532" y="452" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Recognition rather than recall</text><text x="496" y="492" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">07</text><text x="532" y="492" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Flexibility &amp; efficiency of use</text><text x="496" y="532" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">08</text><text x="532" y="532" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Aesthetic &amp; minimalist design</text><text x="496" y="572" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">09</text><text x="532" y="572" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Recover from errors</text><text x="496" y="612" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="900" fill="#f2b400" text-anchor="start">10</text><text x="532" y="612" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Help &amp; documentation</text><rect x="64" y="670" width="840" height="262" rx="18" fill="#1d1b18"/><text x="96" y="712" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffd23f" text-anchor="start" letter-spacing="1.4">SEVERITY RATINGS</text><rect x="96" y="734" width="30" height="30" rx="7" fill="#ece9e1"/><text x="111" y="755" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="900" fill="#1d1b18" text-anchor="middle">0</text><text x="142" y="756" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Not a usability problem</text><rect x="96" y="772" width="30" height="30" rx="7" fill="#ffe9a6"/><text x="111" y="793" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="900" fill="#1d1b18" text-anchor="middle">1</text><text x="142" y="794" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Cosmetic — fix if time allows</text><rect x="96" y="810" width="30" height="30" rx="7" fill="#ffd23f"/><text x="111" y="831" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="900" fill="#1d1b18" text-anchor="middle">2</text><text x="142" y="832" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Minor — low priority</text><rect x="96" y="848" width="30" height="30" rx="7" fill="#f59a1f"/><text x="111" y="869" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">3</text><text x="142" y="870" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Major — important to fix</text><rect x="96" y="886" width="30" height="30" rx="7" fill="#e0442b"/><text x="111" y="907" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">4</text><text x="142" y="908" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="start">Catastrophe — fix before release</text><rect x="940" y="236" width="596" height="250" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="972" y="278" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">EVALUATORS · SLIDE COLOUR</text><rect x="972" y="304" width="150" height="110" rx="14" fill="#f4f4f1" stroke="#1d1b18" stroke-width="2.5"/><text x="990" y="346" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Rama</text><text x="990" y="392" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3732" text-anchor="start">9 findings</text><rect x="1154" y="304" width="150" height="110" rx="14" fill="#ecd3dc" stroke="#1d1b18" stroke-width="2.5"/><text x="1172" y="346" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Atik</text><text x="1172" y="392" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3732" text-anchor="start">16 findings</text><rect x="1336" y="304" width="150" height="110" rx="14" fill="#d8e9d2" stroke="#1d1b18" stroke-width="2.5"/><text x="1354" y="346" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Hans</text><text x="1354" y="392" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#3a3732" text-anchor="start">21 findings</text><text x="972" y="456" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6f6a60" text-anchor="start">Each evaluator’s slides keep their own colour.</text><rect x="940" y="506" width="596" height="426" rx="18" fill="#ffd23f"/><text x="972" 