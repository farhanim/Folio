<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" fill="none">
	<rect width="1600" height="680" rx="30" fill="#f4f5f8"/>
	<text x="82" y="88" fill="#244989" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">METRIC LANGUAGE</text>
	<text x="82" y="136" fill="#202a3b" font-family="Arial,Helvetica,sans-serif" font-size="30">Make each number answer one question</text>
	<g font-family="Arial,Helvetica,sans-serif">
		<rect x="82" y="194" width="690" height="180" rx="18" fill="#fff" stroke="#dce2ec"/>
		<rect x="82" y="194" width="10" height="180" rx="5" fill="#315da7"/>
		<text x="122" y="242" fill="#315da7" font-size="15" font-weight="700" letter-spacing="1">WALLET · REAL TIME</text>
