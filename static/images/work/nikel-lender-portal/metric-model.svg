		<text x="122" y="337" fill="#69758a" font-size="18">RDL balance − pending balance</text>
		<text x="122" y="359" fill="#8a94a5" font-size="14">Funding or withdrawal still in transit stays pending.</text>

		<rect x="828" y="194" width="690" height="180" rx="18" fill="#fff" stroke="#dce2ec"/>
		<rect x="828" y="194" width="10" height="180" rx="5" fill="#31a984"/>
		<text x="868" y="242" fill="#178565" font-size="15" font-weight="700" letter-spacing="1">PERFORMANCE · ALL TIME</text>
		<text x="868" y="296" fill="#263249" font-size="27" font-weight="700">Return value &amp; rate</text>
		<text x="868" y="337" fill="#69758a" font-size="18">Interest received · interest ÷ total funded</text>
		<text x="868" y="359" fill="#8a94a5" font-size="14">Define the period and denominator beside the metric.</text>

		<rect x="82" y="408" width="1436" height="190" rx="18" fill="#fff" stroke="#dce2ec"/>
		<rect x="82" y="408" width="10" height="190" rx="5" fill="#e5ad34"/>
		<text x="122" y="456" fill="#a87914" font-size="15" font-weight="700" letter-spacing="1">PORTFOLIO &amp; RECONCILIATION · MONTH TO DATE</text>
