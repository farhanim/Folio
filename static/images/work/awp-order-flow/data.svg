" letter-spacing="1">Mitra · WPHNT-B</text><rect x="1048" y="472" width="488" height="220" rx="18" fill="#1d1b18"/><text x="1076" y="526" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#ffd23f" text-anchor="start">“Tampilan yang baru lebih nyaman dan</text><text x="1076" y="554" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#ffd23f" text-anchor="start">praktis.”</text><text x="1076" y="608" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#a8a296" text-anchor="start">The new look is more comfortable and practical.</text><text x="1076" y="668" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1">Mitra · WPHNT-D</text><rect x="1048" y="708" width="488" height="220" rx="18" fill="#f7f6f2"/><text x="1076" y="762" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#1d1b18" text-anchor="start">“Lebih terbiasa dengan keadaan yang</text><text x="1076" y="790" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#1d1b18" text-anchor="start">sekarang.”</text><text x="1076" y="844" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#6f6a60" text-anchor="start">Still more used to the current app.</text><text x="1076" y="904" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1d1b18" text-anchor="start" letter-spacing="1">Mitra · WPHNT-S</text></svg>