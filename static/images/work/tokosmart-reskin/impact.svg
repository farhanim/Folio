<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f6f2"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">WARUNG PINTAR · RESKIN</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">03</text><rect x="58" y="96" width="201.2" height="66" fill="#ffd23f"/><text x="64" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start" textLength="187.2" lengthAdjust="spacingAndGlyphs">Impact</text><text x="275.2" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start">on AWP users</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">What existing Warung Pintar users have to relearn once both apps become one.</text><rect x="64" y="236" width="728" height="230" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="96" y="286" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">REGISTRATION STEPS</text><text x="96" y="382" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#a8a296" text-anchor="start">1</text><line x1="174" y1="352" x2="242" y2="352" stroke="#1d1b18" stroke-width="5" stroke-linecap="round"/><path d="M238 343L254 352L238 361Z" fill="#1d1b18"/><text x="270" y="382" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#1d1b18" text-anchor="start">3</text><text x="384" y="344" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Plus three ways to sign up:</text><text x="384" y="371" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">registered, new store, new agent.</text><rect x="808" y="236" width="728" height="230" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="840" y="286" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">ORDER TRACKING STEPS</text><text x="840" y="382" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#a8a296" text-anchor="start">3</text><line x1="918" y1="352" x2="986" y2="352" stroke="#1d1b18" stroke-width="5" stroke-linecap="round"/><path d="M982 343L998 352L982 361Z" fill="#1d1b18"/><text x="1014" y="382" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#1d1b18" text-anchor="start">5</text><text x="1128" y="344" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Multi-seller orders and new statuses</text><text x="1128" y="371" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">to follow.</text><rect x="64" y="486" width="728" height="230" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="96" y="536" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">BOTTOM NAVIGATION</text><text x="96" y="632" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#a8a296" text-anchor="start">5</text><line x1="174" y1="602" x2="242" y2="602" stroke="#1d1b18" stroke-width="5" stroke-linecap="round"/><path d="M238 593L254 602L238 611Z" fill="#1d1b18"/><text x="270" y="632" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#1d1b18" text-anchor="start">4</text><text x="384" y="594" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Pesanan, Keranjang and Akun replace</text><text x="384" y="621" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Pesan, Lacak and Riwayat.</text><rect x="808" y="486" width="728" height="230" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="840" y="536" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">DIGITAL PRODUCTS ON HOME</text><text x="840" y="632" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#a8a296" text-anchor="start">6</text><line x1="918" y1="602" x2="986" y2="602" stroke="#1d1b18" stroke-width="5" stroke-linecap="round"/><path d="M982 593L998 602L982 611Z" fill="#1d1b18"/><text x="1014" y="632" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="88" font-weight="900" fill="#1d1b18" text-anchor="start">3</text><text x="1128" y="594" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Pulsa, Internet and Misi stay; the</text><text x="1128" y="621" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">rest move deeper.</text><rect x="64" y="740" width="900" height="196" rx="18" fill="#f7f6f2" stroke="#ddd8cc" stroke-width="1.5"/><text x="96" y="784" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">ALSO NEW</text><circle cx="104" cy="822" r="6" fill="#f2b400"/><text x="122" y="829" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Cart before checkout — a new step for AWP users</text><circle cx="104" cy="860" r="6" fill="#f2b400"/><text x="122" y="867" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Promos: bundles, buy 1 get 1, cumulative discounts</text><circle cx="104" cy="898" r="6" fill="#f2b400"/><text x="122" y="905" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#1d1b18" text-anchor="start">Payment: COD, bank transfer or digital payment</text><rect x="988" y="740" width="548" height="196" rx="18" fill="#1d1b18"/><text x="1020" y="784" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#ffd23f" text-anchor="start" letter-spacing="1.4">CONCERN</text><text x="1020" y="826" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Pair the in-app product tour with a campaign,</text><text x="1020" y="854" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">so mitra from both apps aren’t lost on day</text><text x="1020" y="882" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">one.</text></svg>