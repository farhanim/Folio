<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f7f4"/><line x1="266" y1="0" x2="266" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="532" y1="0" x2="532" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="798" y1="0" x2="798" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="1064" y1="0" x2="1064" y2="1000" stroke="#00000008" stroke-width="1.5"/><line x1="1330" y1="0" x2="1330" y2="1000" stroke="#00000008" stroke-width="1.5"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">FAZZ · EXPERIENCE TEAM · CATAT UTANG · SURVEY</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">01</text><text x="64" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="50" font-weight="900" fill="#3a3732" text-anchor="start" textLength="252" lengthAdjust="spacingAndGlyphs">Who keeps</text><rect x="328" y="98" width="360" height="66" fill="#1d3f80"/><text x="340" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="50" font-weight="900" fill="#ffffff" text-anchor="start" font-style="italic" textLength="334" lengthAdjust="spacingAndGlyphs">a debt book?</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">377 agents surveyed, 18–27 May 2022. Most catat utang users are PFA agents.</text><rect x="0" y="990" width="1600" height="10" fill="#3b82d6"/><rect x="64" y="236" width="470" height="330" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">AGENTS</text><path d="M214 320A100 100 0 1 1 125.8 372.9L161.1 391.8A60 60 0 1 0 214 360Z" fill="#1d3f80"/><path d="M125.8 372.9A100 100 0 0 1 146.9 345.8L173.7 375.5A60 60 0 0 0 161.1 391.8Z" fill="#f2c400"/><path d="M146.9 345.8A100 100 0 0 1 214 320L214 360A60 60 0 0 0 173.7 375.5Z" fill="#9cc3f0"/><text x="214" y="424" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="38" font-weight="900" fill="#1d1b18" text-anchor="middle">377</text><text x="214" y="450" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#6f6a60" text-anchor="middle">respondents</text><rect x="340" y="360" width="16" height="16" rx="4" fill="#1d3f80"/><text x="366" y="374" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">PFA 82.8%</text><rect x="340" y="390" width="16" height="16" rx="4" fill="#f2c400"/><text x="366" y="404" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">PMA 5.5%</text><rect x="340" y="420" width="16" height="16" rx="4" fill="#9cc3f0"/><text x="366" y="434" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">Both 11.7%</text><rect x="560" y="236" width="470" height="330" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="592" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">DO YOU ACCEPT CUSTOMERS’ DEBT?</text><path d="M710 320A100 100 0 1 1 640.6 492L668.4 463.2A60 60 0 1 0 710 360Z" fill="#1d3f80"/><path d="M640.6 492A100 100 0 0 1 710 320L710 360A60 60 0 0 0 668.4 463.2Z" fill="#f2c400"/><text x="710" y="424" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="32" font-weight="900" fill="#1d1b18" text-anchor="middle">62.2%</text><text x="710" y="450" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#6f6a60" text-anchor="middle">say yes</text><rect x="836" y="390" width="16" height="16" rx="4" fill="#1d3f80"/><text x="862" y="404" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">Yes</text><rect x="836" y="420" width="16" height="16" rx="4" fill="#f2c400"/><text x="862" y="434" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">No</text><rect x="1056" y="236" width="480" height="330" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="1088" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">DO YOU NEED A DEBT REPORT?</text><path d="M1206 320A100 100 0 1 1 1148.2 338.4L1171.3 371A60 60 0 1 0 1206 360Z" fill="#1d3f80"/><path d="M1148.2 338.4A100 100 0 0 1 1206 320L1206 360A60 60 0 0 0 1171.3 371Z" fill="#f2c400"/><text x="1206" y="424" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="32" font-weight="900" fill="#1d1b18" text-anchor="middle">90.2%</text><text x="1206" y="450" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#6f6a60" text-anchor="middle">need it</text><rect x="1332" y="390" width="16" height="16" rx="4" fill="#1d3f80"/><text x="1358" y="404" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">Yes</text><rect x="1332" y="420" width="16" height="16" rx="4" fill="#f2c400"/><text x="1358" y="434" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#3a3732" text-anchor="start">No</text><rect x="64" y="592" width="966" height="340" rx="18" fill="#ffffff" stroke="#dcdfe6" stroke-width="1.5"/><text x="96" y="636" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.4">WHEN DO YOU RECORD A CUSTOMER’S DEBT?</text><text x="294" y="700.5" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="end">Right after the sale</text><rect x="306" y="676" width="620" height="34" rx="4" fill="#eceef2"/><rect x="306" y="676" width="561.7" height="34" rx="4" fill="#1d3f80"/><text x="875.7" y="701.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="start">90.6%</text><text x="294" y="764.5" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="end">Once a day</text><rect x="306" y="740" width="620" height="34" rx="4" fill="#eceef2"/><rect x="306" y="740" width="45" height="34" rx="4" fill="#9cc3f0"/><text x="359" y="765.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="start">7.26%</text><text x="294" y="828.5" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#3a3732" text-anchor="end">Others</text><rect x="306" y="804" width="620" height="34" rx="4" fill="#eceef2"/><rect x="306" y="804" width="13.3" height="34" rx="4" fill="#9cc3f0"/><text x="327.3" y="829.2" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="800" fill="#1d1b18" text-anchor="start">2.14%</text><text x="96" y="900" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start" font-style="italic">Others: once a week, sometimes, when doing the books.</text><rect x="1056" y="592" width="480" height="340" rx="18" fill="#1d3f80"/><text x="1088" y="636" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#f2c400" text-anchor="start" letter-spacing="1.4">WHAT IT MEANS</text><text x="1088" y="690" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">Debt is written down the moment it</text><text x="1088" y="722" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">happens. A report is wanted — but</text><text x="1088" y="754" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">as a reminder, not an analysis</text><text x="1088" y="786" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">tool.</text><text x="1088" y="890" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#cfdcf2" text-anchor="start">211 agents need a report · 23 don’t</text></svg>