<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f6f2"/><text x="64" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="start" letter-spacing="1.6">WARUNG PINTAR · HOME SCREEN REVAMP</text><text x="1536" y="70" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#6f6a60" text-anchor="end" letter-spacing="1.6">01</text><rect x="58" y="96" width="263.6" height="66" fill="#ffd23f"/><text x="64" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start" textLength="249.6" lengthAdjust="spacingAndGlyphs">Findings</text><text x="337.6" y="148" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="52" font-weight="900" fill="#1d1b18" text-anchor="start">from competitors</text><text x="64" y="200" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="400" fill="#6f6a60" text-anchor="start">The old home confused mitra who signed up online, without a sales agent beside them.</text><rect x="64" y="236" width="900" height="216" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="100" y="328" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="72" font-weight="900" fill="#1d1b18" text-anchor="start">5/7</text><circle cx="106" cy="376" r="9" fill="#1d1b18"/><circle cx="132" cy="376" r="9" fill="#1d1b18"/><circle cx="158" cy="376" r="9" fill="#1d1b18"/><circle cx="184" cy="376" r="9" fill="#1d1b18"/><circle cx="210" cy="376" r="9" fill="#1d1b18"/><circle cx="236" cy="376" r="9" fill="#ddd8cc"/><circle cx="262" cy="376" r="9" fill="#ddd8cc"/><text x="100" y="420" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">competitor apps</text><text x="330" y="296" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="900" fill="#1d1b18" text-anchor="start">Search on top</text><text x="330" y="338" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Even when search only finds products, the box belongs at</text><text x="330" y="365" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">the top — it’s the fastest route to an item.</text><rect x="64" y="472" width="900" height="216" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="100" y="564" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="72" font-weight="900" fill="#1d1b18" text-anchor="start">5/7</text><circle cx="106" cy="612" r="9" fill="#1d1b18"/><circle cx="132" cy="612" r="9" fill="#1d1b18"/><circle cx="158" cy="612" r="9" fill="#1d1b18"/><circle cx="184" cy="612" r="9" fill="#1d1b18"/><circle cx="210" cy="612" r="9" fill="#1d1b18"/><circle cx="236" cy="612" r="9" fill="#ddd8cc"/><circle cx="262" cy="612" r="9" fill="#ddd8cc"/><text x="100" y="656" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">competitor apps</text><text x="330" y="532" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="900" fill="#1d1b18" text-anchor="start">Banners, then categories</text><text x="330" y="574" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Banners come right after search, but categories still sit</text><text x="330" y="601" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">inside the first screen — no scrolling to find them.</text><rect x="64" y="708" width="900" height="216" rx="18" fill="#ffffff" stroke="#ddd8cc" stroke-width="1.5"/><text x="100" y="800" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="72" font-weight="900" fill="#1d1b18" text-anchor="start">5/7</text><circle cx="106" cy="848" r="9" fill="#1d1b18"/><circle cx="132" cy="848" r="9" fill="#1d1b18"/><circle cx="158" cy="848" r="9" fill="#1d1b18"/><circle cx="184" cy="848" r="9" fill="#1d1b18"/><circle cx="210" cy="848" r="9" fill="#1d1b18"/><circle cx="236" cy="848" r="9" fill="#ddd8cc"/><circle cx="262" cy="848" r="9" fill="#ddd8cc"/><text x="100" y="892" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#6f6a60" text-anchor="start">competitor apps</text><text x="330" y="768" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="28" font-weight="900" fill="#1d1b18" text-anchor="start">Tailored picks</text><text x="330" y="810" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">Recommendations by location, promotion or best-sellers cut</text><text x="330" y="837" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#3a3732" text-anchor="start">the time it takes to find something.</text><rect x="1000" y="236" width="536" height="688" rx="18" fill="#ffd23f"/><text x="1036" y="284" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="start" letter-spacing="1.4">CRAZY 8S · TOP 4 OF 6 VOTERS</text><rect x="1036" y="316" width="464" height="128" rx="14" fill="#ffffff"/><circle cx="1078" cy="380" r="22" fill="#1d1b18" stroke="#ffffff" stroke-width="3"/><text x="1078" y="387.9" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="23.1" font-weight="800" fill="#ffd23f" text-anchor="middle">1</text><text x="1118" y="374" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Lacak status</text><text x="1118" y="404" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#6f6a60" text-anchor="start">Live order tracking card</text><rect x="1036" y="464" width="464" height="128" rx="14" fill="#ffffff"/><circle cx="1078" cy="528" r="22" fill="#1d1b18" stroke="#ffffff" stroke-width="3"/><text x="1078" y="535.9" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="23.1" font-weight="800" fill="#ffd23f" text-anchor="middle">2</text><text x="1118" y="522" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Search navigation</text><text x="1118" y="552" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#6f6a60" text-anchor="start">Search + notifications in one bar</text><rect x="1036" y="612" width="464" height="128" rx="14" fill="#ffffff"/><circle cx="1078" cy="676" r="22" fill="#1d1b18" stroke="#ffffff" stroke-width="3"/><text x="1078" y="683.9" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="23.1" font-weight="800" fill="#ffd23f" text-anchor="middle">3</text><text x="1118" y="670" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Grouped categories</text><text x="1118" y="700" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#6f6a60" text-anchor="start">Products &amp; services, grouped</text><rect x="1036" y="760" width="464" height="128" rx="14" fill="#ffffff"/><circle cx="1078" cy="824" r="22" fill="#1d1b18" stroke="#ffffff" stroke-width="3"/><text x="1078" y="831.9" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="23.1" font-weight="800" fill="#ffd23f" text-anchor="middle">4</text><text x="1118" y="818" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="900" fill="#1d1b18" text-anchor="start">Status pesanan</text><text x="1118" y="848" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#6f6a60" text-anchor="start">Order status right on Home</text></svg>