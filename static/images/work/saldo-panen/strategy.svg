<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f8f6"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · SALDO PANEN</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">04</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Adoption strategy &amp; next steps</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">Pilot with tech-savvy independent farmers; design the app to act like the field team.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="476" height="360" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="284" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#1f8a66" text-anchor="start">Tech-savvy independent</text><rect x="96" y="314" width="412" height="52" rx="10" fill="#eef9f4"/><text x="114" y="346" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Pilot target users</text><rect x="96" y="378" width="412" height="52" rx="10" fill="#eef9f4"/><text x="114" y="410" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Tutorials on concept &amp; benefit</text><rect x="96" y="442" width="412" height="52" rx="10" fill="#eef9f4"/><text x="114" y="474" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Ongoing CS + FBDO support</text><rect x="96" y="506" width="412" height="52" rx="10" fill="#eef9f4"/><text x="114" y="538" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Follow familiar m-banking patterns</text><rect x="560" y="236" width="476" height="360" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="592" y="284" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#3a7bd5" text-anchor="start">Tech-savvy dependent</text><rect x="592" y="314" width="412" height="52" rx="10" fill="#eef9f4"/><text x="610" y="346" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">FBDO socialisation before roll-out</text><rect x="592" y="378" width="412" height="52" rx="10" fill="#eef9f4"/><text x="610" y="410" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Step-by-step in-app guidance</text><rect x="592" y="442" width="412" height="52" rx="10" fill="#eef9f4"/><text x="610" y="474" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Value: payout within hours, not 3–4 days</text><rect x="592" y="506" width="412" height="52" rx="10" fill="#eef9f4"/><text x="610" y="538" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Free first transfer</text><rect x="1056" y="236" width="476" height="360" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="1088" y="284" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#e24b3b" text-anchor="start">Non-tech-savvy dependent</text><rect x="1088" y="314" width="412" height="52" rx="10" fill="#eef9f4"/><text x="1106" y="346" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Visual aids on where money comes from</text><rect x="1088" y="378" width="412" height="52" rx="10" fill="#eef9f4"/><text x="1106" y="410" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Financial literacy sessions</text><rect x="1088" y="442" width="412" height="52" rx="10" fill="#eef9f4"/><text x="1106" y="474" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Socialisation &amp; mentoring events</text><rect x="1088" y="506" width="412" height="52" rx="10" fill="#eef9f4"/><text x="1106" y="538" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">A much longer transition</text><rect x="64" y="620" width="940" height="312" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="664" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="1.4">DESIGN PRINCIPLES</text><circle cx="110" cy="714" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="719.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140" y="720" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Put Saldo Panen on the home page, not under Akun</text><circle cx="110" cy="768" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="773.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="140" y="774" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Link every balance to its Tarik Ikan record — the source of funds</text><circle cx="110" cy="822" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="827.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="140" y="828" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Confirmation dialogs and success / failure notifications</text><circle cx="110" cy="876" r="15" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="881.4" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15.75" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="140" y="882" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Step-by-step instructions, the way FBDO explains it</text><rect x="1028" y="620" width="508" height="312" rx="18" fill="#e6f23a"/><text x="1060" y="664" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#12392c" text-anchor="start" letter-spacing="1.4">VERDICT</text><text x="1060" y="712" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">Interest didn’t translate into intent.</text><text x="1060" y="740" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">Proceed with a closely monitored pilot,</text><text x="1060" y="768" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">gather feedback, then iterate and run a</text><text x="1060" y="796" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">risk analysis before full launch.</text></svg>