<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f8f6"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · SALDO PANEN</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">02</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Half-hearted acceptance</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">Three archetypes, and why most farmers sat between resisting and accepting.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="1472" height="220" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#e24b3b" text-anchor="start">Resist</text><text x="1504" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#1f8a66" text-anchor="end">Accept</text><defs><linearGradient id="ra"><stop offset="0" stop-color="#e24b3b"/><stop offset="1" stop-color="#1f8a66"/></linearGradient></defs><rect x="96" y="360" width="1408" height="8" rx="4" fill="url(#ra)"/><circle cx="130" cy="330" r="20" fill="#e24b3b" stroke="#fff" stroke-width="3"/><circle cx="320" cy="330" r="20" fill="#f29a2e" stroke="#fff" stroke-width="3"/><circle cx="720" cy="330" r="20" fill="#4fc7a0" stroke="#fff" stroke-width="3"/><circle cx="930" cy="330" r="20" fill="#1f8a66" stroke="#fff" stroke-width="3"/><circle cx="1010" cy="330" r="20" fill="#1f8a66" stroke="#fff" stroke-width="3"/><circle cx="1090" cy="330" r="20" fill="#1f8a66" stroke="#fff" stroke-width="3"/><circle cx="1460" cy="330" r="20" fill="#1f8a66" stroke="#fff" stroke-width="3"/><text x="96" y="410" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start">One farmer rejected it outright; one resisted the change to Tarik Ikan. Most accepted with help from the field team (FBDO) — but stayed skeptical.</text><rect x="64" y="480" width="476" height="260" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><rect x="64" y="480" width="476" height="8" fill="#1f8a66"/><text x="96" y="530" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#1f8a66" text-anchor="start">Tech-savvy independent</text><circle cx="104" cy="568" r="5" fill="#1f8a66"/><text x="120" y="574" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Highly skilled with technology</text><circle cx="104" cy="608" r="5" fill="#1f8a66"/><text x="120" y="614" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Relies little on FBDO</text><circle cx="104" cy="648" r="5" fill="#1f8a66"/><text x="120" y="654" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Trusts banking &amp; fintech</text><circle cx="104" cy="688" r="5" fill="#1f8a66"/><text x="120" y="694" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Fine with the admin fee</text><rect x="560" y="480" width="476" height="260" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><rect x="560" y="480" width="476" height="8" fill="#3a7bd5"/><text x="592" y="530" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#3a7bd5" text-anchor="start">Tech-savvy dependent</text><circle cx="600" cy="568" r="5" fill="#3a7bd5"/><text x="616" y="574" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Relies heavily on FBDO</text><circle cx="600" cy="608" r="5" fill="#3a7bd5"/><text x="616" y="614" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Knows the app, doesn’t fully use it</text><circle cx="600" cy="648" r="5" fill="#3a7bd5"/><text x="616" y="654" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Unsure about own decisions</text><circle cx="600" cy="688" r="5" fill="#3a7bd5"/><text x="616" y="694" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Calculative about the admin fee</text><rect x="1056" y="480" width="476" height="260" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><rect x="1056" y="480" width="476" height="8" fill="#e24b3b"/><text x="1088" y="530" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="21" font-weight="900" fill="#e24b3b" text-anchor="start">Non-tech-savvy dependent</text><circle cx="1096" cy="568" r="5" fill="#e24b3b"/><text x="1112" y="574" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Lacks tech proficiency</text><circle cx="1096" cy="608" r="5" fill="#e24b3b"/><text x="1112" y="614" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Delegates tasks to FBDO</text><circle cx="1096" cy="648" r="5" fill="#e24b3b"/><text x="1112" y="654" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Doesn’t use banking apps</text><circle cx="1096" cy="688" r="5" fill="#e24b3b"/><text x="1112" y="694" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Objected to Saldo Panen</text><rect x="64" y="764" width="1472" height="168" rx="16" fill="#eef9f4"/><text x="96" y="806" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="1.4">MENTAL MODEL BEHIND ACCEPT / RESIST</text><text x="96" y="852" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="900" fill="#12392c" text-anchor="start">Motivation</text><text x="96" y="882" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#39403c" text-anchor="start">Keeping the FBDO relationship matters more than the app</text><text x="582" y="852" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="900" fill="#12392c" text-anchor="start">Ability</text><text x="582" y="882" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#39403c" text-anchor="start">Use the app only for core tasks — fear of mistakes</text><text x="1068" y="852" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="900" fill="#12392c" text-anchor="start">Opportunity</text><text x="1068" y="882" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#39403c" text-anchor="start">Rarely see promos, so the app’s advantage stays</text><text x="1068" y="902" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#39403c" text-anchor="start">invisible</text></svg>