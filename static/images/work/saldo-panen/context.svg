<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f8f6"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · SALDO PANEN</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">01</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Context and who we tested with</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">A balance account for surplus AR/AP settlement, launched for fish farmers first.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="720" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="1.4">WHAT IS SALDO PANEN?</text><text x="96" y="322" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#39403c" text-anchor="start">Farmers receive the surplus from AR/AP settlement into a balance,</text><text x="96" y="349" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#39403c" text-anchor="start">track harvest income and withdraw it to their bank account.</text><text x="96" y="376" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#39403c" text-anchor="start">Internally it shows floating money and prevents settlement fraud,</text><text x="96" y="403" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#39403c" text-anchor="start">since withdrawals are triggered by the farmer.</text><rect x="816" y="236" width="720" height="330" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="848" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">RESEARCH AIMS</text><circle cx="866" cy="322" r="14" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="866" y="327" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14.700000000000001" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="894" y="328" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Current harvest settlement behaviour</text><circle cx="866" cy="370" r="14" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="866" y="375" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14.700000000000001" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="894" y="376" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">What drives willingness to adopt</text><circle cx="866" cy="418" r="14" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="866" y="423" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14.700000000000001" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="894" y="424" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">What drives resistance</text><circle cx="866" cy="466" r="14" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="866" y="471" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14.700000000000001" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="894" y="472" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">Acceptance of the MVP</text><circle cx="866" cy="514" r="14" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="866" y="519" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14.700000000000001" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="894" y="520" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#1d1b18" text-anchor="start">What blocks using the MVP</text><rect x="64" y="592" width="1472" height="340" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="636" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">PARTICIPANTS · 7 FARMERS, SPLIT BY TECH SAVVINESS AND AR/AP HISTORY</text><text x="96" y="716" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="64" font-weight="900" fill="#1f8a66" text-anchor="start">5</text><text x="160" y="696" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#1f8a66" text-anchor="start">Whitelist · tech-savvy</text><text x="160" y="726" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Receive surplus in their own account, no</text><text x="160" y="748" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">AR/AP holds, use eFisheryKu for Tarik</text><text x="160" y="770" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Ikan.</text><circle cx="170" cy="860" r="11" fill="#1f8a66"/><circle cx="200" cy="860" r="11" fill="#1f8a66"/><circle cx="230" cy="860" r="11" fill="#1f8a66"/><circle cx="260" cy="860" r="11" fill="#1f8a66"/><circle cx="290" cy="860" r="11" fill="#1f8a66"/><text x="576" y="716" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="64" font-weight="900" fill="#3a7bd5" text-anchor="start">1</text><text x="640" y="696" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#3a7bd5" text-anchor="start">Whitelist · non-tech-savvy</text><text x="640" y="726" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Never had AR/AP problems, but don’t use</text><text x="640" y="748" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">the app for Tarik Ikan.</text><circle cx="650" cy="860" r="11" fill="#3a7bd5"/><text x="1056" y="716" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="64" font-weight="900" fill="#e24b3b" text-anchor="start">1</text><text x="1120" y="696" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="800" fill="#e24b3b" text-anchor="start">Blacklisted</text><text x="1120" y="726" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">Had AR/AP problems; payment went through</text><text x="1120" y="748" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#39403c" text-anchor="start">another holder’s account.</text><circle cx="1130" cy="860" r="11" fill="#e24b3b"/><text x="96" y="908" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#66706a" text-anchor="start">Criteria: AR/AP in the last 6 months · areas with the most AR/AP · whitelist and blacklisted users</text></svg>