art">Top words are visible, but their meaning stays vague.</text><circle cx="110" cy="810" r="16" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="815.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16.8" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="140" y="816" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#1d1b18" text-anchor="start">Level 2</text><text x="240" y="816" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start">Pairs add clarity — with some redundancy.</text><circle cx="110" cy="866" r="16" fill="#1f8a66" stroke="#ffffff" stroke-width="3"/><text x="110" y="871.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="16.8" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="140" y="872" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="800" fill="#1d1b18" text-anchor="start">Level 3</text><text x="240" y="872" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start">Combining the category field shows the real issues: changing a phone number, the</text><text x="240" y="895.8" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="400" fill="#39403c" text-anchor="start">app, emergency contacts.</text><rect x="1028" y="660" width="508" height="272" rx="18" fill="#e6f23a"/><text x="1060" y="704" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#12392c" text-anchor="start" letter-spacing="1.4">THEN</text><text x="1060" y="752" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">CS workshops turn top phrases into FAQ</text><text x="1060" y="779" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">themes; the PM writes the answers; design</text><text x="1060" y="806" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#12392c" text-anchor="start">and engineering ship them into eFisheryKu.</text></svg>