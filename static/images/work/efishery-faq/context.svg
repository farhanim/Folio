<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f7f8f6"/><circle cx="1540" cy="40" r="120" fill="none" stroke="#d6f2e7" stroke-width="28"/><text x="64" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.6">EFISHERY · CUSTOMER EXPERIENCE</text><text x="1460" y="72" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#66706a" text-anchor="end" letter-spacing="1.6">01</text><text x="64" y="150" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="-0.5">Why tickets kept piling up</text><text x="64" y="196" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#66706a" text-anchor="start">Situation, complication, aim — and the end-to-end support flow the product team mapped.</text><rect x="0" y="980" width="1600" height="20" fill="#1f8a66"/><rect x="64" y="236" width="476" height="230" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">SITUATION</text><text x="96" y="324" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">Farmers must submit a report for every</text><text x="96" y="352" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">issue, and the Level 1 team struggles to</text><text x="96" y="380" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">reach the data quickly.</text><rect x="560" y="236" width="476" height="230" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="592" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">COMPLICATION</text><text x="592" y="324" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">Many questions are common and could be</text><text x="592" y="352" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">answered upfront. Odoo 17 and Mega were</text><text x="592" y="380" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">also in flight — was self-service still</text><text x="592" y="408" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">relevant?</text><rect x="1056" y="236" width="476" height="230" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="1088" y="280" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#1f8a66" text-anchor="start" letter-spacing="1.4">AIM</text><text x="1088" y="324" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">Faster, lighter support: better data</text><text x="1088" y="352" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">access, answers before tickets, less</text><text x="1088" y="380" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="400" fill="#39403c" text-anchor="start">load on the team.</text><rect x="64" y="492" width="1472" height="440" rx="16" fill="#ffffff" stroke="#dde3e0" stroke-width="1.5"/><text x="96" y="536" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#66706a" text-anchor="start" letter-spacing="1.4">EXISTING SUPPORT FLOW</text><circle cx="150" cy="640" r="44" fill="#8fb7f2"/><text x="150" y="646" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="800" fill="#1d1b18" text-anchor="middle">Farmer</text><rect x="220" y="584" width="900" height="110" rx="10" fill="none" stroke="#e24b3b" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="240" y="604" width="240" height="70" rx="12" fill="#eef9f4" stroke="#dde3e0" stroke-width="1.5"/><text x="256" y="634" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">Gets a problem or obstacle</text><line x1="484" y1="639" x2="528" y2="639" stroke="#39403c" stroke-width="2.5" stroke-linecap="round"/><path d="M524 630L540 639L524 648Z" fill="#39403c"/><rect x="544" y="604" width="260" height="70" rx="12" fill="#eef9f4" stroke="#dde3e0" stroke-width="1.5"/><text x="560" y="634" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">Opens “Bantuan” in</text><text x="560" y="653" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">eFisheryKu</text><line x1="808" y1="639" x2="852" y2="639" stroke="#39403c" stroke-width="2.5" stroke-linecap="round"/><path d="M848 630L864 639L848 648Z" fill="#39403c"/><rect x="868" y="604" width="236" height="70" rx="12" fill="#eef9f4" stroke="#dde3e0" stroke-width="1.5"/><text x="884" y="634" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">Submits a complaint</text><text x="884" y="653" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">ticket</text><rect x="1180" y="604" width="300" height="70" rx="12" fill="#fff6d6" stroke="#dde3e0" stroke-width="1.5"/><text x="1196" y="634" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">Lv 1 · handled by CS from CRM</text><line x1="1106" y1="639" x2="1164" y2="639" stroke="#39403c" stroke-width="2.5" stroke-linecap="round"/><path d="M1160 630L1176 639L1160 648Z" fill="#39403c"/><rect x="1180" y="740" width="300" height="70" rx="12" fill="#fde3df" stroke="#dde3e0" stroke-width="1.5"/><text x="1196" y="770" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">Lv 2 · product / service owner</text><line x1="1330" y1="676" x2="1330" y2="736" stroke="#39403c" stroke-width="2.5"/><rect x="868" y="740" width="236" height="70" rx="12" fill="#eef9f4" stroke="#dde3e0" stroke-width="1.5"/><text x="884" y="770" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#1d1b18" text-anchor="start">Ticket closed</text><line x1="1176" y1="775" x2="1096" y2="775" stroke="#39403c" stroke-width="2.5" stroke-linecap="round"/><path d="M1092 766L1108 775L1092 784Z" fill="#39403c"/><text x="240" y="880" font-family="'Nunito Sans','Segoe UI',Roboto,Arial,sans-serif" font-size="18" font-weight="400" fill="#39403c" text-anchor="start">Slow report submission and hard-to-reach data delay every case — while many questions could be answered before a ticket exists.</text></svg>