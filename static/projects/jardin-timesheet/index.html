     Converted from fe-timesheet (React 18 + Vite + Tailwind 3 + TailAdmin).
     • 1) FONTS      : src/css/satoshi.css (Lato, files in assets/fonts)
     • 2) TAILWIND   : compiled with the project's tailwind.config.cjs + src/css/style.css
                       + every *.module.scss / *.scss converted to plain classes
     • 3) TOASTIFY   : react-toastify/dist/ReactToastify.css (verbatim)
     • 4) APP SCRIPT : icons (react-icons/bs SVGs), dummy data, components, pages, router
     No backend: every API call is replaced by in-memory dummy data.
     The login form is prefilled with a demo account — just click Sign In.
     ============================================================ -->

/* ==== components/Loading (LoadingScreen.scss + Indicator/Spinner.scss) ==== */

#loading-screen {
  position: fixed;
  z-index: 99999999;
  width: 100%;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.4);
  top: 0;
  left: 0;
}

.lds-ellipsis, .lds-ellipsis div {
  box-sizing: border-box;
}

.lds-ellipsis {
  color: #093028;
  display: inline-block;
  width: 80px;
  height: 80px;
  position: absolute;
  top: 50%;
  left: 50%;
  margin-right: -50%;
  transform: translate(-50%, -50%);
}

.lds-ellipsis div {
  position: absolute;
  top: 33.33333px;
  width: 13.33333px;
  height: 13.33333px;
  border-radius: 50%;
  background: currentColor;
  animation-timing-function: cubic-bezier(0, 1, 1, 0);
}

.lds-ellipsis div:nth-child(1) {
  left: 8px;
  animation: lds-ellipsis1 0.6s infinite;
}

.lds-ellipsis div:nth-child(2) {
  left: 8px;
  animation: lds-ellipsis2 0.6s infinite;
}

.lds-ellipsis div:nth-child(3) {
  left: 32px;
  animation: lds-ellipsis2 0.6s infinite;
}

.lds-ellipsis div:nth-child(4) {
  left: 56px;
  animation: lds-ellipsis3 0.6s infinite;
}

@keyframes lds-ellipsis1 {
  0% {
    transform: scale(0);
  }

  100% {
    transform: scale(1);
  }
}

@keyframes lds-ellipsis3 {
  0% {
    transform: scale(1);
  }

  100% {
    transform: scale(0);
  }
}

@keyframes lds-ellipsis2 {
  0% {
    transform: translate(0, 0);
  }

  100% {
    transform: translate(24px, 0);
  }
}

/* =====================================================================
   1) CORE — utilities, icons, storage, shared components
   (mirrors src/common/*, src/components/*)
   ===================================================================== */
const ic = (name, cls = '') =>
  (ICONS[name] || '').replace('<svg ', `<svg height="1em" width="1em" class="${cls}" `);

const esc = (v) =>
  String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('jl_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('jl_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('jl_' + k); } catch (e) {} },
};

const uid = (() => { let i = 0; return (p = 'u') => p + (++i); })();
const go = (path) => { location.hash = '#' + path; };
const fmtNum = (v, d = 2) =>
  v === '' || v == null || isNaN(v) ? (v ?? '') : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = (v) => {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
};

const APPROVAL = {
  CREATE_NEED_APPROVAL: 'Create & Need Approval',
  EDIT_NEED_APPROVAL: 'Edit & Need Approval',
  ACTIVED: 'Active',
  REJECT_CREATED: 'Reject Created',
  REJECT_UPDATED: 'Reject Updated',
};

/* ---------- common/Button ---------- */
function Button({ label = '', variant = 'primary', size = 'md', type = 'button', leftIcon = '', rightIcon = '', className = '', attrs = '', disabled = false, showLabel = true }) {
  return `<button type="${type}" ${attrs} ${disabled ? 'disabled' : ''} class="btn btn-${variant} btn-${size} ${disabled ? 'btn-disabled' : ''} ${className}">${
    leftIcon ? `<span class="btn-icon">${leftIcon}</span>` : ''}${showLabel ? `<span class="btn-label">${esc(label)}</span>` : ''}${
    rightIcon ? `<span class="btn-icon">${rightIcon}</span>` : ''}</button>`;
}

/* ---------- common/Form/InputText ---------- */
function InputText({ label, name = '', type = 'text', placeholder = '', value = '', required = false, hint = '', disabled = false, iconRight = '', togglePassword = false, className = '', attrs = '' }) {
  const pw = togglePassword && type === 'password';
  return `<div class="flex flex-col gap-1" data-field="${esc(name)}">
    ${label ? `<span class="mb-1.5 block font-medium text-sm text-black ">${esc(label)} ${required ? '<span class="text-red-500 font-bold">*</span>' : ''}</span>` : ''}
    <div class="relative">
      <input name="${esc(name)}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${disabled ? 'disabled' : ''} ${required ? 'data-required="1"' : ''} data-label="${esc(label || '')}" ${attrs}
        class="w-full rounded-lg border border-stroke bg-transparent py-3 pl-6 pr-10 text-black outline-none focus:border-primary focus-visible:shadow-none dark:border-form-strokedark dark:bg-form-input dark:focus:border-primary disabled:bg-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed ${className}" />
      <div class="absolute right-4 top-4 flex items-center gap-2">
        ${pw ? `<span data-action="toggle-pw" class="cursor-pointer text-gray-400">${ic('BsEye', 'w-4 h-4')}</span>` : ''}
        ${iconRight}
      </div>
    </div>
    <span class="text-red-500 hint" ${hint ? '' : 'hidden'}>${esc(hint)}</span>
  </div>`;
}

/* ---------- common/Form/InputRadio ---------- */
function InputRadio({ label, name, options, selected, required }) {
  return `<div class="flex flex-col gap-1" data-field="${esc(name)}">
    ${label ? `<span class="mb-2.5 block font-medium text-sm text-black ">${esc(label)} ${required ? '*' : ''}</span>` : ''}
    <div class="relative">
      ${options.map((o) => {
        const id = uid('r');

/* ---------- react-select clone (SingleSelect / AutocompleteDebounce / GroupSelect) ---------- */
const SELECTS = {};
const RS_ARROW = '<svg height="20" width="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false" style="display:inline-block;fill:currentColor;line-height:1;stroke:currentColor;stroke-width:0"><path d="M4.516 7.548c0.436-0.446 1.043-0.481 1.576 0l3.908 3.747 3.908-3.747c0.533-0.481 1.141-0.446 1.574 0 0.436 0.445 0.408 1.197 0 1.615-0.406 0.418-4.695 4.502-4.695 4.502-0.217 0.223-0.502 0.335-0.787 0.335s-0.57-0.112-0.789-0.335c0 0-4.287-4.084-4.695-4.502s-0.436-1.17 0-1.615z"></path></svg>';
const RS_CROSS = (s = 20) => `<svg height="${s}" width="${s}" viewBox="0 0 20 20" aria-hidden="true" focusable="false" style="display:inline-block;fill:currentColor;line-height:1;stroke:currentColor;stroke-width:0"><path d="M14.348 14.849c-0.469 0.469-1.229 0.469-1.697 0l-2.651-3.030-2.651 3.029c-0.469 0.469-1.229 0.469-1.697 0-0.469-0.469-0.469-1.229 0-1.697l2.758-3.15-2.759-3.152c-0.469-0.469-0.469-1.228 0-1.697s1.228-0.469 1.697 0l2.652 3.031 2.651-3.031c0.469-0.469 1.228-0.469 1.697 0s0.469 1.229 0 1.697l-2.758 3.152 2.758 3.15c0.469 0.469 0.469 1.229 0 1.698z"></path></svg>`;

/**
 * variant: 'auto' (AutocompleteDebounce: ▾ indicator + loading dots),
 *          'single' (SingleSelect: default chevron), 'group' (GroupSelect: blue focus)
 */
function Select({ name = '', label = '', options = [], value = null, placeholder = 'Select...', variant = 'single', multi = false, clearable = false, required = false, disabled = false, className = '', onChange = null }) {
  const id = uid('rs');
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: String(o) }));
  let val = multi ? [].concat(value || []).map((v) => opts.find((o) => o.value === v || o.label === v) || { value: v, label: v }) : value != null && value !== '' ? opts.find((o) => o.value === value || o.label === value) || { value, label: value } : null;
  SELECTS[id] = { id, name, opts, val, multi, placeholder, variant, clearable, disabled, onChange, loading: variant === 'auto', query: '', focusIdx: 0 };
  if (variant === 'auto') setTimeout(() => { if (SELECTS[id]) { SELECTS[id].loading = false; rsPaint(id); } }, 500);
  return `<div class="flex flex-col gap-1 w-full" data-field="${esc(name)}">
    ${label ? `<span class="mb-1.5 block font-medium text-sm text-black ">${esc(label)} ${required ? '<span class="text-red-500 font-bold">*</span>' : ''}</span>` : ''}
    <div class="relative"><div id="${id}" class="rs ${variant === 'group' ? 'rs-group' : ''} ${multi ? 'is-multi' : ''} ${disabled ? 'is-disabled' : ''} ${className}" data-rs="${id}" ${required ? 'data-required="1"' : ''} data-label="${esc(label)}">${rsInner(SELECTS[id])}</div></div>
    <span class="text-red-500 hint" hidden></span>
  </div>`;
}

function rsInner(s) {
  const hasVal = s.multi ? s.val.length : !!s.val;
  const valueHtml = s.multi
    ? s.val.map((v, i) => `<div class="rs-mv"><div class="rs-mv-label">${esc(v.label)}</div><div class="rs-mv-remove" data-rs-remove="${i}">${RS_CROSS(14)}</div></div>`).join('')
    : s.val && !s.query ? `<div class="rs-single">${esc(s.val.label)}</div>` : '';
  const ph = !hasVal && !s.query ? `<div class="rs-placeholder">${esc(s.placeholder)}</div>` : '';
  const ind = s.variant === 'auto' ? '<span style="font-size:1.25rem">&#9662;</span> ' : RS_ARROW;
  return `<div class="rs-control">
      <div class="rs-value">${ph}${valueHtml}<input class="rs-input" autocomplete="off" value="${esc(s.query)}" ${s.disabled ? 'disabled' : ''} /></div>
      <div class="rs-indicators">
        ${s.clearable && hasVal ? `<div class="rs-clear" data-rs-clear>${RS_CROSS()}</div>` : ''}
        ${s.loading ? '<div class="rs-loading"><span></span><span></span><span></span></div>' : ''}
        <span class="rs-sep"></span><div class="rs-dropdown">${ind}</div>
      </div>
    </div>`;
}

function rsPaint(id) {
  const s = SELECTS[id];
  const el = document.getElementById(id);
  if (!s || !el) return;
  const focused = el.classList.contains('is-focused');
  el.innerHTML = rsInner(s);
  if (focused) { const inp = el.querySelector('.rs-input'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

let RS_OPEN = null;
function rsOpen(id) {
  if (RS_OPEN && RS_OPEN !== id) rsClose();
  const s = SELECTS[id];
  if (!s || s.disabled) return;
  RS_OPEN = id;
  const el = document.getElementById(id);
  el.classList.add('is-focused');
  if (s.variant === 'auto' && !s.loading && !s._loadedOnce) {
    s.loading = true; s._loadedOnce = true; rsPaint(id);
    setTimeout(() => { s.loading = false; rsPaint(id); rsMenu(); }, 350);
  }
  rsMenu();
  el.querySelector('.rs-input').focus();
}
function rsFiltered(s) {
  const q = s.query.toLowerCase();
  return s.opts.filter((o) => (!s.multi || !s.val.some((v) => v.value === o.value)) && o.label.toLowerCase().includes(q));
}
function rsMenu() {
  document.querySelectorAll('.rs-menu').forEach((m) => m.remove());
  if (!RS_OPEN) return;
  const s = SELECTS[RS_OPEN];
  const el = document.getElementById(RS_OPEN);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const list = rsFiltered(s);
  const m = document.createElement('div');
  m.className = 'rs-menu';
  m.style.left = r.left + 'px';
  m.style.width = r.width + 'px';
  const below = window.innerHeight - r.bottom;
  m.innerHTML = `<div class="rs-menu-list">${
    s.loading ? '<div class="rs-nooptions">Loading...</div>'
      : list.length ? list.map((o, i) => `<div class="rs-option ${i === s.focusIdx ? 'is-focused' : ''} ${!s.multi && s.val && s.val.value === o.value ? 'is-selected' : ''}" data-rs-opt="${i}">${esc(o.label)}</div>`).join('')
      : '<div class="rs-nooptions">No options</div>'}</div>`;
  document.body.appendChild(m);
  if (below < m.offsetHeight + 16 && r.top > below) m.style.top = r.top - m.offsetHeight - 16 + 'px';
  else m.style.top = r.bottom + 'px';
  m.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const opt = e.target.closest('[data-rs-opt]');
    if (opt) rsPick(RS_OPEN, list[+opt.dataset.rsOpt]);
  });
  m.addEventListener('mousemove', (e) => {
    const opt = e.target.closest('[data-rs-opt]');
    if (opt && s.focusIdx !== +opt.dataset.rsOpt) {
      s.focusIdx = +opt.dataset.rsOpt;
      m.querySelectorAll('.rs-option').forEach((o, i) => o.classList.toggle('is-focused', i === s.focusIdx));
    }
  });
}
function rsPick(id, o) {
  const s = SELECTS[id];
  if (!o) return;
  if (s.multi) s.val.push(o); else s.val = o;
  s.query = ''; s.focusIdx = 0;
  rsPaint(id);
  const el = document.getElementById(id);
  el && el.closest('[data-field]')?.querySelector('.hint')?.setAttribute('hidden', '');
  if (s.onChange) s.onChange(s.multi ? s.val : s.val);
  el && el.dispatchEvent(new CustomEvent('rs-change', { bubbles: true }));
  if (!s.multi) rsClose(); else rsMenu();
}
function rsClose() {
  if (!RS_OPEN) return;
  const s = SELECTS[RS_OPEN];
  const el = document.getElementById(RS_OPEN);
  if (s) s.query = '';
  RS_OPEN = null;
  document.querySelectorAll('.rs-menu').forEach((m) => m.remove());
  if (el) { el.classList.remove('is-focused'); rsPaint(el.id); }
}
const rsValue = (id) => { const s = SELECTS[id]; return !s ? null : s.multi ? s.val.map((v) => v.value) : s.val ? s.val.value : null; };
const rsLabel = (id) => { const s = SELECTS[id]; return !s ? '' : s.multi ? s.val.map((v) => v.label).join(', ') : s.val ? s.val.label : ''; };

document.addEventListener('mousedown', (e) => {
  const clr = e.target.closest('[data-rs-clear]');
  const rem = e.target.closest('[data-rs-remove]');
  const rs = e.target.closest('[data-rs]');
  if (clr && rs) {
    e.preventDefault();
    const s = SELECTS[rs.id]; s.val = s.multi ? [] : null; rsPaint(rs.id); s.onChange && s.onChange(s.val); rs.dispatchEvent(new CustomEvent('rs-change', { bubbles: true })); return;
  }
  if (rem && rs) {
    e.preventDefault();
    const s = SELECTS[rs.id]; s.val.splice(+rem.dataset.rsRemove, 1); rsPaint(rs.id); rsMenu(); return;
  }
  if (rs) {
    if (e.target.classList.contains('rs-input') && RS_OPEN === rs.id) return;
    e.preventDefault();
    if (RS_OPEN === rs.id) rsClose(); else rsOpen(rs.id);
    return;
  }
  if (!e.target.closest('.rs-menu')) rsClose();
});
document.addEventListener('input', (e) => {
  if (!e.target.classList.contains('rs-input')) return;
  const rs = e.target.closest('[data-rs]');
  const s = SELECTS[rs.id];
  s.query = e.target.value; s.focusIdx = 0;
  rsPaint(rs.id);
  if (RS_OPEN !== rs.id) rsOpen(rs.id); else rsMenu();
});
document.addEventListener('keydown', (e) => {
  if (!RS_OPEN || !e.target.classList.contains('rs-input')) return;
  const s = SELECTS[RS_OPEN];
  const list = rsFiltered(s);
  if (e.key === 'ArrowDown') { s.focusIdx = Math.min(list.length - 1, s.focusIdx + 1); rsMenu(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { s.focusIdx = Math.max(0, s.focusIdx - 1); rsMenu(); e.preventDefault(); }
  if (e.key === 'Enter') { rsPick(RS_OPEN, list[s.focusIdx]); e.preventDefault(); }
  if (e.key === 'Escape') rsClose();
});
window.addEventListener('resize', () => rsMenu());
document.addEventListener('scroll', (e) => { if (RS_OPEN && !e.target.closest?.('.rs-menu')) rsMenu(); }, true);

/* ---------- common/Modal (headlessui Dialog + framer-motion) ---------- */
function openModal(html, className = 'w-full max-w-[500px] bg-white p-6', onMount) {
  closeModal(true);
  const wrap = document.createElement('div');
  wrap.className = 'relative z-[999999]';
  wrap.id = 'modal-root';
  wrap.innerHTML = `<div class="fixed w-full h-full z-[50] top-0 left-0 grid place-items-center px-5 bg-[#1B1B1B]/50" data-modal-backdrop>
      <div class="modal-panel w-full h-fit bg-white rounded-2xl relative flex flex-col gap-6 ${className}">${html}</div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('[data-modal-backdrop]').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.querySelector('.modal-panel').classList.add('is-open')));
  const af = wrap.querySelector('[autofocus]'); af && setTimeout(() => af.focus(), 30);
  onMount && onMount(wrap);
  return wrap;
}
function closeModal(instant) {
  const w = document.getElementById('modal-root');
  if (!w) return;
  if (instant) return w.remove();
  w.id = '';
  w.querySelector('.modal-panel').classList.remove('is-open');
  setTimeout(() => w.remove(), 200);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.getElementById('modal-root')) closeModal(); });

function confirmDelete(onYes, text = 'Are you sure you want to Delete this data?') {

      <button data-no class="text-light-700 hover:text-light-700 border border-light-700 hover:bg-light-800 focus:ring-4 focus:outline-none focus:ring-light-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2">Cancel</button>
    </div>`, undefined, (w) => {

}

const TOAST_ICON = {

function toast(msg, type = 'success') {
  let c = document.querySelector('.Toastify__toast-container--top-right');
  if (!c) {
    const root = document.createElement('div'); root.className = 'Toastify';
    root.innerHTML = '<div class="Toastify__toast-container Toastify__toast-container--top-right"></div>';
    document.body.appendChild(root);
    c = root.firstChild;
  }
  const t = document.createElement('div');
  t.className = `Toastify__toast Toastify__toast-theme--light Toastify__toast--${type} Toastify__bounce-enter--top-right`;
  t.innerHTML = `<div role="alert" class="Toastify__toast-body"><div class="Toastify__toast-icon Toastify--animate-icon Toastify__zoom-enter">${TOAST_ICON[type]}</div><div>${esc(msg)}</div></div>
    <button class="Toastify__close-button Toastify__close-button--light" type="button" aria-label="close"><svg aria-hidden="true" viewBox="0 0 14 16"><path fill-rule="evenodd" d="M7.71 8.23l3.75 3.75-1.48 1.48-3.75-3.75-3.75 3.75L1 11.98l3.75-3.75L1 4.48 2.48 3l3.75 3.75L9.98 3l1.48 1.48-3.75 3.75z"></path></svg></button>
    <div role="progressbar" class="Toastify__progress-bar Toastify__progress-bar--animated Toastify__progress-bar-theme--light Toastify__progress-bar--${type}" style="animation-duration:5000ms;animation-play-state:running;opacity:1"></div>`;
  c.appendChild(t);
  const kill = () => {
    t.classList.remove('Toastify__bounce-enter--top-right'); t.classList.add('Toastify__bounce-exit--top-right');
    setTimeout(() => t.remove(), 750);
  };
  t.querySelector('.Toastify__close-button').onclick = kill;
  t.querySelector('.Toastify__progress-bar').addEventListener('animationend', kill);
  t.addEventListener('mouseenter', () => (t.querySelector('.Toastify__progress-bar').style.animationPlayState = 'paused'));
  t.addEventListener('mouseleave', () => (t.querySelector('.Toastify__progress-bar').style.animationPlayState = 'running'));
}

/* ---------- components/Pagination ---------- */
function Pagination(current, totalPages, totalRecords) {
  const pg = (i) => `<a href="#" data-page="${i}" class="relative inline-flex items-center px-4 py-2 text-sm font-semibold ${i === current ? 'bg-primary text-white' : 'text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50'}">${i}</a>`;
  const pages = [];
  const start = Math.max(1, current - 1), end = Math.min(totalPages, current + 1);
  if (start > 1) { pages.push(pg(1)); if (start > 2) pages.push('<span class="px-2">...</span>'); }
  for (let i = start; i <= end; i++) pages.push(pg(i));
  if (end < totalPages) { if (end < totalPages - 1) pages.push('<span class="px-2">...</span>'); pages.push(pg(totalPages)); }
  return `<div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6">
    <div class="flex flex-1 justify-between sm:hidden">
      <a href="#" data-page="${Math.max(1, current - 1)}" class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Previous</a>
      <a href="#" data-page="${Math.min(totalPages || 1, current + 1)}" class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Next</a>
    </div>
    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
      <div><p class="text-sm text-gray-700">Showing<span class="font-medium"> ${totalRecords ? (current - 1) * 30 + 1 : 1} </span>to<span class="font-medium"> ${Math.min(current * 30, totalRecords)} </span>of<span class="font-medium"> ${totalRecords} </span>results</p></div>
      <div><nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
        <a href="#" data-page="${Math.max(1, current - 1)}" class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0"><span class="sr-only">Previous</span><svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/></svg></a>
        ${pages.join('')}
        <a href="#" data-page="${Math.min(totalPages || 1, current + 1)}" class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 focus:z-20 focus:outline-offset-0"><span class="sr-only">Next</span><svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg></a>
      </nav></div>
    </div>
  </div>`;
}

function syncDropdownToPath(path) {
  if (UI.lastPath === path) return;

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]');
  // ClickOutside for header dropdowns + sidebar
  if (UI.userOpen && !e.target.closest('[data-clickoutside="user"]')) { UI.userOpen = false; paintHeader(); }
  if (UI.notifOpen && !e.target.closest('[data-clickoutside="notif"]')) { UI.notifOpen = false; paintHeader(); }
  if (UI.sidebarOpen && !e.target.closest('#sidebar') && !e.target.closest('[data-action="sidebar-toggle"]')) { UI.sidebarOpen = false; applySidebarOpen(); }
  if (!a) return;
  const act = a.dataset.action;
  if (act === 'noop') { e.preventDefault(); }
  if (act === 'sidebar-toggle') { e.stopPropagation(); UI.sidebarOpen = !UI.sidebarOpen; applySidebarOpen(); }
  if (act === 'sidebar-group') {
    e.preventDefault();
    if (!sidebarExpanded) { sidebarExpanded = true; store.set('sidebar-expanded', true); }
    else UI.openDropdown = UI.openDropdown === a.dataset.mini ? null : a.dataset.mini;
    paintSidebar();
  }
  if (act === 'notif-toggle') { e.preventDefault(); UI.notifying = false; UI.notifOpen = !UI.notifOpen; paintHeader(); }
  if (act === 'user-toggle') { e.preventDefault(); UI.userOpen = !UI.userOpen; paintHeader(); }
  if (act === 'logout') { store.del('token'); UI.userOpen = false; go('/login'); }
  if (act === 'toggle-pw') {
    const inp = a.closest('.relative').querySelector('input');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    a.innerHTML = ic(show ? 'BsEyeSlash' : 'BsEye', 'w-4 h-4');
  }
});

const LIST_STATE = {};
function listState(cfg) {
  if (!LIST_STATE[cfg.key]) LIST_STATE[cfg.key] = { page: 1, search: '', sortKey: 'created_at', sortOrder: 'desc', showSearch: true, filters: {}, dateFrom: '', dateTo: '', cols: cfg.cols.map((c) => ({ key: c[0], label: c[1], sortable: c[2] !== 0, show: true })) };
  return LIST_STATE[cfg.key];
}
function visibleRows(cfg) {
  const st = listState(cfg);
  let rows = rowsOf(cfg).slice();
  const q = st.search.trim().toLowerCase();
  if (q) rows = rows.filter((r) => cfg.cols.some(([k]) => String(r[k] ?? '').toLowerCase().includes(q)));
  Object.entries(st.filters).forEach(([ph, v]) => {
    if (!v || /^All /.test(v)) return;
    rows = rows.filter((r) => Object.values(r).some((x) => String(x).includes(v)));

function applyShowIf(form) {
  form.querySelectorAll('[data-showif]').forEach((w) => {
    const ctl = w.dataset.showif;
    const radio = form.querySelector(`input[type=radio][name="${CSS.escape(ctl)}"]:checked`);
    const rs = form.querySelector(`[data-field="${CSS.escape(ctl)}"] [data-rs]`);
    const cur = radio ? radio.value : rs ? rsLabel(rs.id) : '';
    w.hidden = cur !== w.dataset.showval;
  });
}
function readForm(form) {
  const out = {};
  form.querySelectorAll('[data-field]').forEach((fw) => {
    if (fw.closest('[hidden]')) return;
    const name = fw.dataset.field;
    if (!name) return;
    const rs = fw.querySelector('[data-rs]');
    const radio = fw.querySelector('input[type=radio]:checked');
    const inp = fw.querySelector('input:not([type=radio]):not([type=file]):not(.rs-input)');
    if (rs) out[name] = rsLabel(rs.id);
    else if (fw.dataset.files) out[name] = [...fw.querySelectorAll('[data-file-list] li span')].map((s) => s.textContent);
    else if (radio) out[name] = radio.value;
    else if (inp) out[name] = inp.value;
  });
  return out;
}
function validateForm(form) {
  let ok = true;
  form.querySelectorAll('[data-field]').forEach((fw) => {
    if (fw.closest('[hidden]')) return;
    const rs = fw.querySelector('[data-rs]');
    const inp = fw.querySelector('input[data-required]');
    let msg = '';
    if (rs && rs.dataset.required && !(rsValue(rs.id) && String(rsValue(rs.id)).length)) msg = `${rs.dataset.label} is required`;
    if (inp && !inp.value.trim()) msg = `${inp.dataset.label} is required`;
    if (fw.dataset.files && fw.querySelector('.text-red-500.font-bold') && !fw.querySelectorAll('[data-file-list] li').length) msg = 'At least one file must be uploaded';
    const h = fw.querySelector(':scope > .hint') || fw.querySelector('.hint');
    if (h) { h.textContent = msg; msg ? h.removeAttribute('hidden') : h.setAttribute('hidden', ''); }
    if (msg) ok = false;
  });
  const pw = form.querySelector('[name="password"]'), cpw = form.querySelector('[name="confirm_password"]');
  if (pw && cpw && pw.value !== cpw.value) { setHint(form, 'confirm_password', "Passwords don't match"); ok = false; }
  if (!ok) form.querySelector('.hint:not([hidden])')?.closest('[data-field]')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return ok;
}
function bindForm(cfg, mode, row, REP, base) {
  const form = document.getElementById('mform');

  form.addEventListener('change', (e) => {
    applyShowIf(form);
    if (e.target.type === 'file') {

      [...e.target.files].forEach((f) => { if (ul.children.length < 10) ul.insertAdjacentHTML('beforeend', `<li class="flex items-center justify-between"><span>${esc(f.name)}</span><button type="button" data-rm-file class="ml-2 text-red-500 hover:underline text-xs">Remove</button></li>`); });
      ul.classList.toggle('hidden', !ul.children.length);

      const R = REP[k];

      const current = readForm(wrap);

        const d = {}; R.sec.fields.forEach(([, , key]) => (d[key] = current[`${k}.${i}.${key}`])); return d;
      });

}
function saveRow(cfg, vals, mode, row) {
  const flat = {};
  Object.entries(vals).forEach(([k, v]) => { if (!k.includes('.')) flat[k] = v; });
  if (vals['works.0.name_of_work'] != null) cfg.form.sections.find((s) => s.works).fields.forEach(([, , key]) => (flat[key] = vals[`works.0.${key}`]));
  if (cfg.form.subMatter) {
    const subs = [];
    for (let i = 0; vals[`sm.${i}.name`] != null; i++) if (vals[`sm.${i}.name`]) subs.push({ id: i + 1, name: vals[`sm.${i}.name`], notes: vals[`sm.${i}.notes`] || '-', code: `${String(row ? row.id : cfg.rows.length + 1).padStart(3, '0')}.${String(i + 1).padStart(2, '0')}` });
    flat.sub_matters = subs.length ? subs : row ? row.sub_matters : [];
  }
  if (cfg.key === 'matter') { flat.name = `${flat.client_abbr} - ${flat.matter_display_name}`; flat.client = (CLIENTS.find((c) => c.client_abbr === flat.client_abbr) || {}).client_name; }
  if (cfg.key === 'client') flat.client_name = [flat.prefix, flat.name].filter(Boolean).join(' ');
  if (mode === 'edit') {
    const before = { ...row };
    Object.assign(row, flat);
    if (cfg.approval) { row.change = before; setStatus(row, 'EDIT_NEED_APPROVAL'); }
  } else {
    const r = Object.assign({ id: nextId(cfg.rows) }, flat);
    if (cfg.approval) setStatus(r, 'CREATE_NEED_APPROVAL');
    if (cfg.key === 'client') Object.assign(r, { client_code: String(r.id).padStart(3, '0'), entity_form: r.status });
    if (cfg.key === 'matter') Object.assign(r, { new_metter_code: `${String(r.id).padStart(3, '0')}.001`, created_at: new Date().toISOString().slice(0, 10), updated_at: new Date().toISOString().slice(0, 10) });
    if (cfg.key === 'activities') Object.assign(r, { personnel_initial: (PEOPLE.find((p) => p.name === r.personnel_name) || {}).ini, status: 'Unbilled', net_hours: r.hours, month: new Date(r.date).toLocaleString('en', { month: 'long' }) });
    cfg.rows.push(r);
  }
}

function NotFound() {
  page().innerHTML = `${Breadcrumb('Data Not Found')}<div class="rounded-sm border border-stroke bg-white p-10 shadow-default text-center">The data you are looking for does not exist (it may have been deleted in this demo session).<div class="mt-6">${Button({ label: 'Back to Home', attrs: 'onclick="location.hash=\'#/\'"' })}</div></div>`;
}


/* =====================================================================
   5) ROUTER — hash version of App.tsx + routes/main.routes.tsx
   ===================================================================== */
const ROUTES = [];
const route = (pattern, fn, title) => ROUTES.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '([^/]+)') + '$'), fn, title });
const T = (s) => `${s} Jardin Legal | Timesheet`;

// Pages that live outside DefaultLayout
const AUTH = { '/login': LoginPage, '/forgot-password': ForgotPage, '/reset-password': ResetPage };

// Special routes (registered before the generic module routes so they win)
route('/', WelcomePage, 'Jardin Legal | Timesheet');
route('/my-profile', ProfilePage, T('My Profile'));
route('/global-administrations/correspondence', CorrespondencePage, T('Correspondence'));
route('/global-administrations/legal-document', () => ListPage(MOD.ourdoc), T('Legal Documents'));
route('/global-administrations/access', AccessPage, T('Access'));
route('/global-administrations/access/create', () => AccessEditPage(ROLES[0].id, true), T('Create Access'));
route('/global-administrations/access/edit/:id', (id) => AccessEditPage(id), T('Edit Access'));
route('/professional-service/matter/sub-matter', () => ListPage(MOD.submatterall), T('Sub-Matter'));
route('/professional-service/matter/:mid/sub-matter', (mid) => { const c = subMatterCfg(mid); c ? ListPage(c) : NotFound(); }, T('Detail Sub Matter'));
route('/professional-service/matter/:mid/sub-matter/create', (mid) => { const c = subMatterCfg(mid); c ? FormPage(c, 'create') : NotFound(); }, T('Create Sub Matter'));
route('/professional-service/matter/:mid/sub-matter/:id', (mid, id) => { const c = subMatterCfg(mid); c ? FormPage(c, 'edit', id) : NotFound(); }, T('Edit Sub Matter'));
route('/business-development/credentials', () => ListPage(MOD.cv), T('Credentials'));
route('/business-development/credentials/cv-generator/:id/view', CvDocPage, T('Detail CV Generator'));
route('/finance/billing', () => ListPage(MOD.invoice), T('Invoice Dashboard'));
route('/finance/billing/invoice-dashboard', InvoiceDashboardPage, T('Invoice Dashboard'));
route('/finance/billing/invoice-register/:id/detail', InvoiceDocPage, T('Document Invoice Register'));
route('/finance/billing/invoice-register/:id/view', (id) => DetailPage(MOD.invoice, id), T('Detail Invoice Register'));
route('/finance/billing/official-receipt/:id/detail', ReceiptDocPage, T('Detail Official Receipt'));
route('/human-resource/people', () => ListPage(MOD.personnel), T('People'));
route('/human-resource/subcontractor', () => ListPage(MOD.subpersonnel), T('Personnel'));

// Generic module routes: list / create / :id (edit) / :id/detail
Object.values(MOD).sort((a, b) => b.base.length - a.base.length).forEach((cfg) => {
  route(cfg.base, () => ListPage(cfg), T(cfg.tab));
  if (cfg.form) {
    route(cfg.base + '/create', () => FormPage(cfg, 'create'), `${cfg.form.create} | Jardin Legal | Timesheet`);
    if (cfg.detail) route(cfg.base + '/:id/detail', (id) => DetailPage(cfg, id), T(cfg.detail.title));
    route(cfg.base + '/:id', (id) => FormPage(cfg, 'edit', id), `${cfg.form.edit} | Jardin Legal | Timesheet`);
  }
});

// "Under construction" menus (exist in main.routes.tsx, hidden from the sidebar for empty accessCode)
['/global-administrations/minutes', '/global-administrations/templates', '/global-administrations/calendar', '/global-administrations/procurement', '/global-administrations/logistics', '/global-administrations/helpdesk',
 '/professional-service/deliverables', '/professional-service/communication', '/professional-service/feedback', '/professional-service/research', '/professional-service/due-diligence', '/professional-service/contract-management', '/professional-service/subcontracts',
 '/business-development/origination', '/business-development/marketing', '/business-development/events', '/business-development/media', '/business-development/relationship', '/finance/assets',
 '/human-resource/payroll', '/human-resource/recruitment', '/human-resource/internship', '/human-resource/leave', '/human-resource/evaluation', '/human-resource/training',
 '/risk-and-compliance/risks', '/risk-and-compliance/compliance', '/risk-and-compliance/governance', '/risk-and-compliance/internal-audit', '/risk-and-compliance/legal-clearance', '/risk-and-compliance/ethics', '/risk-and-compliance/regulatory', '/risk-and-compliance/whistleblower', '/risk-and-compliance/data-privacy',
].forEach((p) => route(p, UnderPage, T(p.split('/').pop().replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()))));

function render() {
  const path = currentPath();
  rsClose(); closeModal(true);
  document.querySelectorAll('.topContentSetColumnMenu').forEach((m) => m.remove());
  for (const k in SELECTS) delete SELECTS[k];
  const authed = !!store.get('token');

  if (AUTH[path]) {
    if (path === '/login' && authed) return go('/');
    document.title = 'Jardin Legal - Timesheet';
    UI.lastPath = null;
    return AUTH[path]();
  }
  if (!authed) return go('/login');

  renderShell(path);
  const p = page();
  p.onclick = null;
  const hit = ROUTES.find((r) => r.re.test(path));
  if (hit) { document.title = hit.title; hit.fn(...path.match(hit.re).slice(1)); }
  else { document.title = 'Jardin Legal | Timesheet'; NotFound(); }
  const area = document.getElementById('content-area');
  if (area) area.scrollTop = 0;
}

/* ---------- BOOT: App.tsx shows <Loader /> (Lottie) for 1s, then routes ---------- */
(function boot() {
  const root = document.getElementById('root');
  root.innerHTML = '<div class="flex h-screen items-center justify-center bg-white bg-opacity-50"><div id="lottie" style="width:200px;height:200px"></div></div>';
  try { window.lottie && lottie.loadAnimation({ container: document.getElementById('lottie'), renderer: 'svg', loop: true, autoplay: true, animationData: LOADING_JSON }); } catch (e) {}
  setTimeout(() => {
    root.innerHTML = '';
    window.addEventListener('hashchange', render);
    render();
  }, 1000);
})();

</script>
