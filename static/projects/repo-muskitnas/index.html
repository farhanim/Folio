const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};let files=read('museumFiles',initialFiles),users=read('museumUsers',initialUsers),user=read('museumUser',null),page='dashboard',filterSection='',query='',fromDate='',toDate='',selected=new Set(),currentPage=1,perPage=6,editingId=null,aboutTab='Penggunaan aplikasi';const save=()=>{localStorage.setItem('museumFiles',JSON.stringify(files));localStorage.setItem('museumUsers',JSON.stringify(users))};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let loginSlideIndex=0,loginCarouselTimer=null;function showLoginSlide(index){let slides=[...document.querySelectorAll('.login-slide')],dots=[...document.querySelectorAll('.carousel-indicators button')];if(!slides.length)return;loginSlideIndex=(index+slides.length)%slides.length;slides.forEach((el,i)=>el.classList.toggle('active',i===loginSlideIndex));dots.forEach((el,i)=>{el.classList.toggle('active',i===loginSlideIndex);el.setAttribute('aria-current',i===loginSlideIndex?'true':'false')})}function moveLoginSlide(delta){showLoginSlide(loginSlideIndex+delta);restartLoginCarousel()}function startLoginCarousel(){if(loginCarouselTimer)clearInterval(loginCarouselTimer);loginSlideIndex=0;showLoginSlide(0);loginCarouselTimer=setInterval(()=>showLoginSlide(loginSlideIndex+1),5000);let gallery=document.querySelector('.login-picture');gallery?.addEventListener('mouseenter',()=>clearInterval(loginCarouselTimer));gallery?.addEventListener('mouseleave',()=>{clearInterval(loginCarouselTimer);loginCarouselTimer=setInterval(()=>showLoginSlide(loginSlideIndex+1),5000)})}function restartLoginCarousel(){if(loginCarouselTimer)clearInterval(loginCarouselTimer);loginCarouselTimer=setInterval(()=>showLoginSlide(loginSlideIndex+1),5000)}function render(){if(!user)return login();let sectionLinks=sections.map(s=>`<button onclick="setSection('${s}')">${s}</button>`).join('');document.getElementById('root').innerHTML=`<div class="app"><nav class="navbar"><a class="brand" href="#" onclick="go('dashboard');return false"><img src="assets/logo-museum.webp"><span><b>Repositori Surat Dan Arsip Digital</b><small>Aplikasi Museum Kebangkitan Nasional</small></span></a><div class="navlinks"><button class="${page==='dashboard'?'active':''}" onclick="go('dashboard')">Beranda</button><div class="dropdown"><button onclick="toggleCategoryMenu(this)" aria-expanded="false">Arsip Tata Usaha </button><div class="dropdown-content">${sectionLinks}</div></div><div class="dropdown"><button onclick="toggleCategoryMenu(this)" aria-expanded="false">Arsip Teknis </button><div class="dropdown-content">${sections.slice(8).map(s=>`<button onclick="setSection('${s}')">${s}</button>`).join('')}</div></div><button class="${page==='about'?'active':''}" onclick="go('about')">Tentang Aplikasi</button></div><div class="dropdown"><button class="user-menu" onclick="toggleAccountMenu(this)">Halo, <b>${esc(user.name.split(' ')[0])}</b> </button><div class="dropdown-content account-menu" style="left:auto;right:0"><div class="menu-meta"><b>${esc(user.name)}</b><small>${esc(user.role)} - ${esc(user.email)}</small></div><button onclick="go('users')">Kelola Pengguna</button><button onclick="go('profile')">Profil Saya</button><button class="signout-item" onclick="logout()">Keluar</button></div></div></nav><main class="main">${page==='dashboard'?dashboard():page==='users'?userPage():page==='profile'?profilePage():aboutPage()}</main><footer class="footer">Copyright ${new Date().getFullYear()} <b>Museum Kebangkitan Nasional</b>. All rights reserved.</footer></div>`}
function toggleCategoryMenu(btn){let parent=btn.closest('.dropdown'),open=!parent.classList.contains('open');document.querySelectorAll('.navlinks .dropdown').forEach(item=>{item.classList.remove('open');let trigger=item.querySelector(':scope > button');if(trigger)trigger.setAttribute('aria-expanded','false')});if(open){parent.classList.add('open');btn.setAttribute('aria-expanded','true')}}function toggleAccountMenu(btn){let parent=btn.closest('.dropdown');parent.classList.toggle('open');btn.setAttribute('aria-expanded',parent.classList.contains('open')?'true':'false')}document.addEventListener('click',e=>{if(!e.target.closest('.navbar .dropdown'))document.querySelectorAll('.navbar .dropdown.open').forEach(x=>x.classList.remove('open'))});function go(p){page=p;filterSection='';document.querySelectorAll('.navbar .dropdown.open').forEach(x=>x.classList.remove('open'));render()}function logout(){user=null;localStorage.removeItem('museumUser');page='dashboard';login()}function setSection(s){filterSection=s;page='dashboard';render()}
function dashboard(){
let filtered=files.filter(f=>(!filterSection||f.section===filterSection)&&(!query||Object.values(f).join(' ').toLowerCase().includes(query.toLowerCase()))&&(!fromDate||f.date>=fromDate)&&(!toDate||f.date<=toDate));
let start=(currentPage-1)*perPage,rows=filtered.slice(start,start+perPage);
let cards='<div class="metrics"><div class="metric"><div class="metric-label">Total arsip tersimpan</div><div class="metric-value">'+files.length+'</div><div class="metric-note">Dokumen dalam repositori</div></div><div class="metric"><div class="metric-label">Kategori aktif</div><div class="metric-value">'+new Set(files.map(f=>f.section)).size+'</div><div class="metric-note">Dari '+sections.length+' unit kerja</div></div><div class="metric"><div class="metric-label">Pengguna terdaftar</div><div class="metric-value">'+users.length+'</div><div class="metric-note">Akun demo aktif</div></div><div class="metric"><div class="metric-label">Arsip tahun ini</div><div class="metric-value">'+files.filter(f=>f.date.startsWith(String(new Date().getFullYear()))).length+'</div><div class="metric-note">Diperbarui secara lokal</div></div></div>';
let rowsHtml=rows.length?rows.map((f,i)=>'<tr><td><input class="checkbox" type="checkbox" '+(selected.has(f.id)?'checked':'')+' onchange="toggleOne('+f.id+',this.checked)"></td><td>'+(start+i+1)+'</td><td><span class="tag">'+esc(f.code)+'</span></td><td class="document-title">'+esc(f.title)+'<small>Terakhir diperbarui '+esc(f.updated||f.date)+'</small></td><td><span class="category-label">'+esc(f.section)+'</span></td><td class="nowrap">'+esc(f.date)+'</td><td class="nowrap">'+esc(f.letter||'Not assigned')+'</td><td>'+esc(f.author)+'</td><td><div class="row-actions"><button class="iconbtn info" aria-label="Lihat detail" title="Lihat detail" onclick="viewFile('+f.id+')">Lihat</button><button class="iconbtn warning" aria-label="Edit arsip" title="Edit arsip" onclick="openFile('+f.id+')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5Z"/><path d="m13.8 6.7 3.5 3.5"/></svg></button><button class="iconbtn success" aria-label="Unduh arsip" title="Unduh arsip" onclick="downloadFile('+f.id+')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 17v4h14v-4"/></svg></button></div></td></tr>').join(''):'<tr><td class="empty-state" colspan="9"><b>Tidak ada dokumen ditemukan</b><span>Ubah kata kunci atau rentang tanggal, lalu coba lagi.</span></td></tr>';
let pages=Array.from({length:Math.max(1,Math.ceil(filtered.length/perPage))},(_,i)=>'<button class="'+(currentPage===i+1?'on':'')+'" onclick="currentPage='+(i+1)+';refreshTable()">'+(i+1)+'</button>').join('');
return '<div class="crumb">Beranda'+(filterSection?' / Arsip '+esc(filterSection):'')+'</div>'+cards+'<section class="card"><header class="heading"><span class="eyebrow">PUSAT DOKUMEN DIGITAL</span><h1>Repositori Surat dan Arsip</h1><p>Temukan, tinjau, dan kelola dokumen administrasi Museum Kebangkitan Nasional.</p></header><div class="toolbar"><div class="field search-field"><label for="archive-search">Cari dokumen</label><input id="archive-search" placeholder="Judul, kode, nomor surat, atau author" value="'+esc(query)+'" oninput="query=this.value;currentPage=1;refreshTable()"></div><div class="field date-field"><label>Rentang tanggal</label><div class="date-range"><input aria-label="Tanggal mulai" type="date" value="'+fromDate+'" onchange="fromDate=this.value;refreshTable()"><span>hingga</span><input aria-label="Tanggal akhir" type="date" value="'+toDate+'" onchange="toDate=this.value;refreshTable()"></div></div><div class="toolbar-actions"><button class="btn outline" onclick="downloadSelected()">Unduh pilihan</button><button class="btn primary" onclick="openFile()">+ Tambah arsip</button></div></div><div class="table-caption"><div><h2>Semua dokumen</h2><p>Daftar arsip tersimpan dan informasi surat</p></div><span class="result-count">'+filtered.length+' dokumen'+(filterSection?' | Kategori: '+esc(filterSection):'')+'</span></div><div class="table-wrap"><table class="archive-table"><thead><tr><th class="select-col"><input class="checkbox" type="checkbox" aria-label="Pilih semua" onchange="toggleAll(this.checked)"></th><th class="number-col">No.</th><th class="code-col">Kode arsip</th><th class="title-col">Judul dokumen</th><th class="category-col">Kategori</th><th class="date-col">Tanggal</th><th class="letter-col">Nomor surat</th><th class="author-col">Author</th><th class="action-col">Aksi</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div><div class="pagination"><span>Menampilkan '+(filtered.length?start+1:0)+' to '+Math.min(start+perPage,filtered.length)+' dari '+filtered.length+' dokumen</span><div class="pages"><button aria-label="Halaman sebelumnya" onclick="changePage(-1)">Previous</button>'+pages+'<button aria-label="Halaman berikutnya" onclick="changePage(1)">Next</button></div></div></section>'
}
function refreshTable(){let y=window.scrollY;render();window.scrollTo(0,y)}function changePage(d){let max=Math.max(1,Math.ceil(files.length/perPage));currentPage=Math.max(1,Math.min(max,currentPage+d));refreshTable()}function toggleOne(id,on){if(on)selected.add(id);else selected.delete(id)}function toggleAll(on){files.forEach(f=>{if(on)selected.add(f.id);else selected.delete(f.id)});refreshTable()}
function openFile(id=null){editingId=id;let f=files.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit Data Arsip':'Input Data Arsip'}</h2>`,`<form id="fileform"><div class="grid"><div class="field"><label>Kategori</label><select name="section" required>${sections.map(s=>`<option ${f.section===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Author</label><input value="${esc(user.name)}" disabled></div><div class="field wide"><label>Judul Arsip</label><input name="title" required value="${esc(f.title||'')}" placeholder="Isi judul arsip"></div><div class="field"><label>Tanggal Arsip</label><input type="date" name="date" required value="${f.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>No Surat</label><input name="letter" value="${esc(f.letter||'')}" placeholder="Nomor surat"></div><div class="field wide"><label>Upload Files</label><input type="file" name="upload" accept=".pdf,.doc,.docx,.xls,.xlsx"><div class="sub">${f.file?'File saat ini: '+esc(f.file):''}PDF, DOC, DOCX, XLS, XLSX</div></div></div></form>`,`<button class="btn" onclick="closeModal()">Close</button>${id?`<button class="btn danger" onclick="deleteFile(${id})">Hapus</button>`:''}<button class="btn primary" onclick="saveFile()">${id?'Save Change':'Save changes'}</button>`)}
function saveFile(){let form=document.getElementById('fileform');if(!form.reportValidity())return;let fd=new FormData(form),file=files.find(f=>f.id===editingId),upload=form.elements.upload.files[0];if(file){Object.assign(file,{title:fd.get('title'),section:fd.get('section'),date:fd.get('date'),letter:fd.get('letter'),updated:new Date().toISOString().slice(0,10),author:user.name});if(upload)file.file=upload.name}else{files.unshift({id:Date.now(),code:`1-${fd.get('section').slice(0,2).toUpperCase()}-${Date.now()}`,title:fd.get('title'),section:fd.get('section'),date:fd.get('date'),letter:fd.get('letter'),author:user.name,file:upload?.name||'Contoh-Arsip.pdf',updated:new Date().toISOString().slice(0,10)})}save();closeModal();toast('Data arsip berhasil disimpan.');render()}
function deleteFile(id){if(confirm('Hapus arsip ini')){files=files.filter(f=>f.id!==id);selected.delete(id);save();closeModal();toast('Arsip berhasil dihapus.');render()}}function viewFile(id){let f=files.find(x=>x.id===id);modal(`<h2>Detail Arsip</h2>`,`<div class="profile-row"><b>Kode</b><span>${esc(f.code)}</span></div><div class="profile-row"><b>Kategori</b><span>${esc(f.section)}</span></div><div class="profile-row"><b>Judul</b><span>${esc(f.title)}</span></div><div class="profile-row"><b>Tanggal</b><span>${esc(f.date)}</span></div><div class="profile-row"><b>No Surat</b><span>${esc(f.letter)}</span></div><div class="profile-row"><b>Author</b><span>${esc(f.author)}</span></div><div class="profile-row"><b>File</b><span>${esc(f.file)}</span></div>`,`<button class="btn" onclick="closeModal()">Tutup</button><button class="btn success" onclick="downloadFile(${id})">Download</button>`)}function downloadFile(id){let f=files.find(x=>x.id===id);let blob=new Blob([`Contoh berkas arsip digital\n\n${f.title}\n${f.section} - ${f.date}\nNomor: ${f.letter}\n\nIni berkas placeholder untuk demo lokal.`],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.file||'arsip-demo.txt';a.click();URL.revokeObjectURL(a.href);toast('File contoh berhasil diunduh.')}function downloadSelected(){let picked=files.filter(f=>selected.has(f.id));if(!picked.length){toast('Pilih satu atau lebih arsip terlebih dahulu.');return}let text=picked.map(f=>`${f.code}\t${f.title}\t${f.file}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='arsip-terpilih-demo.txt';a.click();URL.revokeObjectURL(a.href);toast(`${picked.length} arsip disiapkan untuk diunduh.`)}
function userPage(){return `<div class="crumb"> Beranda / Kelola Pengguna</div><section class="card"><header class="heading"><h1>Kelola Pengguna</h1><p>Daftar pengguna aplikasi repositori arsip digital</p><hr></header><div style="display:flex;gap:12px;justify-content:space-between;align-items:end"><div class="field" style="width:min(380px,100%);margin:0"><label>Pencarian</label><input id="userquery" placeholder="Cari nama atau email" oninput="renderUserTable()"></div><button class="btn primary" onclick="editUser()">+ Tambah Pengguna</button></div><div class="table-caption"><h2>Direktori pengguna</h2><span>${users.length} akun | ${users.filter(u=>u.role==='Super Admin').length} administrator</span></div><div id="user-table"></div></section>`}
function renderUserTable(){let q=(document.getElementById('userquery').value||'').toLowerCase();let el=document.getElementById('user-table');if(!el)return;el.innerHTML=`<div class="table-wrap"><table style="min-width:700px"><thead><tr><th>No</th><th>Nama</th><th>NIP</th><th>Bagian</th><th>Email</th><th>Peran</th><th>Aksi</th></tr></thead><tbody>${users.filter(u=>`${u.name} ${u.email} ${u.section}`.toLowerCase().includes(q)).map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${esc(u.nip)}</td><td>${esc(u.section)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><button class="iconbtn warning" onclick="editUser(${u.id})">Edit</button><button class="iconbtn danger" onclick="removeUser(${u.id})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}function editUser(id=null){let u=users.find(x=>x.id===id)||{};modal(`<h2>${id?'Edit Data User':'Tambah Pengguna'}</h2>`,`<form id="userform"><div class="grid"><div class="field wide"><label>Nama Lengkap</label><input name="name" required value="${esc(u.name||'')}"></div><div class="field"><label>NIP</label><input name="nip" value="${esc(u.nip||'')}"></div><div class="field"><label>Bagian</label><select name="section">${sections.map(s=>`<option ${u.section===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>No Telepon</label><input name="phone" value="${esc(u.phone||'')}"></div><div class="field"><label>Email</label><input name="email" type="email" required value="${esc(u.email||'')}"></div><div class="field"><label>Peran</label><select name="role"><option ${u.role==='User'?'selected':''}>User</option><option ${u.role==='Super Admin'?'selected':''}>Super Admin</option></select></div><div class="field"><label>Kata Sandi</label><input name="password" type="password" placeholder="Opsional untuk demo"></div></div></form>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="saveUser(${id||'null'})">Save changes</button>`)}function saveUser(id){let f=document.getElementById('userform');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));if(id)Object.assign(users.find(u=>u.id===id),d);else users.push({id:Date.now(),...d});save();closeModal();toast('Data pengguna berhasil disimpan.');let q=document.getElementById('userquery').value||'';render();if(q){document.getElementById('userquery').value=q}renderUserTable()}function removeUser(id){if(!confirm('Hapus pengguna ini'))return;users=users.filter(u=>u.id!==id);save();render();renderUserTable();toast('Pengguna dihapus.')}
function profilePage(){return `<div class="crumb"> Beranda / Profil Saya</div><section class="card"><header class="heading"><h1>Profil Saya</h1><p>Informasi Data Profil Author</p><hr></header><div style="border:1px solid var(--line);padding:28px 35px">${[['Nama Lengkap',user.name],['NIP',user.nip||'NIP Tidak Ada'],['Bagian',user.role==='Super Admin'?'Super Admin':user.section],['Nomor Telepon',user.phone||'Tidak tersedia'],['Email',user.email]].map(([a,b])=>`<div class="profile-row"><b>${a}</b><span>${esc(b)}</span></div>`).join('')}<div class="profile-actions"><button class="btn warning" onclick="editProfile()">Edit Edit</button></div></div></section>`}function editProfile(){modal('<h2>Edit Data Profil</h2>',`<form id="profileform"><div class="field"><label>Nama Lengkap</label><input name="name" required value="${esc(user.name)}"></div><div class="field"><label>NIP</label><input name="nip" value="${esc(user.nip||'')}"></div><div class="field"><label>No Telepon</label><input name="phone" value="${esc(user.phone||'')}"></div><div class="field"><label>Email</label><input name="email" type="email" required value="${esc(user.email)}"></div></form>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="saveProfile()">Save Change</button>`)}function saveProfile(){let f=document.getElementById('profileform');if(!f.reportValidity())return;Object.assign(user,Object.fromEntries(new FormData(f)));localStorage.setItem('museumUser',JSON.stringify(user));closeModal();render();toast('Profil berhasil diperbarui.')}
function aboutPage(){let topics=['Penggunaan aplikasi','Kelola dan membuat arsip','Pencarian arsip','Mengubah arsip','Mengunduh arsip','Kelola pengguna'];return `<div class="crumb"> Tentang Aplikasi</div><section class="card"><header class="heading"><h1>Tentang Aplikasi</h1><p>Seputar Informasi Tentang Aplikasi</p><hr></header><div class="about-hero"></div><div class="about-section"><h2>Museum Kebangkitan Nasional</h2><p>Museum Kebangkitan Nasional adalah sebuah gedung yang dibangun sebagai monumen tempat lahir dan berkembangnya kesadaran nasional dan juga ditemukannya organisasi pergerakan modern pertama kali dengan nama Boedi Oetomo. Museum Kebangkitan Nasional berada di Jl. Dr. Abdul Rahman Saleh No.26, Senen, Jakarta Pusat.</p></div><div class="about-section"><h2>Aplikasi Repositori Surat Dan Arsip Digital</h2><p>Aplikasi Repository Arsip Digital berfungsi untuk menghimpun seluruh data arsip tata usaha dan arsip teknis di Museum Kebangkitan Nasional dalam bentuk digital. Pegawai dapat mengakses arsip secara mandiri dengan efektif dan efisien.</p></div><hr><h2 style="color:var(--navy)">Cara Penggunaan Aplikasi</h2><div class="tabs">${topics.map(t=>`<button class="${aboutTab===t?'on':''}" onclick="aboutTab='${t}';render()">${t}</button>`).join('')}</div><div class="help-panel"><b>${aboutTab}</b><p style="margin:10px 0 0">${{'Penggunaan aplikasi':'Masuk dengan akun demo yang sudah terisi. Navigasi Beranda untuk melihat dan mengelola arsip.', 'Kelola dan membuat arsip':'Gunakan tombol INPUT ARSIP untuk menambahkan arsip digital beserta kategori dan informasi surat.', 'Pencarian arsip':'Ketik kata kunci dan gunakan filter tanggal untuk menyaring daftar arsip.', 'Mengubah arsip':'Pilih tombol edit pada baris arsip untuk memperbarui judul, kategori, tanggal, atau nomor surat.', 'Mengunduh arsip':'Pilih satu atau beberapa arsip, lalu tekan Download ZIP. Demo menyiapkan berkas daftar arsip.', 'Kelola pengguna':'Buka menu akun lalu Kelola Pengguna untuk menambah, mengubah, dan menghapus akun demo.'}[aboutTab]}</p></div></section>`}
function modal(title,body,foot=''){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head">${title}<button class="close" onclick="closeModal()">Delete</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML=''}function toast(t){let el=document.getElementById('toast-root');el.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>el.innerHTML='',2800)}
if(user)render();else login();const oldRender=render;render=function(){oldRender();if(page==='users')renderUserTable()};
</script></body></html>
