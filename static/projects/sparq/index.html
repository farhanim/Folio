<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#084e8f">
  <title>SparQ — Quant Data Workspace</title>
  <style>
    @font-face { font-family: "Rubik"; src: url("assets/Rubik-Regular.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
    @font-face { font-family: "Rubik"; src: url("assets/Rubik-Medium.woff2") format("woff2"); font-style: normal; font-weight: 500; font-display: swap; }
    @font-face { font-family: "Rubik"; src: url("assets/Rubik-Bold.woff2") format("woff2"); font-style: normal; font-weight: 700; font-display: swap; }
    :root {
      color-scheme: light;
      --blue: #084e8f;
      --blue-dark: #063c70;
      --blue-700: #3971a5;
      --blue-100: #cddde8;
      --blue-50: #e6edf3;
      --canvas: #f4f7fa;
      --ink: #202224;
      --muted: #797a7b;
      --subtle: #a5a6a7;
      --line: #e8e8e9;
      --green: #1e7e25;
      --red: #ff3b30;
      --orange: #ff9500;
      --white: #fff;
      --shadow: 0 8px 26px rgba(22, 48, 76, .08);
      font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    svg { display: block; }
    .icon { display: inline-block; flex-shrink: 0; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
    body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); background: var(--canvas); font-size: 14px; }
    button, input, select { font: inherit; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; line-height: 1; color: inherit; }
    button > .icon, button > svg, .eyebrow > .icon, .workspace-tree-button > .icon, .workspace-item-name > .icon, .tab > .icon, .page-tab > .icon, .primary-btn > .icon, .secondary-btn > .icon, .text-button > .icon, .filter-chip > .icon { vertical-align: middle; }
    .nav-item, .workspace-tree-button, .workspace-item-name, .eyebrow, .text-button, .primary-btn, .secondary-btn, .filter-chip, .page-tab, .tab { display: inline-flex; align-items: center; gap: 8px; line-height: 1; }
    .nav-item, .workspace-tree-button { justify-content: flex-start; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(8, 78, 143, .24); outline-offset: 2px; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; z-index: 5; inset: 0 auto 0 0; width: 252px; padding: 27px 16px 20px; color: white; background: var(--blue); border-radius: 0 24px 24px 0; transition: width .22s ease, transform .22s ease; }
    .brand { display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 9px; white-space: nowrap; }
    .brand-mark { flex: 0 0 31px; width: 31px; height: 31px; }
    .brand-name { overflow: hidden; font-size: 14px; font-weight: 650; letter-spacing: .13em; transition: opacity .15s ease; }
    .side-divider { height: 1px; margin: 20px 3px 15px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent); }
    .nav { height: calc(100vh - 125px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: transparent transparent; }
    .nav-section { margin: 22px 10px 8px; color: rgba(255,255,255,.5); font-size: 10px; font-weight: 650; letter-spacing: .11em; white-space: nowrap; }
    .nav-item { display: flex; width: 100%; min-height: 42px; align-items: center; gap: 14px; margin: 3px 0; padding: 0 11px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: #e0eaf3; cursor: pointer; text-align: left; white-space: nowrap; transition: .18s ease; }
    .nav-item:hover, .nav-item.active { border-color: rgba(255,255,255,.26); background: rgba(255,255,255,.09); color: white; }
    .nav-item.create-link { margin-bottom: 8px; background: rgba(255,255,255,.12); color: white; }
    .nav-item .icon { flex: 0 0 19px; width: 19px; height: 19px; }
    .nav-label { overflow: hidden; opacity: 1; transition: opacity .15s ease; }
    .collapse-btn { position: absolute; z-index: 8; top: 82px; right: -13px; display: grid; width: 27px; height: 27px; place-items: center; border: 1px solid #89adcf; border-radius: 50%; background: white; color: var(--blue); cursor: pointer; box-shadow: 0 2px 7px rgba(0,0,0,.1); }
    .collapse-btn .icon { width: 14px; height: 14px; }
    .main { min-height: 100vh; margin-left: 252px; padding: 0 34px 48px; transition: margin-left .22s ease; }
    .topbar { position: relative; display: flex; min-height: 88px; align-items: center; justify-content: space-between; gap: 22px; }
    .page-heading { min-width: 0; }
    .page-heading h1 { overflow: hidden; margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.025em; text-overflow: ellipsis; white-space: nowrap; }
    .page-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .global-search { position: relative; width: min(31vw, 355px); }
    .global-search input { width: 100%; height: 40px; padding: 0 56px 0 39px; border: 1px solid var(--line); border-radius: 22px; background: white; box-shadow: 0 2px 6px rgba(22,48,76,.03); color: var(--ink); font-size: 12px; }
    .global-search .icon { position: absolute; top: 12px; left: 14px; width: 16px; height: 16px; color: var(--subtle); }
    .shortcut { position: absolute; top: 11px; right: 13px; color: var(--subtle); font-size: 10px; }
    .icon-button { display: inline-grid; flex: 0 0 auto; width: 38px; height: 38px; place-items: center; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #444b51; cursor: pointer; transition: .16s ease; }
    .icon-button:hover { border-color: var(--line); background: white; }
    .icon-button .icon { width: 18px; height: 18px; }
    .avatar { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 12px; background: linear-gradient(145deg, #d8e8f2, #8eb4cb); color: #184e70; cursor: pointer; font-size: 13px; font-weight: 700; }
    .popover-anchor { position: relative; }
    .popover { position: absolute; z-index: 12; top: calc(100% + 9px); right: 0; width: 208px; padding: 7px; border: 1px solid var(--line); border-radius: 13px; background: white; box-shadow: var(--shadow); }
    .popover button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; }
    .popover button:hover { background: var(--canvas); }
    .popover .icon { width: 16px; height: 16px; color: var(--muted); }
    .content { width: 100%; max-width: 1510px; margin: 0 auto; }
    .search-big { position: relative; max-width: 580px; }
    .search-big input { width: 100%; height: 49px; padding: 0 72px 0 45px; border: 1px solid #e2e7ec; border-radius: 26px; background: white; box-shadow: 0 3px 10px rgba(22,48,76,.04); }
    .search-big .icon { position: absolute; top: 16px; left: 17px; width: 17px; height: 17px; color: var(--subtle); }
    .search-big .shortcut { top: 16px; right: 15px; }
    .welcome { display: flex; min-height: 178px; align-items: center; justify-content: space-between; gap: 24px; margin: 24px 0 25px; padding: 26px 34px; overflow: hidden; border: 1px solid #dfebf4; border-radius: 20px; background: linear-gradient(110deg, #fff 0%, #fff 56%, #edf5fb 100%); }
    .welcome-copy { max-width: 540px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 9px; color: var(--blue); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .eyebrow .icon { width: 15px; height: 15px; }
    .welcome h2 { margin: 0 0 7px; font-size: clamp(23px, 2.5vw, 30px); font-weight: 650; letter-spacing: -.045em; }
    .welcome p { max-width: 440px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .welcome-art { flex: 0 0 auto; width: min(28%, 230px); min-width: 130px; height: 130px; }
    .section-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 25px 0 13px; }
    .section-bar h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .text-button { display: inline-flex; align-items: center; gap: 5px; padding: 7px 9px; border: 0; border-radius: 8px; background: transparent; color: var(--blue); cursor: pointer; font-size: 12px; font-weight: 550; }
    .text-button:hover { background: white; }
    .text-button .icon { width: 15px; height: 15px; }
    .quick-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin: 24px 0 27px; }
    .stat-card { display: flex; align-items: center; gap: 13px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 15px; background: white; }
    .stat-icon { display: grid; flex: 0 0 39px; width: 39px; height: 39px; place-items: center; border-radius: 12px; background: var(--blue-50); color: var(--blue); }
    .stat-icon .icon { width: 19px; height: 19px; }
    .stat-value { font-size: 19px; font-weight: 650; letter-spacing: -.03em; }
    .stat-label { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .tabs { display: flex; gap: 6px; margin: 20px 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tab { position: relative; display: flex; align-items: center; gap: 7px; padding: 10px 13px 12px; border: 0; border-radius: 9px 9px 0 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; white-space: nowrap; }
    .tab:hover { background: rgba(8,78,143,.045); }
    .tab.active { background: #e7f0f8; color: var(--blue); font-weight: 600; }
    .tab-count { display: inline-grid; min-width: 19px; height: 18px; place-items: center; padding: 0 5px; border-radius: 10px; background: #eceeef; color: var(--muted); font-size: 10px; }
    .tab.active .tab-count { background: var(--blue); color: white; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .asset-card { position: relative; display: flex; min-height: 128px; gap: 13px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: white; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
    .asset-card:hover { transform: translateY(-2px); border-color: #c4d8e8; box-shadow: var(--shadow); }
    .asset-art { display: grid; flex: 0 0 39px; width: 39px; height: 39px; place-items: center; border-radius: 11px; background: #edf4fa; color: var(--blue); }
    .asset-art .icon { width: 19px; height: 19px; }
    .asset-info { min-width: 0; flex: 1; }
    .asset-title { overflow: hidden; margin: 2px 22px 5px 0; font-size: 13px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .asset-desc { overflow: hidden; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
    .asset-meta { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--subtle); font-size: 10px; }
    .asset-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .pin-button { position: absolute; top: 10px; right: 8px; display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 7px; background: transparent; color: #a8adb1; cursor: pointer; }
    .pin-button:hover, .pin-button.pinned { background: #f4f8fc; color: var(--blue); }
    .pin-button .icon { width: 15px; height: 15px; }
    .empty-assets { grid-column: 1/-1; padding: 32px; border: 1px dashed #d6e0e8; border-radius: 15px; color: var(--muted); text-align: center; }
    .workflow-tabs { margin-top: 3px; }
    .workflow-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 21px 0 16px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 9px; }
    .toolbar-search { position: relative; width: min(23vw, 260px); }
    .toolbar-search input { width: 100%; height: 37px; padding: 0 11px 0 34px; border: 1px solid #dedfe0; border-radius: 10px; background: white; font-size: 12px; }
    .toolbar-search .icon { position: absolute; top: 11px; left: 11px; width: 15px; height: 15px; color: var(--subtle); }
    .select, .filter-chip { height: 37px; padding: 0 11px; border: 1px solid #dedfe0; border-radius: 10px; background: white; color: #555b60; font-size: 12px; }
    .select { max-width: 143px; }
    .filter-chip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap; }
    .filter-chip:hover, .filter-chip.selected { border-color: #b7cde0; background: #f5f9fc; color: var(--blue); }
    .filter-chip .icon { width: 15px; height: 15px; }
    .pinned-toggle { display: flex; align-items: center; gap: 7px; padding: 0 4px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .pinned-toggle input { accent-color: var(--blue); }
    .primary-btn, .secondary-btn { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 1px solid transparent; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 570; white-space: nowrap; transition: .16s ease; }
    .primary-btn { background: var(--blue); color: white; }
    .primary-btn:hover { background: var(--blue-700); }
    .secondary-btn { border-color: #dedfe0; background: white; color: #535a60; }
    .secondary-btn:hover { border-color: var(--blue-100); background: #f6f9fb; color: var(--blue); }
    .primary-btn .icon, .secondary-btn .icon { width: 16px; height: 16px; }
    .workflow-panel { overflow: hidden; border: 1px solid #ebedef; border-radius: 16px; background: white; }
    .table-scroll { overflow: auto; }
    .workflow-table { width: 100%; min-width: 960px; border-collapse: collapse; text-align: left; }
    .workflow-table th { padding: 15px 11px; border-bottom: 1px solid #eef0f1; color: var(--muted); font-size: 10px; font-weight: 650; white-space: nowrap; }
    .workflow-table th:first-child, .workflow-table td:first-child { padding-left: 17px; }
    .workflow-table td { height: 77px; padding: 10px 11px; border-bottom: 1px solid #f0f1f2; font-size: 11px; white-space: nowrap; }
    .workflow-table tr:last-child td { border-bottom: 0; }
    .workflow-table tbody tr:hover { background: #fbfcfd; }
    .workflow-name { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 620; }
    .tag { display: inline-flex; padding: 3px 8px; border-radius: 7px; background: var(--blue-50); color: var(--blue); font-size: 10px; }
    .run-dots { display: flex; align-items: center; gap: 5px; }
    .run-dot { display: grid; width: 26px; height: 26px; place-items: center; border: 1px solid #d2d2d3; border-radius: 50%; color: #979b9e; font-size: 8px; }
    .run-dot.success { border-color: var(--green); color: var(--green); }
    .run-dot.error { border-color: var(--red); color: var(--red); }
    .schedule { padding: 5px 7px; border-radius: 6px; background: #f0f1f2; color: #686e72; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .last-run { color: #52585c; font-size: 10px; }
    .row-actions { display: flex; align-items: center; gap: 3px; }
    .row-actions .icon-button { width: 31px; height: 31px; }
    .row-actions .icon-button .icon { width: 15px; height: 15px; }
    .icon-button.danger { color: var(--red); }
    .state-switch { position: relative; display: inline-block; width: 32px; height: 18px; }
    .state-switch input { width: 0; height: 0; opacity: 0; }
    .switch-track { position: absolute; inset: 0; border-radius: 99px; background: #c6c9cb; cursor: pointer; transition: .18s ease; }
    .switch-track::before { position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: white; content: ""; transition: .18s ease; }
    .state-switch input:checked + .switch-track { background: var(--blue); }
    .state-switch input:checked + .switch-track::before { transform: translateX(14px); }
    .table-empty { padding: 42px 20px; color: var(--muted); text-align: center; }
    .table-empty strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }
    .generic-card { display: flex; min-height: 122px; flex-direction: column; justify-content: space-between; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: white; cursor: pointer; transition: .16s ease; }
    .generic-card:hover { transform: translateY(-2px); border-color: #c4d8e8; box-shadow: var(--shadow); }
    .generic-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .generic-card h3 { margin: 11px 0 5px; font-size: 13px; }
    .generic-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .generic-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: #edf4fa; color: var(--blue); }
    .generic-icon .icon { width: 18px; height: 18px; }
    .page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 18px; }
    .toolbar-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .panel { padding: 18px; border: 1px solid var(--line); border-radius: 15px; background: white; }
    .panel-title { margin: 0; font-size: 14px; font-weight: 650; }
    .panel-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .data-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .data-table { width: 100%; min-width: 660px; border-collapse: collapse; text-align: left; }
    .data-table th { padding: 13px 15px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 650; text-transform: uppercase; }
    .data-table td { padding: 13px 15px; border-bottom: 1px solid #f0f1f2; font-size: 11px; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table tbody tr:hover { background: #fbfcfd; }
    .data-table tbody tr[data-open-page] { cursor: pointer; }
    .data-table tbody tr[data-open-page]:hover td:first-child { color: var(--blue); }
    .muted { color: var(--muted); }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 20px; background: #eef6ef; color: var(--green); font-size: 10px; font-weight: 550; }
    .status-badge.warning { background: #fff5e8; color: #a76605; }
    .status-badge.neutral { background: #eef1f3; color: #697177; }
    .status-badge.error { background: #fff0ef; color: var(--red); }
    .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .page-tabs { display: flex; gap: 7px; overflow-x: auto; margin: 15px 0; }
    .page-tab { padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: white; color: #646c72; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .page-tab.active { border-color: #bfd3e3; background: #edf4fa; color: var(--blue); font-weight: 600; }
    .split-layout { display: grid; grid-template-columns: 245px minmax(0, 1fr); gap: 14px; align-items: start; }
    .editor-panel { overflow: hidden; border: 1px solid #263543; border-radius: 13px; background: #17212b; color: #e4edf5; }
    .editor-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #34404a; color: #b5c3d0; font-size: 11px; }
    .sql-editor { display: block; width: 100%; min-height: 210px; resize: vertical; padding: 17px; border: 0; outline: 0; background: transparent; color: #d8e8f5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.8; }
    .schema-list { margin-top: 14px; }
    .schema-list details { padding: 9px 2px; border-bottom: 1px solid #eff0f2; font-size: 11px; }
    .schema-list summary { cursor: pointer; font-weight: 550; }
    .schema-list ul { margin: 8px 0 0 17px; padding: 0; color: var(--muted); line-height: 2; }

    .result-header h3 { margin: 0; font-size: 13px; }

    .sql-explorer { min-width:0;padding:15px;border-right:1px solid var(--line);background:#fbfcfd; }
    .sql-explorer .schema-list details { padding:8px 2px; }
    .sql-explorer .schema-list li { cursor:pointer; }
    .sql-explorer .schema-list li:hover { color:var(--blue); }
    .sql-workspace { display:flex;min-width:0;flex-direction:column; }
    .sql-query-actions { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line); }

    .sql-results { min-height:210px;padding:0 15px 15px;border-top:1px solid var(--line); }
    .sql-results-tabs { display:flex;align-items:center;gap:14px;height:46px;border-bottom:1px solid var(--line); }
    .sql-result-tab { height:100%;padding:0 3px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:11px; }
    .sql-result-tab.active { border-bottom-color:var(--blue);color:var(--blue);font-weight:600; }
    .sql-results .data-table-wrap { margin-top:12px; }
    .sql-right-tools { display:flex;justify-content:flex-end;gap:6px;margin-left:auto; }
    .playground-content { padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff; }
    .notebook-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px; }
    .notebook-card,.cluster-card { min-width:0;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff; }
    .notebook-card:hover,.cluster-card:hover { border-color:#c7d9e8;box-shadow:var(--shadow); }
    .resource-card-heading { display:flex;align-items:flex-start;justify-content:space-between;gap:10px; }

      function openModal({ title, description, name = "", tag = "Test", onSave, confirm = false, fieldLabel = "Workflow name", selectLabel = "Category", submitLabel, placeholder = "e.g. Weekly Revenue Report", options = ["Test","Analytics","Production","Ingestion"] }) {
        $("#modalRoot").innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-head"><div><h2 id="modalTitle">${escapeHTML(title)}</h2><p>${escapeHTML(description)}</p></div><button class="icon-button" id="modalClose" aria-label="Close">${icon("close")}</button></div>
          ${confirm ? "" : `<form id="createForm"><label class="form-field"><span>${escapeHTML(fieldLabel)}</span><input name="name" required maxlength="80" placeholder="${escapeHTML(placeholder)}" value="${escapeHTML(name)}"></label>
            <label class="form-field"><span>${escapeHTML(selectLabel)}</span><select name="tag">${options.map((option) => `<option ${tag === option ? "selected" : ""}>${escapeHTML(option)}</option>`).join("")}</select></label></form>`}
          <div class="modal-actions"><button type="button" class="secondary-btn" id="modalCancel">${confirm ? "Cancel" : "Close"}</button><button type="button" class="primary-btn" id="modalSave">${escapeHTML(submitLabel || (confirm ? "Delete workflow" : name ? "Save changes" : "Create workflow"))}</button></div>
        </section></div>`;
        const close = () => { $("#modalRoot").innerHTML = ""; };
        $("#modalClose").addEventListener("click", close);
        $("#modalCancel").addEventListener("click", close);
        $("#modalBackdrop").addEventListener("click", (event) => { if (event.target.id === "modalBackdrop") close(); });
        $("#modalSave").addEventListener("click", () => {
          if (!confirm && !$("#createForm").reportValidity()) return;
          const formData = confirm ? null : new FormData($("#createForm"));
          if (onSave) onSave(formData);
          close();
        });
        if (!confirm) $("#createForm input").focus();
      }

        if (tableSearch) tableSearch.addEventListener("input", (event) => {
          const cursor = event.target.selectionStart;
          state.tableQuery = event.target.value;state.workflowPage=1;
          render();
          const next = $("#tableSearch"); next.focus(); next.setSelectionRange(cursor, cursor);
        });
        const creatorSelect = $("#creatorSelect");
        if (creatorSelect) creatorSelect.addEventListener("change", (event) => { state.creator = event.target.value;state.workflowPage=1; render(); });
        const pinToggle = $("#pinnedOnly");
        if (pinToggle) pinToggle.addEventListener("change", (event) => { state.pinnedOnly = event.target.checked;state.workflowPage=1; render(); });
        for (const [id, key] of [["catalogSearch","query"],["querySearch","query"],["dashboardSearch","query"],["playgroundSearch","query"],["experimentSearch","query"],["featureSearch","query"],["modelSearch","modelSearch"],["schemaSearch","sqlSearch"]]) {
          const input = $(`#${id}`);
          if (input) input.addEventListener("input", (event) => {
            const cursor = event.target.selectionStart;
            state[key] = event.target.value;
            render();
            const next = $(`#${id}`);
            if (next) { next.focus(); next.setSelectionRange(cursor,cursor); }
          });
        }
        $$("[data-action]").forEach((button) => button.addEventListener("click", () => handleAction(button.dataset.action)));
        $("#sqlCode")?.addEventListener("keydown", (event) => {
          if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { event.preventDefault(); handleAction("run-query"); }
        });
        $$("[data-open-sql]").forEach((button) => button.addEventListener("click", () => {
          state.sqlTab = button.dataset.openSql; state.page = "sql"; render(); toast(`Opened ${button.dataset.openSql} in SQL Editor.`);
        }));
        $$("[data-preview-query]").forEach((button) => button.addEventListener("click", () => {
          openModal({ title: button.dataset.previewQuery, description: "Saved SQL query · SQL Warehouse · Shared", confirm: true, submitLabel: "Close" });
          $("#modalSave").addEventListener("click", () => { $("#modalRoot").innerHTML = ""; });
        }));
        $$("[data-delete-query]").forEach((button) => button.addEventListener("click", () => {
          const query = button.dataset.deleteQuery;
          openModal({ title: "Delete saved query?", description: `${query} will be removed from your saved queries.`, confirm: true, submitLabel: "Delete query", onSave: () => {
            state.savedQueries = state.savedQueries.filter((item) => item !== query); render(); toast("Saved query deleted.");
          } });
        }));
        $$("[data-open-page='experimentDetail']").forEach((button) => button.addEventListener("click", () => { state.page = "experimentDetail"; render(); }));
        $$("[data-playground-action]").forEach((button) => button.addEventListener("click", () => handlePlaygroundAction(Number(button.dataset.playgroundAction))));
        $$("[data-deployment-action]").forEach((button) => button.addEventListener("click", () => {
          const index = Number(button.dataset.deploymentAction);
          state.deploymentStates[index] = state.deploymentStates[index] === "Running" ? "Stopped" : "Running";
          render();
          toast(`Deployment ${index + 1} ${state.deploymentStates[index] === "Running" ? "started" : "stopped"}.`);
        }));
        $$("[data-connector-open]").forEach((button) => button.addEventListener("click", () => toast("Connection details opened.")));
        $$("[data-workspace-file]").forEach((item) => item.addEventListener("click", (event) => {
          if (event.target.closest("[data-file-more]")) return;
          const name = item.dataset.workspaceFile;
          state.currentNotebookName = name.replace(/\.(ipynb|sql|csv)$/i,"");
          state.page = name.endsWith(".sql") ? "sql" : "workspaceCreate";
          render(); toast(`Opened ${name}.`);
        }));
        $$("[data-file-more]").forEach((button) => button.addEventListener("click", () => toast("File options: rename, share, or delete.")));
        $("#workflowDraftName")?.addEventListener("input", (event) => { state.workflowDraft.name = event.target.value; });
        $("#workflowSchedule")?.addEventListener("change", () => {
          const summary = content.querySelector(".panel[style*='background']");
          if (summary) summary.innerHTML = `<h3 class="panel-title">Schedule summary</h3><p class="panel-subtitle">This workflow will run ${escapeHTML($("#workflowSchedule").value)} using the default workspace compute profile.</p>`;
        });
        $("#filtersBtn")?.addEventListener("click", () => { state.filtersOpen = !state.filtersOpen; render(); });
        $$("[data-quick-filter]").forEach((button) => button.addEventListener("click", () => {
          const filter = button.dataset.quickFilter;
          state.workflowPage=1;
          state.filtersOpen = false;
          if (filter === "all") { state.pinnedOnly = false; state.failedOnly = false; state.tableQuery = ""; state.workflowTab = "All"; }
          if (filter === "pinned") { state.pinnedOnly = true; state.failedOnly = false; }
          if (filter === "errors") { state.pinnedOnly = false; state.failedOnly = true; state.tableQuery = ""; state.workflowTab = "All"; }
          render();
        }));
        $$("[data-toggle-workflow]").forEach((input) => input.addEventListener("change", () => {
          const item = workflows.find((workflow) => workflow.id === Number(input.dataset.toggleWorkflow));
          item.enabled = input.checked;
          render();
          toast(`${item.name} ${item.enabled ? "activated" : "paused"}.`);
        }));
        $$("[data-run]").forEach((button) => button.addEventListener("click", () => {
          const item = workflows.find((workflow) => workflow.id === Number(button.dataset.run));
          item.lastRun = "Just now";
          item.nextRun=item.enabled?"Oct 10, 2026 · 8:00 AM":"—";
          item.left[2]=["running",1];
          render();
          toast(`${item.name} run started.`);
        }));
        $$("[data-delete]").forEach((button) => button.addEventListener("click", () => {
          const item = workflows.find((workflow) => workflow.id === Number(button.dataset.delete));
          openModal({ title: "Delete workflow?", description: `“${item.name}” will be removed from this demo workspace.`, confirm: true, onSave: () => {
            workflows.splice(workflows.findIndex((workflow) => workflow.id === item.id), 1);
            render(); toast(`${item.name} deleted.`);
          } });
        }));
        $$("[data-more]").forEach((button) => button.addEventListener("click", () => { state.menuFor = state.menuFor === Number(button.dataset.more) ? null : Number(button.dataset.more); render(); }));
        $$("[data-detail]").forEach((button) => button.addEventListener("click", () => {
          state.selectedWorkflowId=Number(button.dataset.detail);state.selectedWorkflowTask=undefined;
          state.menuFor = null;state.workflowDetailTab = "Graph"; state.page = "workflowDetail"; render();
        }));
        $$("[data-workflow-task]").forEach((button)=>button.addEventListener("click",()=>{
          state.selectedWorkflowTask=Number(button.dataset.workflowTask);state.workflowDetailTab="XCom";render();
        }));
        $$("[data-edit]").forEach((button) => button.addEventListener("click", () => {
          const item = workflows.find((workflow) => workflow.id === Number(button.dataset.edit));
          state.menuFor = null;
          openModal({ title: "Edit workflow", description: "Update the name or category of this workflow.", name: item.name, tag: item.tag, onSave: (form) => { item.name = String(form.get("name")).trim(); item.tag = String(form.get("tag")); render(); toast("Workflow changes saved."); } });
        }));
        $$("[data-pin-workflow]").forEach((button) => button.addEventListener("click", () => {
          const item = workflows.find((workflow) => workflow.id === Number(button.dataset.pinWorkflow));
          item.pinned = !item.pinned; state.menuFor = null; render(); toast(item.pinned ? "Workflow pinned." : "Workflow unpinned.");
        }));
        $$("[data-generic]").forEach((card) => {
          card.addEventListener("click", () => toast(`Opened ${card.dataset.generic} · Demo data`));
          card.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); card.click(); } });
        });
      }

      function handlePlaygroundAction(index) {
        const row = state.playgroundTab === "Notebooks" ? state.notebookItems[index] : state.playgroundTab === "Clusters" ? state.clusters[index] : state.libraryItems[index];
        if (!row) return;
        if (state.playgroundTab === "Notebooks") {
          state.page = "workspaceCreate";
          render();
          toast(`Opened ${row[0]}.`);
        } else if (state.playgroundTab === "Clusters") {
          row[1] = row[1] === "running" ? "stopped" : "running";
          render();
          toast(`${row[0]} ${row[1]}.`);
        } else {
          state.libraryItems.splice(index,1);
          render();
          toast(`${row[0]} removed from this workspace.`);
        }
      }

      function handleAction(action) {
        const newWorkflow = (form) => {
          const name = String(form.get("name")).trim();
          workflows.unshift({ id: Date.now(), name, tag: String(form.get("tag")), schedule: "0 9 * * *", lastRun: "Never run", owner: "You", enabled: true, pinned: false, left: [["success","—"],["success","—"],["success","—"]], right: [["success","—"],["success","—"],["success","—"],["success","—"],["success","—"]] });
          state.page = "workflow"; state.workflowTab = "All"; render(); toast(`${name} created successfully.`);
        };
        const newAsset = (title, label, options, onSave, selectLabel = "Type") => openModal({
          title, description: "Add an item to your SparQ workspace.", fieldLabel: label, selectLabel, options, placeholder: `Enter ${label.toLowerCase()}`, submitLabel: "Create", onSave,
        });
        switch (action) {
          case "new-asset":
            return showCreateMenu();
          case "create-workflow":
            return openWorkflowDrawer();
          case "cancel-workflow":
            state.page = "workflow"; state.workflowDraft = null; return render();
          case "add-workflow-task":
            state.workflowDraft ||= { name: "Untitled workflow", tasks: [] };
            state.workflowDraft.tasks.push(`New task ${state.workflowDraft.tasks.length + 1}`);
            return render();
          case "save-workflow": {
            const name = ($("#workflowDraftName")?.value || "Untitled workflow").trim();
            const schedule = $("#workflowSchedule")?.value || "Manual";
            const category = $("#workflowCategory")?.value || "Analytics";
            workflows.unshift({ id: Date.now(), name, tag: category, schedule: schedule === "Manual" ? "Manual" : schedule, lastRun: "Never run", owner: "You", enabled: true, pinned: false, left: [["success","—"],["success","—"],["success","—"]], right: [["success","—"],["success","—"],["success","—"],["success","—"],["success","—"]] });
            state.workflowDraft = null; state.page = "workflow"; state.workflowTab = "All"; render(); return toast(`${name} created.`);
          }
          case "run-workflow":
            {
              const item=workflows.find((workflow)=>workflow.id===state.selectedWorkflowId)||workflows[0];
              if(item){item.lastRun="Just now";item.nextRun=item.schedule==="None"?"—":"Oct 10, 2026 · 8:00 AM";item.left[2]=["running",1];item.recentTask=item.tasks?.[0]?.taskId||item.recentTask;}
              render();return toast(`${item?.name||"Workflow"} run started.`);
            }
          case "edit-workflow":
            {
              const item=workflows.find((workflow)=>workflow.id===state.selectedWorkflowId)||workflows[0];
              return openModal({title:"Edit workflow",description:"Update the name or category of this workflow.",name:item.name,tag:item.tag,options:["Production","Analytics","Ingestion","Machine learning","Operations"],onSave:(form)=>{item.name=String(form.get("name")).trim();item.tag=String(form.get("tag"));render();toast("Workflow changes saved.");}});
            }
          case "create-notebook":
            return openModal({ title: "Create a notebook", description: "Choose a name and language for your new notebook.", fieldLabel: "Notebook name", selectLabel: "Language", options: ["Python","SQL","R","Scala"], placeholder: "e.g. Customer analysis", submitLabel: "Create notebook", onSave: (form) => {
              const baseName = String(form.get("name")).trim();
              const extension=String(form.get("tag")).toLowerCase()==="sql"?"sql":"ipynb";
              const name = `${baseName}.${extension}`;
              state.currentNotebookName = baseName;
              state.workspaceFiles.unshift({id:state.workspaceItemsNextId++,name,parent:state.workspacePath,type:extension==="ipynb"?"notebook":"file",favorite:false,deleted:false,owner:"You",modified:"Just now",createdAt:"Just now",ageDays:0});
              state.notebookItems.unshift([baseName,String(form.get("tag")).toLowerCase(),"idle","Just now"]);
              state.page = "workspaceCreate"; render(); toast("Notebook created. Select a compute profile to get started.");
            } });
          case "create-folder":
            return newAsset("Create a folder","Folder name",["Workspace folder"],(form) => {
              const name=String(form.get("name")).trim();
              if(state.workspaceFiles.some((item)=>!item.deleted&&item.type==="folder"&&item.parent===state.workspacePath&&item.name.toLowerCase()===name.toLowerCase()))return toast("A folder with that name already exists.");
              state.workspaceFiles.unshift({id:state.workspaceItemsNextId++,name,parent:state.workspacePath,type:"folder",favorite:false,deleted:false,owner:"You",modified:"Just now",createdAt:"Just now",ageDays:0});
              state.workspacePage=1;render();toast("Folder created.");
            });
          case "upload-file":
            return toast("File upload is simulated in this standalone demo.");
          case "save-notebook":
            return toast("Notebook saved to your workspace.");
          case "toggle-server":
            state.serverRunning = !state.serverRunning; render(); return toast(state.serverRunning ? "Notebook compute started." : "Notebook compute stopped.");
          case "schedule-notebook":
            return openModal({ title: "Schedule notebook", description: "Set a recurring schedule for this notebook.", fieldLabel: "Schedule name", selectLabel: "Frequency", options: ["Daily","Weekdays","Weekly","Monthly"], placeholder: "e.g. Daily customer refresh", submitLabel: "Save schedule", onSave: () => toast("Notebook schedule saved.") });
          case "run-cell":
            $("#notebookOutput").innerHTML = `<h3 class="panel-title">Output</h3><p class="panel-subtitle">Displaying 10 sample rows from analytics.customer.transactions.</p><div class="feature-grid"><div class="metric-card"><strong>10</strong><span>Rows returned</span></div><div class="metric-card"><strong>0.38s</strong><span>Execution time</span></div></div>`;
            return toast("Notebook cell completed.");
          case "add-cell":
            $("#notebookCode").value += "\n\n# New cell\n";
            $("#notebookCode").focus(); return toast("Cell added.");
          case "download":
            return toast("Export ready in this demo workspace.");
          case "create-catalog":
            return newAsset("Add data","Catalog or connection name",["Catalog","Connection","External location"],() => toast("Data catalog item added."));
          case "create-schema":
            return newAsset("Create schema","Schema name",["Managed","External"],() => toast("Schema created."));
          case "favorite-catalog":
            return toast("Catalog added to favorites.");
          case "new-query":
            state.page = "sql"; state.sqlTab = "Query 1"; state.runResult = false; render(); return;
          case "new-query-tab":
            state.sqlTab = `Query ${Date.now().toString().slice(-3)}`; state.sqlTabs ||= []; state.sqlTabs.push(state.sqlTab); state.runResult = false; return render();
          case "run-query":
            state.sqlCode = $("#sqlCode").value;
            if (!state.sqlCode.trim()) return toast("Add a SQL statement before running.");
            state.runResult = true; render(); return toast("Query completed · 3 rows returned.");
          case "save-query":
            state.sqlCode = $("#sqlCode").value;
            return openModal({ title: "Save query", description: "Save this SQL for your team to reuse.", fieldLabel: "Query name", selectLabel: "Warehouse", options: ["SQL Warehouse · Shared","Analytics Warehouse"], placeholder: "e.g. Monthly revenue", submitLabel: "Save query", onSave: (form) => { state.savedQueries.unshift(String(form.get("name")).trim()); render(); toast("Query saved successfully."); } });
          case "format-sql":
            $("#sqlCode").value = $("#sqlCode").value.replace(/\s+/g," ").replace(/\b(FROM|WHERE|GROUP BY|ORDER BY|LIMIT|SELECT)\b/gi,"\n$1").trim();
            return toast("SQL formatted.");
          case "share-query":
            return openModal({ title: "Share query", description: "Share this query with a teammate.", fieldLabel: "User or group", selectLabel: "Permission", options: ["Can view","Can edit"], placeholder: "name@company.com", submitLabel: "Share", onSave: () => toast("Query shared with your teammate.") });
          case "create-dashboard":
            state.page = "dashboardBuilder"; render(); return;
          case "toggle-view":
            state.listView = !state.listView; return render();
          case "publish-dashboard": {
            const name = ($("#dashboardName")?.value || "Untitled dashboard").trim();
            state.dashboards.unshift(name); state.page = "dashboard"; render(); return toast(`${name} published.`);
          }
          case "add-chart":
            return toast("Chart added to the dashboard canvas.");
          case "remove-chart":
            return toast("Chart removed from the dashboard.");
          case "share-dashboard":
            return openModal({ title: "Share dashboard", description: "Invite a teammate to view this dashboard.", fieldLabel: "User or group", selectLabel: "Permission", options: ["Can view","Can edit"], placeholder: "name@company.com", submitLabel: "Share", onSave: () => toast("Dashboard shared.") });
          case "create-cluster":
            return newAsset("Create compute cluster","Cluster name",["Small · 1 node","Standard · 2 nodes","Memory optimized · 4 nodes"],(form) => { state.clusters.unshift([String(form.get("name")).trim(),"starting",String(form.get("tag")),"Just now"]); state.playgroundTab = "Clusters"; render(); toast("Compute cluster is starting."); },"Profile");
          case "install-library":
            return newAsset("Install a library","Package name",["PyPI","Maven","CRAN","Conda"],(form) => { state.libraryItems.unshift([String(form.get("name")).trim(),"Latest",String(form.get("tag")),"Pending"]); state.playgroundTab = "Libraries"; render(); toast("Library added to install queue."); },"Package source");
          case "add-connector":
            return newAsset("Add connector","Connection name",["Database","Object storage","Kubernetes","API"],(form) => { state.newConnectors ||= []; state.newConnectors.push(String(form.get("name")).trim()); render(); toast("Connector added."); });
          case "restart-connector":
            return toast("Connector restart requested.");
          case "toggle-connector":
            state.connectorStopped = !state.connectorStopped; render(); return toast(state.connectorStopped ? "Connector terminated." : "Connector started.");
          case "connector-metrics":
            return toast("Connector metrics are up to date.");
          case "connector-help":
            return toast(`${state.connectorProvider||"Tableau"} connection instructions opened.`);
          case "connector-options":
            return toast("Connector options: edit details, view health, or remove this integration.");
          case "fit-workflow-graph":
            state.workflowGraphScale=1;render();return toast("Workflow graph fitted to view.");
          case "clear-run-filters":
            return toast("Run filters cleared.");
          case "cluster-settings":
          case "cluster-details":
          case "notebook-options":
            return toast("Resource details opened in this demo.");
          case "create-experiment":
            return newAsset("Create experiment","Experiment name",["Classification","Forecasting","Regression","GenAI"],(form) => {
              state.createdExperiments ||= [];
              state.createdExperiments.unshift([String(form.get("name")).trim(),`${form.get("tag")} · customer_transactions`,"You","Just now","Running"]);
              state.experimentTab = "MLflow"; render(); toast("Experiment created.");
            },"Experiment type");
          case "rerun-experiment":
            return toast("Experiment run queued.");
          case "create-feature":
            return newAsset("Create feature table","Table name",["Delta","Parquet"],() => toast("Feature table created."));
          case "edit-feature":
            return toast("Feature table description is ready to edit.");
          case "register-model":
            return newAsset("Register a model","Model name",["Scikit-learn","XGBoost","TensorFlow","PyTorch"],() => toast("Model registered."));
          case "deploy-model":
            return openModal({ title: "Deploy a model", description: "Create a real-time serving endpoint.", fieldLabel: "Deployment name", selectLabel: "Model", options: ["customer_churn_predictor · v2.4","fraud_detection_model · v1.8","recommendation_engine · v3.0"], placeholder: "e.g. churn-predictor-prod", submitLabel: "Deploy model", onSave: () => toast("Model deployment started.") });
          case "compare-model":
            return toast("Model version comparison opened.");
          case "model-settings":
            return openModal({title:"Model registry settings",description:"Demo registry defaults and version management settings.",fieldLabel:"Default model status",selectLabel:"Version retention",options:["None","Staging","Production"],placeholder:"Registry settings",submitLabel:"Save settings",onSave:()=>toast("Model registry settings saved.")});
          case "serving-settings":
            return openModal({title:"Model serving settings",description:"Set default resources and health monitoring for new endpoints.",fieldLabel:"Default replicas",selectLabel:"Default resources",options:["Small · 1 CPU · 2 GB","Medium · 2 CPU · 4 GB","Large · 4 CPU · 8 GB"],placeholder:"1",submitLabel:"Save settings",onSave:()=>toast("Serving settings saved.")});
          case "refresh":
            return toast("Data refreshed.");
          default:
            return toast("Action is available in this interactive demo.");
        }
      }

      function showCreateMenu() {
        $("#modalRoot").innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">Create something new</h2><p>Start a new item in your workspace.</p></div><button class="icon-button" id="modalClose" aria-label="Close">${icon("close")}</button></div>
          <div class="generic-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
            ${[["workspaceCreate","Notebook","file"],["sql","SQL query","database"],["workflowCreate","Workflow","route"],["dashboardBuilder","Dashboard","graph"]].map(([page,label,glyph]) => `<button class="generic-card" data-create-page="${page}"><span class="generic-icon">${icon(glyph)}</span><span style="font-size:12px;font-weight:600">${label}</span></button>`).join("")}
          </div><div class="modal-actions"><button class="secondary-btn" id="modalCancel">Cancel</button></div></section></div>`;
        const close = () => { $("#modalRoot").innerHTML = ""; };
        $("#modalClose").addEventListener("click", close);
        $("#modalCancel").addEventListener("click", close);
        $("#modalBackdrop").addEventListener("click", (event) => { if (event.target.id === "modalBackdrop") close(); });
        $$("[data-create-page]").forEach((button) => button.addEventListener("click", () => {
          const page = button.dataset.createPage;
          close();
          if (page === "workflowCreate") return handleAction("create-workflow");
          if (page === "sql") return handleAction("new-query");
          if (page === "dashboardBuilder") return handleAction("create-dashboard");
          if (page === "workspaceCreate") return handleAction("create-notebook");
        }));
      }

      $$(".nav-item").forEach((button) => button.addEventListener("click", () => {
        if (button.dataset.page === "new") { showCreateMenu(); return; }
        state.page = button.dataset.page; state.tableQuery = ""; state.menuFor = null; app.classList.remove("mobile-nav-open");
        history.pushState({ page: state.page }, "", `#/${state.page}`);
        render();
      }));
      window.addEventListener("popstate", () => {
        const page = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
        state.page = pageInfo[page] ? page : "workspace";
        app.classList.remove("mobile-nav-open");
        render();
      });
      $("#collapseBtn").addEventListener("click", () => {
        state.collapsed = !state.collapsed;
        app.classList.toggle("collapsed", state.collapsed);
        $("#collapseBtn").setAttribute("aria-label", state.collapsed ? "Expand sidebar" : "Collapse sidebar");
        $("#collapseBtn").title = state.collapsed ? "Expand sidebar" : "Collapse sidebar";
        $("#collapseBtn").innerHTML = icon(state.collapsed ? "chevron-right" : "chevron-left");
      });
      $("#mobileMenu").addEventListener("click", () => app.classList.toggle("mobile-nav-open"));
      $("#globalSearch").addEventListener("input", (event) => { state.query = event.target.value; render(); });
      $("#globalSearch").addEventListener("keydown", (event) => { if (event.key === "Escape") { event.target.value = ""; state.query = ""; render(); event.target.blur(); } });
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); $("#globalSearch").focus(); }
        if (event.key === "Escape") { $("#profileMenu").hidden = true; $("#notificationsMenu").hidden = true; app.classList.remove("mobile-nav-open"); }
      });
      $("#avatarBtn").addEventListener("click", () => { $("#notificationsMenu").hidden = true; $("#profileMenu").hidden = !$("#profileMenu").hidden; });
      $("#notificationsBtn").addEventListener("click", () => { $("#profileMenu").hidden = true; $("#notificationsMenu").hidden = !$("#notificationsMenu").hidden; });
      $$("[data-toast]").forEach((button) => button.addEventListener("click", () => { toast(button.dataset.toast); $("#profileMenu").hidden = true; $("#notificationsMenu").hidden = true; }));
      $$("[data-demo-logout]").forEach((button)=>button.addEventListener("click",()=>{
        sessionStorage.removeItem("sparqDemoAuth");state.authenticated=false;state.page="workspace";
        $("#profileMenu").hidden=true;render();
      }));
      document.addEventListener("click", (event) => {
        if (!event.target.closest("#avatarBtn, #profileMenu")) $("#profileMenu").hidden = true;
        if (!event.target.closest("#notificationsBtn, #notificationsMenu")) $("#notificationsMenu").hidden = true;
      });
      render();
    })();
  </script>
</body>
</html>
