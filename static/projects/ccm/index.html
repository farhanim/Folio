<script type="text/x-page-js" data-page="home">

function getSummaryTicket(period, time){
    urlSummaryTicket = "mock://HomeController@summaryTicket";

    $.ajax({
        type: 'GET',
        url: urlSummaryTicket,
        dataType: 'json',
        data: {
            period: period,
            time: time
        },
        success: function(result){
            // Do something with data result, looping ect
            $.each(result, function(key, obj){
                $.each(obj, function(key, value){
                    $('#'+key).text(value);
                });
            });
        },
        error: function(result,status,xhr){
            // Do something when get data result from HomeController@summaryTicket is error
            console.log('Summary Ticket get data is error');
        }
    });
}

</script>
<script type="text/x-page-js" data-page="home">

function getPercentageClosedTicket(period, time) {
    urlGetData = "mock://HomeController@percentageClosedTicket";

    $.ajax({
        type: 'GET',
        url: urlGetData,
        dataType: 'json',
        data: {
            period: period,
            time: time
        },
        success: function(dataResult){
            // Do something with data result, looping ect
            // console.log('Percentage Closed Ticket', dataResult);
            renderGauges(dataResult);
        },
        error: function(result,status,xhr){
            // Do something when get data result from HomeController@summaryTicket is error
            console.log('Percentage Closed Ticket get data is error');
        }
    });
}

function renderGauges(data) {
    var molohok = Highcharts.chart('gauges-chart', {
        chart: {
            type: 'gauge'
        },
        credits: { enabled: false },        
        title: null,
        pane: {
            center: ['50%', '50%'],
            size:'95%',
            startAngle: -130,
            endAngle: 130,
            background: {
                backgroundColor:'#DDD ',
                innerRadius: '60%',
                outerRadius: '100%',
                shape: 'arc'
            }
        },
        navigation: {
            buttonOptions: {
                enabled: false
            }
        },
        yAxis: {
            min: 0,
            max: 100,
            minorTickInterval:null,
            minorTickLength:null,
            minorTickWidth:null,
            tickLength: 0,
            tickAmount: 0,
            tickWidth: 0,
            minorTickLength: 0,
            labels: {
                distance: 10
            },
            plotBands: {
                from: 0,
                to: [parseFloat(data[0].rate)],
                color: '#ed1c24',
                innerRadius: '100%',
                outerRadius: '60%'
            },
            
        },
        plotOptions: {
            gauge: {
                pivot: {
                    radius: 10,
                    borderWidth: 6,
                    borderColor: '#ed1c24',
                    backgroundColor: {
                        linearGradient: { x1: 0, y1: 0, x2: 1, y2: 1 },
                        stops: [                        
                            [0, '#ed1c24']
                        ]
                    }
                },
                dial: {
                    radius: '100%'
                }
            }
        },
        series: [{
            data: [parseFloat(data[0].rate)],
            name: 'Ticket',
            color:'#ed1c24',
            dataLabels: {
            borderWidth:0,
            padding:30,        
            style: {
                fontFamily: 'montserratregular'
            },
            format: '<div style="text-align:center;"><span style="font-size:25px; font-family: montserratregular; color:' +
                    ((Highcharts.theme && Highcharts.theme.contrastTextColor) || 'black') + '">{y}% </span>'
            },
            tooltip: {
                valueSuffix: '%'
            },                
        }]
    });
}

</script>
<script type="text/x-page-js" data-page="home">

function lineChartDataFormatter(data){
    category = [];
    seriesData = [];

    $.each(data, function(key, item){
        category.push(item.time_period);
        seriesData.push(parseFloat(item.sla_avg));
    });

    formattedData = {
        category: category,
        seriesData: seriesData
    }

    return formattedData;
}

function getSlaAverage(period, startTime, endTime) {
    urlSlaAverage = "mock://HomeController@slaAverage";

    $.ajax({
        type: 'GET',
        url: urlSlaAverage,
        dataType: 'json',
        data: {
            period: period,
            startTime: startTime,
            endTime: endTime
        },
        success: function(dataResult){
            // Do something with data result, looping ect
            // console.log(dataResult);
            formattedData = lineChartDataFormatter(dataResult);
            // console.log(formattedData);
            renderSlaAverage(formattedData);
        },
        error: function(result,status,xhr){
            // Do something when get data result from HomeController@summaryTicket is error
            console.log('Sla Average get data is error');
        }
    });

}

function renderSlaAverage(data) {
    var latestValue = Sugar.Array(data.seriesData).last();
    $('#latest_sla_average_value').text(latestValue);

    var chartSpeed =
        Highcharts.chart('line-chart_sla-average', {
            navigation: {
                buttonOptions: 
                {
                    enabled: false
                }
            },
            chart: {
                type: 'line',
                backgroundColor:'#7EA1E5',
            },
            title: {
                text: null
            },
            subtitle: {
                text: null
            },
            xAxis: {
                lineColor: '#fff',
                categories: data.category,
                tickWidth: 0,
                 labels: {
                     style:{
                        color:'#fff',
                        fontSize:'12'
                  },
              }
            },
            yAxis: {
                lineWidth: 0,
                minorGridLineWidth: 0,
                lineColor: 'transparent',
                gridLineColor: 'transparent',
                title: {
                    text: null
                },

<script type="text/x-page-js" data-page="national">

function getSummaryTicket(period, time) {
    urlSummaryTicket = "mock://NationalController@summaryTicket";

    $.ajax({
        type: 'GET',
        url: urlSummaryTicket,
        datatype: 'json',
        data: {
            period: period,
            time: time
        },

        success: function(result){
            // Do something with data result national ticket data
            //console.log(result);
            $.each(result, function(key, obj){
                $.each(obj, function(key, value){
                    $('#'+key).text(value);
                });
            });
        },

        error: function(result, status, xhr){
            // Do something when get data from NationalController@ticketData is error
            console.log("National Ticket Data get data is error");
        }

    });
}

function renderSummaryTicket(){
    getSummaryTicket();
}

</script>

        'NationalController@summaryRegionalIndexComplaintRemedyTicket': function (p) {
            return D.divisions.map(function (n) {

                return { main: n, sub: n, area: n, index_complaint: b.ic, remedy_ticket: b.total };
            });
        }
    };

    // ---------------------------------------------------------------- extra sample data (new UI sections)
    var SERVICES = { Voice: ['Incoming Call', 'Outgoing Call', 'Drop Call', 'Voice Quality', 'No Coverage'], Data: ['Slow/Cannot Internet Access', 'Low Signal Strength', 'No Coverage', 'Application'], SMS: ['SMS Failed', 'SMS Delayed'] };
    var TIER2_LABEL = { networknormal: 'Network Normal', needoptim: 'Need Optim', hwfaulty: 'HW Faulty', capacity: 'Capacity / New Site', transmisi: 'Transmisi', power: 'Power', networkinterupt: 'Network Interupt', communitycase: 'Community Case', other: 'Other', swfaulty: 'SW Faulty', coreproblem: 'Core Problem', underinvestigation: 'Under Investigation', tiketproblem: 'Ticket Problem', relocation: 'Relocation Update' };

    function isoWeekStart(y, w) {
        var d = new Date(Date.UTC(y, 0, 4)), day = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() - day + 1 + (w - 1) * 7);
        return d;
    }
    function periodStart(period, time) {
        var o = parseTime(time);
        period = parseInt(period, 10) || 2;
        if (period === 3) return new Date(Date.UTC(o.y, o.t - 1, 1));
        if (period === 4) return new Date(Date.UTC(o.y, (o.t - 1) * 3, 1));
        if (period === 5) return new Date(Date.UTC(o.y, (o.t - 1) * 6, 1));
        return isoWeekStart(o.y, o.t);
    }
    function periodDays(period) { return { 2: 7, 3: 30, 4: 90, 5: 181 }[parseInt(period, 10) || 2]; }

    function citiesFor(s) {
        if (s.city) return [s.city];
        if (s.division) {
            var out = [];
            (D.divisionProvinces[s.division] || []).forEach(function (pv) { out = out.concat(D.provinces[pv] || []); });
            if (out.length) return out;
        }
        return allCities();
    }
    function divisionOfCity(city) {
        var found = D.divisions[0];
        Object.keys(D.divisionProvinces).forEach(function (dv) {
            D.divisionProvinces[dv].forEach(function (pv) { if ((D.provinces[pv] || []).indexOf(city) >= 0) found = dv; });
        });
        return found;
    }

    function tickets(p, count) {
        var s = scopeOf(p), r = rng('tk|' + scopeStr(s) + p.period + p.time), b = base(p);
        var start = periodStart(p.period, p.time).getTime(), days = periodDays(p.period), cities = citiesFor(s);
        var list = [];
        for (var i = 0; i < (count || 8); i++) {
            var city = cities[Math.floor(r() * cities.length)];
            var service = r() < 0.4 ? 'Voice' : (r() < 0.88 ? 'Data' : 'SMS');
            var problems = SERVICES[service];
            var m = tier2Mix(s, p.period, p.time), x = r(), acc = 0, cause = TIER2[0][0];
            for (var k = 0; k < TIER2.length; k++) { acc += m[k]; if (x <= acc) { cause = TIER2[k][0]; break; } }
            var st = r(), status = st < b.rateOpen / 100 + 0.08 ? 'Open' : (st < 0.62 ? 'Closed BES' : 'Closed Auto');
            var opened = new Date(start + Math.floor(r() * days * 24) * 3600e3 + int(r, 0, 59) * 60e3);
            var hours = status === 'Closed Auto' ? round2(0.2 + r() * 6) : round2(4 + r() * 46);
            list.push({
                id: 'INC' + String(10000000 + Math.floor(r() * 89999999)) + '',
                opened: opened, division: s.division || divisionOfCity(city),
                department: s.department || D.departments[Math.floor(r() * D.departments.length)],
                city: city, service: service, problem: problems[Math.floor(r() * problems.length)],
                cause: TIER2_LABEL[cause], status: status, hours: hours, msisdn: '0811' + int(r, 1000000, 9999999)
            });
        }
        return list.sort(function (a, c) { return c.opened - a.opened; });
    }

    function weeksBack(time, n) {
        var out = [];
        for (var i = n - 1; i >= 0; i--) out.push(shiftTime(2, time, i));
        return out;
    }
    // Weekly series for the Trends page and scorecards
    function weekly(scopeParams, endTime, n) {
        var s = scopeOf(scopeParams);
        return weeksBack(endTime, n).map(function (t) {
            var b = baseAt(s, 2, t);
            b.time = t; b.label = periodLabel(2, t); b.tier2 = tier2Mix(s, 2, t);
            return b;
        });
    }
    function scorecard(p, weeks) {
        return D.divisions.map(function (n) {
            var params = $.extend({}, p, { division: n, department: '', subdepartment: '', city: '' });
            var cur = base(params), prev = base($.extend({}, params, { time: shiftTime(parseInt(p.period, 10) || 2, p.time, 1) }));
            return { division: n, cur: cur, prev: prev, spark: weekly({ division: n }, p.period == 2 ? p.time : '201731', weeks || 8).map(function (w) { return w.rateClosed; }) };
        });
    }

    window.CCM_MOCK = {
        base: base, baseAt: baseAt, scopeOf: scopeOf, shiftTime: shiftTime, periodLabel: periodLabel, shortPrev: shortPrev,
        tickets: tickets, weekly: weekly, scorecard: scorecard, tier2: TIER2, tier2Label: TIER2_LABEL,
        periodStart: periodStart, periodDays: periodDays, fmt: fmt, round2: round2
    };

    // ---- $.ajax override: answer mock:// URLs locally, behave like an async jQuery request
    var realAjax = $.ajax;
    $.ajax = function (url, options) {
        var o = typeof url === 'object' ? url : $.extend({}, options, { url: url });
        if (typeof o.url !== 'string' || o.url.indexOf('mock://') !== 0) return realAjax.apply(this, arguments);

        var endpoint = o.url.substr('mock://'.length);
        var params = o.data || {};
        var dfd = $.Deferred();
        var xhr = dfd.promise({ status: 200, readyState: 4, abort: function () {} });
        var ctx = o.context || o;

        if (o.beforeSend) o.beforeSend.call(ctx, xhr, o);
        setTimeout(function () {
            var handler = H[endpoint];
            if (!handler) {
                console.warn('[mock] No dummy data for', endpoint);
                if (o.error) o.error.call(ctx, xhr, 'error', 'Not Found');
                dfd.reject(xhr, 'error', 'Not Found');
            } else {
                var result = JSON.parse(JSON.stringify(handler(params)));
                if (o.success) o.success.call(ctx, result, 'success', xhr);
                dfd.resolve(result, 'success', xhr);
            }
            if (o.complete) o.complete.call(ctx, xhr, handler ? 'success' : 'error');
        }, 120 + Math.random() * 280);
        return xhr;
    };
    $.ccmMockEndpoints = H;
})(jQuery);

</script>

<script>
(function ($, H) {
    // Add-on layer: keeps the original interface untouched and only adds information
    // (KPI change badges, sample tables, weekly charts) using the original components.
    var M = window.CCM_MOCK;
    var X = window.CCMX = {};
    var TARGET = { closed: 85, sla: 24 };
    // Original app colors for the same metrics
    var ORIG = { open: '#4db30f', bes: '#0c65e8', auto: '#ff4d4d', closed: '#56D794', blue: '#0c65e8' };

    function norm(n) { return String(n == null ? '' : n).toLowerCase().replace(/[^a-z]/g, ''); }
    function fmt(v) { return Number(v).toLocaleString('en-US'); }
    function esc(s) { return $('<div>').text(s == null ? '' : s).html(); }

    // ------------------------------------------------------------------ typo fixes in table labels (text only)
    var FIX = { intergrity: 'Integrity', accesibleity: 'Accessibility', retainabilty: 'Retainability', voicequiality: 'Voice Quality', needoptimm: 'Need Optim', tiketproblem: 'Ticket Problem' };
    function paintRow(tr) {
        var td = tr.firstElementChild;
        if (!td || tr.__ccm) return;
        tr.__ccm = true;
        var fixed = FIX[norm(td.textContent)];
        if (fixed) td.textContent = fixed;
    }
    new MutationObserver(function (muts) {
        muts.forEach(function (m) {
            Array.prototype.forEach.call(m.addedNodes, function (n) {
                if (n.nodeType !== 1) return;
                if (n.tagName === 'TR') paintRow(n);
                else if (n.querySelectorAll) Array.prototype.forEach.call(n.querySelectorAll('tbody tr'), paintRow);
            });
        });
    }).observe(document.getElementById('ccm-root'), { childList: true, subtree: true });

    // ------------------------------------------------------------------ KPI tiles
    var KPI = {
        rate_open_ticket: { label: 'Open Ticket Rate', icon: 'icon-ticket.png', key: 'rateOpen', pp: true, up: 'bad', unit: '%' },
        total_remedy_ticket: { label: 'Total Remedy Tickets', icon: 'icon-ticket-remedy.png', key: 'total', up: 'bad', unit: 'Ticket' },
        open_ticket: { label: 'Open Tickets', icon: 'icon-ticket.png', key: 'open', up: 'bad', unit: 'Ticket' },
        total_closed_resolved: { label: 'Closed & Resolved', icon: 'icon-ticket-done.png', key: 'closed', up: 'good', unit: 'Ticket' },
        rate_auto_closed: { label: 'Auto Closed Rate', icon: 'icon-auto-percen.png', key: 'rateAuto', pp: true, up: 'good', unit: '%' },
        rate_closed_not_auto: { label: 'Closed by BES', icon: 'icon-bes.png', key: 'rateBes', pp: true, up: 'none', unit: '%' },
        sla_average: { label: 'SLA Average', icon: 'icon-time.png', key: 'sla', up: 'bad', unit: 'Hours' },
        auto_closed: { label: 'Auto Closed', icon: 'icon-auto.png', key: 'auto', up: 'good', unit: 'Ticket' },
        rate_closed: { label: 'Closed & Resolved Rate', icon: 'icon-ticket-done.png', key: 'rateClosed', pp: true, up: 'good', unit: '%' }
    };

    function deltaHtml(cur, prev, pp, up) {
        if (prev == null || isNaN(prev) || isNaN(cur)) return '';
        var d = pp ? cur - prev : (prev ? (cur - prev) / prev * 100 : 0);
        var flat = Math.abs(d) < 0.05;
        var cls = flat || up === 'none' ? 'flat' : ((d > 0) === (up === 'good') ? 'good' : 'bad');
        var arrow = flat ? '●' : (d > 0 ? '▲' : '▼');
        return '<span class="delta ' + cls + '">' + arrow + ' ' + (flat ? '0' : Math.abs(d).toFixed(1) + (pp ? ' pp' : '%')) + '</span>';
    }
    X.deltaHtml = deltaHtml;

    function kpiStrip(ids) {
        return '<div class="row row-0 mt-3 ccm-kpi-strip">' + ids.map(function (id, i) {
            var k = KPI[id];
            var unit = k.unit === '%' ? '<span>%</span>' : (k.unit === 'Ticket' ? '' : '<span> <b>' + k.unit + '</b></span>');
            return '<div class="col-md-2 modul-icon' + (i === ids.length - 1 ? ' pr-0' : '') + '"><div class="box"><h7>' + esc(k.label) + '</h7>' +
                '<img src="assets/img/icon/' + k.icon + '"><span data-kpi-value="' + id + '"></span>' + unit +
                '<div class="kpi-delta" data-kpi="' + id + '"></div></div></div>';
        }).join('') + '</div>';
    }

    function boxRow(title, body, foot) {

            '</tr></thead><tbody data-tickets></tbody></table></div>',
            '<div class="ccm-box-foot"><span data-tickets-foot></span><a href="javascript:void(0)" data-tickets-export>Export CSV</a></div>');
    }
    function scorecardRow() {
        return boxRow('Regional Scorecard <small class="box-note">Closure vs 85% target · SLA vs 24 h target · click a region to open it</small>',
            '<div class="table-responsive"><table class="table table-striped ccm-data-table"><thead><tr>' +
            '<th>#</th><th>Region</th><th class="r">Remedy Tickets</th><th>Closed &amp; Resolved</th><th>Status</th><th>Change</th><th class="r">SLA Avg</th><th class="r">Index Complaint</th><th>8-Week Trend</th>' +
            '</tr></thead><tbody data-scorecard></tbody></table></div>');
    }
    function weeklyRow() {
        return '<div class="row">' +
            '<div class="col-md-6 pr-0"><div class="box-header"><h5>Weekly Closed &amp; Resolved Rate</h5></div><div class="box"><div id="x-weekly-closed" class="ccm-chart" style="height:250px"></div></div></div>' +
            '<div class="col-md-6"><div class="box-header"><h5>Weekly Remedy Ticket Volume &amp; Backlog</h5></div><div class="box"><div id="x-weekly-volume" class="ccm-chart" style="height:250px"></div></div></div>' +
            '</div>';
    }

    // ------------------------------------------------------------------ filter panel: labelled fields + Reset / Apply
    var FIELD_LABEL = {
        division_filter: 'Region', department_filter: 'Department', subdepartment_filter: 'Sub-Department', province_filter: 'Province',
        city_filter: 'City / Regency', period_filter: 'Period', range_filter: 'Range', year_filter: 'Year'
    };
    var TIME_LABEL = { week_filter: 'Week', month_filter: 'Month', quarter_filter: 'Quarter', semester_filter: 'Semester' };
    function buildFilter($root) {
        var $well = $root.find('.well.ccm-filter');
        if (!$well.length) return;
        var $selects = $well.find('select').detach();
        var $btn = $well.find('#filter_button').detach().removeClass('btn btn-block').addClass('f-apply').text('Apply Filters');
        $well.empty().addClass('f-panel');
        // The original period handler hides/shows inputs inside #ccm-time-filter, so year + time live there
        var $timeGroup = $('<div id="ccm-time-filter" class="f-group"></div>');
        var $time = $('<div class="f-field"><label data-time-label>Week</label><div class="f-time"></div></div>');
        $selects.each(function () {
            var id = this.id;
            if (TIME_LABEL[id]) { $time.find('.f-time').append(this); return; }
            var $f = $('<div class="f-field"><label for="' + id + '">' + esc(FIELD_LABEL[id] || id) + '</label></div>').append(this);
            if (id === 'year_filter') $timeGroup.append($f); else $well.append($f);
        });
        $well.append($timeGroup.append($time));
        var $reset = $('<a href="javascript:void(0)" class="f-reset">Reset</a>');
        $well.append($('<div class="f-actions"></div>').append($reset).append($btn));
        $reset.on('click', function () {
            $well.find('#period_filter').val('week_filter').trigger('change');
            ['division_filter', 'department_filter', 'subdepartment_filter', 'province_filter', 'city_filter'].forEach(function (id) {
                var s = document.getElementById(id); if (s) s.selectedIndex = 0;
            });
            var r = document.getElementById('range_filter'); if (r) r.value = '12';
            if (window.setFiltersToCurrent) setFiltersToCurrent();
            $('#filter_button').trigger('click');
        });
        $well.find('#period_filter').on('change', function () {
            $well.find('[data-time-label]').text(TIME_LABEL[$(this).val()] || 'Week');
        });
    }

    X.layout = function (page, root, query) {
        var $root = $(root);
        var $cf = $root.children('.container-fluid').first();

        // Clearer labels on the existing KPI tiles + a change badge (top-right, tile size unchanged)
        $root.find('.modul-icon > .box').each(function () {
            var id = $(this).children('span[id]').attr('id');
            if (!KPI[id]) return;
            $(this).find('h7').text(KPI[id].label);
            // Drop the "Ticket" unit: it wraps under the number and spills out of the tile
            $(this).children('span').filter(function () { return /^\s*ticket\s*$/i.test(this.textContent); }).remove();
            $(this).append('<div class="kpi-delta" data-kpi="' + id + '"></div>');
        });

        // Colored trend panels: body takes the header's color so no white seams show around the chart
        $root.find('.box-header.no-border').each(function () {
            var bg = this.style.backgroundColor;
            if (!bg) return;
            $(this).addClass('trend-head').nextAll('.box').first().addClass('trend-body').each(function () {
                this.style.setProperty('background-color', bg, 'important');
            });
        });

        buildFilter($root);

        // First section of each page: all columns (tiles, gauge, trend panels) share one height
        $root.find('.row.mt-3').each(function () {
            $(this).addClass('eq-row').find('[class*="col-md-"]').each(function () {
                if ($(this).children('[class*="col-md-"]').length) $(this).addClass('eq-nest');
            });
        });

        var $extra = $('<div class="container-fluid"></div>');
        if (/^(department|subdepartment|city)$/.test(page)) {
            $cf.find('.row-dropdown-filter').after(kpiStrip(['total_remedy_ticket', 'open_ticket', 'total_closed_resolved', 'rate_closed', 'rate_auto_closed', 'sla_average']));
        }
        if (/^(subdepartment|city)$/.test(page)) $extra.append(weeklyRow());
        if (page === 'home') $extra.append(scorecardRow());
        if (page !== 'trends') $extra.append(ticketsRow());
        $root.append($extra);

        // Deep links (e.g. from the scorecard): preselect filters before the page scripts read them
        Object.keys(query || {}).forEach(function (k) {
            var s = document.getElementById(k + '_filter');
            if (s && $(s).find('option').filter(function () { return this.value === query[k] || this.text === query[k]; }).length) $(s).val(query[k]);
        });

        $root.on('click', '[data-tickets-export]', exportTickets);
        $root.on('click', 'tr[data-go]', function () { location.hash = $(this).attr('data-go'); });
    };

    // ------------------------------------------------------------------ data-driven updates (on load and on every filter submit)
    var lastTickets = [];
    function currentParams(page) {
        if (window.getFilters) getFilters();
        var p = { period: window.period_id_filter || 2, time: (window.year_filter || '2017') + (window.time_filter || '31') };
        if (page === 'regional' || page === 'department' || page === 'subdepartment' || page === 'trends') p.division = window.division_filter;
        if (page === 'department' || page === 'subdepartment') p.department = window.department_filter;
        if (page === 'subdepartment') p.subdepartment = window.subdepartment_filter;
        if (page === 'city') p.city = window.city_filter;
        return p;
    }

    function kpiValue(id, b) { return id === 'rate_closed_not_auto' ? 100 - b.rateAuto : b[KPI[id].key]; }
    function updateKpis(page, p) {
        var b = M.base(p), prev = M.base($.extend({}, p, { time: M.shiftTime(+p.period, p.time, 1) }));
        b.rateBes = 100 - b.rateAuto; prev.rateBes = 100 - prev.rateAuto;
        var vs = 'vs ' + M.shortPrev(p.period);
        $('[data-kpi]').each(function () {
            var id = $(this).attr('data-kpi'), k = KPI[id];
            if (!k) return;
            $(this).attr('title', 'Change ' + vs).html(deltaHtml(kpiValue(id, b), kpiValue(id, prev), k.pp, k.up));
        });
        $('[data-kpi-value]').each(function () {
            var id = $(this).attr('data-kpi-value'), v = kpiValue(id, b);
            $(this).text(KPI[id].pp || id === 'sla_average' ? M.round2(v) : fmt(Math.round(v)));
        });
    }

    var STATUS = { 'Open': ['warn', 'Open'], 'Closed Auto': ['good', 'Auto Closed'], 'Closed BES': ['info', 'Closed by BES'] };
    function fmtDate(d) {
        var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return d.getUTCDate() + ' ' + mon[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ', ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2);
    }
    function updateTickets(page, p) {
        var $tb = $('[data-tickets]');
        if (!$tb.length) return;
        var list = lastTickets = M.tickets(p, 8), b = M.base(p);
        $tb.html(list.map(function (t) {
            var st = STATUS[t.status], over = t.hours > TARGET.sla;
            return '<tr><td class="mono">' + esc(t.id) + '</td><td>' + esc(fmtDate(t.opened)) + '</td>' +
                '<td><b>' + esc(t.division) + '</b> · ' + esc(t.city) + '</td><td>' + esc(t.department) + '</td>' +
                '<td><span class="svc">' + esc(t.service) + '</span> ' + esc(t.problem) + '</td><td>' + esc(t.cause) + '</td>' +
                '<td><span class="status ' + st[0] + '">' + esc(st[1]) + '</span></td>' +
                '<td class="r">' + (over ? '<span class="status bad" title="Over the 24 h SLA">' + t.hours.toFixed(1) + ' h</span>' : t.hours.toFixed(1) + ' h') + '</td></tr>';
        }).join(''));
        $('[data-tickets-count]').text(fmt(b.total) + ' tickets in period');
        $('[data-tickets-foot]').text('Showing 8 of ' + fmt(b.total) + ' remedy tickets · ' + fmt(b.open) + ' still open (sample data)');
    }
    function exportTickets() {
        var head = ['Ticket', 'Opened (UTC)', 'Region', 'City', 'Department', 'Service', 'Problem', 'Tier-2 cause', 'Status', 'Duration (h)'];
        var rows = lastTickets.map(function (t) { return [t.id, t.opened.toISOString(), t.division, t.city, t.department, t.service, t.problem, t.cause, t.status, t.hours]; });
        var csv = [head].concat(rows).map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = 'remedy-tickets.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function sparkSvg(values, color, target) {
        var w = 110, h = 26, mn = Math.min.apply(null, values.concat([target])) - 2, mx = Math.max.apply(null, values.concat([target])) + 2;
        var x = function (i) { return 2 + i * (w - 6) / (values.length - 1); }, y = function (v) { return h - 3 - (v - mn) / (mx - mn) * (h - 6); };
        var d = values.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
        var li = values.length - 1;
        return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
            '<line x1="0" x2="' + w + '" y1="' + y(target).toFixed(1) + '" y2="' + y(target).toFixed(1) + '" stroke="#c4cad4" stroke-dasharray="3 3"/>' +
            '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
            '<circle cx="' + x(li).toFixed(1) + '" cy="' + y(values[li]).toFixed(1) + '" r="3" fill="' + color + '"/></svg>';
    }
    X.sparkSvg = sparkSvg;
    function statusFor(rate) {
        if (rate >= TARGET.closed) return '<span class="status good">On target</span>';
        if (rate >= TARGET.closed - 7) return '<span class="status warn">Watch</span>';
        return '<span class="status bad">Below target</span>';
    }
    function updateScorecard(page, p) {
        var $tb = $('[data-scorecard]');
        if (!$tb.length) return;
        var rows = M.scorecard(p, 8).sort(function (a, b) { return b.cur.rateClosed - a.cur.rateClosed; });
        $tb.html(rows.map(function (r, i) {
            return '<tr data-go="#/summary/regional?division=' + encodeURIComponent(r.division) + '" style="cursor:pointer">' +
                '<td>' + (i + 1) + '</td><td><b>' + esc(r.division) + '</b></td><td class="r">' + fmt(r.cur.total) + '</td>' +
                '<td><span class="bar-meter"><i style="width:' + r.cur.rateClosed + '%"></i></span>' + r.cur.rateClosed.toFixed(1) + '%</td>' +
                '<td>' + statusFor(r.cur.rateClosed) + '</td>' +
                '<td>' + deltaHtml(r.cur.rateClosed, r.prev.rateClosed, true, 'good') + ' <span class="muted">vs ' + M.shortPrev(p.period) + '</span></td>' +
                '<td class="r">' + (r.cur.sla > TARGET.sla ? '<span class="status bad">' + r.cur.sla.toFixed(1) + ' h</span>' : r.cur.sla.toFixed(1) + ' h') + '</td>' +
                '<td class="r">' + r.cur.ic.toFixed(2) + '</td><td>' + sparkSvg(r.spark, ORIG.blue, TARGET.closed) + '</td></tr>';
        }).join(''));
    }

    function updateWeekly(page, p) {
        if (!document.getElementById('x-weekly-closed')) return;
        var end = +p.period === 2 ? p.time : '201731';
        var w = M.weekly(p, end, 8), cats = w.map(function (x) { return x.label; });
        var common = { credits: { enabled: false }, navigation: { buttonOptions: { enabled: false } }, title: { text: null } };
        H.chart('x-weekly-closed', $.extend(true, {}, common, {
            chart: { type: 'line' }, legend: { enabled: false },
            xAxis: { categories: cats }, yAxis: { title: { text: null }, labels: { format: '{value}%' },
                plotLines: [{ value: TARGET.closed, color: '#999', dashStyle: 'Dash', width: 1, label: { text: 'Target 85%', align: 'right', x: -4 } }] },
            tooltip: { valueDecimals: 1, valueSuffix: '%' },
            plotOptions: { line: { dataLabels: { enabled: true, format: '{y:.1f}%' } } },
            series: [{ name: 'Closed & Resolved', data: w.map(function (x) { return x.rateClosed; }), color: ORIG.closed }]
        }));
        H.chart('x-weekly-volume', $.extend(true, {}, common, {
            chart: { type: 'column' }, legend: { align: 'center', verticalAlign: 'top', itemStyle: { color: '#000000', fontWeight: 'normal', fontSize: '12px' } },
            xAxis: { categories: cats }, yAxis: { min: 0, title: { text: null }, stackLabels: { enabled: true } },
            tooltip: { shared: true },
            plotOptions: { column: { stacking: 'normal', borderWidth: 0 } },
            series: [
                { name: 'Open (Backlog)', color: ORIG.open, data: w.map(function (x) { return x.open; }) },
                { name: 'Closed BES', color: ORIG.bes, data: w.map(function (x) { return x.bes; }) },
                { name: 'Closed Auto', color: ORIG.auto, data: w.map(function (x) { return x.auto; }) }
            ]
        }));
    }

    X.afterLabels = function (page) {
        var p = currentParams(page);
        updateKpis(page, p);
        updateTickets(page, p);
        updateScorecard(page, p);
        updateWeekly(page, p);
        if (page === 'trends' && X.renderTrends) X.renderTrends(p);
    };

    // Run our updates whenever the original code refreshes its filter labels (page load + every Submit)
    var origLabels = window.setFiltersLabels;
    window.setFiltersLabels = function () {
        var r = origLabels.apply(this, arguments);
        try { X.afterLabels(window.ccmPage); } catch (e) { console.error('[ccm]', e); }
        return r;
    };
})(jQuery, Highcharts);

</script>

<!-- App shell: login + hash router -->
<script>
(function ($) {
    var AUTH_KEY = 'ccm_demo_auth';
    var ROUTES = {
        '/home': 'home',
        '/summary/national': 'national',
        '/summary/regional': 'regional',
        '/summary/city': 'city',
        '/summary/department': 'department',
        '/summary/subdepartment': 'subdepartment',
        '/trends': 'trends'
    };
    var PUBLIC = { '/login': 'login', '/password/reset': 'reset' };
    var root = document.getElementById('ccm-root');
    var currentRoute = null;

    function authEmail() {
        try { return sessionStorage.getItem(AUTH_KEY); } catch (e) { return window.__ccmAuth || null; }
    }
    function setAuth(email) {
        try {
            if (email) sessionStorage.setItem(AUTH_KEY, email); else sessionStorage.removeItem(AUTH_KEY);
        } catch (e) { window.__ccmAuth = email; }
    }
    function go(route) {
        if (location.hash === '#' + route) render(); else location.hash = '#' + route;
    }
    function parseHash() {
        var h = location.hash.replace(/^#/, '') || '/';
        var i = h.indexOf('?'), query = {};
        if (i >= 0) {
            h.slice(i + 1).split('&').forEach(function (kv) {
                var p = kv.split('=');
                if (p[0]) query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
            });
            h = h.slice(0, i);
        }
        return { route: h, query: query };
    }

    function runScript(code) {
        var s = document.createElement('script');
        s.text = code;
        document.body.appendChild(s);
        document.body.removeChild(s);
    }

    function cleanup() {
        if (window.Highcharts) {
            Highcharts.charts.forEach(function (c) { if (c) c.destroy(); });
        }
        $('.modal-backdrop, .tooltip').remove();
        $(root).off().removeClass('ccm-app');
    }

    // The original login page also loads Montserrat from Google Fonts; the app layout does not.
    function loginFont(on) {
        var el = document.getElementById('ccm-login-font');
        if (on && !el) {
            el = document.createElement('link');
            el.id = 'ccm-login-font';
            el.rel = 'stylesheet';
            el.href = 'https://fonts.googleapis.com/css?family=Montserrat';
            document.head.appendChild(el);
        } else if (!on && el) {
            el.parentNode.removeChild(el);
        }
    }

    function renderAuthView(tpl) {
        cleanup();
        loginFont(true);
        document.body.className = '';
        root.style.height = '100%'; // keep .full-height working through the extra wrapper
        root.innerHTML = document.getElementById(tpl).innerHTML;
    }

    function renderLogin() {
        renderAuthView('tpl-login');
        $('#login-form').on('submit', function (e) {
            e.preventDefault();
            var email = $.trim($('#email').val());
            var password = $('#password').val();
            if (email.toLowerCase() === CCM_DIMS.demoUser.email && password === CCM_DIMS.demoUser.password) {
                setAuth(email);
                go('/home');
            } else {
                $('#login-error').text('These credentials do not match our records.');
            }
        });
        $('#email').focus();
    }

    function renderReset() {
        renderAuthView('tpl-reset');
        $('#reset-form').on('submit', function (e) {
            e.preventDefault();
            var email = $.trim($('#reset-email').val());
            $('#reset-ok').text('If ' + email + ' is registered, a reset link is on its way. (Demo: no email is sent.)').show();
            $(this).find('button').prop('disabled', true).text('LINK SENT');
        });
    }

    function renderPage(page, query) {
        cleanup();
        loginFont(false);
        document.body.className = '';
        root.style.height = '';
        window.ccmPage = page;
        var html = document.getElementById('tpl-page-' + page).innerHTML
            .replace('__AUTH_EMAIL__', $('<div>').text(authEmail()).html());
        root.innerHTML = html;
        window.scrollTo(0, 0);

        // Layout + design layer must be in place before charts measure their containers
        if (window.CCMX) CCMX.layout(page, root, query);

        runScript(document.querySelector('script[type="text/x-layout-js"]').textContent);
        document.querySelectorAll('script[type="text/x-page-js"][data-page="' + page + '"]').forEach(function (s) {
            runScript(s.textContent);
        });
    }

    function render() {
        var h = parseHash(), route = h.route;

        if (route === '/logout') {
            setAuth(null);
            currentRoute = null;
            return go('/login');
        }
        if (PUBLIC[route] === 'reset') { currentRoute = route; return renderReset(); }
        if (!authEmail()) {
            if (route !== '/login') return go('/login');
            currentRoute = route;
            return renderLogin();
        }
        if (route === '/login' || route === '/' || !ROUTES[route]) return go('/home');

        currentRoute = location.hash.replace(/^#/, '');
        renderPage(ROUTES[route], h.query);
    }

    window.ccmLogout = function () { go('/logout'); };

    // Placeholder links stay on the current page, like the original.
    $(document).on('click', 'a[href="#"]', function (e) { e.preventDefault(); });

    // Clicking a menu link for the page that is already open reloads it, like a normal link would.
    $(document).on('click', 'a[href^="#/"]', function (e) {
        if ($(this).attr('href') === '#' + currentRoute) { e.preventDefault(); render(); }
    });

    window.addEventListener('hashchange', render);
    render();
})(jQuery);

</script>
