function go(path) { if (location.hash === '#' + path) router(); else location.hash = '#' + path; }
function reload() { router(); }

function router() {
    var hash = location.hash;
    if (hash && hash.indexOf('#/') !== 0) return;
    var path = hash.replace(/^#/, '') || '/';
    $('.modal-backdrop').remove();
    $('body').removeClass('modal-open').css('padding-right', '');
    var me = currentUser();
    for (var i = 0; i < routes.length; i++) {
        var m = path.match(routes[i][0]);
        if (m) {
            var guest = routes[i][2];
            if (!guest && !me) return go('/login');
            if (path === '/login' && me) return go('/dashboard');
            var args = m.slice(1).filter(function (x) { return x !== undefined && x !== 'dashboard'; }).map(Number);
            var page = routes[i][1].apply(null, args);
            if (page) render(page);
            window.scrollTo(0, 0);
            return;
        }
    }
    go(me ? '/dashboard' : '/login');
}

/* Site import (CSV parsed, other files add demo rows) */
function importSites(file, projectId, done) {
    function upsert(row) {
        if (!row.site_id) return;
        var exist = DB.sites.filter(function (s) { return s.site_id === row.site_id; })[0];
        var data = { project_id: projectId, site_id: row.site_id, name: row.site_name || '', longitude: String(row.longitude || '').replace(',', '.'),
            latitude: String(row.latitude || '').replace(',', '.'), address: row.address || '', region: row.region || '', city: row.city || '', tower_owner: row.tower_owner || '' };
        if (exist) $.extend(exist, data); else { data.id = nextId(DB.sites); DB.sites.push(data); }
    }
    var ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'csv' || ext === 'txt') {
        var r = new FileReader();
        r.onload = function () {
            var lines = String(r.result).split(/\r?\n/).filter(function (l) { return $.trim(l); });
            var sep = lines[0].indexOf(';') > -1 ? ';' : ',';
            var head = lines[0].split(sep).map(function (h) { return $.trim(h).toLowerCase().replace(/\s+/g, '_'); });
            lines.slice(1).forEach(function (l) {
                var cols = l.split(sep), row = {};
                head.forEach(function (h, i) { row[h] = $.trim(cols[i] || ''); });
                upsert(row);
            });
            save(); done(lines.length - 1);
        };
        r.readAsText(file);
    } else {
        var n = Date.now() % 1000;
        [['Demo Site A', 'Jabodetabek', 'Jakarta Barat'], ['Demo Site B', 'Jabodetabek', 'Jakarta Timur'], ['Demo Site C', 'Jawa Barat', 'Bekasi']].forEach(function (d, i) {
            upsert({ site_id: 'IMP' + n + i, site_name: d[0], longitude: (106.8 + i / 10).toFixed(4), latitude: (-6.2 - i / 10).toFixed(4), address: 'Imported from ' + file.name, region: d[1], city: d[2], tower_owner: 'PT Menara Prima' });
        });
        save(); done(3);
    }
}

function deleteProject(id) {
    id = Number(id);
    DB.projects = DB.projects.filter(function (p) { return p.id !== id; });
    DB.sites = DB.sites.filter(function (s) { return s.project_id !== id; });
    DB.templates = DB.templates.filter(function (t) { return t.project_id !== id; });
    DB.tasks = DB.tasks.filter(function (t) { return t.project_id !== id; });
    save(); swalSuccess('Project has been deleted!'); reload();
}
function bindProjectDelete() {

function resourceRows(list, name, checkedIds) {
    return list.map(function (u) {
        var chk = checkedIds && checkedIds.indexOf(u.id) > -1 ? ' checked="checked"' : '';
        var load = DB.tasks.filter(function (t) { return t.pic_id === u.id && !isFinished(t); }).length;
        return '<tr><td><input name="' + name + '" type="checkbox" class="role-check" value="' + u.id + '"' + chk + '></td><td>' + userCell(u, esc(u.email), 'avatar-sm') + '</td>' +
            '<td>' + esc(u.role_id === 6 ? 'RNPO' : role(u.role_id).name) + '</td><td><span class="tag">' + load + ' open task' + (load === 1 ? '' : 's') + '</span></td></tr>';
    }).join('');
}
function bindSearchResource(tableSel) {
    tableSel = tableSel || '#table-resource';
    $('#searchResource').on('keyup', function () {
        var value = $(this).val().toLowerCase();
        $(tableSel + ' tbody tr').filter(function () { $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1); });
    });
    function count() { $('#resourceCount').text($(tableSel + ' tbody :checkbox:checked').length + ' selected'); }
    $(tableSel + ' thead :checkbox').on('change', function () { $(tableSel + ' tbody tr:visible :checkbox').prop('checked', this.checked); count(); });
    $(tableSel).on('change', 'tbody :checkbox', count);
    count();
}
function bindFileLabel(sel) {
    $(sel).on('change', function () { if (this.files[0]) $(this).next('.custom-file-label').html('&nbsp;' + esc(this.files[0].name)); });

            $('#dataTablesRole').on('click', '.roleEditBtn', function () {
                var r = byId(DB.roles, $(this).data('id'));
                $('#roleModal').modal('show'); $('#roleName').val(r.name); $('#description').val(r.description);
                $('#roleModalTitle').html('Edit Role'); $('#roleBtnModal').text('Update');
                $('#roleBtnModal').off('click').on('click', function (e) {
                    e.preventDefault();
                    if (!$.trim($('#roleName').val())) { $('#rolenameError').html('The name field is required.'); return clearErrorModal(); }
                    r.name = $('#roleName').val(); r.description = $('#description').val(); r.updated_at = stamp();
                    save(); $('#roleModal').modal('hide'); sessionStorage.setItem('ss-tab', 'nav-role-tab'); swalSuccess('Role has been updated!'); reload();
                });
            });
            $('#dataTablesRole').on('click', '.deleteRole', function (e) {
                e.preventDefault(); var id = Number($(this).data('id'));
                confirmDelete('Are you sure to delete this role?', function () {
                    DB.roles = DB.roles.filter(function (r) { return r.id !== id; }); delete DB.roleResources[id];
                    save(); sessionStorage.setItem('ss-tab', 'nav-role-tab'); swalSuccess('Role has been deleted!'); reload();
                });
            });

            $('#userRoleOption').on('change', function () {
                var rid = $(this).val();
                $('[name="resourceRole"]').prop('checked', false).prop('disabled', !rid);
                (DB.roleResources[rid] || []).forEach(function (x) { $('[name="resourceRole"][value="' + x + '"]').prop('checked', true); });
                $('#accessHint').html(rid ? '<span class="mdi mdi-security"></span> Editing access for <b>' + esc(role(rid).name) + '</b> &middot; ' + (DB.roleResources[rid] || []).length + ' modules enabled. Changes are saved automatically.'
                    : '<span class="mdi mdi-information-outline"></span> Select a role on the top right to view and change its module access.');
            });
            $('[name="resourceRole"]').on('change', function () {
                var rid = $('#userRoleOption').val();
                if (!rid) { this.checked = false; return swal('Please select role first', '', 'warning'); }
                var list = DB.roleResources[rid] || (DB.roleResources[rid] = []), val = Number(this.value);
                if (this.checked) { if (list.indexOf(val) < 0) list.push(val); } else { DB.roleResources[rid] = list.filter(function (x) { return x !== val; }); }
                save();
            });
        }
    };
}

/* =====================================================================
 *  PAGE: Profile
 * ===================================================================== */
function pageProfile() {
    var me = currentUser();
    var all = me.role_id === 4 || me.role_id === 5;
    var mine = DB.projects.filter(function (p) { return all || p.pm_id === me.id || p.customer_id === me.id || p.resource.indexOf(me.id) > -1; });
    var myTasks = all ? DB.tasks : DB.tasks.filter(function (t) { return t.pic_id === me.id || t.rnpo_id === me.id || (project(t.project_id) || {}).pm_id === me.id; });
    var acts = myTasks.filter(function (t) { return t.submitted_at; }).sort(function (a, b) { return a.submitted_at < b.submitted_at ? 1 : -1; }).slice(0, 5).map(function (t) {
        return '<li><span class="tl-dot" style="background:' + (STATUS_COLOR[t.status] || '#0B9CF0') + '"></span><b>' + esc(user(t.pic_id).name) + '</b> submitted <a href="#/report/preview/' + t.id + '">' + esc(t.name) + '</a><small>' + relDay(t.finished_at) + ' &middot; ' + t.submitted_at.substr(11) + '</small></li>';
    }).join('');
    var html =
        '<div class="row ss-row">' +
        '<div class="col-lg-4"><div class="card mb-3"><div class="card-body text-center pt-4">' + avatar(me.name, 'avatar-lg') +
        '<h5 class="mt-3 mb-1 font-weight-600" style="color:#1f2d3d">' + esc(me.name) + '</h5><div class="mb-2">' + badge(String(me.status) === '1' ? 'Active' : 'Deactive') + ' <span class="tag">' + esc(role(me.role_id).name) + '</span></div>' +
        '<div class="text-left mt-3"><div class="kv"><span>Email</span><b>' + esc(me.email) + '</b></div><div class="kv"><span>Phone</span><b>' + esc(me.phone || '-') + '</b></div>' +
        '<div class="kv"><span>Application</span><b>' + (String(me.application) === '1' ? 'Web Application' : 'Mobile Application') + '</b></div>' +
        '<div class="kv"><span>Member Since</span><b>' + niceDate(me.created_at) + '</b></div><div class="kv"><span>Last Login</span><b>' + (me.last_login ? relTime(me.last_login) : '-') + '</b></div></div>' +
        '</div></div>' +
        '<div class="card"><div class="card-header"><h6 class="ss-card-title"><span class="mdi mdi-account-edit"></span>Profile Info</h6></div><div class="card-body"><form onsubmit="return false">' +
        '<div class="form-group"><label class="control-label" for="user">User Name</label><input type="text" class="form-control form-control-sm" id="user" placeholder="User Name" value="' + esc(me.name) + '"></div>' +
        '<div class="form-group"><label class="control-label" for="email">Email</label><input type="email" class="form-control form-control-sm" id="email" placeholder="name@example.com" value="' + esc(me.email) + '"></div>' +
        '<div class="form-group mb-0"><label class="control-label" for="role">Position (Role)</label><input type="text" class="form-control form-control-sm" id="role" placeholder="Position" value="' + esc(role(me.role_id).name) + '" disabled></div>' +
        '</form></div><div class="card-footer d-flex justify-content-between align-items-center"><a class="btn btn-link btn-sm text-danger logout-link px-0 mdi mdi-logout" href="#"> Logout</a>' +
        '<div><button class="btn btn-light btn-sm" id="changePassBtn">Change Password</button> <button class="btn btn-primary btn-sm" id="saveProfileBtn">Save</button></div></div></div></div>' +
        '<div class="col-lg-8">' +
        kpiRow([
            kpi('My Project', mine.length, 'mdi-briefcase', 'blue', mine.filter(function (p) { return p.status === 'Open' || p.status === 'Re-Open'; }).length + ' active'),
            kpi('Related Task', myTasks.length, 'mdi-clipboard-text', 'cyan', myTasks.filter(isOnGoing).length + ' on going'),
            kpi('Finished', myTasks.filter(isFinished).length, 'mdi-check-circle', 'green', pct(myTasks.filter(isFinished).length, myTasks.length) + '% done')
        ], 'col-md-4') +
        '<div class="card mb-3">' + cardHead('My Project', 'Projects you manage or are assigned to', '<a href="#/project" class="small">View all</a>', 'mdi-briefcase') +
        '<div class="card-body py-1 scroll-y" style="max-height:330px">' +
        (mine.length ? mine.map(function (p) {
            var st = projectStats(p);
            return '<div class="list-row"><div class="kpi-icon ic-blue" style="width:38px;height:38px;font-size:18px"><span class="mdi mdi-google-analytics"></span></div><div class="min-w-0 flex-grow-1 mr-3">' +
                '<a href="#/project/info/' + p.id + '" class="d-block text-truncate font-weight-600" style="color:#1f2d3d;font-size:.82rem">' + esc(p.name) + '</a>' +
                '<small class="text-muted-2">' + esc(p.scope) + ' &middot; ' + st.done + '/' + st.tasks + ' tasks &middot; ' + (st.daysLeft < 0 ? 'ended' : st.daysLeft + ' days left') + '</small>' + progress(st.progress) + '</div>' + badge(p.status) + '</div>';
        }).join('') : emptyState('No project yet', 'mdi-briefcase-outline')) + '</div></div>' +
        '<div class="card">' + cardHead('Recent Activity', 'Latest reports related to you', '', 'mdi-history') + '<div class="card-body">' +
        (acts ? '<ul class="timeline">' + acts + '</ul>' : emptyState('No activity yet', 'mdi-history')) + '</div></div>' +
        '</div></div>';
    return {
        layout: 'top', navTitle: 'Profile', breadcrumb: [['Profile', '#/profile']], back: { text: 'Menu', href: '#/dashboard' },
        html: html, init: function () {
            $('#changePassBtn').on('click', function () { sessionStorage.setItem('ss-reset-user', me.id); go('/user/changePassword'); });
            $('#saveProfileBtn').on('click', function () {
                var name = $.trim($('#user').val()), email = $.trim($('#email').val());
                if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return swal('Please fill a valid name and email', '', 'warning');
                if (DB.users.some(function (u) { return u.email.toLowerCase() === email.toLowerCase() && u.id !== me.id; })) return swal('The email has already been taken.', '', 'warning');
                me.name = name; me.email = email; me.updated_at = stamp(); save(); swalSuccess('Profile has been updated!'); reload();
            });
        }
    };
}

/* =====================================================================
 *  PAGE: Notifications
 * ===================================================================== */
function pageNotif() {
    var groups = { Today: [], Yesterday: [], Earlier: [] };
    DB.notifications.forEach(function (n) {
        var d = dayDiff(n.time.substr(0, 10), today());
        groups[d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : 'Earlier'].push(n);
    });
    var unread = DB.notifications.filter(function (n) { return !n.read; }).length;
    var body = Object.keys(groups).filter(function (k) { return groups[k].length; }).map(function (k) {
        return '<div class="row text-muted mx-0 mt-3 mb-2 small"><div class="col text-left px-0 font-weight-600">' + k + '</div><div class="col text-right px-0">' +
            (k === 'Today' ? longDate(today()) : k === 'Yesterday' ? longDate(addDays(-1)) : '') + '</div></div>' +
            groups[k].map(function (n) {
                return '<div class="list-row px-3 rounded mb-2" style="background:' + (n.read ? '#fafbfd' : '#f0f8ff') + ';border:1px solid #e7edf3">' + notifIcon(n.type) +
                    '<div class="min-w-0 flex-grow-1"><span class="notif-title">' + esc(n.title) + (n.read ? '' : ' <span class="badge-status st-open ml-1">New</span>') + '</span><div class="small">' + esc(n.message) + '</div><span class="notif-time"><span class="mdi mdi-clock-outline"></span> ' + relTime(n.time) + ' &middot; ' + n.time.substr(11, 5) + '</span></div>' +
                    '<div class="text-nowrap ml-3"><a class="btn btn-soft-primary btn-sm" href="#' + n.link + '">View Detail</a> ' + deleteBtn('deleteNotif', n.id, 'Delete') + '</div></div>';
            }).join('');
    }).join('') || emptyState('You are all caught up. No notifications.', 'mdi-bell-outline');
    var html = pageHead('Notifications', DB.notifications.length + ' notifications &middot; ' + unread + ' unread',
            (DB.notifications.length ? '<button class="btn btn-light btn-sm mdi mdi-delete-sweep" id="clearNotif"> Clear All</button>' : '')) +
        '<div class="card"><div class="card-body pt-1">' + body + '</div></div>';
    DB.notifications.forEach(function (n) { n.read = true; }); save();
    return {
        layout: 'top', navTitle: 'Notifications', breadcrumb: [['Notifications', '#/notifications']], back: { text: 'Menu', href: '#/dashboard' },
        html: html, init: function () {
            $('.deleteNotif').on('click', function (e) {
                e.preventDefault(); var id = Number($(this).data('id'));
                DB.notifications = DB.notifications.filter(function (n) { return n.id !== id; }); save(); reload();
            });
            $('#clearNotif').on('click', function () {
                confirmDelete('Clear all notifications?', function () { DB.notifications = []; save(); reload(); });
            });
        }
    };
}

/* =====================================================================
 *  Global handlers
 * ===================================================================== */
$(document).on('click', 'a[href="#"]', function (e) { e.preventDefault(); });
$(document).on('click', '.toggle-password', function () {
    $(this).toggleClass('mdi-eye mdi-eye-off');
    var input = $($(this).attr('toggle'));
    input.attr('type', input.attr('type') === 'password' ? 'text' : 'password');
});
$(document).on('click', '.logout-link', function (e) {
    e.preventDefault(); localStorage.removeItem(SESSION_KEY); go('/login');
});
$(document).on('click', '.notif-link', function (e) {
    e.preventDefault();
    var n = byId(DB.notifications, $(this).data('id'));
    if (n) { n.read = true; save(); go(n.link); }
});

// open index.html?reset to restore the dummy data
if (/[?&]reset\b/.test(location.search)) {
    localStorage.removeItem(STORE_KEY); localStorage.removeItem(SESSION_KEY);
    location.replace(location.pathname + '#/login');
    return;
}

$(window).on('hashchange', router);
$(router);

})(jQuery);
</script>
