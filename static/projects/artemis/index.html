// ---- Period model for the Dashboard: offset 0 = December 2017 (the reference month) ----
var DASH = { offset: 0, label: 'December 2017' };
function dashCapMul(o) {
  if (o <= -8) return 0.85;
  if (o <= -4) return 0.93;
  if (o <= 0) return 1;
  return Math.pow(1.15, Math.floor(o / 6));          // capacity expansion every 6 months
}
function dashOccAt(ne, o) {
  if (o === 0) return ne.occupancy;
  if (o === -1) return ne.last_occupancy;
  var noise = (rand(ne.ne_names + '|' + o) - 0.5) * 2.4;
  var occ;
  if (o < 0) occ = (ne.last_occupancy + (o + 1) * 0.9 + noise) * dashCapMul(-1) / dashCapMul(o) * (o <= -4 ? 0.97 : 1);
  else occ = (ne.occupancy + o * 0.8 + noise) / dashCapMul(o);
  return round2(Math.max(5, Math.min(99, occ)));
}
function dashCountAt(d, o) {
  if (o === 0) return d.count_of_ne;
  if (o === -1) return d.count_of_ne_last;
  var growth = (d.count_of_ne - d.count_of_ne_last) || (rand(d.name + 'g') > 0.6 ? 1 : 0);
  return Math.max(1, d.count_of_ne + Math.round(o * growth * 0.6));
}
function dashLabel(o) {
  var t = 12 + o;
  var m = (((t - 1) % 12) + 12) % 12;
  return MONTHS[m] + ' ' + (2017 + Math.floor((t - 1) / 12));
}
// snapshot of Number Of NE + Network Capacity Status for the selected dashboard period
function dashNonData(o) {
  return $.map(NON_DATA, function (d) {
    var c = dashCountAt(d, o), l = dashCountAt(d, o - 1);
    var inc = pctChange(c, l), st = trendStatus(inc);
    return $.extend({}, d, {
      count_of_ne: c, count_of_ne_last: l,
      increament_ne: inc === 0 ? null : inc,
      increament_ne_status: st,
      increament_ne_color: st == 'up' ? 'green' : (st == 'down' ? 'red' : null)
    });
  });
}
function dashNcsData(o) {
  return $.map(NCS_DATA, function (d) {
    var occ = dashOccAt(d, o), last = dashOccAt(d, o - 1);
    var inc = pctChange(occ, last), st = trendStatus(inc);
    return $.extend({}, d, {
      capacity: Math.round(d.capacity * dashCapMul(o)),
      occupancy: occ, last_occupancy: last,
      increament_occupancy: inc, increament_occupancy_status: st,
      increament_occupancy_color: st == 'up' ? 'red' : (st == 'down' ? 'green' : null),
      current_occupancy_text_color: occ >= 80 ? 'red' : null,
      last_occupancy_text_color: last >= 80 ? 'red' : null
    });
  });
}

// 13 months trend ending at the selected dashboard period
function buildTrendNetworkCapacity(functionName) {
  var ne = Sugar.Array(NCS_DATA).filter({ trend_function: functionName }).raw[0];
  if (!ne) return [];
  var rows = [];
  for (var o = DASH.offset - 12; o <= DASH.offset; o++) {
    var t = 12 + o;
    var m = (((t - 1) % 12) + 12) % 12;
    var y = 2017 + Math.floor((t - 1) / 12);
    var occ = dashOccAt(ne, o);
    var cap = Math.round(ne.capacity * dashCapMul(o));
    rows.push({
      year_time: MONTHS_ABBR[m] + '-' + String(y).slice(2),
      capacity: cap,
      usage: Math.round(cap * occ / 100),
      occupancy: occ
    });
  }
  return rows;
}

var REGIONS = ['Sumbagut', 'Sumbagteng', 'Sumbagsel', 'Jabotabek', 'West Java', 'Central Java', 'East Java', 'Balinusra', 'Kalimantan', 'Sulawesi', 'Puma', 'USO'];
var REGION_CITY = { 'Sumbagut': 'MDN', 'Sumbagteng': 'PKU', 'Sumbagsel': 'PLB', 'Jabotabek': 'JKT', 'West Java': 'BDG', 'Central Java': 'SMG', 'East Java': 'SBY', 'Balinusra': 'DPS', 'Kalimantan': 'BPN', 'Sulawesi': 'MKS', 'Puma': 'JYP', 'USO': 'USO' };
var VENDORS = ['EID', 'Huawei', 'NSN'];
// number of SGSN per region per vendor [EID, Huawei, NSN] (null = vendor not present)
var SGSN_COUNT = {
  'Sumbagut': [2, 1, 1], 'Sumbagteng': [1, 1, null], 'Sumbagsel': [1, 2, 1], 'Jabotabek': [4, 3, 2],
  'West Java': [2, 2, 1], 'Central Java': [2, 1, 1], 'East Java': [3, 2, 1], 'Balinusra': [1, 1, null],
  'Kalimantan': [1, 1, 1], 'Sulawesi': [1, 2, null], 'Puma': [1, null, null], 'USO': [null, 1, null]
};
var KPIS = [
  { key: 'thp', text: 'THP', base: [20000, 60000] },
  { key: 'sau', text: 'SAU', base: [1500000, 4000000] },
  { key: 'pdp', text: 'PDP', base: [1000000, 3000000] },
  { key: '4g_attached', text: '4G Attached', base: [800000, 2500000] },
  { key: '4g_bearers', text: '4G Bearers', base: [1200000, 3500000] },
  { key: 'cpuload', text: 'CPU Load', base: [100, 100], percent: true }
];
var THRESHOLD_FIELD = { 'thp': 'thp_threshold', 'sau': 'sau_threshold', 'pdp': 'pdp_threshold', '4g_attached': 'attached_threshold', '4g_bearers': 'bearers_threshold', 'cpuload': 'cpu_load_threshold' };

var NES = [];
$.each(REGIONS, function (ri, region) {
  $.each(VENDORS, function (vi, vendor) {
    var n = SGSN_COUNT[region][vi] || 0;
    for (var i = 1; i <= n; i++) {
      NES.push({ name: 'SGSN-' + REGION_CITY[region] + '-' + vendor.charAt(0) + pad2(i), region: region, vendor: vendor });
    }
  });
});

function kpiByKey(key) {
  if (key == 'cpu_load') key = 'cpuload';
  return Sugar.Array(KPIS).filter({ key: key }).raw[0] || KPIS[0];
}
function kpiByText(text) { return Sugar.Array(KPIS).filter({ text: text }).raw[0] || KPIS[0]; }
function tIndex(period, year, time) {
  year = parseInt(year, 10) || 2017;
  time = parseInt(time, 10) || 1;
  return period == 'weekly' ? (year - 2017) * 52 + time : (year - 2017) * 12 + time;
}
function periodLabel(period, t) {
  if (period == 'weekly') {
    var w = (((t - 1) % 52) + 52) % 52 + 1;
    var yw = 2017 + Math.floor((t - 1) / 52);
    return 'W' + pad2(w) + '-' + String(yw).slice(2);
  }
  var m = (((t - 1) % 12) + 12) % 12;
  var y = 2017 + Math.floor((t - 1) / 12);
  return MONTHS_ABBR[m] + '-' + String(y).slice(2);
}
function neValue(ne, kpi, period, t) {
  var seed = ne.name + '|' + kpi.key;
  var occBase = 0.38 + 0.36 * rand(seed + 'occ');
  var phase = rand(seed + 'phase') * 6.28;
  var freq = period == 'weekly' ? 0.12 : 0.5;
  var growth = (period == 'weekly' ? t / 52 : t / 12) * 0.02;
  var occ = occBase + 0.07 * Math.sin(t * freq + phase) + 0.03 * (rand(seed + period + t) - 0.5) + growth;
  occ = Math.max(0.15, Math.min(0.97, occ));
  if (kpi.percent) {
    return { capacity: 100, usage: round2(occ * 100), occupancy: round2(occ * 100) };
  }
  var step = period == 'weekly' ? 13 : 3;
  var base = kpi.base[0] + rand(seed + 'base') * (kpi.base[1] - kpi.base[0]);
  var cap = Math.round(base * (1 + 0.05 * Math.floor(Math.max(t, 0) / step)));
  var usage = Math.round(cap * occ);
  return { capacity: cap, usage: usage, occupancy: round2(usage / cap * 100) };
}
function aggValue(nes, kpi, period, t) {
  var cap = 0, usg = 0;
  $.each(nes, function (i, ne) { var v = neValue(ne, kpi, period, t); cap += v.capacity; usg += v.usage; });
  if (!nes.length) return { capacity: null, usage: null, occupancy: null };
  if (kpi.percent) {
    var avg = round2(usg / nes.length);
    return { capacity: 100, usage: avg, occupancy: avg };
  }
  return { capacity: cap, usage: usg, occupancy: round2(usg / cap * 100) };
}
function nesOfRegion(region) {
  if (!region || region == 'Nationwide') return NES;
  return NES.filter(function (n) { return n.region == region; });
}
function regionGroups() {
  var groups = [{ region: 'Nationwide', nes: NES }];
  $.each(REGIONS, function (i, r) { groups.push({ region: r, nes: nesOfRegion(r) }); });
  return groups;
}

var SgsnApi = {
  // f_sgsn_[periode](year, time, region)
  capacity: function (d) {
    var t = tIndex(d.periode, d.year, d.time), rows = [];
    $.each(regionGroups(), function (gi, g) {
      $.each(KPIS, function (ki, k) {
        var cur = aggValue(g.nes, k, d.periode, t), last = aggValue(g.nes, k, d.periode, t - 1);
        var row = { region: g.region, kpi_param: 'SGSN ' + k.text };
        $.each(['capacity', 'usage', 'occupancy'], function (fi, f) {
          var inc = pctChange(cur[f], last[f]);
          var st = trendStatus(inc);
          row[f] = cur[f];
          row['last_' + f] = last[f];
          row['increament_' + f] = inc;
          row['increament_' + f + '_status'] = st;
          row['increament_' + f + '_color'] = (st == null || st == 'stay') ? null :
            (f == 'capacity' ? (st == 'up' ? 'green' : 'red') : (st == 'up' ? 'red' : 'green'));
        });
        row.current_occupancy_text_color = cur.occupancy >= 80 ? 'red' : null;
        row.last_occupancy_text_color = last.occupancy >= 80 ? 'red' : null;
        rows.push(row);
      });
    });
    return rows;
  },
  // f_number_of_sgsn(periode, year, month)
  numberOfSgsn: function (d, nationwideOnly) {
    var rows = [];
    $.each(VENDORS, function (vi, v) {
      var total = 0;
      $.each(REGIONS, function (ri, r) { total += SGSN_COUNT[r][vi] || 0; });
      rows.push({ region: 'Nationwide', vendor: v, number_of_sgsn: total });
    });
    if (nationwideOnly) return rows;
    $.each(REGIONS, function (ri, r) {
      $.each(VENDORS, function (vi, v) { rows.push({ region: r, vendor: v, number_of_sgsn: SGSN_COUNT[r][vi] }); });
    });
    return rows;
  },
  // f_kpi_parameter_threshold(periode, year, month)
  threshold: function (d) {
    var t = tIndex(d.periode, d.year, d.month), rows = [];
    $.each(REGIONS, function (ri, r) {
      var row = { region: r };
      $.each(KPIS, function (ki, k) {
        var n = 0;
        $.each(nesOfRegion(r), function (i, ne) { if (neValue(ne, k, d.periode, t).occupancy >= 80) n++; });
        row[THRESHOLD_FIELD[k.key]] = String(n);
      });
      rows.push(row);
    });
    return rows;
  },
  // f_sgsn_threshold_summary(periode, year, month)
  totalThreshold: function (d) {
    var t = tIndex(d.periode, d.year, d.month), over = 0;
    $.each(NES, function (i, ne) {
      var red = false;
      $.each(KPIS, function (ki, k) { if (neValue(ne, k, d.periode, t).occupancy >= 80) red = true; });
      if (red) over++;
    });
    return [{ total_sgsn: NES.length, kpi_below_threshold: NES.length - over, kpi_over_threshold: over }];
  },
  // f_sgsn_table_regional(periode, year, month, region)
  regTable: function (d) {
    var t = tIndex(d.periode, d.year, d.month), rows = [];
    $.each(KPIS, function (ki, k) {
      $.each(nesOfRegion(d.region), function (i, ne) {
        var v = neValue(ne, k, d.periode, t);
        rows.push({
          kpi_param: 'SGSN ' + k.text, vendor_name: ne.vendor, region_name: ne.region, ne_name: ne.name,
          capacity: v.capacity, usage: v.usage, occupancy: v.occupancy,
          occupancy_text_color: v.occupancy >= 80 ? 'red' : null
        });
      });
    });
    return rows;
  },
  // f_sgsn_kpi_param_[kpi]_[period](year, month, region)
  kpiChart: function (d) {
    var k = kpiByKey(d.kpi_param);
    var time = d.period == 'weekly' ? Math.max(1, Math.round(parseInt(d.month, 10) * 52 / 12)) : d.month;
    var tEnd = tIndex(d.period, d.year, time), rows = [];
    $.each(regionGroups(), function (gi, g) {
      for (var i = 12; i >= 0; i--) {
        var v = aggValue(g.nes, k, d.period, tEnd - i);
        rows.push({ region: g.region, month_abbrevation: periodLabel(d.period, tEnd - i), capacity: v.capacity, usage: v.usage, occupancy: v.occupancy });
      }
    });
    return rows;
  },
  // f_sgsn_chart_regional(periode, year, time, region, kpiparam, nename)
  regionalBar: function (d) {
    var k = kpiByKey(d.kpiparam), tEnd = tIndex(d.periode, d.year, d.time), rows = [];
    var regionNes = nesOfRegion(d.region);
    for (var i = 12; i >= 0; i--) {
      var v = aggValue(regionNes, k, d.periode, tEnd - i);
      rows.push({ label: 'Regionwide', time_period: periodLabel(d.periode, tEnd - i), capacity: v.capacity, usage: v.usage, occupancy: v.occupancy });
    }
    if (d.nename) {
      var ne = Sugar.Array(NES).filter({ name: d.nename }).raw[0];
      if (ne) {
        for (var j = 12; j >= 0; j--) {
          var nv = neValue(ne, k, d.periode, tEnd - j);
          rows.push({ label: ne.name, time_period: periodLabel(d.periode, tEnd - j), capacity: nv.capacity, usage: nv.usage, occupancy: nv.occupancy });
        }
      }
    }
    return rows;
  },
  // f_sgsn_[mom|qoq|yoy]_summary(period, year, time, region, kpiParam, neName)
  trendFooter: function (d) {
    var weekly = d.period == 'weekly';
    var lag = { mom: 1, qoq: weekly ? 13 : 3, yoy: weekly ? 52 : 12 }[d.getFooter] || 1;
    var k = kpiByKey(d.kpiParam), t = tIndex(d.period, d.year, d.time);
    var nes = d.neName ? NES.filter(function (n) { return n.name == d.neName; }) : nesOfRegion(d.region);
    var cur = aggValue(nes, k, d.period, t), prev = aggValue(nes, k, d.period, t - lag);
    var row = {};
    var cap = pctChange(cur.capacity, prev.capacity), usg = pctChange(cur.usage, prev.usage), occ = pctChange(cur.occupancy, prev.occupancy);
    row[d.getFooter + '_cap'] = (cap == null ? 0 : cap).toFixed(2) + '%';
    row[d.getFooter + '_usg'] = (usg == null ? 0 : usg).toFixed(2) + '%';
    row[d.getFooter + '_occ'] = (occ == null ? 0 : occ).toFixed(2) + '%';
    row.increament_sign_cap = trendStatus(cap) || 'stay';
    return [row];
  }
};

/**
 * Create a global getSVG method that takes an array of charts as an argument. The SVG is returned as an argument in the callback.
 */
Highcharts.getSVG = function (charts, options, callback) {
  var svgArr = [],
    top = 0,
    width = 0,
    addSVG = function (svgres) {
      var svgWidth = +svgres.match(/^<svg[^>]*width\s*=\s*\"?(\d+)\"?[^>]*>/)[1],
        svgHeight = +svgres.match(/^<svg[^>]*height\s*=\s*\"?(\d+)\"?[^>]*>/)[1],
        svg = svgres.replace('<svg', '<g transform="translate(0,' + top + ')" ');
      svg = svg.replace('</svg>', '</g>');
      top += svgHeight;
      width = Math.max(width, svgWidth);
      svgArr.push(svg);
    },
    exportChart = function (i) {
      if (i === charts.length) {
        return callback('<svg height="' + top + '" width="' + width +
          '" version="1.1" xmlns="http://www.w3.org/2000/svg">' + svgArr.join('') + '</svg>');
      }
      charts[i].getSVGForLocalExport(options, {}, function () {
        console.log("Failed to get SVG");
      }, function (svg) {
        addSVG(svg);
        return exportChart(i + 1);
      });
    };
  exportChart(0);
};

// ---- Status helpers (one rule for the whole app: <70 normal, 70-80 warning, >=80 critical) ----
// ---- user settings (thresholds, notifications) persisted in localStorage ----
var SETTINGS_KEY = 'capmon_settings_v1';
function loadSettings() {
  var def = { warn: 70, crit: 80, period: 'monthly', notif: { breach: true, weekly: true, event: true, anomaly: false }, users: {} };
  try { var v = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; return $.extend(true, def, v); } catch (e) { return def; }
}
var APP_SET = loadSettings();
function saveSettings(patch) {
  APP_SET = $.extend(true, {}, APP_SET, patch);
  if (patch.notif) APP_SET.notif = patch.notif;
  if (patch.users) APP_SET.users = patch.users;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(APP_SET));
}

function occLevel(v) {
  if (v == null || isNaN(v)) return '';
  return v >= APP_SET.crit ? 'crit' : (v >= APP_SET.warn ? 'warn' : 'ok');
}
function occTextClass(v) {
  var l = occLevel(v);
  return l == 'crit' ? 'text-danger' : (l == 'warn' ? 'text-warn' : '');
}
function occCellHtml(v) {
  if (v == null) return '-';
  var l = occLevel(v);
  return '<span class="occ"><span class="occ-bar ' + l + '"><span style="width:' + Math.min(100, v) + '%"></span></span>' +
    '<span class="occ-val ' + occTextClass(v) + '">' + Number(v).toFixed(2) + '%</span></span>';
}
function statusBadgeHtml(v) {
  var l = occLevel(v);
  if (!l) return '<span class="badge-status info">N/A</span>';
  return '<span class="badge-status ' + l + '">' + ({ ok: 'Normal', warn: 'Warning', crit: 'Critical' })[l] + '</span>';
}
// change indicator; goodWhenUp: true for capacity / NE count, false for usage / occupancy
function deltaHtml(inc, goodWhenUp, suffix) {
  if (inc == null || isNaN(inc)) return '<span class="delta flat">-</span>';
  if (inc === 0) return '<span class="delta flat">&#9644; 0.00' + (suffix || '%') + '</span>';
  var up = inc > 0;
  var good = goodWhenUp ? up : !up;
  return '<span class="delta ' + (up ? 'up-' : 'down-') + (good ? 'good' : 'bad') + '">' +
    (up ? '&#9650; ' : '&#9660; ') + Math.abs(inc).toFixed(2) + (suffix || '%') + '</span>';
}
function tileHtml(t) {
  return '<div class="col-md-3 col-6"><div class="stat-tile t-' + (t.tone || 'brand') + '">' +
    '<div class="stat-icon"><i class="fa ' + t.icon + '"></i></div>' +
    '<div class="stat-body"><div class="stat-label">' + t.label + '</div>' +
    '<div class="stat-value">' + t.value + (t.unit ? '<small>' + t.unit + '</small>' : '') + '</div>' +
    '<div class="stat-sub">' + (t.sub || '&nbsp;') + '</div></div></div></div>';
}
function compactNumber(n) {
  if (n == null) return '-';
  var a = Math.abs(n);
  if (a >= 1e9) return round2(n / 1e9).toFixed(2) + ' B';
  if (a >= 1e6) return round2(n / 1e6).toFixed(2) + ' M';
  if (a >= 1e3) return round2(n / 1e3).toFixed(1) + ' K';
  return numberFormat(n);
}

var tablesToExcel = (function () {
  var uri = 'data:application/vnd.ms-excel;base64,',
    tmplWorkbookXML =
      '<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      '<DocumentProperties xmlns="urn:schemas-microsoft-com:office:office"><Author>Axel Richter</Author><Created>{created}</Created></DocumentProperties>' +
      '<Styles>' +
      '<Style ss:ID="Currency"><NumberFormat ss:Format="Currency"></NumberFormat></Style>' +
      '<Style ss:ID="Date"><NumberFormat ss:Format="Medium Date"></NumberFormat></Style>' +
      '</Styles>' +
      '{worksheets}</Workbook>',
    tmplWorksheetXML = '<Worksheet ss:Name="{nameWS}"><Table>{rows}</Table></Worksheet>',
    tmplCellXML = '<Cell{attributeStyleID}{attributeFormula}><Data ss:Type="{nameType}">{data}</Data></Cell>',
    base64 = function (s) {
      return window.btoa(unescape(encodeURIComponent(s)))
    },
    format = function (s, c) {
      return s.replace(/{(\w+)}/g, function (m, p) {
        return c[p];
      })
    }
  return function (tables, wsnames, wbname, appname) {
    var ctx = "";
    var workbookXML = "";
    var worksheetsXML = "";
    var rowsXML = "";

    for (var i = 0; i < tables.length; i++) {
      if (!tables[i].nodeType) tables[i] = document.getElementById(tables[i]);
      for (var j = 0; j < tables[i].rows.length; j++) {
        rowsXML += '<Row>'
        for (var k = 0; k < tables[i].rows[j].cells.length; k++) {
          var dataType = tables[i].rows[j].cells[k].getAttribute("data-type");
          var dataStyle = tables[i].rows[j].cells[k].getAttribute("data-style");
          var dataValue = tables[i].rows[j].cells[k].getAttribute("data-value");
          dataValue = (dataValue) ? dataValue : tables[i].rows[j].cells[k].innerHTML;
          var dataFormula = tables[i].rows[j].cells[k].getAttribute("data-formula");
          dataFormula = (dataFormula) ? dataFormula : (appname == 'Calc' && dataType == 'DateTime') ? dataValue : null;
          ctx = {
            attributeStyleID: (dataStyle == 'Currency' || dataStyle == 'Date') ? ' ss:StyleID="' + dataStyle + '"' : '',
            nameType: (dataType == 'Number' || dataType == 'DateTime' || dataType == 'Boolean' || dataType == 'Error') ? dataType : 'String',
            data: (dataFormula) ? '' : dataValue,
            attributeFormula: (dataFormula) ? ' ss:Formula="' + dataFormula + '"' : ''
          };
          rowsXML += format(tmplCellXML, ctx);
        }
        rowsXML += '</Row>'
      }
      ctx = {
        rows: rowsXML,
        nameWS: wsnames[i] || 'Sheet' + i
      };
      worksheetsXML += format(tmplWorksheetXML, ctx);
      rowsXML = "";
    }

    ctx = {
      created: (new Date()).getTime(),
      worksheets: worksheetsXML
    };
    workbookXML = format(tmplWorkbookXML, ctx);

    var link = document.createElement("A");
    link.href = uri + base64(workbookXML);
    link.download = wbname || 'Workbook.xls';
    link.target = '_blank';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
})();

function exportTablesForExport(prefix, extraTableIds) {
  var date = new Date();

  var sheetName = [];
  $('.tableforexport').each(function () {

    sheetName.push($(this).attr('id'));
  });
  $.each(extraTableIds || [], function (i, id) { tablenames.push(id); sheetName.push(id); });
  tablesToExcel(tablenames, sheetName, prefix + date.getDate() + '' + (date.getMonth() + 1) + '' + date.getFullYear() + '.xls', 'Excel');
}

// Navbar search (typeahead + menu_list)
var substringMatcher = function (strs) {
  return function findMatches(q, cb) {
    var matches = [];
    var substrRegex = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    $.each(strs, function (i, str) {
      if (substrRegex.test(str)) {
        matches.push(str);
      }
    });
    cb(matches);
  };
};

  var w = { 'Jabotabek': 1.18, 'West Java': 1.1, 'East Java': 1.08, 'Central Java': 1.0, 'Sumbagut': 0.97, 'Sumbagsel': 0.95, 'Sumbagteng': 0.9, 'Balinusra': 0.94, 'Kalimantan': 0.9, 'Sulawesi': 0.93, 'Puma': 0.82, 'USO': 0.7 }[region] || 1;
  var transport = round2(Math.min(97, 64.37 * w + (rand(region + 'tr') - 0.5) * 8));
  var ran = round2(Math.min(97, 60.5 * w + (rand(region + 'ran') - 0.5) * 8));
  var coreNe = Math.round(255 * ({ 'Jabotabek': 0.2, 'West Java': 0.12, 'East Java': 0.12, 'Central Java': 0.1, 'Sumbagut': 0.08, 'Sumbagsel': 0.07, 'Sumbagteng': 0.05, 'Balinusra': 0.05, 'Kalimantan': 0.06, 'Sulawesi': 0.07, 'Puma': 0.05, 'USO': 0.03 }[region] || 0.05));
  var sites = Math.round((24892 + 374175 / 8 + 18687) * ({ 'Jabotabek': 0.19, 'West Java': 0.14, 'East Java': 0.13, 'Central Java': 0.11, 'Sumbagut': 0.08, 'Sumbagsel': 0.07, 'Sumbagteng': 0.05, 'Balinusra': 0.05, 'Kalimantan': 0.06, 'Sulawesi': 0.07, 'Puma': 0.03, 'USO': 0.02 }[region] || 0.05));
  return { region: region, core: core, transport: transport, ran: ran, coreNe: coreNe, sites: sites, worst: Math.max(core, transport, ran) };
}

function initDashboard() {

  function applyDashboardPeriod() {
    var period = $('#period_dropdown').val();

    var month, label;
    if ($('#period_dropdown option:selected').text() == 'Period') {
      $('#week_dropdown, #month_dropdown, #year_dropdown').hide();
    } else if (period == 'weekly') {
      $('#month_dropdown').hide(); $('#week_dropdown, #year_dropdown').show();
      var week = parseInt($('#week_dropdown').val(), 10);
      month = Math.min(12, Math.max(1, Math.ceil(week * 12 / 52)));
      label = 'W' + pad2(week) + ' ' + year;
    } else {
      $('#week_dropdown').hide(); $('#month_dropdown, #year_dropdown').show();
      month = parseInt($('#month_dropdown').val(), 10);
      label = MONTHS[month - 1] + ' ' + year;
    }
    if (month) {
      DASH.offset = (year - 2017) * 12 + month - 12;
      DASH.label = label;
    }
    refreshDashboardData();
  }
  $('#period_dropdown, #week_dropdown, #month_dropdown, #year_dropdown').change(applyDashboardPeriod);

  $(document).off('click.dashslide').on('click.dashslide', '#ncs-tbody tr[data-slide]', function (e) {

    }
  });

  getKpiDataSearch('dashboard');

  // Add highlight (POST AddHighlights)

      title: $('#titleForm').val(),
      description: $('#descForm').val(),
      status: $('#statusCheckbox').is(':checked')
    });
    reloadPage();
  });

  // Update highlight (POST UpdateHighlights)
  $('#updateHighlightForm').on('submit', function (e) {
    e.preventDefault();
    var id = $('#idHighlight').val();
    if (!id) return;
    var $f = $(this);
    HighlightStore.update(id, {
      color: $f.find('[name="color_' + id + '"]').filter('select').val(),
      title: $f.find('[name="title_' + id + '"]').val(),
      description: $f.find('[name="description_' + id + '"]').val(),
      status: $f.find('[name="status_' + id + '"]').is(':checked')
    });
    reloadPage();
  });

  window.clickEdit = function (id, selectedColor) {
    $('#label_' + id).hide();
    $('#teksbok_' + id).show();
    $('#statusCheckbox_' + id).prop("disabled", false);
    $('#hrefedit_' + id).hide();
    $('#hrefupdate_' + id).show();

    $('#colorDropdown_' + id).show();
    $('#idHighlight').val(id);
    $('#colorDropdownSelect_' + id).val(selectedColor).change();
  };
  window.cancelEdit = function (id) {
    $('#teksbok_' + id).hide();
    $('#label_' + id).show();
    $('#statusCheckbox_' + id).prop("disabled", true);
    $('#hrefupdate_' + id).hide();
    $('#hrefedit_' + id).show();
    $('#colorDropdown_' + id).hide();
    $('#color_' + id).show();
    $('#idHighlight').val('');

  };
}

function refreshDashboardData() {

    tileHtml({ icon: 'fa-exclamation-triangle', tone: hot.length ? 'crit' : 'ok', label: 'NE Above 80% Threshold', value: hot.length, unit: ' of ' + ncs.length, sub: hot.length ? $.map(hot, function (d) { return esc(d.ne_names); }).join(', ') : 'All elements within threshold' }) +
    tileHtml({ icon: 'fa-bell', tone: redIssues ? 'warn' : 'info', label: 'Open Highlights', value: openIssues.length, sub: redIssues + ' critical &middot; peak ' + esc(peak.ne_names) + ' ' + peak.occupancy + '%' })
  );

  // Trend chart containers (2 slides per NE: column + line)
  var $g = $('#dashboardChartGroup');
  if ($g.hasClass('slick-initialized')) $g.slick('unslick');

  var groupHtml = '';

  });

  // Render trending charts, then build the carousel so the cloned slides contain the charts too
  getNetworkCapacityStatus(function () {
    $('#dashboardChartGroup').slick(DASHBOARD_SLICK);
  });
}

function dataPieFormating(data) {
  var dataVal = [];
  var ColorType = ['#ce2c2c', '#fba763', '#66c5a2'];
  var count = 0;
  $.each(data, function (key, item) {
    dataVal.push({
      name: 'SGSN ' + item.vendor,
      color: ColorType[count],
      y: item.number_of_sgsn
    });
    count++;
  });
  return { dataVal: dataVal };
}

function dataNumberOfSgsnFormating(data) {
  var Categories = [];
  var dataEID = [];
  var dataHuawei = [];
  var dataNSN = [];
  var dataValue = Sugar.Array(data).exclude({ region: 'Nationwide' }).raw;

  $.each(dataValue, function (key, item) {
    Categories.push(item.region);
    var nos = (item.number_of_sgsn != null) ? parseFloat(item.number_of_sgsn) : item.number_of_sgsn;
    if (item.vendor == 'EID') {
      dataEID.push(nos);
    } else if (item.vendor == 'Huawei') {
      dataHuawei.push(nos);
    } else {
      dataNSN.push(nos);
    }
  });

  return {
    series: [{
      name: 'SGSN EID',
      color: '#ce2c2c',
      data: dataEID
    }, {
      name: 'SGSN Huawei',
      color: '#fba763',
      data: dataHuawei
    }, {
      name: 'SGSN NSN',
      color: '#66c5a2',
      data: dataNSN
    }],
    categories: Sugar.Array.unique(Categories)
  };
}

// Stat tiles on top of the SGSN page (follow region / period filters)
function renderSgsnTiles(kpiSummary) {
  var region = $('#region_dropdown').val();
  var period = $('#period_dropdown').val();
  var t = tIndex(period, $('#year_dropdown').val(), currentTime());
  var nes = nesOfRegion(region);
  var over = 0;
  $.each(nes, function (i, ne) {
    var red = false;
    $.each(KPIS, function (ki, k) { if (neValue(ne, k, period, t).occupancy >= 80) red = true; });
    if (red) over++;
  });
  var vendors = Sugar.Array.unique($.map(nes, function (n) { return n.vendor; }));
  var row = function (p) { return Sugar.Array(kpiSummary).filter({ kpi_param: p }).raw[0] || {}; };
  var sau = row('SGSN SAU'), thp = row('SGSN THP'), cpu = row('SGSN CPU Load');
  var tone = function (v) { var l = occLevel(v); return l == 'ok' ? 'ok' : (l == 'warn' ? 'warn' : 'crit'); };
  $('#scope-chip').text('Scope: ' + (region || 'Nationwide'));
  $('#sgsn-tiles').html(
    tileHtml({ icon: 'fa-hdd-o', tone: 'brand', label: 'SGSN In Service', value: nes.length, sub: vendors.length + ' vendor(s): ' + vendors.join(', ') }) +
    tileHtml({ icon: 'fa-users', tone: tone(sau.occupancy), label: 'SAU Occupancy', value: Number(sau.occupancy || 0).toFixed(2), unit: '%', sub: compactNumber(sau.usage) + ' of ' + compactNumber(sau.capacity) + ' SAU &middot; ' + deltaHtml(sau.increament_occupancy, false) }) +
    tileHtml({ icon: 'fa-exchange', tone: tone(thp.occupancy), label: 'Throughput Occupancy', value: Number(thp.occupancy || 0).toFixed(2), unit: '%', sub: compactNumber(thp.usage) + ' of ' + compactNumber(thp.capacity) + ' Mbps &middot; ' + deltaHtml(thp.increament_occupancy, false) }) +
    tileHtml({ icon: 'fa-exclamation-triangle', tone: over ? 'crit' : 'ok', label: 'NE Over Threshold', value: over, unit: ' of ' + nes.length, sub: 'Any KPI &ge; 80% &middot; CPU load ' + Number(cpu.usage || 0).toFixed(1) + '%' })
  );
}

function appendKpiSummaryTable(targetTable, unit, valueField, data) {
  $.each(data, function (key, item) {
    var cur = item[valueField], last = item['last_' + valueField];
    var currentValue, lastValue;
    if (valueField == 'occupancy') {
      currentValue = cur == null ? '-' : occCellHtml(cur);
      lastValue = last == null ? '-' : '<span class="' + occTextClass(last) + '">' + Number(last).toFixed(2) + '%</span>';
    } else {
      currentValue = cur == null ? '-' : Sugar.Number(cur).format(0).raw;
      lastValue = last == null ? '-' : Sugar.Number(last).format(0).raw;
    }
    var inc = item['increament_' + valueField];
    $('#' + targetTable).append('<tr>' +
      '<td class="pl-3">' + item.kpi_param.replace('SGSN ', '') + '</td>' +
      '<td>' + deltaHtml(inc, valueField == 'capacity') + '</td>' +
      '<td class="num"><b>' + currentValue + '</b></td>' +
      '<td class="num text-muted">' + lastValue + '</td>' +
      '</tr>');
  });
}

function appendSgsnThresholdTable(data) {
  $('#sgsnthresholdbody').html('');
  var cell = function (v) { return '<td class="text-center"><span class="count-badge' + (v != '0' ? ' crit' : '') + '">' + v + '</span></td>'; };
  var totals = [0, 0, 0, 0, 0, 0];
  $.each(data, function (key, item) {
    var vals = [item.thp_threshold, item.sau_threshold, item.pdp_threshold, item.attached_threshold, item.bearers_threshold, item.cpu_load_threshold];
    $.each(vals, function (i, v) { totals[i] += parseInt(v, 10) || 0; });
    $('#sgsnthresholdbody').append('<tr>' +
      '<td class="pl-3 font-weight-bold">' + item.region + '</td>' + $.map(vals, cell).join('') + '</tr>');
  });
  $('#sgsnthresholdbody').append('<tr style="background:#fafbfd"><td class="pl-3 font-weight-bold">Total</td>' +
    $.map(totals, function (v) { return cell(String(v)); }).join('') + '</tr>');
}

// build the NE inventory of each page once
$.each(NE_PAGES, function (path, cfg) {
  var regions = cfg.regions || REGIONS;
  var wsum = regions.reduce(function (s, r) { return s + REGION_WEIGHT[r]; }, 0);
  cfg.nes = [];
  $.each(regions, function (ri, r) {
    var n = Math.max(1, Math.round(cfg.total * REGION_WEIGHT[r] / wsum));
    var city = REGION_CITY[r];
    for (var i = 0; i < n; i++) {
      var vendor = cfg.vendors[(i + ri) % cfg.vendors.length];
      cfg.nes.push({
        name: cfg.prefix + '-' + city + '-' + vendor.charAt(0).toUpperCase() + pad2(i + 1),
        region: r, vendor: vendor, site: CITY_NAME[city] + ' ' + SITE_SUFFIX[i % SITE_SUFFIX.length]
      });
    }
  });
  // keep the inventory equal to the configured total (same number as the dashboard "Number Of NE")
  var hub = cfg.nes.filter(function (n) { return n.region == 'Jabotabek'; });
  while (cfg.nes.length > cfg.total && hub.length > 1) {
    var drop = hub.pop();
    cfg.nes.splice(cfg.nes.indexOf(drop), 1);
  }
  var extra = 1;
  while (cfg.nes.length < cfg.total) {
    var v = cfg.vendors[extra % cfg.vendors.length];
    cfg.nes.push({ name: cfg.prefix + '-JKT-' + v.charAt(0).toUpperCase() + pad2(20 + extra), region: 'Jabotabek', vendor: v, site: 'Jakarta ' + SITE_SUFFIX[extra % SITE_SUFFIX.length] });
    extra++;
  }
});

function neRender() {
  var cfg = NE_STATE.cfg;
  var period = $('#ne_period_dropdown').val();
  var year = $('#year_dropdown').val();
  var time = period == 'weekly' ? $('#week_dropdown').val() : $('#month_dropdown').val();
  var t = tIndex(period, year, time);
  var region = $('#ne_region_dropdown').val();
  var scope = region || 'Nationwide';
  var nes = region ? cfg.nes.filter(function (n) { return n.region == region; }) : cfg.nes;
  var timeLabel = period == 'weekly' ? 'W' + pad2(parseInt(time, 10)) + ' ' + year : MONTHS[parseInt(time, 10) - 1] + ' ' + year;
  var lastLabel = period == 'weekly' ? 'WoW' : 'MoM';

  $('.ne-time-title').text(timeLabel);
  $('#ne-scope-chip').text('Scope: ' + scope);
  $('.ne-scope-label').text(scope);

  // ---------- KPI summary ----------
  var summary = $.map(cfg.kpis, function (k) {
    var cur = aggValue(nes, k, period, t), last = aggValue(nes, k, period, t - 1);
    return { kpi: k, cur: cur, last: last };
  });
  $('#ne_kpi_summary thead th').eq(6).text(lastLabel);
  $('#ne-kpi-tbody').html($.map(summary, function (s) {
    var pct = s.kpi.percent;
    return '<tr><td class="text-left"><b>' + esc(s.kpi.text) + '</b></td><td class="text-left text-muted">' + esc(s.kpi.unit) + '</td>' +
      '<td class="num">' + (pct ? '100' : numberFormat(s.cur.capacity)) + '</td>' +
      '<td class="num">' + numberFormat(s.cur.usage) + '</td>' +
      '<td class="num">' + occCellHtml(s.cur.occupancy) + '</td>' +
      '<td class="num ' + occTextClass(s.last.occupancy) + '">' + Number(s.last.occupancy).toFixed(2) + '%</td>' +
      '<td class="num">' + deltaHtml(round2(s.cur.occupancy - s.last.occupancy), false, ' pp') + '</td>' +
      '<td class="num">' + statusBadgeHtml(s.cur.occupancy) + '</td></tr>';
  }).join(''));
  var top = summary.slice().sort(function (a, b) { return b.cur.occupancy - a.cur.occupancy; })[0];
  $('#ne-kpi-footer').html('Highest utilisation: <b>' + esc(top.kpi.text) + '</b> at <b class="' + occTextClass(top.cur.occupancy) + '">' +
    top.cur.occupancy.toFixed(2) + '%</b> &middot; Thresholds: warning 70%, critical 80%.');

  // ---------- NE level values ----------
  var neRows = $.map(nes, function (ne) {
    var worst = 0, worstKpi = null;
    $.each(cfg.kpis, function (ki, k) {
      var v = neValue(ne, k, period, t);
      if (v.occupancy > worst) { worst = v.occupancy; worstKpi = k; }
    });
    return { ne: ne, worst: worst, worstKpi: worstKpi };
  });
  var over = $.grep(neRows, function (r) { return r.worst >= 80; });
  var warn = $.grep(neRows, function (r) { return r.worst >= 70 && r.worst < 80; });
  var peak = neRows.slice().sort(function (a, b) { return b.worst - a.worst; })[0];
  var vendors = Sugar.Array.unique($.map(nes, function (n) { return n.vendor; }));
  var primary = summary[0];
  var tone = function (v) { var l = occLevel(v); return l == 'ok' ? 'ok' : (l == 'warn' ? 'warn' : 'crit'); };

  $('#ne-tiles').html(
    tileHtml({ icon: 'fa-hdd-o', tone: 'brand', label: cfg.name + ' In Service', value: nes.length, sub: vendors.length + ' vendor(s): ' + vendors.join(', ') }) +
    tileHtml({ icon: 'fa-tachometer', tone: tone(primary.cur.occupancy), label: primary.kpi.text + ' Occupancy', value: primary.cur.occupancy.toFixed(2), unit: '%', sub: compactNumber(primary.cur.usage) + ' of ' + compactNumber(primary.cur.capacity) + ' ' + esc(primary.kpi.unit) }) +
    tileHtml({ icon: 'fa-fire', tone: tone(peak.worst), label: 'Peak NE Utilisation', value: peak.worst.toFixed(2), unit: '%', sub: esc(peak.ne.name) + ' &middot; ' + esc(peak.worstKpi.text) }) +
    tileHtml({ icon: 'fa-exclamation-triangle', tone: over.length ? 'crit' : (warn.length ? 'warn' : 'ok'), label: 'NE Over Threshold', value: over.length, unit: ' of ' + nes.length, sub: warn.length + ' NE in warning (70-80%)' })
  );

  // ---------- Number of NE (vendor donut + per region stacked bar) ----------
  var vendorColors = ['#bc2424', '#f28f43', '#2fa398', '#3d6fb6'];
  var allVendors = cfg.vendors;
  var pieData = $.map(allVendors, function (v, i) {
    var c = $.grep(nes, function (n) { return n.vendor == v; }).length;
    return c ? { name: v, y: c, color: vendorColors[i % vendorColors.length] } : null;
  });
  Highcharts.chart('ne-pie', {
    chart: { type: 'pie' },
    title: { text: '<span style="font-size:22px;color:#1b2536">' + nes.length + '</span><br><span style="font-size:10px;color:#6b7785">TOTAL NE</span>', useHTML: true, verticalAlign: 'middle', y: -18 },
    navigation: { buttonOptions: { enabled: false } },
    tooltip: { pointFormat: '<b>{point.y}</b> NE ({point.percentage:.0f}%)' },
    legend: { itemStyle: { fontSize: '10.5px' } },
    plotOptions: { pie: { innerSize: '62%', dataLabels: { enabled: false }, showInLegend: true, borderWidth: 2 } },
    series: [{ name: 'NE', data: pieData }]
  });
  var barRegions = Sugar.Array.unique($.map(cfg.nes, function (n) { return n.region; }));
  Highcharts.chart('ne-bar', {
    chart: { type: 'bar' },
    title: { text: null },
    navigation: { buttonOptions: { enabled: false } },
    xAxis: { categories: barRegions, labels: { style: { fontSize: '10px' } } },
    yAxis: { min: 0, title: { text: null }, labels: { enabled: false }, gridLineWidth: 0, allowDecimals: false },
    legend: { enabled: false },
    tooltip: { shared: true },
    plotOptions: { series: { stacking: 'normal', pointWidth: 11, dataLabels: { enabled: false } } },
    series: $.map(allVendors, function (v, i) {
      return {
        name: v, color: vendorColors[i % vendorColors.length],
        data: $.map(barRegions, function (r) { var c = $.grep(cfg.nes, function (n) { return n.region == r && n.vendor == v; }).length; return [c || null]; })
      };
    })
  });
  $('#ne-count-footer').html('<span><span class="text-muted">Total ' + esc(cfg.name) + '</span> <b>' + nes.length + '</b></span>' +
    '<span class="badge-status ok">Below Threshold: ' + (nes.length - over.length) + '</span>' +
    '<span class="badge-status crit">Over Threshold: ' + over.length + '</span>');

  // ---------- Trend (capacity / usage columns + occupancy line) ----------
  var trendKpi = Sugar.Array(cfg.kpis).filter({ key: $('#ne_trend_kpi').val() }).raw[0] || cfg.kpis[0];
  var cats = [], cap = [], usg = [], occ = [];
  for (var i = 12; i >= 0; i--) {
    var v = aggValue(nes, trendKpi, period, t - i);
    cats.push(periodLabel(period, t - i));
    cap.push(trendKpi.percent ? null : v.capacity);
    usg.push(v.usage);
    occ.push(v.occupancy);
  }
  Highcharts.chart('ne-trend', {
    chart: { zoomType: 'x' },
    title: { text: trendKpi.text + ' &middot; ' + scope, useHTML: true, align: 'left', x: 4 },
    subtitle: { text: '13 ' + (period == 'weekly' ? 'weeks' : 'months') + ' ending ' + timeLabel + ' (' + esc(trendKpi.unit) + ')', align: 'left', x: 4 },
    legend: { margin: 4, padding: 4 },
    xAxis: { categories: cats, crosshair: true },
    yAxis: [{ min: 0, title: { text: trendKpi.unit } }, {
      min: 0, max: 100, opposite: true, title: { text: 'Occupancy' }, labels: { format: '{value}%' }, gridLineWidth: 0,
      plotLines: [{ value: 80, color: '#e5484d', dashStyle: 'ShortDash', width: 1, label: { text: '80% threshold', align: 'right', style: { color: '#e5484d', fontSize: '10px' } } }]
    }],
    tooltip: { shared: true },
    exporting: { filename: 'trend_' + cfg.prefix + '_' + trendKpi.key },
    series: [
      { name: 'Capacity', type: 'column', color: '#bc2424', data: cap, visible: !trendKpi.percent, tooltip: { valueSuffix: ' ' + trendKpi.unit } },
      { name: 'Usage', type: 'column', color: '#f28f43', data: usg, tooltip: { valueSuffix: ' ' + trendKpi.unit } },

  if (l.media == 'VSAT') return 550 + Math.round(rand(l.seed + 'lat') * 40);
  var a = trNode(l.from), b = trNode(l.to);
  return round2(Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)) / 38 + 0.6);
}
function trCapLabel(g) { return g >= 1000 ? (g / 1000) + ' Tbps' : g + ' Gbps'; }

function initTransport() {

function renderTransport() {
  var p = monthOffset('#tr_month'), o = p.o;
  var layer = $('#tr_layer').val(), metric = $('#tr_metric').val();
  $('.tr-time').text(p.label);
  var links = TR.links.filter(function (l) { return !layer || l.layer == layer; });
  $.each(links, function (i, l) { l.util = trLinkUtil(l, o, metric); l.traffic = round2(l.capacity * l.util / 100); l.latency = trLatency(l); });
  var visibleNodeIds = {};
  $.each(links, function (i, l) { visibleNodeIds[l.from] = 1; visibleNodeIds[l.to] = 1; });
  var nodes = TR.nodes.filter(function (n) { return visibleNodeIds[n.id]; });

  // ---- tiles ----
  var bb = links.filter(function (l) { return l.layer == 'Backbone'; });
  var totalCap = links.reduce(function (s, l) { return s + l.capacity; }, 0);
  var totalTraffic = links.reduce(function (s, l) { return s + l.traffic; }, 0);
  var hot = links.filter(function (l) { return l.util >= 80; });
  var avgUtil = round2(totalTraffic / totalCap * 100);
  $('#tr-tiles').html(
    tileHtml({ icon: 'fa-sitemap', tone: 'brand', label: 'Transport Nodes', value: nodes.length, sub: links.length + ' links monitored' }) +
    tileHtml({ icon: 'fa-exchange', tone: 'info', label: 'Installed Capacity', value: (totalCap / 1000).toFixed(2), unit: ' Tbps', sub: bb.length + ' backbone / ' + (links.length - bb.length) + ' aggregation links' }) +
    tileHtml({ icon: 'fa-tachometer', tone: occLevel(avgUtil) == 'ok' ? 'ok' : 'warn', label: (metric == 'avg' ? 'Average' : 'Busy-hour') + ' Utilization', value: avgUtil.toFixed(2), unit: '%', sub: compactNumber(Math.round(totalTraffic)) + ' Gbps carried' }) +
    tileHtml({ icon: 'fa-exclamation-triangle', tone: hot.length ? 'crit' : 'ok', label: 'Congested Links', value: hot.length, unit: ' of ' + links.length, sub: hot.length ? 'Worst: ' + esc(hot.sort(function (a, b) { return b.util - a.util; })[0].name) : 'No link above 80%' })
  );

  // ---- topology (vis.js network) ----
  if (TR.network) { TR.network.destroy(); TR.network = null; }
  var nodeStyle = {
    'IP Core': { color: '#1b2536', size: 24, font: 13 },
    'Regional Core': { color: '#bc2424', size: 16, font: 12 },
    'Aggregation': { color: '#3d6fb6', size: 8, font: 9 }
  };
  var visNodes = new vis.DataSet($.map(nodes, function (n) {
    var st = nodeStyle[n.type];
    var sel = TR.selected == n.id;
    return {
      id: n.id, label: n.label, x: n.x, y: n.y, shape: 'dot', size: sel ? st.size + 6 : st.size,
      color: { background: st.color, border: sel ? '#00bff3' : '#ffffff', highlight: { background: st.color, border: '#00bff3' } },
      borderWidth: sel ? 4 : 2, font: { size: st.font, color: '#1f2a3a', face: 'Segoe UI', strokeWidth: 3, strokeColor: '#ffffff' },
      title: n.label + ' (' + n.type + ') - ' + n.region
    };
  }));
  var visEdges = new vis.DataSet($.map(links, function (l, i) {
    var dim = TR.selected && l.from != TR.selected && l.to != TR.selected;
    return {
      id: i, from: l.from, to: l.to,
      width: Math.max(1, Math.log(l.capacity) / Math.log(2) - 2),
      color: { color: levelColor(l.util), opacity: dim ? 0.15 : 0.9, highlight: '#00bff3' },
      dashes: l.media == 'VSAT' || l.media == 'Microwave',
      label: l.layer == 'Backbone' ? l.util.toFixed(0) + '%' : undefined,
      font: { size: 10, color: '#1f2a3a', strokeWidth: 3, strokeColor: '#ffffff', align: 'middle' },
      title: l.name + ': ' + l.util.toFixed(1) + '% of ' + trCapLabel(l.capacity) + ' (' + l.media + ')'
    };
  }));
  TR.network = new vis.Network(document.getElementById('tr-topology'), { nodes: visNodes, edges: visEdges }, {
    physics: false,
    interaction: { hover: true, tooltipDelay: 120, navigationButtons: false, zoomView: true },
    edges: { smooth: { type: 'continuous', roundness: 0.2 } }
  });
  TR.network.once('afterDrawing', function () { TR.network.fit({ animation: false }); });
  TR.network.on('click', function (params) {
    TR.selected = params.nodes.length ? params.nodes[0] : null;
    renderTransport();
  });

  // ---- node detail ----
  var scopeLinks = TR.selected ? links.filter(function (l) { return l.from == TR.selected || l.to == TR.selected; }) : links;
  if (TR.selected) {
    var n = trNode(TR.selected);
    var cap = scopeLinks.reduce(function (s, l) { return s + l.capacity; }, 0);
    var tr = scopeLinks.reduce(function (s, l) { return s + l.traffic; }, 0);
    var worst = scopeLinks.slice().sort(function (a, b) { return b.util - a.util; })[0];
    $('#tr-node-name').text(n.label);
    $('#tr-scope').text('Node: ' + n.id);
    $('#tr-node-detail').html(
      '<div class="node-kv"><span>Node ID</span><b>' + n.id + '</b></div>' +
      '<div class="node-kv"><span>Role</span><b>' + n.type + '</b></div>' +
      '<div class="node-kv"><span>Region</span><b>' + n.region + '</b></div>' +
      '<div class="node-kv"><span>Connected links</span><b>' + scopeLinks.length + '</b></div>' +
      '<div class="node-kv"><span>Attached capacity</span><b>' + trCapLabel(cap) + '</b></div>' +
      '<div class="node-kv"><span>Traffic</span><b>' + numberFormat(Math.round(tr)) + ' Gbps</b></div>' +
      '<div class="node-kv"><span>Node utilization</span>' + occCellHtml(round2(tr / cap * 100)) + '</div>' +
      '<div class="node-kv"><span>Hottest link</span><b class="' + occTextClass(worst.util) + '">' + esc(worst.name) + ' (' + worst.util.toFixed(1) + '%)</b></div>' +
      '<div class="node-kv"><span>Hardware</span><b>' + (n.type == 'Aggregation' ? 'Huawei CX600-X8' : (n.type == 'IP Core' ? 'Cisco CRS-X' : 'Juniper MX960')) + '</b></div>');
  } else {
    var byType = function (t) { return nodes.filter(function (x) { return x.type == t; }).length; };
    var media = {};
    $.each(links, function (i, l) { media[l.media] = (media[l.media] || 0) + 1; });
    $('#tr-node-name').text('Nationwide');
    $('#tr-scope').text(layer ? layer + ' layer' : 'All links');
    $('#tr-node-detail').html(
      '<div class="node-kv"><span>IP Core nodes</span><b>' + byType('IP Core') + '</b></div>' +
      '<div class="node-kv"><span>Regional Core nodes</span><b>' + byType('Regional Core') + '</b></div>' +
      '<div class="node-kv"><span>Aggregation nodes</span><b>' + byType('Aggregation') + '</b></div>' +
      '<div class="node-kv"><span>Fiber / Submarine links</span><b>' + ((media.Fiber || 0) + (media.Submarine || 0)) + '</b></div>' +
      '<div class="node-kv"><span>Microwave / VSAT links</span><b>' + ((media.Microwave || 0) + (media.VSAT || 0)) + '</b></div>' +
      '<div class="node-kv"><span>Redundancy</span><b>Dual-homed rings (Java, Sumatera)</b></div>' +
      '<div class="node-kv"><span>Avg latency (backbone)</span><b>' + round2(bb.reduce(function (s, l) { return s + (l.media == 'VSAT' ? 0 : l.latency); }, 0) / Math.max(1, bb.filter(function (l) { return l.media != 'VSAT'; }).length)).toFixed(1) + ' ms</b></div>' +
      '<div class="small text-muted mt-2"><i class="fa fa-info-circle" style="display:inline;width:auto;height:auto;font-size:12px"></i> Select a node on the map to see its details and connected links.</div>');
  }

  // ---- 24h traffic profile ----
  var hours = [], cur = [], prev = [];
  for (var h = 0; h < 24; h++) {
    var shape = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin((h - 5) / 24 * Math.PI * 1.15)), 1.6);
    if (h >= 19 && h <= 22) shape += 0.08;
    hours.push(pad2(h) + ':00');
    cur.push(Math.round(totalTraffic * shape / 1.05));
    prev.push(Math.round(totalTraffic * shape / 1.05 * 0.94));
  }
  Highcharts.chart('tr-hourly', {
    chart: { type: 'areaspline' },
    title: { text: null },
    xAxis: { categories: hours, tickInterval: 3, plotBands: [{ from: 18.5, to: 22.5, color: 'rgba(188,36,36,.06)', label: { text: 'Busy hour', style: { color: '#bc2424', fontSize: '10px' } } }] },
    yAxis: { min: 0, title: { text: 'Gbps' } },
    tooltip: { shared: true, valueSuffix: ' Gbps' },
    plotOptions: { areaspline: { fillOpacity: 0.12, marker: { enabled: false } } },
    exporting: { filename: 'transport_24h_profile' },
    series: [{ name: p.label, color: '#bc2424', data: cur }, { name: 'Previous month', color: '#6b7785', dashStyle: 'ShortDash', fillOpacity: 0, data: prev }]
  });

  // ---- histogram ----
  var buckets = [[0, 40], [40, 60], [60, 70], [70, 80], [80, 90], [90, 101]];
  Highcharts.chart('tr-histogram', {
    chart: { type: 'column' },
    title: { text: null },
    xAxis: { categories: ['<40%', '40-60%', '60-70%', '70-80%', '80-90%', '≥90%'], title: { text: 'Utilization band' } },
    yAxis: { min: 0, allowDecimals: false, title: { text: 'Links' } },
    legend: { enabled: false },
    tooltip: { pointFormat: '<b>{point.y}</b> links' },
    plotOptions: { column: { dataLabels: { enabled: true, style: { textOutline: false, fontWeight: 'normal' } } } },
    exporting: { filename: 'transport_utilization_distribution' },
    series: [{
      name: 'Links', data: $.map(buckets, function (b) {
        var c = links.filter(function (l) { return l.util >= b[0] && l.util < b[1]; }).length;
        return { y: c, color: b[0] >= 80 ? '#e5484d' : (b[0] >= 70 ? '#e8a33d' : '#2fa398') };
      })
    }]
  });

  // ---- media mix ----
  var mediaColors = { Fiber: '#2fa398', Submarine: '#3d6fb6', Microwave: '#f28f43', VSAT: '#8e6cc6' };
  var mediaCount = {};
  $.each(links, function (i, l) { mediaCount[l.media] = (mediaCount[l.media] || 0) + l.capacity; });
  Highcharts.chart('tr-media', {
    chart: { type: 'pie' },
    title: { text: null },
    tooltip: { pointFormat: '<b>{point.y:,.0f} Gbps</b> ({point.percentage:.1f}%)' },
    plotOptions: { pie: { innerSize: '55%', showInLegend: true, dataLabels: { enabled: false } } },
    exporting: { filename: 'transport_media_mix' },
    series: [{ name: 'Capacity', data: $.map(mediaCount, function (v, k) { return { name: k, y: v, color: mediaColors[k] }; }) }]
  });

  // ---- link table ----
  var tableLinks = scopeLinks.slice().sort(function (a, b) { return b.util - a.util; });
  $('#tr-link-count').text(tableLinks.length + ' link(s)' + (TR.selected ? ' connected to ' + TR.selected : ''));
  $('#tr-links-tbody').html($.map(tableLinks, function (l) {
    var a = trNode(l.from), b = trNode(l.to);
    return '<tr><td class="text-left"><b>' + esc(l.name) + '</b></td><td class="text-left">' + esc(a.label) + '</td><td class="text-left">' + esc(b.label) + '</td>' +
      '<td class="text-left">' + l.layer + '</td><td class="text-left text-muted">' + l.media + '</td>' +
      '<td class="num">' + trCapLabel(l.capacity) + '</td><td class="num">' + l.traffic.toFixed(1) + ' Gbps</td>' +
      '<td class="num">' + occCellHtml(l.util) + '</td><td class="num">' + l.latency + ' ms</td><td class="num">' + statusBadgeHtml(l.util) + '</td></tr>';
  }).join(''));
}

function darkChart(opts) {
  // Artemis now uses the same light theme as the rest of the app
  opts.navigation = { buttonOptions: { enabled: false } };
  return opts;
}

function artemisElements() {
  var els = [];
  $.each(dashNcsData(0), function (i, d) {
    els.push({ name: d.ne_names, domain: 'Core', unit: d.unit, occ: d.occupancy, growth: round2(Math.max(0.15, Math.min(1.9, (d.occupancy - d.last_occupancy) * 0.75 + rand(d.ne_names + 'g') * 0.6))) });
  });
  $.each(RAN_TECHS, function (i, t) { els.push({ name: t.name + ' ' + t.metric, domain: 'RAN', occ: t.base, growth: t.growth }); });
  $.each(HOME_RAN_NCS, function (i, d) {
    if (d.name == 'TRX' || d.name == 'POWER' || d.name == 'IuB') els.push({ name: 'RAN ' + d.name, domain: 'RAN', occ: d.occupancy, growth: round2(d.occupancy - d.last) });
  });
  $.each(HOME_TRANSPORT_NCS, function (i, d) { els.push({ name: d.name, domain: 'Transport', occ: d.occupancy, growth: round2(d.occupancy - d.last) }); });
  $.each(TR.links.filter(function (l) { return l.layer == 'Backbone'; }).sort(function (a, b) { return trLinkUtil(b, 0) - trLinkUtil(a, 0); }).slice(0, 5), function (i, l) {
    els.push({ name: 'Backbone ' + l.name, domain: 'Transport', occ: trLinkUtil(l, 0), growth: round2(0.4 + rand(l.seed + 'g') * 0.9) });
  });
  return els;
}
function monthsToReach(e, thr) {
  if (e.occ >= thr) return 0;
  if (e.growth <= 0) return null;
  return Math.ceil((thr - e.occ) / e.growth);
}
function artemisAction(e, risk) {
  if (risk == 'Low') return 'Monitor - no action required';
  var map = {
    Core: 'Plan node expansion / license upgrade',
    RAN: 'Add carrier or sector split on hot clusters',
    Transport: 'Upgrade link capacity / add diverse route'
  };
  return (risk == 'Breached' ? 'Immediate: ' : (risk == 'High' ? 'Priority: ' : 'Plan: ')) + map[e.domain];
}

var AR = { selected: null };
function initArtemis() {
  setHighchartsLang(false);
  AR.selected = null;
  $('#ar_domain, #ar_horizon, #ar_threshold').change(renderArtemis);
  $('#ar_element').change(function () { AR.selected = $(this).val(); renderArtemisForecast(); markArtemisRow(); });
  $(document).off('click.artable').on('click.artable', '#ar-tbody tr', function () {
    AR.selected = $(this).data('name');
    $('#ar_element').val(AR.selected);
    renderArtemisForecast();
    markArtemisRow();
  });
  $('.artemis-tabs a').click(function (e) {
    e.preventDefault();
    $('.artemis-tabs a').removeClass('active');
    $(this).addClass('active');
    var tab = $(this).data('tab');
    $('#ar-tab-forecast').toggle(tab == 'forecast');
    $('#ar-tab-anomaly').toggle(tab == 'anomaly');
    if (tab == 'anomaly') renderArtemisAnomaly(); else renderArtemisForecast();
  });
  renderArtemis();
}

function artemisRows() {
  var thr = parseInt($('#ar_threshold').val(), 10), horizon = parseInt($('#ar_horizon').val(), 10);
  var domain = $('#ar_domain').val();
  return $.map(artemisElements().filter(function (e) { return !domain || e.domain == domain; }), function (e) {
    var m = monthsToReach(e, thr), full = monthsToReach(e, 100);
    var risk = m === 0 ? 'Breached' : (m == null ? 'Low' : (m <= 3 ? 'High' : (m <= horizon ? 'Medium' : 'Low')));
    return $.extend({}, e, { toThr: m, toFull: full, risk: risk, thr: thr });
  }).sort(function (a, b) {
    var av = a.toThr == null ? 999 : a.toThr, bv = b.toThr == null ? 999 : b.toThr;
    return av - bv || b.occ - a.occ;
  });
}

function renderArtemis() {
  var rows = artemisRows(), horizon = parseInt($('#ar_horizon').val(), 10), thr = rows.length ? rows[0].thr : 80;
  var atRisk = rows.filter(function (r) { return r.risk != 'Low'; });
  var first = rows.filter(function (r) { return r.toThr != null; })[0];
  $('#ar-tiles').html(
    tileHtml({ icon: 'fa-th-large', tone: 'info', label: 'Elements Modelled', value: rows.length, sub: 'Core, RAN &amp; Transport capacity indicators' }) +
    tileHtml({ icon: 'fa-exclamation-triangle', tone: atRisk.length ? 'crit' : 'ok', label: 'Breach Within ' + horizon + ' Months', value: atRisk.length, unit: ' of ' + rows.length, sub: rows.filter(function (r) { return r.risk == 'Breached'; }).length + ' already above ' + thr + '%' }) +
    tileHtml({ icon: 'fa-clock-o', tone: 'warn', label: 'Earliest Exhaustion', value: first ? (first.toThr === 0 ? 'Now' : dashLabel(first.toThr).replace(/^(\w{3})\w*/, '$1')) : '-', sub: first ? esc(first.name) + ' reaches ' + thr + '%' : 'No breach forecast' }) +
    tileHtml({ icon: 'fa-check-circle', tone: 'ok', label: 'Model Accuracy', value: '96.2', unit: '%', sub: 'MAPE 3.8% &middot; backtest Jan-Dec 2017' })
  );
  var riskBadge = { Breached: 'crit', High: 'crit', Medium: 'warn', Low: 'ok' };
  $('#ar-tbody').html($.map(rows, function (r) {
    var when = function (m) { return m === 0 ? '<b class="text-danger">Breached</b>' : (m == null ? '<span class="text-muted">Not forecast</span>' : dashLabel(m) + ' <span class="text-muted">(' + m + ' mo)</span>'); };
    return '<tr data-name="' + esc(r.name) + '"><td class="text-left"><b>' + esc(r.name) + '</b></td><td class="text-left">' + r.domain + '</td>' +
      '<td class="num">' + occCellHtml(r.occ) + '</td><td class="num">' + deltaHtml(r.growth, false, ' pp') + '</td>' +
      '<td class="num">' + when(r.toThr) + '</td><td class="num">' + when(r.toFull) + '</td>' +
      '<td class="num"><span class="badge-status ' + riskBadge[r.risk] + '">' + r.risk + '</span></td><td class="text-left text-muted">' + artemisAction(r, r.risk) + '</td></tr>';
  }).join(''));
  $('#ar_element').html($.map(rows, function (r) { return '<option value="' + esc(r.name) + '">' + esc(r.name) + '</option>'; }).join(''));
  if (!AR.selected || !rows.filter(function (r) { return r.name == AR.selected; }).length) AR.selected = rows.length ? rows[0].name : null;
  $('#ar_element').val(AR.selected);
  markArtemisRow();

  // risk map scatter
  var colors = { Breached: '#e5484d', High: '#e5484d', Medium: '#e8a33d', Low: '#2fa398' };
  Highcharts.chart('ar-scatter', darkChart({
    chart: { type: 'scatter', zoomType: 'xy' },
    title: { text: null },
    xAxis: { min: 30, max: 100, title: { text: 'Current occupancy (%)' }, plotLines: [{ value: thr, color: '#e5484d', dashStyle: 'ShortDash', width: 1 }] },
    yAxis: { title: { text: 'Growth (pp / month)' }, plotLines: [{ value: 0, color: '#d5dbe5', width: 1 }] },
    legend: { enabled: false },
    tooltip: { useHTML: true, headerFormat: '', pointFormat: '<b>{point.name}</b><br>Occupancy {point.x:.1f}%<br>Growth {point.y:.2f} pp/mo' },
    series: [{ name: 'Elements', marker: { radius: 6, lineWidth: 1, lineColor: '#ffffff' }, data: $.map(rows, function (r) { return { x: r.occ, y: r.growth, name: r.name, color: colors[r.risk] }; }) }]
  }));

  if ($('#ar-tab-anomaly').is(':visible')) renderArtemisAnomaly(); else renderArtemisForecast();
}

function markArtemisRow() {
  $('#ar-tbody tr').removeClass('selected').filter(function () { return $(this).data('name') == AR.selected; }).addClass('selected');
}

function renderArtemisForecast() {
  var rows = artemisRows();
  var e = rows.filter(function (r) { return r.name == AR.selected; })[0] || rows[0];
  if (!e) return;
  var horizon = parseInt($('#ar_horizon').val(), 10);
  var cats = [], actual = [], forecast = [], lower = [], band = [];
  for (var k = -12; k <= horizon; k++) {
    cats.push(dashLabel(k).replace(/^(\w{3})\w* \d{2}(\d{2})$/, '$1-$2'));
    if (k <= 0) {
      actual.push(round2(Math.max(5, e.occ + e.growth * k + (k ? (rand(e.name + k) - 0.5) * 2.2 : 0))));
      forecast.push(k === 0 ? e.occ : null);
      lower.push(k === 0 ? e.occ : null);
      band.push(k === 0 ? 0 : null);
    } else {
      var f = round2(Math.min(115, e.occ + e.growth * k));
      var spread = round2(0.8 + 0.35 * k);
      actual.push(null);
      forecast.push(f);
      lower.push(round2(f - spread));
      band.push(round2(spread * 2));
    }
  }
  Highcharts.chart('ar-forecast', darkChart({
    title: { text: e.name + ' &middot; ' + e.domain, useHTML: true, align: 'left', x: 4 },
    subtitle: { text: 'Growth ' + e.growth.toFixed(2) + ' pp/month &middot; ' + (e.toThr === 0 ? 'already above ' + e.thr + '%' : (e.toThr == null ? 'no breach forecast' : 'reaches ' + e.thr + '% in ' + dashLabel(e.toThr))), useHTML: true, align: 'left', x: 4, style: { color: '#6b7785' } },
    xAxis: { categories: cats, plotBands: [{ from: 12, to: 12 + horizon, color: 'rgba(61,111,182,.05)', label: { text: 'Forecast', style: { color: '#3d6fb6', fontSize: '10px' } } }] },
    yAxis: {
      min: 0, max: 120, reversedStacks: false, title: { text: 'Occupancy (%)' }, labels: { format: '{value}%' },
      plotLines: [
        { value: e.thr, color: '#e8a33d', dashStyle: 'ShortDash', width: 1, label: { text: e.thr + '% threshold', style: { color: '#e8a33d', fontSize: '10px' } } },
        { value: 100, color: '#e5484d', dashStyle: 'ShortDash', width: 1, label: { text: 'Full capacity', style: { color: '#e5484d', fontSize: '10px' } } }
      ]
    },
    tooltip: { shared: true, valueSuffix: '%', valueDecimals: 2 },
    legend: { align: 'right', verticalAlign: 'top', y: -6 },
    series: [
      { name: 'Lower', type: 'area', stacking: 'normal', stack: 'ci', data: lower, fillOpacity: 0, lineWidth: 0, marker: { enabled: false }, enableMouseTracking: false, showInLegend: false, color: 'transparent' },
      { name: 'Confidence 90%', type: 'area', stacking: 'normal', stack: 'ci', data: band, color: 'rgba(242,143,67,.25)', lineWidth: 0, marker: { enabled: false }, enableMouseTracking: false },
      { name: 'Actual', type: 'spline', data: actual, color: '#3d6fb6', marker: { radius: 3 } },
      { name: 'Forecast', type: 'spline', data: forecast, color: '#f28f43', dashStyle: 'ShortDash', marker: { radius: 2 } }
    ]
  }));

function renderArtemisAnomaly() {

function ruasModel(region) {
  if (region == 'Jabotabek') return RUAS_JABOTABEK;
  var city = (REGION_CITY[region] || 'reg').toLowerCase();
  var suf = ['ctr', 'tmr', 'brt', 'utr', 'sel', 'pst', 'kot', 'pel', 'bnd', 'rsd', 'plz', 'krt', 'sdr', 'mrd', 'jtn', 'klp', 'pgr', 'sng'];
  var types = {}, edges = [];
  var hub1 = city + '-' + suf[0], hub2 = city + '-' + suf[1];
  types[hub1] = 'RR, SR, Core, & AGG';
  types[hub2] = 'SR & AGG';
  if (['Sumbagut', 'East Java', 'Sulawesi', 'West Java'].indexOf(region) >= 0) { types['TSEL-' + city] = 'RR & ASBR'; edges.push([hub1, 'TSEL-' + city]); }
  var mid = [];
  for (var i = 2; i < 6; i++) { var n = city + '-' + suf[i]; types[n] = i % 2 ? 'Core' : 'SR'; mid.push(n); edges.push([hub1, n]); }
  types[city + '-agg'] = 'AGG'; edges.push([hub1, city + '-agg']);
  edges.push([hub1, hub2]);
  for (var j = 6; j < 12; j++) { var u = city + '-' + suf[j]; types[u] = 'PAG'; edges.push([j % 2 ? hub2 : mid[j % mid.length], u]); }
  for (var k = 12; k < 17; k++) { var b = city + '-' + suf[k]; types[b] = 'PAG'; edges.push([b, hub1]); if (k % 2) edges.push([b, hub2]); }
  edges.push([city + '-' + suf[17], city + '-' + suf[12]]); types[city + '-' + suf[17]] = 'PAG';
  return { types: types, edges: edges };
}

function routerSpec(site, type) {

// ---- draw the router diagram as SVG ----
function routerSvg(spec, seed) {
  var W = 700, H = spec.height, gap = 10, out = [], labels = [], ifaces = [];
  var byId = {};
  $.each(spec.nodes, function (i, n) { byId[n.id] = n; });
  var halfW = 50, halfH = 39;
  var boundary = function (dx, dy) {
    var tx = Math.abs(dx) < 1e-6 ? Infinity : halfW / Math.abs(dx);
    var ty = Math.abs(dy) < 1e-6 ? Infinity : halfH / Math.abs(dy);
    return Math.min(tx, ty);
  };
  var txt = function (x, y, str, ang, anchor, size, weight, color) {
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" transform="rotate(' + ang.toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')" text-anchor="' + anchor +
      '" dominant-baseline="central" font-size="' + size + '" font-weight="' + (weight || 'normal') + '" fill="' + (color || '#111') +
      '" style="paint-order:stroke;stroke:#fff;stroke-width:2.5px;font-family:Segoe UI,Arial">' + esc(str) + '</text>';
  };

  // TELKOM boxes first (background)
  $.each(spec.nodes, function (i, n) {
    if (n.box) {
      out.push('<rect x="' + (n.x - 68) + '" y="' + (n.y - 58) + '" width="136" height="138" rx="6" fill="#e8f5df" stroke="#9ccc65"/>');
      out.push('<text x="' + (n.x + 62) + '" y="' + (n.y + 72) + '" text-anchor="end" font-size="10" font-weight="600" fill="#33691e">' + n.box + '</text>');
    }
  });

  $.each(spec.links, function (li, l) {
    var A = byId[l.a], B = byId[l.b];
    var dx = B.x - A.x, dy = B.y - A.y, len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len, px = -uy, py = ux;
    var ts = boundary(ux, uy);
    var sx = A.x + ux * ts, sy = A.y + uy * ts, ex = B.x - ux * ts, ey = B.y - uy * ts;
    var ang = Math.atan2(uy, ux) * 180 / Math.PI, flipped = false;
    if (ang > 90) { ang -= 180; flipped = true; } else if (ang < -90) { ang += 180; flipped = true; }
    var n = l.lines.length;
    $.each(l.lines, function (k, ln) {
      var off = (k - (n - 1) / 2) * gap;
      var x1 = sx + px * off, y1 = sy + py * off, x2 = ex + px * off, y2 = ey + py * off;
      var speedG = ln[2] == 'gi' ? 1 : 10;
      var util = round2(28 + rand(seed + '|' + li + '|' + k) * 68);
      var color = ln[2] == 'gi' ? '#f2e600' : '#e3141b';
      out.push('<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="' + color + '" stroke-width="2.6"><title>' +
        esc(A.label + ' ' + ln[0] + ' ↔ ' + B.label + ' ' + ln[1] + ' · ' + speedG + ' Gbps · ' + util + '%') + '</title></line>');
      labels.push(txt(x1 + ux * 8, y1 + uy * 8, ln[0], ang, flipped ? 'end' : 'start', 8.5));
      labels.push(txt(x2 - ux * 8, y2 - uy * 8, ln[1], ang, flipped ? 'start' : 'end', 8.5));
      if (ln[3]) labels.push(txt((x1 + x2) / 2, (y1 + y2) / 2, ln[3], ang, 'middle', 7.5));
      ifaces.push({ node: A.label, ifA: ln[0], peer: B.label, ifB: ln[1], speed: speedG + ' Gbps', util: util });
    });
    if (l.note) {
      var nx = (sx + ex) / 2 + px * ((n / 2) * gap + 14), ny = (sy + ey) / 2 + py * ((n / 2) * gap + 14);
      labels.push(txt(nx, ny, l.note, ang, 'middle', 11, 'bold'));
    }
    if (l.bundle) {
      var i0 = l.bundle.idx[0], i1 = l.bundle.idx[l.bundle.idx.length - 1];
      var c = ((i0 + i1) / 2 - (n - 1) / 2) * gap;
      var cx = (sx + ex) / 2 + px * c, cy = (sy + ey) / 2 + py * c;
      var segLen = Math.sqrt(Math.pow(ex - sx, 2) + Math.pow(ey - sy, 2));
      var rx = Math.max(24, segLen * 0.36), ry = (i1 - i0) * gap / 2 + 7;
      out.push('<ellipse cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" rx="' + rx.toFixed(1) + '" ry="' + ry.toFixed(1) + '" transform="rotate(' + ang.toFixed(1) + ' ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ')" fill="none" stroke="#1aa33a" stroke-width="2.4"/>');
      // arrow pointing to the bundle from the right-hand side
      var sgn = px >= 0 ? 1 : -1;
      if (Math.abs(px) < 0.2) sgn = py >= 0 ? 1 : -1;
      if (l.bundle.side == 'left') sgn = px >= 0 ? -1 : 1;
      var edge = ((n - 1) / 2) * gap - c + ry;
      var tipX = cx + px * sgn * (ry + 3), tipY = cy + py * sgn * (ry + 3);
      var tailX = cx + px * sgn * (edge + 95), tailY = cy + py * sgn * (edge + 95);
      out.push('<line x1="' + tailX.toFixed(1) + '" y1="' + tailY.toFixed(1) + '" x2="' + tipX.toFixed(1) + '" y2="' + tipY.toFixed(1) + '" stroke="#1aa33a" stroke-width="2.4" marker-end="url(#bundleArrow)"/>');
      labels.push(txt(tailX + (tailX >= cx ? -4 : 4), tailY - 12, l.bundle.label, 0, tailX >= cx ? 'end' : 'start', 10.5, 'bold'));
    }
  });

  // nodes
  var arrowsGlyph = '<g stroke="#fff" stroke-width="5" stroke-linecap="round" fill="#fff">' +
    '<line x1="-24" y1="0" x2="24" y2="0"/><line x1="0" y1="-24" x2="0" y2="24"/>' +
    '<polygon points="0,-33 -8,-21 8,-21" stroke-width="1"/><polygon points="0,33 -8,21 8,21" stroke-width="1"/>' +
    '<polygon points="-33,0 -21,-8 -21,8" stroke-width="1"/><polygon points="33,0 21,-8 21,8" stroke-width="1"/>' +
    '<circle cx="0" cy="0" r="7" fill="#1563b6" stroke-width="4"/></g>';
  $.each(spec.nodes, function (i, nd) {
    var g = '<g transform="translate(' + nd.x + ',' + nd.y + ')"><title>' + esc(nd.label) + '</title>';
    if (nd.kind == 'asbr') {
      g += '<path d="M-50,-26 V26 A50,13 0 0 0 50,26 V-26 Z" fill="#1563b6"/>' +
        '<ellipse cx="0" cy="-26" rx="50" ry="13" fill="#2f7fd1" stroke="#fff" stroke-width="1.5"/>' +
        '<path d="M-50,0 A50,13 0 0 0 50,0 M-50,13 A50,13 0 0 0 50,13" fill="none" stroke="#fff" stroke-width="2"/>' +
        '<g stroke="#fff" stroke-width="2.5" fill="none"><path d="M-18,-30 L18,-22 M-18,-22 L18,-30"/></g>';
      g += '</g>';
      out.push(g);
      labels.push(txt(nd.x, nd.y - 55, nd.label, 0, 'middle', 11, 'bold'));
    } else {
      g += '<rect x="-' + halfW + '" y="-' + halfH + '" width="' + (halfW * 2) + '" height="' + (halfH * 2) + '" rx="9" fill="#1563b6"/>' + arrowsGlyph + '</g>';
      out.push(g);
      labels.push(txt(nd.x, nd.top ? nd.y - halfH - 12 : nd.y + halfH + 16, nd.label, 0, 'middle', 11, 'bold'));
    }
  });

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-height:' + (H + 20) + 'px;display:block" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><marker id="bundleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1aa33a"/></marker></defs>' +
    out.join('') + labels.join('') + '</svg>';
  return { svg: svg, ifaces: ifaces };
}

function notificationItems() {
  var s = APP_SET, items = [];
  if (s.notif.breach) {
    $.each(dashNcsData(0), function (i, d) {
      if (d.occupancy >= s.crit) items.push({ color: '#e5484d', text: esc(d.ne_names) + ' occupancy ' + d.occupancy + '% (critical)', time: (i + 1) * 2 + 'h ago', href: '#/dashboard' });
      else if (d.occupancy >= s.warn) items.push({ color: '#e8a33d', text: esc(d.ne_names) + ' occupancy ' + d.occupancy + '% (warning)', time: (i + 2) * 3 + 'h ago', href: '#/dashboard' });
    });
  }
  if (s.notif.event) {
    $.each(EVENTS, function (i, e) {
      if (e.status == 'Upcoming' && e.readiness < 50) items.push({ color: '#3d6fb6', text: esc(e.name) + ' readiness ' + e.readiness + '%', time: 'yesterday', href: '#/event' });
    });
  }
  if (s.notif.anomaly) items.push({ color: '#8e6cc6', text: 'Artemis: traffic spike +41% detected on 25 Dec', time: '2 days ago', href: '#/artemis' });
  if (s.notif.weekly) items.push({ color: '#2fa398', text: 'Weekly capacity report W52 2017 is ready', time: '3 days ago', href: '#/dashboard' });
  var hours = [1, 2, 4, 6, 9, 13, 18];
  $.each(items, function (i, it) { if (/h ago$/.test(it.time)) it.time = hours[Math.min(i, hours.length - 1)] + 'h ago'; });
  return items;
}

function evStatusBadge(s) { return '<span class="badge-status ' + ({ Ongoing: 'crit', Upcoming: 'info', Completed: 'ok' })[s] + '">' + s + '</span>'; }
function evFiltered() {

function initEvent() {

  $('#ev_status, #ev_region, #ev_type').change(renderEvent);
  $(document).off('click.evcard').on('click.evcard', '#ev-list .event-card, #ev-pins .map-pin', function () {

    renderEvent();
  });
  window.exportExcel = function () { exportTablesForExport('event_management_'); };
  window.exportPdf = printCurrentPage;
  getKpiDataSearch();
  EV_STATE.selected = EV_STATE.selected || 'nye';

}

function renderEvent() {
  var list = evFiltered();
  if (!list.filter(function (e) { return e.id == EV_STATE.selected; }).length) EV_STATE.selected = list.length ? list[0].id : null;
  var upcoming = EVENTS.filter(function (e) { return e.status != 'Completed'; });
  var sites = upcoming.reduce(function (s, e) { return s + e.sites; }, 0);
  var cow = upcoming.reduce(function (s, e) { return s + Math.ceil(e.sites * 0.12); }, 0);
  var ready = round2(upcoming.reduce(function (s, e) { return s + e.readiness * e.sites; }, 0) / sites);
  $('#ev-count-chip').text(list.length + ' event(s)');
  $('#ev-tiles').html(
    tileHtml({ icon: 'fa-calendar', tone: 'brand', label: 'Active & Upcoming Events', value: upcoming.length, sub: EVENTS.filter(function (e) { return e.status == 'Ongoing'; }).length + ' ongoing now' }) +
    tileHtml({ icon: 'fa-signal', tone: 'info', label: 'Sites Impacted', value: numberFormat(sites), sub: 'Across ' + Sugar.Array.unique($.map(upcoming, function (e) { return e.region; })).length + ' regions' }) +
    tileHtml({ icon: 'fa-truck', tone: 'warn', label: 'Mobile COW Planned', value: cow, sub: 'Cell on Wheels units' }) +
    tileHtml({ icon: 'fa-check-square-o', tone: occLevel(100 - ready) == 'ok' ? 'ok' : 'warn', label: 'Overall Readiness', value: ready.toFixed(1), unit: '%', sub: 'Weighted by impacted sites' })
  );

  $('#ev-list').html(list.length ? $.map(list, function (e) {
    var tone = e.readiness >= 80 ? 'ok' : (e.readiness >= 50 ? 'warn' : 'crit');
    return '<a class="event-card' + (e.id == EV_STATE.selected ? ' active' : '') + '" data-event="' + e.id + '">' +
      '<div class="ev-row"><span class="ev-title">' + esc(e.name) + '</span>' + evStatusBadge(e.status) + '</div>' +
      '<div class="ev-meta"><i class="fa fa-calendar-o" style="display:inline;width:auto;height:auto;font-size:11px"></i> ' + e.start + ' - ' + e.end + ' &middot; ' + esc(e.location) + '</div>' +
      '<div class="ev-row"><span class="text-muted">' + e.type + ' &middot; ' + numberFormat(e.sites) + ' sites &middot; +' + e.uplift + '% traffic</span>' +
      '<span class="occ"><span class="occ-bar ' + tone + '"><span style="width:' + e.readiness + '%"></span></span><span class="occ-val">' + e.readiness + '%</span></span></div></a>';
  }).join('') : '<div class="text-muted small">No event for the selected filter.</div>');

  var ev = EVENTS.filter(function (e) { return e.id == EV_STATE.selected; })[0];
  if (!ev) { $('#ev-title').text('Event Detail'); $('#ev-kpis, #ev-checklist, #ev-sites-tbody, #ev-pins').html(''); return; }
  $('#ev-title').text(ev.name);
  $('#ev-status-badge').html(evStatusBadge(ev.status));
  $('#ev-kpis').html(
    '<div class="ev-kpi"><span>Date</span><b>' + ev.start + '</b></div>' +
    '<div class="ev-kpi"><span>Expected crowd</span><b>' + compactNumber(ev.crowd) + '</b></div>' +
    '<div class="ev-kpi"><span>Traffic uplift</span><b style="color:var(--crit)">+' + ev.uplift + '%</b></div>' +
    '<div class="ev-kpi"><span>Impacted sites</span><b>' + numberFormat(ev.sites) + '</b></div>' +
    '<div class="ev-kpi"><span>Readiness</span><b style="color:' + (ev.readiness >= 80 ? 'var(--ok)' : (ev.readiness >= 50 ? '#c6831c' : 'var(--crit)')) + '">' + ev.readiness + '%</b></div>');

  // hourly traffic forecast vs capacity on the event day
  var hours = [], normal = [], forecast = [], base = 40 + ev.sites * 0.9;
  for (var h = 0; h < 24; h++) {
    var shape = 0.35 + 0.65 * Math.pow(Math.max(0, Math.sin((h - 5) / 24 * Math.PI * 1.15)), 1.6);
    var dist = Math.min(Math.abs(h - ev.peak), 24 - Math.abs(h - ev.peak));
    var boost = 1 + ev.uplift / 100 * Math.exp(-dist * dist / 8);
    hours.push(pad2(h) + ':00');
    normal.push(round2(base * shape));
    forecast.push(round2(base * shape * boost));
  }
  var capBefore = round2(Math.max.apply(null, normal) * 1.3);
  var capAfter = round2(capBefore * (1 + ev.uplift / 100 * 0.62 * Math.max(0.35, ev.readiness / 100)));
  Highcharts.chart('ev-traffic', {
    title: { text: 'Event-day traffic forecast vs capacity', align: 'left', x: 4 },
    subtitle: { text: 'Event cluster, Gbps &middot; peak around ' + pad2(ev.peak) + ':00', useHTML: true, align: 'left', x: 4 },
    xAxis: { categories: hours, tickInterval: 2, plotBands: [{ from: ev.peak - 2, to: ev.peak + 2, color: 'rgba(188,36,36,.06)', label: { text: 'Event peak', style: { color: '#bc2424', fontSize: '10px' } } }] },
    yAxis: { min: 0, title: { text: 'Gbps' } },
    tooltip: { shared: true, valueSuffix: ' Gbps' },
    legend: { margin: 4, padding: 4 },
    exporting: { filename: 'event_' + ev.id + '_traffic' },
    series: [
      { name: 'Normal day', type: 'areaspline', color: '#6b7785', fillOpacity: 0.12, data: normal, marker: { enabled: false } },
      { name: 'Event forecast', type: 'column', color: '#f28f43', data: forecast, borderRadius: 2 },
      { name: 'Capacity today', type: 'line', color: '#e5484d', dashStyle: 'ShortDash', data: $.map(hours, function () { return capBefore; }), marker: { enabled: false } },
      { name: 'Capacity after mitigation', type: 'line', color: '#2fa398', data: $.map(hours, function () { return capAfter; }), marker: { enabled: false } }
    ]
  });

  // readiness checklist
  var doneCount = Math.round(ev.readiness / 100 * EV_TASKS.length);
  $('#ev-ready-text').text(doneCount + ' of ' + EV_TASKS.length + ' completed');
  $('#ev-checklist').html($.map(EV_TASKS, function (t, i) {
    var state = i < doneCount ? ['fa-check-circle', 'var(--ok)', 'Done'] : (i == doneCount ? ['fa-clock-o', '#e8a33d', 'In progress'] : ['fa-circle-o', '#9aa6b6', 'Planned']);
    return '<li><i class="fa ' + state[0] + '" style="color:' + state[1] + '"></i><span>' + t + '</span><span class="owner">' + EV_OWNERS[i] + ' &middot; ' + state[2] + '</span></li>';
  }).join(''));

  // map pins
  $('#ev-pins').html($.map(list, function (e) {
    return '<div class="map-pin" data-event="' + e.id + '" style="left:' + e.pos[0] + '%;top:' + e.pos[1] + '%;" title="' + esc(e.name) + '">' +
      (e.id == ev.id ? '<span class="pin-label">' + esc(e.name.replace(/ 20dd$/, '')) + '</span>' : '') +
      '<i class="fa fa-map-marker" style="color:' + (e.id == ev.id ? '#e5242b' : '#1b2536') + ';' + (e.id == ev.id ? '' : 'opacity:.55;') + '"></i></div>';
  }).join(''));

  $('#ev-loc-info').html(
    '<div class="kv"><span>Venue</span><b>' + esc(ev.location) + '</b></div>' +
    '<div class="kv"><span>Region</span><b>' + esc(ev.region) + ' &middot; Area 0' + (areaIndexOf(ev.region) + 1) + '</b></div>' +
    '<div class="kv"><span>Serving core</span><b>' + (ev.region == 'Balinusra' || ev.region == 'Central Java' ? 'IPC Surabaya' : 'IPC Jakarta') + '</b></div>' +
    '<div class="kv"><span>Mobile COW / sites</span><b>' + Math.ceil(ev.sites * 0.12) + ' COW &middot; ' + numberFormat(ev.sites) + ' sites</b></div>');

  // impacted sites
  var n = Math.min(14, ev.sites), city = REGION_CITY[ev.region] || 'JKT';
  var rows = [];
  for (var i = 0; i < n; i++) {
    var sd = ev.id + i;
    var baseU = round2(45 + rand(sd + 'b') * 30);
    var fc = round2(Math.min(160, baseU * (1 + ev.uplift / 100 * (0.35 + rand(sd + 'f') * 0.3))));
    var after = round2(Math.min(99, fc / (1 + ev.uplift / 100 * 0.62 * Math.max(0.35, ev.readiness / 100))));
    var ready = i / n < ev.readiness / 100;
    rows.push({
      site: city + '-' + (ev.id.toUpperCase()).slice(0, 3) + '-' + pad2(i + 1) + ' ' + CITY_NAME[city] + ' ' + SITE_WORDS[Math.floor(rand(sd + 's') * SITE_WORDS.length)],
      tech: ['4G L1800', '4G L2300', '3G U2100', '4G L1800'][i % 4], base: baseU, fc: fc, after: after,
      mit: EV_MITIGATION[Math.floor(rand(sd + 'm') * EV_MITIGATION.length)],
      status: ev.status == 'Completed' ? 'Completed' : (ready ? 'Ready' : (i / n < ev.readiness / 100 + 0.25 ? 'In Progress' : 'Planned'))
    });
  }
  rows.sort(function (a, b) { return b.fc - a.fc; });
  var stBadge = { Ready: 'ok', Completed: 'ok', 'In Progress': 'warn', Planned: 'info' };
  $('#ev-sites-meta').text('top ' + n + ' of ' + numberFormat(ev.sites) + ' impacted sites · ' + ev.region);
  $('#ev-sites-tbody').html($.map(rows, function (r) {
    return '<tr><td class="text-left"><b>' + esc(r.site) + '</b></td><td class="text-left">' + r.tech + '</td><td class="text-left">' + ev.region + '</td>' +
      '<td class="num">' + occCellHtml(r.base) + '</td><td class="num"><span class="' + occTextClass(r.fc) + '"><b>' + r.fc.toFixed(1) + '%</b></span></td>' +
      '<td class="num">' + occCellHtml(r.after) + '</td><td class="text-left text-muted">' + r.mit + '</td>' +
      '<td class="num"><span class="badge-status ' + stBadge[r.status] + '">' + r.status + '</span></td></tr>';
  }).join(''));
}

function isLoggedIn() { return localStorage.getItem('capmon_auth') === '1'; }
function currentPath() { return location.hash.replace(/^#\/?/, '').split('?')[0].replace(/\/$/, ''); }
function goTo(path) {
  path = String(path || '').replace(/^\/+/, '');
  if (currentPath() === path) {
    reloadPage();
  } else {
    location.hash = '#/' + path;
  }
}
function reloadPage() { mount(currentPath()); }

function teardown() {
  $('.modal-backdrop').remove();
  $('body').removeClass('modal-open').css('padding-right', '');
  $('.slick-initialized').each(function () { $(this).slick('unslick'); });
  $.each(Highcharts.charts.slice(), function (i, c) { if (c) c.destroy(); });
  $('.typeahead').each(function () { try { $(this).typeahead('destroy'); } catch (e) { } });
  while (PAGE_CLEANUP.length) { try { PAGE_CLEANUP.pop()(); } catch (e) { } }
}

function mount(path) {
  var r = ROUTES[path];
  routeToken++;
  teardown();
  document.title = 'Capacity Managemenet Dashboard';
  document.body.className = r.bodyClass || '';
  var html = (r.sidenav ? document.getElementById('tpl-sidenav').innerHTML : '') +
    document.getElementById(r.tpl).innerHTML;
  $('#app').html(html);
  $('#app [data-appbar]').each(function () {
    var parts = $(this).attr('data-appbar').split('|');
    $(this).replaceWith(appbarHtml(parts[0], parts[1]));
  });
  enhanceAppbar();
  if (r.menu) {
    $('#menu li[data-menu="' + r.menu + '"]').addClass('active');
    $('#menu a[href="#/' + path + '"]').parent('li').addClass('active');
  }
  window.scrollTo(0, 0);
  if (r.init) r.init();
}

function route() {
  var path = currentPath();
  if (path === 'logout') {
    localStorage.removeItem('capmon_auth');
    location.replace('#/login');
    return;
  }
  if (path === '') {
    location.replace(isLoggedIn() ? '#/landing' : '#/login');
    return;
  }
  if (!ROUTES[path]) {
    location.replace(isLoggedIn() ? '#/landing' : '#/login');
    return;
  }
  if (!ROUTES[path].guest && !isLoggedIn()) {
    location.replace('#/login');
    return;
  }
  if (ROUTES[path].guest && isLoggedIn()) {
    location.replace('#/landing');
    return;
  }
  mount(path);
}

// links with href="#" (or empty href) are placeholders in the original app: do nothing
$(document).on('click', 'a[href="#"], a[href=""]', function (e) { e.preventDefault(); });

$(window).on('hashchange', route);
$(function () { route(); });
