/* =====================================================================
   ROUTER  (Next.js app router -> hash routing, so the single file works
   from file:// as well as from any static server)
   ===================================================================== */
const ROUTES = {
  "/":               { title: "Revolutionizing Lending with AI | Kee Platforms", render: pageHome,    init: initHome },
  "/about/story":    { title: "Our Story - About Kee Platforms | Kee Platforms", render: pageStory,   init: initStory },
  "/about/carrers":  { title: "Careers - Join Our Team | Kee Platforms",         render: pageCareers, init: initCareers },
  "/about/contact":  { title: "Contact Us - Get in Touch | Kee Platforms",       render: pageContact, init: initContact },
  "/privacy-policy": { title: "Kee Platforms",                                   render: pagePrivacy, init: () => {} },
};
let currentPath = null;
let pageCleanups = [];

function normalizePath(p) {
  if (!p) return "/";
  p = p.replace(/\/+$/, "");
  return p === "" ? "/" : p;
}
function parseLocation() {
  // "#/about/story?to=board-of-directors"
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, query] = raw.split("?");
  const to = new URLSearchParams(query || "").get("to");
  return { path: normalizePath(path), to };
}
// Equivalent of router.push(...)
function navigate(link) {
  if (!link) return;
  if (/^(https?:|mailto:|tel:)/.test(link)) { window.open(link, "_blank"); return; }
  const [p, hash] = link.split("#");
  const path = normalizePath(p);
  if (path === currentPath) {
    if (hash) scrollToSection("#" + hash, true); else window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  location.hash = "#" + path + (hash ? "?to=" + encodeURIComponent(hash) : "");
}
// Builds an href for <a> tags
function hrefFor(link) {
  const [p, hash] = link.split("#");
  return "#" + normalizePath(p) + (hash ? "?to=" + encodeURIComponent(hash) : "");
}
// handleScroll / hash effect from DynamicMainLayout
function scrollToSection(id, fromNav) {
  const section = document.querySelector(id);
  if (!section) return;
  const withOffset = currentPath === "/about/story" || (!fromNav && currentPath === "/about/contact");
  if (withOffset) {
    const offsetTop = section.getBoundingClientRect().top + window.pageYOffset;
    window.scrollTo({ top: offsetTop - 100, behavior: "smooth" });
  } else {
    section.scrollIntoView({ behavior: "smooth" });
  }
}

function renderRoute() {
  const { path, to } = parseLocation();
  const route = ROUTES[path] || ROUTES["/"];
  const samePage = currentPath === path;
  currentPath = ROUTES[path] ? path : "/";

  if (!samePage) {
    pageCleanups.forEach(fn => fn());
    pageCleanups = [];
    closeAllMenus();
    document.title = route.title;
    document.getElementById("app").innerHTML = route.render();
    window.scrollTo(0, 0);
    initFadeIns(document.getElementById("app"));
    route.init();
    initScrollTopObserver();
  }
  if (to) setTimeout(() => scrollToSection("#" + to, false), 100);
}

/* =====================================================================
   SHARED HELPERS
   ===================================================================== */
// <FadeInWhenVisible delay={x}>
function fade(inner, delay = 0, extra = "") {
  return `<div class="fiv" style="--d:${delay}s;${extra}">${inner}</div>`;
}
function initFadeIns(root) {
  const els = root.querySelectorAll(".fiv:not(.is-in)");
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  els.forEach(el => io.observe(el));
  // whileInView (viewport once, amount "some")
  const els2 = root.querySelectorAll(".wiv:not(.is-in)");
  const io2 = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("is-in"); io2.unobserve(e.target); }
    });
  }, { threshold: 0 });
  els2.forEach(el => io2.observe(el));
  pageCleanups.push(() => { io.disconnect(); io2.disconnect(); });
}

// Switches classes listed in data-on / data-off for an element and its descendants
function applyState(root, active) {
  [root, ...root.querySelectorAll("[data-on],[data-off]")].forEach(n => {
    const on = (n.dataset.on || "").split(" ").filter(Boolean);
    const off = (n.dataset.off || "").split(" ").filter(Boolean);
    if (active) { n.classList.remove(...off); n.classList.add(...on); }
    else { n.classList.remove(...on); n.classList.add(...off); }
  });
}
// clickedCard state: one active card per group, click again to deselect
function initCardGroup(group, { closeOnOutside = false } = {}) {
  let active = null;
  group.querySelectorAll("[data-card]").forEach(card => {
    card.addEventListener("click", () => {
      if (active === card) { applyState(card, false); active = null; return; }
      if (active) applyState(active, false);
      applyState(card, true);
      active = card;
    });
  });
  if (closeOnOutside) {
    const onDown = e => {
      if (active && !group.contains(e.target)) { applyState(active, false); active = null; }
    };
    document.addEventListener("mousedown", onDown);
    pageCleanups.push(() => document.removeEventListener("mousedown", onDown));
  }
}

const navState = { openDropdowns: {}, mobileDropdowns: {}, mobileOpen: false };

function getTopLevel() {
  return DATA.navbar.menuItems
    .filter(i => !i.parentId && i.status === "ACTIVE")
    .sort((a, b) => a.order - b.order);
}
function getChildrenItems(parentId) {
  return DATA.navbar.menuItems
    .filter(i => i.parentId === parentId && i.status === "ACTIVE")
    .map(c => ({ ...c, children: getChildrenItems(c.id) }));
}
function findItem(id) { return DATA.navbar.menuItems.find(i => i.id === id); }

function handleMenuItemClick(item) {
  if (item.link) {
    if (item.link.startsWith("#")) {
      if (currentPath === "/") scrollToSection(item.link, true);
      else navigate("/" + item.link);
    } else if (item.link.startsWith("/")) {
      navigate(item.link);
    } else {
      window.open(item.link, "_blank");
    }
  }
  closeAllMenus();
}

function renderNestedSubmenu(items, level = 1) {
  return items.map(item => {
    const hasChildren = item.children && item.children.length > 0;
    if (hasChildren) {
      return `<div class="relative group">
        <div class="flex items-center justify-between px-4 py-2 text-base text-gray-700 hover:bg-gray-50 hover:text-black cursor-pointer">
          ${item.link
            ? `<button data-menu-click="${item.id}" class="flex-1 text-left">${item.label}</button>`
            : `<span class="flex-1">${item.label}</span>`}
          ${icon("FaChevronDown", "text-xs ml-2 -rotate-90")}
        </div>
        <div class="absolute ${level === 1 ? "left-full top-0 ml-1" : "right-full top-0 mr-1"} w-56 bg-white shadow-lg rounded-md py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 pointer-events-none group-hover:pointer-events-auto" style="z-index:${60 + level}">
          ${renderNestedSubmenu(item.children, level + 1)}
        </div>
      </div>`;
    }
    return `<div data-menu-click="${item.id}" class="block px-4 py-2 text-base text-gray-700 hover:bg-gray-50 hover:text-black cursor-pointer">${item.label}</div>`;
  }).join("");
}

function renderDesktopNav() {
  const html = getTopLevel().map(item => {
    const children = getChildrenItems(item.id);
    if (children.length > 0) {
      const open = !!navState.openDropdowns[item.id];
      return `<div data-dropdown="${item.id}" class="relative inline-block text-left">
        <div class="flex items-center gap-1">
          ${item.link
            ? `<button data-menu-click="${item.id}" class="hover:text-gray-900 cursor-pointer">${item.label}</button>`
            : `<button data-toggle-dropdown="${item.id}" class="hover:text-gray-900 cursor-pointer">${item.label}</button>`}
          <button data-toggle-dropdown="${item.id}" class="hover:text-gray-900 cursor-pointer p-1">
            ${icon("FaChevronDown", `text-xs transition-transform ${open ? "rotate-180" : "rotate-0"}`)}
          </button>
        </div>
        ${open ? `<div class="absolute -left-1 mt-6 w-56 bg-white backdrop-blur-sm shadow-lg rounded-md py-2 z-50">${renderNestedSubmenu(children)}</div>` : ""}
      </div>`;
    }
    return `<button data-menu-click="${item.id}" class="hover:text-gray-900 cursor-pointer">${item.label}</button>`;
  }).join("");
  document.getElementById("desktop-nav").innerHTML = html;
}

function renderNestedMobileSubmenu(items, level = 1) {
  return items.map(item => {
    const hasChildren = item.children && item.children.length > 0;
    const key = `${item.id}-level-${level}`;
    if (hasChildren) {
      const open = !!navState.mobileDropdowns[key];
      return `<div class="flex flex-col">
        <div class="flex items-center justify-between">
          ${item.link
            ? `<button data-menu-click="${item.id}" class="text-left hover:text-gray-900 flex-1">${item.label}</button>`
            : `<button data-toggle-mobile="${key}" class="text-left hover:text-gray-900 flex-1">${item.label}</button>`}
          <button data-toggle-mobile="${key}" class="hover:text-gray-900 cursor-pointer p-1">
            ${icon("FaChevronDown", `text-xs transition-transform ${open ? "rotate-180" : "rotate-0"}`)}
          </button>
        </div>
        ${open ? `<div class="mt-2 ${level === 1 ? "bg-gray-50/40" : "bg-gray-100/60"} border border-white p-2 rounded-lg flex flex-col space-y-2" style="margin-left:${level * 8}px">${renderNestedMobileSubmenu(item.children, level + 1)}</div>` : ""}
      </div>`;
    }
    return `<button data-menu-click="${item.id}" class="text-left text-gray-700 hover:text-black py-1">${item.label}</button>`;
  }).join("");
}

function renderMobileNav() {
  const html = getTopLevel().map(item => {
    const children = getChildrenItems(item.id);
    if (children.length > 0) {
      const open = !!navState.mobileDropdowns[item.id];
      return `<div class="flex flex-col">
        <div class="flex items-center justify-between">
          ${item.link
            ? `<button data-menu-click="${item.id}" class="text-left hover:text-gray-900">${item.label}</button>`
            : `<button data-toggle-mobile="${item.id}" class="text-left hover:text-gray-900">${item.label}</button>`}
          <button data-toggle-mobile="${item.id}" class="hover:text-gray-900 cursor-pointer p-1">
            ${icon("FaChevronDown", `text-xs transition-transform ${open ? "rotate-180" : "rotate-0"}`)}
          </button>
        </div>
        ${open ? `<div class="mt-2 bg-gray-50/40 border border-white p-2 rounded-lg flex flex-col space-y-3">${renderNestedMobileSubmenu(children)}</div>` : ""}
      </div>`;
    }
    return `<button data-menu-click="${item.id}" class="text-left hover:text-gray-900">${item.label}</button>`;
  }).join("");
  document.getElementById("mobile-nav").innerHTML = html;
  // keep the open menu height in sync after toggling a submenu
  const menu = document.getElementById("mobile-menu");
  if (navState.mobileOpen && menu.style.height !== "auto") menu.style.height = "auto";
}

function setMobileOpen(open) {
  const menu = document.getElementById("mobile-menu");
  navState.mobileOpen = open;
  document.getElementById("mobile-toggle").innerHTML = icon(open ? "FiX" : "FiMenu", "", 24);
  if (open) {
    menu.style.display = "";
    menu.style.height = "0px";
    menu.style.opacity = "0";
    const h = menu.scrollHeight;
    requestAnimationFrame(() => {
      menu.style.height = h + "px";
      menu.style.opacity = "1";
    });
    const done = () => { if (navState.mobileOpen) menu.style.height = "auto"; menu.removeEventListener("transitionend", done); };
    menu.addEventListener("transitionend", done);
  } else {
    if (menu.style.display === "none") return;
    menu.style.height = menu.scrollHeight + "px";
    requestAnimationFrame(() => {
      menu.style.height = "0px";
      menu.style.opacity = "0";
    });
    const done = () => { if (!navState.mobileOpen) menu.style.display = "none"; menu.removeEventListener("transitionend", done); };
    menu.addEventListener("transitionend", done);
  }
}

function closeAllMenus() {
  navState.openDropdowns = {};
  navState.mobileDropdowns = {};
  renderDesktopNav();
  renderMobileNav();
  if (navState.mobileOpen) setMobileOpen(false);
}

function initNavbar() {

  const cta = document.getElementById("nav-cta");
  const mcta = document.getElementById("mobile-cta");
  cta.textContent = DATA.navbar.ctaText;
  mcta.textContent = DATA.navbar.ctaText;
  const ctaClick = () => {
    if (DATA.navbar.ctaLink.startsWith("/")) navigate(DATA.navbar.ctaLink);
    else window.open(DATA.navbar.ctaLink, "_blank");
  };
  cta.addEventListener("click", ctaClick);
  mcta.addEventListener("click", () => { ctaClick(); setMobileOpen(false); });

  document.getElementById("mobile-toggle").innerHTML = icon("FiMenu", "", 24);
  document.getElementById("mobile-toggle").addEventListener("click", () => setMobileOpen(!navState.mobileOpen));

  renderDesktopNav();
  renderMobileNav();

  // Event delegation for all nav clicks
  document.getElementById("site-header").addEventListener("click", e => {
    const t = e.target.closest("[data-menu-click],[data-toggle-dropdown],[data-toggle-mobile],[data-nav]");
    if (!t) return;
    if (t.dataset.menuClick) handleMenuItemClick(findItem(t.dataset.menuClick));
    else if (t.dataset.toggleDropdown) {
      const id = t.dataset.toggleDropdown;
      navState.openDropdowns[id] = !navState.openDropdowns[id];
      renderDesktopNav();
    } else if (t.dataset.toggleMobile) {
      const id = t.dataset.toggleMobile;
      navState.mobileDropdowns[id] = !navState.mobileDropdowns[id];
      renderMobileNav();
    } else if (t.dataset.nav) navigate(t.dataset.nav);
  });

  // Close dropdown / mobile menu when clicking outside
  document.addEventListener("mousedown", e => {
    if (Object.values(navState.openDropdowns).some(Boolean)) {
      let changed = false;
      document.querySelectorAll("[data-dropdown]").forEach(dd => {
        if (!dd.contains(e.target) && navState.openDropdowns[dd.dataset.dropdown]) {
          navState.openDropdowns[dd.dataset.dropdown] = false; changed = true;
        }
      });
      if (changed) renderDesktopNav();
    }
    if (navState.mobileOpen) {
      const menu = document.getElementById("mobile-menu");
      const toggle = document.getElementById("mobile-toggle");
      if (!menu.contains(e.target) && !toggle.contains(e.target)) setMobileOpen(false);
    }
  });

  // Scrolled state
  const header = document.getElementById("site-header");
  const onScroll = () => {
    const scrolled = window.scrollY > 0;
    header.classList.toggle("bg-white/40", scrolled);
    header.classList.toggle("backdrop-blur-md", scrolled);
    header.classList.toggle("border-gray-50", scrolled);
    header.classList.toggle("bg-transparent", !scrolled);
    header.classList.toggle("border-white/0", !scrolled);
  };
  onScroll();
  window.addEventListener("scroll", onScroll);
}

// Floating scroll-to-top: visible when #hero-section is out of view
let heroObserver = null;
function initScrollTopObserver() {
  const btn = document.getElementById("scroll-top");
  if (heroObserver) heroObserver.disconnect();
  btn.classList.add("is-hidden");
  const hero = document.querySelector("#hero-section");
  if (!hero) return;
  heroObserver = new IntersectionObserver(([entry]) => {
    btn.classList.toggle("is-hidden", entry.isIntersecting);
  }, { threshold: 0.1 });
  heroObserver.observe(hero);
}
function initScrollTop() {
  const btn = document.getElementById("scroll-top");
  btn.innerHTML = icon("FiArrowUp", "", 24);
  btn.addEventListener("click", () => {
    const hero = document.querySelector("#hero-section");
    if (hero) hero.scrollIntoView({ behavior: "smooth" });
    else window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

// CustomCursor
function initCursor() {
  const dot = document.getElementById("cursor-dot");
  const circle = document.getElementById("cursor-circle");
  let mouseX = 0, mouseY = 0, circleX = 0, circleY = 0;
  const speed = 0.1;
  window.addEventListener("mousemove", e => {
    mouseX = e.clientX; mouseY = e.clientY;
    dot.style.transform = `translate3d(${mouseX - 4}px, ${mouseY - 4}px, 0)`;
  });
  const animate = () => {
    circleX += (mouseX - circleX) * speed;
    circleY += (mouseY - circleY) * speed;
    circle.style.transform = `translate3d(${circleX - 16}px, ${circleY - 16}px, 0)`;
    requestAnimationFrame(animate);
  };
  animate();
}

function heroDescription(text) {
  return text.split(/(\*[^*]+\*)/).map(part => {
    if (part.startsWith("*") && part.endsWith("*")) {
      return `<span class="font-semibold bg-gradient-to-r from-blue-700 to-purple-500 bg-clip-text text-transparent">${part.slice(1, -1)}</span>`;
    }
    return part;
  }).join("");
}

function heroLabel({ key, delay, closedCls, openCls, dot, dotSize = 12, ringSize = 24, dotFirst, closedText, openTitle, openP, openTextWrap, openDotFirst, t }) {
  const dotEl = `<div class="rounded-full shadow-md" style="width:${dotSize}px;height:${dotSize}px;background:${dot}"></div>`;

  return `<div data-lbl-group="${key}">
    <div class="lbl-closed kee-lbl-appear ${closedCls}" style="--delay:${delay}s;border-radius:999px;background-color:rgba(0,0,0,0.6)">

function initHome() {
  const app = document.getElementById("app");

  // Hero background crossfade every 5s
  const bgs = app.querySelectorAll("[data-hero-bg]");
  let current = 0;
  const interval = setInterval(() => {
    current = (current + 1) % bgs.length;
    bgs.forEach((bg, i) => (bg.style.opacity = i === current ? 1 : 0));
  }, 5000);
  pageCleanups.push(() => clearInterval(interval));

  // Hero labels: swap closed pill <-> open card (AnimatePresence mode="wait")
  app.querySelectorAll("[data-lbl-group]").forEach(group => {
    const closed = group.querySelector(".lbl-closed");
    const open = group.querySelector(".lbl-open");
    let token = 0;
    const swap = (from, to) => {
      const my = ++token;
      closed.classList.remove("kee-lbl-appear");
      from.getAnimations().forEach(a => a.cancel());
      to.getAnimations().forEach(a => a.cancel());
      const out = from.animate(
        [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-6px)" }],
        { duration: 350, easing: "ease-in-out", fill: "forwards" }
      );
      out.onfinish = () => {
        if (my !== token) return;
        from.style.display = "none";
        out.cancel();
        to.style.display = "";
        to.animate(
          [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: 350, easing: "ease-in-out" }
        );
      };
    };
    closed.addEventListener("mouseenter", () => swap(closed, open));
    open.addEventListener("mouseleave", () => swap(open, closed));
  });

  // Navigation buttons inside the page
  const onNavClick = e => {
    const t = e.target.closest("[data-nav],[data-nav-link]");
    if (!t) return;
    e.preventDefault();
    navigate(t.dataset.nav || t.dataset.navLink);
  };
  app.addEventListener("click", onNavClick);
  pageCleanups.push(() => app.removeEventListener("click", onNavClick));

  // Click-to-highlight cards
  app.querySelectorAll("[data-card-group]").forEach(g => initCardGroup(g, { closeOnOutside: g.hasAttribute("data-close-outside") }));

  // Partner logos arrows (only when overflowing)
  const logos = app.querySelector("#partner-logos");
  if (logos) {
    const arrows = app.querySelectorAll("[data-logo-scroll]");
    const check = () => {
      const show = logos.scrollWidth > logos.clientWidth;
      arrows.forEach(a => (a.style.display = show ? "" : "none"));
    };
    check();
    window.addEventListener("resize", check);
    pageCleanups.push(() => window.removeEventListener("resize", check));
    arrows.forEach(a => a.addEventListener("click", () => {
      const amount = logos.clientWidth * 0.6;
      logos.scrollBy({ left: a.dataset.logoScroll === "left" ? -amount : amount, behavior: "smooth" });
    }));
  }
}

function initStory() {
  document.querySelectorAll("[data-team]").forEach(section => {
    const team = DATA.teams.find(t => t.id === section.dataset.team);
    const members = team.members;
    let currentIndex = 0;
    const imgs = section.querySelectorAll("[data-team-img]");
    const OFFSET_CLASSES = [
      "z-20 scale-100 opacity-100",
      "z-10 translate-x-6 sm:translate-x-8 md:translate-x-12 lg:translate-x-20 scale-90 opacity-5",
      "z-0 translate-x-12 sm:translate-x-16 md:translate-x-24 lg:translate-x-40 scale-75 opacity-5",
      "hidden",
    ];
    const ALL = OFFSET_CLASSES.join(" ").split(" ");
    const update = () => {
      const m = members[currentIndex];
      section.querySelector("[data-team-position]").textContent = m.position;
      section.querySelector("[data-team-name]").textContent = m.name;
      section.querySelector("[data-team-bio]").textContent = m.description;
      section.querySelector("[data-team-count]").textContent = `${currentIndex + 1} / ${members.length}`;
      imgs.forEach((img, idx) => {
        const offset = (idx - currentIndex + members.length) % members.length;
        img.classList.remove(...ALL);
        img.classList.add(...OFFSET_CLASSES[Math.min(offset, 3)].split(" "));
      });
    };
    update();
    section.querySelector("[data-team-prev]")?.addEventListener("click", () => { currentIndex = (currentIndex - 1 + members.length) % members.length; update(); });
    section.querySelector("[data-team-next]")?.addEventListener("click", () => { currentIndex = (currentIndex + 1) % members.length; update(); });
  });
}

function initContact() {
  const form = document.getElementById("contact-form");
  const agree = document.getElementById("agreement");
  const btn = document.getElementById("contact-submit");
  const msg = document.getElementById("submit-message");
  let isLoading = false;

  const SPINNER = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Sending...`;

  const syncButton = () => {
    const disabled = !agree.checked || isLoading;
    btn.disabled = disabled;
    btn.classList.toggle("opacity-50", disabled);
    btn.classList.toggle("cursor-not-allowed", disabled);
    btn.classList.toggle("hover:from-blue-800", !disabled);
    btn.classList.toggle("hover:to-purple-600", !disabled);
  };
  const showMessage = text => {
    const ok = text.includes("successfully") || text.includes("Thank you");
    msg.className = `p-3 rounded-md text-sm ${ok ? "bg-green-100 text-green-700 border border-green-300" : "bg-red-100 text-red-700 border border-red-300"}`;
    msg.textContent = text;
    msg.style.display = text ? "" : "none";
  };
  agree.addEventListener("change", syncButton);

  form.addEventListener("submit", e => {
    e.preventDefault();
    showMessage("");
    if (!agree.checked) { showMessage("Please agree to the privacy policy"); return; }
    isLoading = true;
    btn.innerHTML = SPINNER;
    syncButton();
    // Dummy submit (original: POST /api/contact)
    setTimeout(() => {
      const payload = Object.fromEntries(new FormData(form).entries());
      console.log("[dummy] contact submission:", payload);
      showMessage("Thank you! Your message has been sent successfully.");
      form.reset();
      agree.checked = false;
      isLoading = false;
      btn.textContent = "Submit";
      syncButton();
    }, 1200);
  });
}
