<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge,chrome=1">
  <meta name="description" content="Navy - One Management System">
  <title>Navy</title>
  <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">

  <!-- Vuetify 0.17.4 (same build the original Nuxt app used) -->
  <link rel="stylesheet" href="assets/css/vuetify.min.css">

  <style>
  /* ==========================================================
     Fonts (local copies)
     ========================================================== */
  @font-face { font-family: 'Material Icons'; font-style: normal; font-weight: 400;
    src: local('Material Icons'), local('MaterialIcons-Regular'), url(assets/fonts/MaterialIcons-Regular.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400 500;
    src: url(assets/fonts/Montserrat-latin.woff2) format('woff2'); }
  @font-face {src:url("assets/fonts/Roboto-Thin.woff2") format("woff2"); font-family: 'Roboto'; font-weight: 100; }
  @font-face {src:url("assets/fonts/Roboto-Light.woff2") format("woff2"); font-family: 'Roboto'; font-weight: 300; }
  @font-face {src:url("assets/fonts/Roboto-Regular.woff2") format("woff2"); font-family: 'Roboto'; font-weight: 400; }
  @font-face {src:url("assets/fonts/Roboto-Medium.woff2") format("woff2"); font-family: 'Roboto'; font-weight: 500; }
  @font-face {src:url("assets/fonts/Roboto-Bold.woff2") format("woff2"); font-family: 'Roboto'; font-weight: 700; }

  .material-icons {
    font-family: 'Material Icons'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal;
    direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  }

  /* ==========================================================
     Original styles: resources/assets/css/app.styl + main.css
     ========================================================== */
  html, body { background-color: #fff; color: #2e2f30; letter-spacing: 0.5px; font-family: "Source Sans Pro", Arial, sans-serif; height: 100vh; margin: 0; }
  .vertical-center { min-height: 100%; min-height: 100vh; display: flex; align-items: center; }
  a, a:hover, a:focus, a:visited { color: #744d82; text-decoration: none; }
  .page-enter-active, .page-leave-active { transition: opacity .35s }
  .page-enter, .page-leave-active { opacity: 0 }
  .radius-8{ border-radius:8px; }
  .montserrat{ font-family: 'Montserrat', sans-serif; font-weight: 500; }
  .color-fff{ color:#fff; }
  .enter{ border-radius: 18px; border:1px solid #ccc; padding: 8px 24px; font-family: 'Montserrat', sans-serif; color: #333; }
  .bg-module{ min-height: 100vh; background: url(assets/img/bg.webp) no-repeat center top #141e82; background-size: cover; }
  .navy-header { background: #0D47A1!important; z-index: 1000; position: relative; color:#fff; }
  #myVideo {
    width: 500px; position: absolute; right: 0; top:-131px; opacity: 1; left: -50px; z-index: 0;
    box-shadow: inset -92px 0px 134px -9px rgba(13,72,161,1);
  }
  .video-bg{ width: 300px; height: 60px; z-index: 3; top: 0; position: absolute; left: 160px; box-shadow: inset -200px 0px 188px -110px rgba(13,72,161,1) }
  .navy-ico-title{ position: relative; z-index: 2; }
  .navy-sub-header{ background: #0D47A1!important; z-index: 990; position: relative; height: 47px; }
  .toolbar__content{ border-bottom: 1px solid #1565C0!important; padding: 10px 0px; height: 61px!important; padding-left: 3rem; padding-right: 3rem; }
  .normal{ font-weight: 400; }
  .menu__content.menuable__content__active UL{ padding-top:0px; padding-bottom: 0px; background:#fff!important; }
  .menu__content.menuable__content__active ul li a{ font-size: 14px; }
  .navy-sub-header .tabs__wrapper--scrollable { margin:0px 2rem!important; }
  .navy-sub-header .tabs__li a{ color:#fff!important; font-size:12px; }
  .navy-content-wrap .content{ padding: 0px!important; }
  .card{ box-shadow: none; border:1px solid #efefef; border-radius: 4px; }
  .title{ color: #283593; line-height: 120%!important; }
  .color-1{ color:#283593!important; }
  p{ word-wrap: break-word; }
  .scrollbar-ripe-malinka::-webkit-scrollbar-track { box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.1); background-color: #fff; border-radius: 10px; }
  .scrollbar-ripe-malinka::-webkit-scrollbar { width: 12px; background-color: #fff; }
  .scrollbar-ripe-malinka::-webkit-scrollbar-thumb { border-radius: 10px; box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.1); background-image: linear-gradient(120deg, #E8EAF6 0%, #E3F2FD 100%); }
  .thin::-webkit-scrollbar { width: 6px; }
  p.navy-quote{ font-size: 20px; color: #000; font-style: italic; font-family: serif, times new roman; }
  .btn-blank{ background: #fff; color: #000!important; border:1px solid #E0E0E0; }

  /* ==========================================================
     Design system (consistent spacing / size / components)
     ========================================================== */
  :root { --navy:#0D47A1; --blue:#1d90fb; --ink:#1f2a44; --muted:#7a869a; --line:#e6eaf2; --soft:#f4f6fb; }
  #appnavy.application.theme--light { background: var(--soft); font-family: 'Roboto', sans-serif; letter-spacing: .2px; }
  #appnavy a { text-decoration: none; }
  .page { padding: 28px 32px 48px; max-width: 1680px; margin: 0 auto; }
  .page-header { display: flex; align-items: flex-end; flex-wrap: wrap; margin-bottom: 22px; }
  .page-header__crumbs { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; }
  .page-header__crumbs .material-icons { font-size: 14px; margin: 0 4px; }
  .page-header__title { font-size: 22px; font-weight: 500; color: var(--ink); margin: 0; line-height: 1.3; }
  .page-header__sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .page-header__actions { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; }
  .page-header__actions > * { margin-left: 10px; margin-top: 8px; }

  .grid { display: flex; flex-wrap: wrap; margin: -8px; }
  .grid + .grid { margin-top: 8px; }
  .gcol { padding: 8px; width: 100%; display: flex; }
  .gcol > * { flex: 1; min-width: 0; }
  @media (min-width: 600px) { .sm-6 { width: 50%; } .sm-4 { width: 33.3333%; } }
  @media (min-width: 960px) {
    .md-2 { width: 16.6666%; } .md-3 { width: 25%; } .md-4 { width: 33.3333%; } .md-5 { width: 41.6666%; }
    .md-6 { width: 50%; } .md-7 { width: 58.3333%; } .md-8 { width: 66.6666%; } .md-9 { width: 75%; }
  }
  @media (min-width: 1264px) { .lg-2 { width: 16.6666%; } .lg-3 { width: 25%; } .lg-4 { width: 33.3333%; } }

  /* stat card */
  .stat { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .stat__icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 14px; flex: none; }
  .stat__icon .material-icons { font-size: 24px; }
  .stat__body { min-width: 0; }
  .stat__label { font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .stat__value { font-size: 24px; font-weight: 500; color: var(--ink); line-height: 1.25; white-space: nowrap; }
  .stat__value small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .stat__sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat__sub.up { color: #2e9e5b; } .stat__sub.down { color: #e04848; }

  /* panel */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .panel__head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eef1f6; min-height: 58px; }
  .panel__head .material-icons.ph-icon { color: var(--blue); font-size: 20px; margin-right: 10px; }
  .panel__title { font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .panel__sub { font-size: 12px; color: var(--muted); }
  .panel__actions { margin-left: auto; display: flex; align-items: center; }
  .panel__body { padding: 16px 18px; flex: 1; min-height: 0; }
  .panel__body.flush { padding: 0; }
  .panel__foot { border-top: 1px solid #eef1f6; padding: 10px 18px; font-size: 12px; color: var(--muted); display: flex; align-items: center; }

  /* status chips */
  .chip-s { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 500; white-space: nowrap; line-height: 18px; }
  .chip-s:before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; }
  .chip-s.cs-green { color: #2e9e5b; background: #e6f6ec; } .chip-s.cs-orange { color: #e07b00; background: #fff2e0; }
  .chip-s.cs-blue { color: #1c6fd1; background: #e5f0fd; } .chip-s.cs-red { color: #e04848; background: #fdeaea; }
  .chip-s.cs-grey { color: #6b7688; background: #eef1f5; } .chip-s.cs-purple { color: #7e57c2; background: #f0eafa; }
  .chip-s.cs-amber { color: #b88600; background: #fff7d6; } .chip-s.cs-teal { color: #00897b; background: #e0f4f1; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); font-size: 11px; color: #4a5568; white-space: nowrap; }

  /* tables */
  .ntable { width: 100%; border-collapse: collapse; }
  .ntable th { text-align: left; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 500;
    padding: 10px 14px; background: #fafbfd; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ntable td { padding: 11px 14px; border-bottom: 1px solid #f0f2f7; font-size: 13.5px; color: #2d3748; vertical-align: middle; }
  .ntable tbody tr { transition: background .15s; }
  .ntable tbody tr:hover { background: #f7f9fd; }
  .ntable tbody tr.clickable { cursor: pointer; }
  .ntable .muted { color: var(--muted); font-size: 12px; }
  .person { display: flex; align-items: center; min-width: 0; }
  .person img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; margin-right: 12px; flex: none; background: #eef1f5; }
  .person__name { font-weight: 500; color: var(--ink); font-size: 13.5px; white-space: nowrap; }
  .person__meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .nowrap { white-space: nowrap; }
  .desc-cell { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty .material-icons { font-size: 40px; color: #c5ccd8; display: block; margin: 0 auto 8px; }

  /* filters */
  .search { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: 38px; min-width: 240px; }
  .search .material-icons { font-size: 20px; color: var(--muted); margin-right: 6px; }
  .search input { border: 0; outline: none; flex: 1; font-size: 13.5px; background: transparent; color: var(--ink); font-family: inherit; }
  .nselect { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font-size: 13.5px; background: #fff; color: var(--ink); outline: none; font-family: inherit; }
  .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 12.5px; color: #4a5568; border-radius: 6px; cursor: pointer; font-family: inherit; outline: none; white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--navy); font-weight: 500; box-shadow: 0 1px 2px rgba(16,24,40,.08); }
  .seg button .cnt { margin-left: 6px; font-size: 11px; color: var(--muted); }
  .nbtn { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    color: var(--ink) !important; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; outline: none; white-space: nowrap; }
  .nbtn .material-icons { font-size: 18px; margin-right: 6px; }
  .nbtn:hover { background: var(--soft); }
  .nbtn.primary { background: var(--navy); border-color: var(--navy); color: #fff !important; }
  .nbtn.primary:hover { background: #0b3d8c; }
  .nbtn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 12.5px; color: var(--muted); border-top: 1px solid #eef1f6; }
  .pager__btns { display: flex; }
  .pager__btns button { min-width: 32px; height: 32px; margin-left: 4px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; color: #4a5568; font-family: inherit; outline: none; }
  .pager__btns button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .pager__btns button:disabled { opacity: .45; cursor: default; }

  /* list rows (attendance / calls / frequents) */
  .lrow { display: flex; align-items: center; padding: 10px 18px; border-bottom: 1px solid #f0f2f7; transition: background .15s; }
  .lrow:last-child { border-bottom: 0; }
  .lrow.clickable { cursor: pointer; }
  .lrow.clickable:hover { background: #f7f9fd; }
  .lrow.active { background: #eef5ff; box-shadow: inset 3px 0 0 var(--blue); }
  .lrow img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; margin-right: 12px; flex: none; }
  .lrow__main { flex: 1; min-width: 0; }
  .lrow__title { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow__sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow__side { text-align: right; margin-left: 10px; flex: none; }
  .lrow__time { font-size: 12px; color: var(--muted); }
  .scroll-list { overflow-y: auto; }

  /* key-value list */
  .kv { display: flex; padding: 9px 0; border-bottom: 1px dashed #edf0f5; font-size: 13px; }
  .kv:last-child { border-bottom: 0; }
  .kv__k { color: var(--muted); width: 42%; flex: none; display: flex; align-items: center; }
  .kv__k .material-icons { font-size: 16px; margin-right: 8px; color: #a0aabb; }
  .kv__v { color: var(--ink); font-weight: 500; min-width: 0; word-break: break-word; }

  /* progress bars */
  .pbar { margin-bottom: 16px; }
  .pbar:last-child { margin-bottom: 0; }
  .pbar__top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; color: #4a5568; }
  .pbar__top b { color: var(--ink); font-weight: 500; }
  .pbar__track { height: 8px; background: #eef1f6; border-radius: 4px; overflow: hidden; }
  .pbar__fill { height: 100%; border-radius: 4px; transition: width .6s; }

  /* toolbar user area */
  .hdr-user { display: flex; align-items: center; }
  .hdr-clock { font-size: 12px; opacity: .85; margin-right: 18px; display: flex; align-items: center; white-space: nowrap; }
  .hdr-clock .material-icons { font-size: 16px; margin-right: 6px; }
  .hdr-user img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.35); }
  .hdr-user__name { margin-left: 10px; line-height: 1.2; text-align: left; }
  .hdr-user__name b { display: block; font-size: 13px; font-weight: 500; }
  .hdr-user__name span { font-size: 11px; opacity: .75; }
  @media (max-width: 900px) { .hdr-clock { display: none; } }

  /* branch card */
  .bcard { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s; color: inherit !important; }
  .bcard:hover { box-shadow: 0 10px 24px rgba(16,24,40,.10); transform: translateY(-2px); }
  .bcard__img { height: 170px; background-size: cover; background-position: center; position: relative; }
  .bcard__img:after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,71,161,0) 40%, rgba(13,30,70,.75)); }
  .bcard__badge { position: absolute; top: 12px; left: 12px; z-index: 1; background: rgba(255,255,255,.92); color: var(--navy); font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 12px; letter-spacing: .5px; }
  .bcard__status { position: absolute; top: 12px; right: 12px; z-index: 1; }
  .bcard__type { position: absolute; left: 16px; bottom: 12px; z-index: 1; color: #fff; font-size: 12px; opacity: .95; display: flex; align-items: center; }
  .bcard__type .material-icons { font-size: 16px; margin-right: 5px; }
  .bcard__body { padding: 16px 18px 6px; flex: 1; }
  .bcard__name { font-size: 16px; font-weight: 500; color: #283593; margin-bottom: 6px; }
  .bcard__addr { font-size: 12.5px; color: var(--muted); display: flex; align-items: flex-start; min-height: 36px; }
  .bcard__addr .material-icons { font-size: 16px; margin-right: 6px; margin-top: 1px; color: #a0aabb; }
  .bcard__cmd { font-size: 12.5px; color: #4a5568; margin-top: 8px; display: flex; align-items: center; }
  .bcard__cmd .material-icons { font-size: 16px; margin-right: 6px; color: #a0aabb; }
  .bcard__stats { display: flex; border-top: 1px solid #eef1f6; margin-top: 12px; }
  .bcard__stats > div { flex: 1; text-align: center; padding: 12px 6px; }
  .bcard__stats > div + div { border-left: 1px solid #eef1f6; }
  .bcard__stats b { display: block; font-size: 17px; font-weight: 500; color: var(--ink); }
  .bcard__stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  /* employee card */
  .ecard { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s, transform .2s; color: inherit !important; }
  .ecard:hover { box-shadow: 0 10px 24px rgba(16,24,40,.10); transform: translateY(-2px); }
  .ecard__top { padding: 22px 16px 14px; text-align: center; background: linear-gradient(180deg, #f2f6ff, #fff); position: relative; }
  .ecard__top img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(16,24,40,.15); }
  .ecard__status { position: absolute; top: 12px; right: 12px; }
  .ecard__name { font-size: 15px; font-weight: 500; color: #283593; margin-top: 10px; }
  .ecard__rank { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ecard__div { margin-top: 8px; }
  .ecard__info { padding: 4px 16px 10px; flex: 1; }
  .ecard__line { display: flex; align-items: center; font-size: 12.5px; color: #4a5568; padding: 6px 0; border-bottom: 1px dashed #edf0f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ecard__line:last-child { border-bottom: 0; }
  .ecard__line .material-icons { font-size: 16px; color: #3f51b5; margin-right: 10px; }
  .ecard__foot { display: flex; border-top: 1px solid #eef1f6; }
  .ecard__foot > div { flex: 1; text-align: center; padding: 10px 4px; }
  .ecard__foot > div + div { border-left: 1px solid #eef1f6; }
  .ecard__foot b { display: block; font-size: 15px; font-weight: 500; color: var(--ink); }
  .ecard__foot span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  /* profile card (detail) */
  .profile__top { text-align: center; padding: 24px 18px 18px; background: linear-gradient(160deg, #0D47A1, #1d6fd8); color: #fff; }
  .profile__top img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,.7); }
  .profile__name { font-size: 17px; font-weight: 500; margin-top: 10px; }
  .profile__rank { font-size: 12.5px; opacity: .85; }
  .profile__body { padding: 8px 18px 14px; }

  /* call info strip over map */
  .callinfo { display: flex; align-items: center; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid #eef1f6; background: #fafbfd; }
  .callinfo__party { display: flex; align-items: center; min-width: 0; }
  .callinfo__party img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
  .callinfo__arrow { margin: 0 14px; color: var(--muted); }
  .callinfo__meta { margin-left: auto; display: flex; flex-wrap: wrap; }
  .callinfo__meta > div { margin-left: 22px; font-size: 12px; color: var(--muted); }
  .callinfo__meta b { display: block; color: var(--ink); font-size: 13.5px; font-weight: 500; }

  /* remote: rooms + cctv */
  .room { display: flex; align-items: center; padding: 10px 18px; border-bottom: 1px solid #f0f2f7; }
  .room:last-child { border-bottom: 0; }
  .room__name { flex: 1; min-width: 0; }
  .room__name b { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .room__name span { font-size: 12px; color: var(--muted); }
  .room__sw { display: flex; }
  .dev { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 52px; margin-left: 6px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 10.5px; color: var(--muted); user-select: none; outline: none; font-family: inherit; }
  .dev .material-icons { font-size: 19px; margin-bottom: 2px; }
  .dev.on { background: #eaf2ff; border-color: #b9d3fb; color: var(--navy); }
  .cctv { position: relative; background: #000; border-radius: 8px; overflow: hidden; height: 190px; }
  .cctv video, .cctv iframe { width: 100%; height: 100%; object-fit: cover; display: block; border: 0; filter: saturate(.7) contrast(1.05); }
  .cctv__ovl { position: absolute; inset: 0; pointer-events: none; padding: 8px 10px; color: #fff; font: 500 11px 'Roboto Mono', Consolas, monospace;
    background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.45)); display: flex; flex-direction: column; justify-content: space-between; }
  .cctv__row { display: flex; justify-content: space-between; align-items: center; }
  .rec { display: inline-flex; align-items: center; } .rec:before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; margin-right: 6px; animation: blink 1.2s infinite; }
  .cctv.off { display: flex; align-items: center; justify-content: center; color: #8a94a6; font-size: 12px; background: #11151c; }
  @keyframes blink { 50% { opacity: .2; } }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; margin-right: 6px; box-shadow: 0 0 0 3px rgba(46,204,113,.2); }

  /* home */
  .home { display: flex; flex-direction: column; font-family: 'Roboto', sans-serif; }
  .home__bar { display: flex; align-items: center; padding: 18px 40px; }
  .home__bar img.logo-s { height: 40px; }
  .home__user { margin-left: auto; display: flex; align-items: center; color: #fff; }
  .home__user .hdr-clock { color: #fff; }
  .home__logout { margin-left: 18px; color: #fff !important; border: 1px solid rgba(255,255,255,.4); border-radius: 18px; padding: 6px 14px; font-size: 12.5px; display: flex; align-items: center; }
  .home__logout .material-icons { font-size: 16px; margin-right: 6px; }
  .home__logout:hover { background: rgba(255,255,255,.12); }
  .home__hero { text-align: center; padding: 34px 20px 10px; }
  .home__hero p { color: rgba(255,255,255,.8); font-size: 15px; margin-top: 12px; }
  .home__cards { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px 24px; }
  .home__cards > div { width: 100%; max-width: 360px; padding: 14px; }
  .mcard { background: #fff; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 100%; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .mcard__top { text-align: center; padding: 28px 22px 8px; }
  .mcard__top img { width: 76px; height: 76px; }
  .mcard__title { font-size: 18px; color: #1f2a44; margin-top: 12px; }
  .mcard__text { font-size: 13px; color: #5b6678; line-height: 1.6; padding: 6px 24px 0; text-align: center; flex: 1; }
  .mcard__stats { display: flex; margin: 18px 22px 0; border: 1px solid #eef1f6; border-radius: 8px; }
  .mcard__stats > div { flex: 1; text-align: center; padding: 10px 4px; }
  .mcard__stats > div + div { border-left: 1px solid #eef1f6; }
  .mcard__stats b { display: block; font-size: 17px; color: #0D47A1; font-weight: 500; }
  .mcard__stats span { font-size: 10.5px; color: #7a869a; text-transform: uppercase; letter-spacing: .5px; }
  .mcard__foot { text-align: center; padding: 20px 0 24px; }
  .home__status { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding: 18px 24px 26px; color: rgba(255,255,255,.85); font-size: 12px; }
  .home__status > span { margin: 4px 14px; display: flex; align-items: center; }

  /* fleet map */
  .fleet-top { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 5; display: flex; align-items: flex-start; pointer-events: none; }
  .fleet-top > * { pointer-events: auto; }
  .fleet-title { background: rgba(255,255,255,.96); border-radius: 10px; padding: 10px 16px 10px 10px; display: flex; align-items: center; box-shadow: 0 4px 16px rgba(16,24,40,.15); }
  .fleet-title a { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink) !important; margin-right: 10px; }
  .fleet-title a:hover { background: var(--soft); }
  .fleet-stats { margin-left: 12px; display: flex; }
  .fleet-stats > div { background: rgba(255,255,255,.96); border-radius: 10px; padding: 8px 14px; margin-left: 8px; box-shadow: 0 4px 16px rgba(16,24,40,.15); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .fleet-stats b { display: block; font-size: 17px; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .fleet-panel { position: absolute; left: 16px; bottom: 16px; width: 880px; max-width: calc(100% - 90px); z-index: 6; background: rgba(33,33,33,.93); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .fleet-panel__bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; color: rgba(255,255,255,.8); font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .fleet-panel__bar button { background: transparent; border: 0; color: #fff; cursor: pointer; display: flex; outline: none; }
  .fleet-drawer-body { max-height: 250px; overflow-y: auto; }
  .fleet-show { position: absolute; left: 16px; bottom: 16px; z-index: 6; display: flex; align-items: center; background: rgba(33,33,33,.93); color: #fff; border: 0; border-radius: 20px; padding: 8px 16px 8px 12px; cursor: pointer; font-size: 13px; font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.3); outline: none; }
  .fleet-show .material-icons { font-size: 18px; margin-right: 6px; }
  .fleet-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .fleet-table th { text-align: left; color: rgba(255,255,255,.55); font-weight: 500; text-transform: uppercase; font-size: 10.5px; letter-spacing: .6px; padding: 6px 12px; position: sticky; top: 0; background: #2b2b2b; }
  .fleet-table td { padding: 6px 12px; color: #fff; border-top: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
  .fleet-table tr { cursor: pointer; }
  .fleet-table tr:hover td, .fleet-table tr.sel td { background: rgba(29,144,251,.25); }

  /* ==========================================================
     Login page (Bootstrap 4 + MDB 4.4.3 look, lg- prefix)
     ========================================================== */
  .login-page.vertical-center { background: url(assets/img/bg.webp) no-repeat center center fixed; background-size: cover; font-family: 'Roboto', sans-serif; }
  .login-page *, .login-page *:before, .login-page *:after { box-sizing: border-box; }
  .lg-container-fluid { width: 100%; padding-right: 15px; padding-left: 15px; margin-right: auto; margin-left: auto; }
  .lg-row { display: flex; flex-wrap: wrap; margin-right: -15px; margin-left: -15px; justify-content: center; }
  .lg-col { position: relative; width: 100%; padding-right: 15px; padding-left: 15px; }
  @media (min-width: 768px) { .lg-col { flex: 0 0 33.333333%; max-width: 33.333333%; } }
  .lg-card { position: relative; display: flex; flex-direction: column; min-width: 0; word-wrap: break-word; background-clip: border-box;
    border: 0; border-radius: .3rem; font-weight: 400; padding: 3rem !important;
    box-shadow: 0 2px 5px 0 rgba(0,0,0,.16), 0 2px 10px 0 rgba(0,0,0,.12);
    background-color: rgba(0,0,0, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .lg-md-form { position: relative; margin-bottom: 1.5rem; }
  .lg-md-form input.login-form {
    display: block; width: 100%; font-size: 1rem; line-height: 1.5; color: #495057; background-color: transparent; background-image: none;
    border: none; border-bottom: 1px solid #bdbdbd; border-radius: 2px; outline: none; height: 2.1rem; box-shadow: none; box-sizing: content-box;
    transition: all 0.3s; padding: 3px 0px; margin-top: 6px; text-indent: 8px; font-family: inherit;
  }
  .lg-md-form input.login-form:focus { border-bottom: 1px solid #4285F4; box-shadow: 0 1px 0 0 #4285F4; }
  .lg-md-form input.login-form::placeholder { color: #6c757d; }
  .lg-text-center { text-align: center; }
  .lg-btn { display: block; width: 100%; font-weight: 400; text-align: center; white-space: normal; vertical-align: middle; user-select: none;
    font-size: 0.8rem; line-height: 1.5; padding: 0.85rem 2.13rem; margin: inherit; border-radius: 2px; border: 0; transition: .2s ease-out;
    text-transform: uppercase; word-wrap: break-word; cursor: pointer; color: #fff; background-color: #4285F4; font-family: inherit;
    box-shadow: 0 2px 5px 0 rgba(0,0,0,.16), 0 2px 10px 0 rgba(0,0,0,.12); }
  .lg-btn:hover { background-color: #5a95f5; box-shadow: 0 5px 11px 0 rgba(0,0,0,.18), 0 4px 15px 0 rgba(0,0,0,.15); }
  .lg-btn:active, .lg-btn:focus { background-color: #0d5bdd; outline: 0; }
  .lg-alert { position: relative; padding: 0.75rem 1.25rem; padding-right: 4rem; margin-bottom: 1rem; border: 1px solid #f5c6cb; border-radius: 0.25rem;
    color: #721c24; background-color: #f8d7da; font-size: 1rem; }
  .lg-alert .lg-close { position: absolute; top: 0; right: 0; padding: 0.75rem 1.25rem; color: inherit; background: transparent; border: 0;
    font-size: 1.5rem; font-weight: 700; line-height: 1; opacity: .5; cursor: pointer; }
  .lg-hint { color: rgba(255,255,255,.55); font-size: 12px; margin-top: 14px; text-align: center; }

  /* ==========================================================
     Notification modal (Bootstrap modal look inside v-dialog)
     ========================================================== */
  .navy-modal { background: #fff; border-radius: 10px; font-family: 'Roboto', sans-serif; }
  .navy-modal .nm-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #e9ecef; }
  .navy-modal .nm-title { margin: 0; line-height: 1.5; font-size: 18px; font-weight: 500; color: #000; }
  .navy-modal .nm-close { padding: 0 .5rem; margin: -.25rem -.25rem -.25rem auto; background: transparent; border: 0; font-size: 1.5rem; font-weight: 700; line-height: 1; color: #000; opacity: .5; cursor: pointer; }
  .navy-modal .nm-body { padding: 18px 22px; }
  .navy-modal .nm-profile { display: flex; align-items: center; }
  .navy-modal .nm-profile img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.15); margin-right: 16px; }
  .navy-modal .nm-name { margin: 0; font-size: 17px; color: #000; font-weight: 500; }
  .navy-modal .nm-meta { margin: 0; color: #666; font-size: 12.5px; }
  .navy-modal .nm-meta .material-icons { font-size: 14px; vertical-align: middle; margin-right: 3px; color: #555; }
  .navy-modal hr { border: 0; border-top: 1px solid rgba(0,0,0,.08); margin: 14px 0; }
  .navy-modal .nm-dates { display: flex; align-items: center; margin-bottom: .5rem; }
  .navy-modal .nm-date { flex: 1; border: 1px solid #dee2e6; border-radius: 6px; padding: .5rem 1rem; text-align: center; font-size: 13px; }
  .navy-modal .nm-to { width: 50px; text-align: center; font-size: 13px; color: #666; }
  .navy-modal label { display: block; margin-bottom: .5rem; color: #333; }
  .navy-modal textarea { display: block; width: 100%; padding: .5rem .75rem; font-size: 14px; line-height: 1.5; color: #495057; background: #fff;
    border: 1px solid #ced4da; border-radius: 6px; resize: vertical; font-family: inherit; outline: none; }
  .navy-modal textarea:focus { border-color: #80bdff; box-shadow: 0 0 0 .2rem rgba(0,123,255,.2); }
  .navy-modal .nm-footer { display: flex; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid #e9ecef; }
  .navy-modal .nm-btn { font-size: 12.5px; padding: 10px 22px; margin-left: 8px; border-radius: 6px; border: 0; text-transform: uppercase; cursor: pointer; font-family: inherit; font-weight: 500; letter-spacing: .5px; }
  .navy-modal .nm-btn.btn-blank { background: #fff; color: #000; border: 1px solid #E0E0E0; }
  .navy-modal .nm-btn.nm-danger { background: #e53945; color: #fff; }
  .navy-modal .nm-btn.nm-success { background: #00a54a; color: #fff; }
  .nm-action { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #dee2e6; border-radius: 8px; margin-left: 6px; cursor: pointer; background: #fff; }
  .nm-action .material-icons { font-size: 18px; }
  .nm-action.text-danger .material-icons { color: #e53945; }
  .nm-action.text-success .material-icons { color: #00a54a; }
  .nm-action:hover { background: var(--soft); }

  /* ==========================================================
     Map (replaces vue2-google-maps, no API key needed)
     ========================================================== */
  .navy-map { position: relative; z-index: 0; overflow: hidden; background: #b5badb; cursor: grab; user-select: none; touch-action: none; }
  .navy-map.dragging { cursor: grabbing; }
  .navy-map__tiles img { position: absolute; width: 256px; height: 256px; max-width: none;
    filter: grayscale(.45) sepia(.3) hue-rotate(195deg) saturate(1.5) brightness(.93); pointer-events: none; }
  .navy-map svg.navy-map__curve { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .navy-map__pin { position: absolute; cursor: pointer; transform: translate(-50%, -100%); }
  .navy-map__pin svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .navy-map__pin .lbl { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font: 500 11px Roboto, Arial, sans-serif; color: #fff; }
  .navy-map__pin.icon img { width: 25px; height: 25px; display: block; }
  .navy-map__pin.icon .lbl { top: auto; bottom: -14px; font-size: 11px; color: #000; }
  .navy-map__pin .tip { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -4px); background: #1f2a44; color: #fff; font: 500 11px Roboto, sans-serif;
    padding: 3px 8px; border-radius: 4px; white-space: nowrap; display: none; }
  .navy-map__pin:hover .tip, .navy-map__pin.sel .tip { display: block; }
  .navy-map__zoom { position: absolute; right: 10px; bottom: 30px; display: flex; flex-direction: column; background: #fff; border-radius: 4px; box-shadow: rgba(0,0,0,.3) 0 1px 4px -1px; }
  .navy-map__zoom button { width: 36px; height: 36px; border: 0; background: #fff; font-size: 20px; color: #666; cursor: pointer; outline: none; }
  .navy-map__zoom button + button { border-top: 1px solid #e6e6e6; }
  .navy-map__attr { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.7); font: 10px Roboto, Arial, sans-serif; padding: 1px 5px; color: #333; }
  .navy-map__attr a { color: #333 !important; }
  .navy-map__legend { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.95); border-radius: 6px; padding: 6px 10px; font: 11.5px Roboto, sans-serif; color: #4a5568; box-shadow: rgba(0,0,0,.2) 0 1px 4px; }

  .nuxt-progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; transition: width .2s, opacity .4s; opacity: 1; background-color: #744d82; z-index: 999999; }
  .highcharts-tooltip span { font-family: Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- ============================================================
       LAYOUTS
       ============================================================ -->
  <script type="text/x-template" id="tpl-layout-blank">
    <v-app id="appnavy">
      <v-content>
        <page-view/>
      </v-content>
    </v-app>
  </script>

  <script type="text/x-template" id="tpl-layout-default">
    <v-app id="appnavy">
      <v-tabs>
        <v-toolbar class="white--text navy-header" app fixed dense>
          <v-toolbar-title class="montserrat ml-0 navy-ico-title"><small><title-toolbar/></small></v-toolbar-title>
          <v-spacer></v-spacer>
          <v-toolbar-title class="normal"><user-toolbar/></v-toolbar-title>
          <v-menu :nudge-width="100" left bottom>
            <v-toolbar-side-icon slot="activator" class="white--text"></v-toolbar-side-icon>
            <v-list class="grey lighten-3">
              <v-list-tile><router-link to="/">Home</router-link></v-list-tile>
              <v-list-tile><router-link to="/logout">Logout</router-link></v-list-tile>
            </v-list>
          </v-menu>
          <menu-toolbar slot="extension" class="navy-sub-header white--text"/>
          <video autoplay muted loop playsinline id="myVideo"><source src="assets/video/wata3.mp4" type="video/mp4"></video>
          <div class="video-bg"></div>
          <div class="video-bg"></div>
        </v-toolbar>
        <v-tabs-items>
          <v-content class="navy-content-wrap">
            <page-view/>
          </v-content>
        </v-tabs-items>
      </v-tabs>
    </v-app>
  </script>

  <script type="text/x-template" id="tpl-layout-title">
    <v-app id="appnavy">
      <v-toolbar class="white--text navy-header" app fixed dense>
        <v-toolbar-title class="montserrat ml-0 navy-ico-title"><small><title-toolbar/></small></v-toolbar-title>
        <v-spacer></v-spacer>
        <v-toolbar-title class="normal"><user-toolbar/></v-toolbar-title>
        <v-menu :nudge-width="100" left bottom>
          <v-toolbar-side-icon slot="activator" class="white--text"></v-toolbar-side-icon>
          <v-list class="grey lighten-3">
            <v-list-tile><router-link to="/">Home</router-link></v-list-tile>
            <v-list-tile><router-link to="/logout">Logout</router-link></v-list-tile>
          </v-list>
        </v-menu>
        <video autoplay muted loop playsinline id="myVideo"><source src="assets/video/wata3.mp4" type="video/mp4"></video>
        <div class="video-bg"></div>
        <div class="video-bg"></div>
      </v-toolbar>
      <v-content class="navy-content-wrap">
        <page-view/>
      </v-content>
    </v-app>
  </script>

  <!-- ============================================================
       SHARED COMPONENTS
       ============================================================ -->
  <script type="text/x-template" id="tpl-user-toolbar">
    <div class="hdr-user">
      <div class="hdr-clock"><i class="material-icons">schedule</i>{{ now | dateformatter('ddd, DD MMM YYYY · HH:mm') }}</div>
      <img :src="$avatar(id)" alt=".">
      <div class="hdr-user__name"><b>Hi, {{ name }}</b><span>{{ role }}</span></div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-menu-toolbar">
    <v-tabs-bar class="indigo">
      <v-tabs-slider color="yellow"></v-tabs-slider>
      <v-tabs-item v-for="(item, index) in items" :key="index" :to="item.to" :exact="item.exact">{{ item.title }}
        <v-badge class="pl-1" v-if="item.count" color="red">
          <span slot="badge">{{ item.count }}</span>
        </v-badge>
      </v-tabs-item>
    </v-tabs-bar>
  </script>

  <script type="text/x-template" id="tpl-page-header">
    <div class="page-header">
      <div>
        <div class="page-header__crumbs" v-if="crumbs && crumbs.length">
          <template v-for="(c, i) in crumbs">
            <i class="material-icons" v-if="i" :key="'i' + i">chevron_right</i>
            <router-link v-if="c.to" :to="c.to" :key="'c' + i">{{ c.text }}</router-link>
            <span v-else :key="'c' + i">{{ c.text || c }}</span>
          </template>
        </div>
        <h1 class="page-header__title">{{ title }}</h1>
        <div class="page-header__sub" v-if="subtitle">{{ subtitle }}</div>
      </div>
      <div class="page-header__actions"><slot></slot></div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-stat-card">
    <div class="stat">
      <div class="stat__icon" :style="{ background: color + '1a', color: color }"><i class="material-icons">{{ icon }}</i></div>
      <div class="stat__body">
        <div class="stat__label">{{ label }}</div>
        <div class="stat__value">{{ value }}<small v-if="unit">{{ unit }}</small></div>
        <div class="stat__sub" :class="trend" v-if="sub">{{ sub }}</div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-panel">
    <div class="panel">
      <div class="panel__head" v-if="title">
        <i class="material-icons ph-icon" v-if="icon">{{ icon }}</i>
        <div>
          <div class="panel__title">{{ title }}</div>
          <div class="panel__sub" v-if="subtitle">{{ subtitle }}</div>
        </div>
        <div class="panel__actions"><slot name="actions"></slot></div>
      </div>
      <div class="panel__body" :class="{ flush: flush }" :style="bodyStyle"><slot></slot></div>
      <div class="panel__foot" v-if="$slots.foot"><slot name="foot"></slot></div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-pager">
    <div class="pager" v-if="total > perPage">
      <span>Showing {{ from }}–{{ to }} of {{ total }}</span>
      <div class="pager__btns">
        <button type="button" :disabled="value <= 1" @click="$emit('input', value - 1)">‹</button>
        <button type="button" v-for="p in pages" :key="p" :class="{ on: p === value }" @click="$emit('input', p)">{{ p }}</button>
        <button type="button" :disabled="value >= last" @click="$emit('input', value + 1)">›</button>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-menu-card">
    <div class="mcard">
      <div class="mcard__top">
        <img :src="'assets/' + data.icon" alt="">
        <div class="mcard__title montserrat"><b>{{ data.title }}</b></div>
      </div>
      <p class="mcard__text">{{ data.text }}</p>
      <div class="mcard__stats">
        <div v-for="s in data.stats" :key="s.label"><b>{{ s.value }}</b><span>{{ s.label }}</span></div>
      </div>
      <div class="mcard__foot">
        <span @click="set(data)"><router-link :to="'/' + data.id" class="enter montserrat">enter</router-link></span>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-branch-card">
    <router-link :to="to" class="bcard">
      <div class="bcard__img" :style="{ backgroundImage: 'url(assets/img/branches/' + data.id + '.jpg)' }">

  <script type="text/x-template" id="tpl-navy-map">
    <div class="navy-map" :class="{ dragging: !!drag }" @mousedown="down" @touchstart="down" @wheel.prevent="wheel" @dblclick="zoomBy(1)">
      <div class="navy-map__tiles">
        <img v-for="t in tiles" :key="t.key" :src="t.url" :style="{ left: t.left + 'px', top: t.top + 'px' }" alt="" draggable="false" @error="$event.target.style.visibility='hidden'">
      </div>
      <svg class="navy-map__curve" v-if="curvePath" :width="w" :height="h">
        <path :d="curvePath" fill="none" stroke="#0D47A1" stroke-width="2.5" stroke-dasharray="6 5"></path>
      </svg>
      <div v-for="(p, i) in pins" :key="'p' + i" class="navy-map__pin" :class="{ icon: !!p.icon, sel: p.m.selected }"
           :style="{ left: p.left + 'px', top: p.top + 'px', zIndex: p.m.selected ? 50 : 10 + i }" @mousedown.stop @touchstart.stop @click.stop="clickPin(p)">
        <div class="tip" v-if="p.m.title">{{ p.m.title }}</div>
        <template v-if="p.icon">
          <img :src="p.icon" alt="">
          <div class="lbl">{{ p.label }}</div>
        </template>
        <template v-else>
          <svg width="24" height="38" viewBox="0 0 22 40"><path d="M11 0C4.9 0 0 4.9 0 11c0 8.3 11 29 11 29s11-20.7 11-29C22 4.9 17.1 0 11 0z" :fill="p.m.color || '#EA4335'" stroke="rgba(0,0,0,.25)" stroke-width="1"/></svg>
          <div class="lbl">{{ p.label }}</div>
        </template>
      </div>
      <div class="navy-map__legend" v-if="$slots.legend"><slot name="legend"></slot></div>
      <div class="navy-map__zoom" @mousedown.stop @touchstart.stop>
        <button type="button" @click="zoomBy(1)" title="Zoom in">+</button>
        <button type="button" @click="zoomBy(-1)" title="Zoom out">&minus;</button>
      </div>
      <div class="navy-map__attr">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
    </div>
  </script>

  var TILE = 256
  function project (lat, lng, z) {
    var s = TILE * Math.pow(2, z), sin = Math.sin(lat * Math.PI / 180)
    sin = Math.min(Math.max(sin, -0.9999), 0.9999)
    return { x: (lng + 180) / 360 * s, y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s }
  }
  function unproject (x, y, z) {
    var s = TILE * Math.pow(2, z), n = Math.PI - 2 * Math.PI * y / s
    return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), lng: x / s * 360 - 180 }
  }
  var CURVATURE = 0.2 // how curvy to make the arc (same as original)

  Vue.component('navy-map', {
    template: '#tpl-navy-map',
    props: {
      markers: { type: Array, default: function () { return [] } },
      center: Object,
      zoom: { type: Number, default: 7 },
      curve: Boolean,
      autofit: { type: Boolean, default: true }
    },
    data: function () {
      return { w: 600, h: 400, c: this.center ? Object.assign({}, this.center) : { lat: -2.5, lng: 118 }, z: this.zoom, drag: null, fitted: false }
    },
    computed: {
      origin: function () { var p = project(this.c.lat, this.c.lng, this.z); return { x: p.x - this.w / 2, y: p.y - this.h / 2 } },
      tiles: function () {
        var o = this.origin, n = Math.pow(2, this.z), out = []
        var x0 = Math.floor(o.x / TILE), x1 = Math.floor((o.x + this.w) / TILE)
        var y0 = Math.floor(o.y / TILE), y1 = Math.floor((o.y + this.h) / TILE)
        for (var y = y0; y <= y1; y++) {
          if (y < 0 || y >= n) continue
          for (var x = x0; x <= x1; x++) {
            var xw = ((x % n) + n) % n
            out.push({ key: this.z + '/' + x + '/' + y, url: 'https://tile.openstreetmap.org/' + this.z + '/' + xw + '/' + y + '.png',
              left: Math.round(x * TILE - o.x), top: Math.round(y * TILE - o.y) })
          }
        }
        return out
      },
      pins: function () {
        var o = this.origin, z = this.z
        return this.markers.map(function (m, i) {
          var p = project(m.position.lat, m.position.lng, z)
          return { left: p.x - o.x, top: p.y - o.y, label: m.label || String(i + 1), icon: m.icon && m.icon.url, m: m }
        })
      },
      curvePath: function () {
        if (!this.curve || this.pins.length < 2) return null
        var p1 = this.pins[0], p2 = this.pins[1]
        var e = { x: p2.left - p1.left, y: p2.top - p1.top }
        var m = { x: e.x / 2, y: e.y / 2 }
        var o = { x: e.y, y: -e.x }
        var c = { x: m.x + CURVATURE * o.x, y: m.y + CURVATURE * o.y }
        return 'M ' + p1.left + ',' + p1.top + ' q ' + c.x + ',' + c.y + ' ' + e.x + ',' + e.y
      },
      markerKey: function () { return this.markers.map(function (m) { return m.id || (m.position.lat.toFixed(3) + ',' + m.position.lng.toFixed(3)) }).join('|') }
    },
    watch: {
      markerKey: function () { if (this.autofit) this.fitBounds() },
      center: function (v) { if (v) this.c = Object.assign({}, v) }
    },
    mounted: function () {
      this._resize = this.measure.bind(this)
      window.addEventListener('resize', this._resize)
      this.measure()
      this.fitBounds()
    },
    beforeDestroy: function () { window.removeEventListener('resize', this._resize); this.up() },
    methods: {
      measure: function () { if (this.$el.clientWidth) { this.w = this.$el.clientWidth; this.h = this.$el.clientHeight || 400 } },
      fitBounds: function () {
        var ms = this.markers
        if (!ms.length) return
        if (ms.length === 1) { this.c = Object.assign({}, ms[0].position); this.z = 13; return }
        var lats = ms.map(function (m) { return m.position.lat }), lngs = ms.map(function (m) { return m.position.lng })
        var maxLat = Math.max.apply(null, lats), minLat = Math.min.apply(null, lats)
        var maxLng = Math.max.apply(null, lngs), minLng = Math.min.apply(null, lngs)
        var z = 16, p1, p2
        for (; z > 2; z--) {
          p1 = project(maxLat, minLng, z); p2 = project(minLat, maxLng, z)
          if ((p2.x - p1.x) < this.w - 120 && (p2.y - p1.y) < this.h - 120) break
        }
        p1 = project(maxLat, minLng, z); p2 = project(minLat, maxLng, z)
        this.z = z
        this.c = unproject((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, z)
      },
      zoomBy: function (d) { this.z = Math.min(18, Math.max(2, this.z + d)) },
      wheel: function (e) {
        var now = Date.now()
        if (this._lastWheel && now - this._lastWheel < 250) return
        this._lastWheel = now
        this.zoomBy(e.deltaY < 0 ? 1 : -1)
      },
      point: function (e) { var t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY } },
      down: function (e) {
        var pt = this.point(e)
        this.drag = { x: pt.x, y: pt.y, c: project(this.c.lat, this.c.lng, this.z) }
        this._move = this.move.bind(this); this._up = this.up.bind(this)
        document.addEventListener('mousemove', this._move); document.addEventListener('mouseup', this._up)
        document.addEventListener('touchmove', this._move, { passive: false }); document.addEventListener('touchend', this._up)
      },
      move: function (e) {
        if (!this.drag) return
        if (e.cancelable) e.preventDefault()
        var pt = this.point(e)
        this.c = unproject(this.drag.c.x - (pt.x - this.drag.x), this.drag.c.y - (pt.y - this.drag.y), this.z)
      },
      up: function () {
        this.drag = null
        if (this._move) {
          document.removeEventListener('mousemove', this._move); document.removeEventListener('mouseup', this._up)
          document.removeEventListener('touchmove', this._move); document.removeEventListener('touchend', this._up)
        }
      },
      clickPin: function (p) { this.c = Object.assign({}, p.m.position); this.$emit('marker-click', p.m) }
    }
  })

    computed: {
      employee: function () { return this.$store.state.view.employee || {} },
      calls: function () { return this.$store.state.view.calls || [] },
      shown: function () { return this.calls.slice(0, this.limit) },
      crumbs: function () {
        var mod = (this.$route.name || '').split('-')[0]
        var m = MENUS.filter(function (x) { return x.id === mod })[0]
        return [{ text: m.title, to: '/' + mod }, { text: this.branch.name, to: '/' + mod + '/' + this.branch.id + '/employees' }, 'Employee Detail']
      },
      summary: function () {
        var s = [null, 0, 0, 0]
        this.calls.forEach(function (c) { s[c.call_type] += c.call_type === 3 ? 1 : c.seconds })
        return [null, Math.round(s[1] / 60), Math.round(s[2] / 60), s[3]]
      },
      counts: function () { var n = [0, 0, 0, 0]; this.calls.forEach(function (c) { n[c.call_type]++ }); return n },
      missedRate: function () { return Math.round(this.counts[3] / Math.max(1, this.calls.length) * 100) },
      frequents: function () {
        var agg = {}
        this.calls.forEach(function (c) {
          if (!agg[c.party_id]) agg[c.party_id] = { party_id: c.party_id, party_firstname: c.party_firstname, party_lastname: c.party_lastname, party_msisdn: c.party_msisdn, counts: 0, seconds: 0 }
          agg[c.party_id].counts++; agg[c.party_id].seconds += c.seconds
        })
        return Object.keys(agg).map(function (k) { var a = agg[k]; a.minutes = Math.round(a.seconds / 60); return a })
          .sort(function (a, b) { return b.counts - a.counts }).slice(0, 5)
      },
      summaryMonthly: function () {
        var m = this.$store.state.view.monthly || []
        return {
          chart: { type: this.chartMode, height: 470 },
          xAxis: { categories: m.map(function (n) { return moment(n.months).format('MMM YY') }) },
          yAxis: { min: 0 },
          tooltip: { shared: true, valueSuffix: ' min' },
          plotOptions: { area: { stacking: 'normal', fillOpacity: 0.35, marker: { radius: 3 } }, column: { stacking: 'normal', borderWidth: 0 } },
          series: [
            { name: 'Incoming', color: '#1d90fb', data: m.map(function (n) { return n.incoming }) },
            { name: 'Outgoing', color: '#3cb878', data: m.map(function (n) { return n.outgoing }) }
          ]
        }
      },
      markers: function () { return markersForCall(this.current) }
    },
    methods: {
      callType: callTypeName,
      setCall: function (item) { this.current = item },
      onScroll: function (e) {
        var t = e.target
        if (t.scrollTop + t.clientHeight >= t.scrollHeight - 4 && this.limit < this.calls.length) this.limit += 15
      }
    }
  }

  var MonitorDashboardPage = {
    template: '#tpl-page-monitor-dashboard',
    mixins: [branchMixin],
    fetch: function (ctx) { return api.attendance(ctx.params.branch, TODAY).then(function (d) { put('attendance', d) }) },
    data: function () { return { date: TODAY, menu: false } },
    watch: {
      date: function (d) { api.attendance(this.$route.params.branch, d).then(function (a) { put('attendance', a) }) }
    },
    computed: {
      a: function () { return this.$store.state.view.attendance || { rows: [], stats: {}, hourly: [], onsite: [], dist: [], divisions: [], weekly: [] } },
      attendees: function () { return this.a.rows },
      stats: function () { return this.a.stats },
      divisions: function () { return this.a.divisions },
      divisionCount: function () { return this.a.divisions.length },
      trendText: function () { var d = this.stats.delta || 0; return (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d) + ' pts vs previous day' },
      dayName: function () { return moment(this.date).format('dddd') },
      dayDate: function () { return moment(this.date).format('DD MMM YYYY') },
      chartTrend: function () {
        var cats = []; for (var h = 6; h <= 19; h++) cats.push((h < 10 ? '0' : '') + h + ':00')
        return {
          chart: { height: 300 },
          xAxis: { categories: cats },
          yAxis: [{ allowDecimals: false, min: 0 }],
          tooltip: { shared: true },
          plotOptions: { column: { borderWidth: 0, borderRadius: 2 }, areaspline: { fillOpacity: 0.18, marker: { radius: 3 } } },
          series: [
            { type: 'areaspline', name: 'Personnel on site', color: '#1d90fb', data: this.a.onsite },
            { type: 'column', name: 'Check-ins per hour', color: '#3cb878', data: this.a.hourly }
          ]
        }
      },
      chartPie: function () {
        var d = this.a.dist, total = d.reduce(function (s, x) { return s + x }, 0) || 1
        var names = ['Before 07:00', '07:00 – 07:30', '07:30 – 08:00 (late)', 'After 08:00 (late)']
        return {
          chart: { type: 'pie', height: 280 },
          tooltip: { pointFormat: '<b>{point.y}</b> personnel ({point.percentage:.0f}%)' },
          plotOptions: { pie: { innerSize: '62%', borderWidth: 2, borderColor: '#fff', showInLegend: true, dataLabels: { enabled: true, format: '{point.percentage:.0f}%', distance: 10, style: { fontWeight: '500', textOutline: 'none' } } } },
          legend: { layout: 'vertical', align: 'right', verticalAlign: 'middle', itemMarginBottom: 6 },
          series: [{ name: 'Personnel', colorByPoint: true, colors: ['#0c65e8', '#3cb878', '#ffc200', '#F35958'],
            data: names.map(function (n, i) { return { name: n, y: d[i] || 0 } }) }],
          subtitle: { text: '<b style="font-size:20px">' + total + '</b><br><span style="font-size:11px;color:#7a869a">present</span>', floating: true, verticalAlign: 'middle', x: -78, y: 6, useHTML: false }
        }
      },
      chartWeek: function () {
        var w = this.a.weekly
        return {
          chart: { type: 'column', height: 280 },
          xAxis: { categories: w.map(function (x) { return x.day }) },
          yAxis: { min: 0, max: 100, labels: { format: '{value}%' }, plotLines: [{ value: 85, color: '#F35958', dashStyle: 'Dash', width: 1, label: { text: 'Target 85%', style: { color: '#F35958', fontSize: '10px' } } }] },
          legend: { enabled: false },
          tooltip: { valueSuffix: '%' },
          plotOptions: { column: { borderWidth: 0, borderRadius: 3, colorByPoint: false, dataLabels: { enabled: true, format: '{y}%', style: { fontSize: '10px', fontWeight: '500', textOutline: 'none', color: '#4a5568' } } } },
          series: [{ name: 'Attendance', color: '#1d90fb', data: w.map(function (x, i) { return { y: x.pct, color: i === w.length - 1 ? '#0D47A1' : '#90c4fb' } }) }]
        }
      },
      markers: function () {
        return this.attendees.map(function (a) {
          return { id: a.id, position: { lat: a.latitude, lng: a.longitude }, label: ' ', title: a.firstname + ' ' + a.lastname + ' · ' + (a.late ? 'Late' : a.status),
            color: a.status !== 'Check In' ? '#7e57c2' : (a.late ? '#e07b00' : '#2e9e5b') }
        })
      }
    }
  }

  var MonitorEmployeesPage = {
    template: '#tpl-page-monitor-employees',
    mixins: [branchMixin],
    fetch: function (ctx) { return api.employees(ctx.params.branch).then(function (d) { put('employees', d) }) },
    data: function () {
      return { q: '', division: '', status: 'All', page: 1, perPage: 10, today: moment().format('dddd, DD MMM YYYY'),
        statuses: ['All', 'Present', 'Late', 'Sick', 'Leave', 'Absent'] }
    },
    watch: { q: function () { this.page = 1 }, division: function () { this.page = 1 } },
    computed: {
      items: function () { return this.$store.state.view.employees || [] },
      divisionList: function () { return DIVISIONS },
      filtered: function () {
        var f = filterText(this.q), d = this.division, s = this.status
        return this.items.filter(function (e) { return (!d || e.division === d) && (s === 'All' || e.today === s) && f(e.fullname, e.nrp, e.email, e.phone, e.position) })
      },
      paged: function () { return this.filtered.slice((this.page - 1) * this.perPage, this.page * this.perPage) },
      statusStats: function () {
        var c = {}; this.items.forEach(function (e) { c[e.today] = (c[e.today] || 0) + 1 })
        var n = this.items.length || 1
        return [
          { icon: 'verified_user', color: '#2e9e5b', label: 'Present', value: (c.Present || 0) + (c.Late || 0), sub: (c.Late || 0) + ' arrived late' },
          { icon: 'local_hospital', color: '#e07b00', label: 'Sick', value: c.Sick || 0, sub: Math.round((c.Sick || 0) / n * 100) + '% of personnel' },
          { icon: 'beach_access', color: '#7e57c2', label: 'Leave', value: c.Leave || 0, sub: Math.round((c.Leave || 0) / n * 100) + '% of personnel' },
          { icon: 'person_outline', color: '#e04848', label: 'Absent / not yet', value: (c.Absent || 0) + (c['Not yet'] || 0), sub: (c['Not yet'] || 0) + ' not checked in yet' }
        ]
      }
    }
  }

  var MonitorNotificationsPage = {
    template: '#tpl-page-monitor-notifications',
    mixins: [branchMixin],
    fetch: function (ctx) { return store.dispatch('notification/asks', { branch: ctx.params.branch }) },
    data: function () {
      return { cat: 'All', categories: ['All', 'Sick', 'Leave', 'Permit', 'Duty Travel'],
        dialog: false, mode: 'approve', selected: null, message: '', snackbar: false, snackText: '', snackColor: 'success' }
    },
    computed: {
      items: function () { return this.$store.getters['notification/gets'] },
      history: function () { return this.$store.getters['notification/history'] },
      filtered: function () { var c = this.cat; return this.items.filter(function (n) { return c === 'All' || n.category === c }) },
      approvedCount: function () { return this.history.filter(function (h) { return h.decision === 'Approved' }).length }
    },
    methods: {
      countOf: function (c) { return this.items.filter(function (n) { return n.category === c }).length },
      open: function (p) { this.mode = p.mode; this.selected = p.item; this.message = ''; this.dialog = true },
      confirm: function () {
        var s = this.selected, rejected = this.mode === 'reject'
        this.$store.dispatch('notification/resolve', { branch: this.$route.params.branch, item: s, decision: rejected ? 'Rejected' : 'Approved', note: this.message })
        this.dialog = false
        this.snackColor = rejected ? 'error' : 'success'
        this.snackText = s.category + ' request from ' + s.name + (rejected ? ' rejected' : ' approved')
        this.snackbar = true
      }
    }
  }

  var RemoteDashboardPage = {
    template: '#tpl-page-remote-dashboard',
    mixins: [branchMixin],
    fetch: function (ctx) {
      return Promise.all([api.attendance(ctx.params.branch, TODAY), api.rooms(ctx.params.branch)]).then(function (r) {
        put('attendance', r[0]); put('rooms', r[1])
      })
    },
    data: function () {
      var bid = this.$route.params.branch
      var emps = branchEmployees(bid)
      return {
        isFile: location.protocol === 'file:',
        rooms: JSON.parse(JSON.stringify(this.$store.state.view.rooms || [])),
        cameras: cameras(bid),
        attendees: (this.$store.state.view.attendance ? this.$store.state.view.attendance.rows : []).slice(0, 12).map(function (a) {
          var e = EMP_BY_ID[a.id]; return Object.assign({}, a, { position: e.position })
        }),
        sensorsOnline: 40 + emps.length % 9,
        jitter: 1
      }
    },
    created: function () {
      var vm = this
      this._t = setInterval(function () { vm.jitter = 0.97 + Math.random() * 0.06 }, 3000)
    },
    beforeDestroy: function () { clearInterval(this._t) },
    watch: {
      rooms: { deep: true, handler: function (v) { ROOM_CACHE[this.$route.params.branch] = JSON.parse(JSON.stringify(v)) } }
    },
    computed: {
      power: function () { var vm = this; return Math.round(this.rooms.reduce(function (s, r) { return s + vm.roomPower(r) }, 0) * this.jitter) },
      acOn: function () { return this.rooms.filter(function (r) { return r.ac }).length },
      avgTemp: function () { return (this.rooms.reduce(function (s, r) { return s + (r.ac ? r.temp : r.temp + 4) }, 0) / Math.max(1, this.rooms.length)).toFixed(1) },
      avgHum: function () { return Math.round(this.rooms.reduce(function (s, r) { return s + r.hum }, 0) / Math.max(1, this.rooms.length)) },
      devicesOn: function () { return this.rooms.reduce(function (s, r) { return s + (r.light ? 1 : 0) + (r.ac ? 1 : 0) + (r.elec ? 1 : 0) }, 0) },
      devicesTotal: function () { return this.rooms.length * 3 },
      camerasOnline: function () { return this.cameras.filter(function (c) { return c.online }).length },
      accessOn: function () { return this.attendees.filter(function (a) { return a.remote }).length },
      energyChart: function () {
        var r = rng(hash('energy' + this.$route.params.branch)), cur = moment().hours(), today = [], yest = [], cats = []
        var base = this.power / 1000 || 5
        for (var h = 0; h < 24; h++) {
          var f = h < 6 ? 0.35 : (h < 8 ? 0.6 : (h < 17 ? 1 : (h < 21 ? 0.7 : 0.45)))
          cats.push((h < 10 ? '0' : '') + h + ':00')
          yest.push(Math.round(base * f * (0.9 + r() * 0.2) * 10) / 10)
          today.push(h <= cur ? Math.round((h === cur ? base : base * f * (0.9 + r() * 0.2)) * 10) / 10 : null)
        }
        return {
          chart: { type: 'areaspline', height: 380 },
          xAxis: { categories: cats, tickInterval: 2, plotLines: [{ value: cur, color: '#F35958', width: 1, dashStyle: 'Dot', label: { text: 'Now', style: { color: '#F35958', fontSize: '10px' } } }] },
          yAxis: { min: 0, labels: { format: '{value} kW' } },
          tooltip: { shared: true, valueSuffix: ' kW' },
          plotOptions: { areaspline: { fillOpacity: 0.15, marker: { enabled: false } } },
          series: [
            { name: 'Today', color: '#1d90fb', data: today },
            { name: 'Yesterday', color: '#a0aabb', dashStyle: 'Dash', fillOpacity: 0, data: yest }
          ]
        }
      }
    },
    methods: {
      roomPower: function (r) { return (r.light ? r.lightW : 0) + (r.ac ? r.acW : 0) + (r.elec ? r.elecW : 0) },
      allOff: function () { this.rooms.forEach(function (r) { r.light = r.ac = r.elec = false }) },
      allOn: function () { this.rooms.forEach(function (r) { r.light = r.ac = r.elec = true }) }
    }
  }

  var RemoteMapPage = {
    layout: 'blank',
    template: '#tpl-page-remote-map',
    data: function () {
      return { vessels: JSON.parse(JSON.stringify(FLEET)), selected: null, center: null, drawer: true, mini: false }
    },
    created: function () {
      var vm = this
      this._t = setInterval(function () {
        vm.vessels.forEach(function (v) {
          if (v.speed < 1) return
          var d = v.speed * 0.0006, rad = v.heading * Math.PI / 180
          v.lat += Math.cos(rad) * d; v.lng += Math.sin(rad) * d
          v.heading = (v.heading + (Math.random() - 0.5) * 4 + 360) % 360
          v.speed = Math.max(6, Math.min(22, v.speed + (Math.random() - 0.5) * 0.6))
        })
      }, 2000)
    },
    beforeDestroy: function () { clearInterval(this._t) },
    computed: {
      markers: function () {
        var sel = this.selected, vm = this
        return this.vessels.map(function (v, i) {
          return { id: v.id, position: { lat: v.lat, lng: v.lng }, label: String(i + 1), title: v.name + ' · ' + v.status, color: vm.statusColor(v.status), selected: sel === v.id, v: v }
        })
      }
    },
    methods: {
      countStatus: function (s) { return this.vessels.filter(function (v) { return v.status === s }).length },
      statusColor: function (s) { return { Patrol: '#2e9e5b', Transit: '#1d90fb', Anchored: '#e07b00', Docked: '#7a869a' }[s] || '#EA4335' },
      select: function (v) { var x = v.v || v; this.selected = x.id; this.center = { lat: x.lat, lng: x.lng } }
    }
  }

  /* ---------------- Layouts ---------------- */
  var layouts = {
    blank: { template: '#tpl-layout-blank' },
    'default': { template: '#tpl-layout-default' },
    titleToolbar: { template: '#tpl-layout-title' }
  }

  /* ==================================================================
     ROUTER (hash mode so it works when opened directly from disk)
     ================================================================== */
  var router = new VueRouter({
    mode: 'hash',
    scrollBehavior: function () { return { x: 0, y: 0 } },
    routes: [
      { path: '/login', name: 'login', component: LoginPage },
      { path: '/logout', name: 'logout', beforeEnter: function (to, from, next) { store.dispatch('authuser/logout'); next('/login') } },
      { path: '/', name: 'index', component: IndexPage },
      { path: '/identifier', name: 'identifier', component: BranchesPage },
      { path: '/identifier/:branch/employees', name: 'identifier-branch-employees', component: IdentifierEmployeesPage },
      { path: '/identifier/:branch/employees/:employee', name: 'identifier-branch-employees-employee', component: EmployeeDetailPage },
      { path: '/identifier/:branch/calls', name: 'identifier-branch-calls', component: IdentifierCallsPage },
      { path: '/monitor', name: 'monitor', component: BranchesPage },
      { path: '/monitor/:branch/dashboard', name: 'monitor-branch-dashboard', component: MonitorDashboardPage },
      { path: '/monitor/:branch/employees', name: 'monitor-branch-employees', component: MonitorEmployeesPage },
      { path: '/monitor/:branch/employees/:employee', name: 'monitor-branch-employees-employee', component: EmployeeDetailPage },
      { path: '/monitor/:branch/notifications', name: 'monitor-branch-notifications', component: MonitorNotificationsPage },
      { path: '/remote', name: 'remote', component: BranchesPage },
      { path: '/remote/map', name: 'remote-map', component: RemoteMapPage },
      { path: '/remote/:branch/dashboard', name: 'remote-branch-dashboard', component: RemoteDashboardPage },
      { path: '*', redirect: '/' }
    ]
  })

  router.beforeEach(function (to, from, next) {
    var logged = store.getters['authuser/logged']
    if (to.name === 'logout') return next()
    if (!logged && to.name !== 'login') return next('/login')
    if (logged && to.name === 'login') return next('/')
    next()
  })

  var loading = new Vue({
    data: { percent: 0, show: false },
    methods: {
      start: function () {
        var vm = this
        this.show = true; this.percent = 10
        clearInterval(this._t)
        this._t = setInterval(function () { vm.percent = Math.min(90, vm.percent + 15) }, 80)
      },
      finish: function () {
        var vm = this
        clearInterval(this._t); this.percent = 100
        setTimeout(function () { vm.show = false; vm.percent = 0 }, 400)
      }
    }
  })

  router.beforeResolve(function (to, from, next) {
    var comps = router.getMatchedComponents(to)
    var fetches = comps.filter(function (c) { return typeof c.fetch === 'function' })
    if (!fetches.length) return next()
    loading.start()
    Promise.all(fetches.map(function (c) { return c.fetch({ store: store, params: to.params, route: to }) }))
      .then(function () { loading.finish(); next() })
      .catch(function (e) { console.error(e); loading.finish(); next() })
  })

  new Vue({
    el: '#app',
    store: store,
    router: router,
    components: layouts,
    template:
      '<div id="__nuxt">' +
        '<div class="nuxt-progress" :style="{ width: loading.percent + \'%\', opacity: loading.show ? 1 : 0 }"></div>' +
        '<component v-if="layout" :is="layout"></component>' +
      '</div>',
    data: { loading: loading },
    computed: {
      layout: function () {
        var m = this.$route.matched[0]
        if (!m) return null
        var c = m.components && m.components['default']
        return (c && c.layout) || 'default'
      }
    }
  })
  })()
  </script>
</body>
</html>
