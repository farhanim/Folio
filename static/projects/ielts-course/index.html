<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devfartha IELTS</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">

    <!-- Devfartha theme (Bootstrap 4 + Font Awesome 4.7 + course/courses styles) -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/devfartha.css">
    <!-- Theme fonts, loaded without blocking so the page also works offline -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:500,600,700,800|Poppins:400,500,600&display=swap" media="print" onload="this.media='all'">

    <style>
        /* Local fallback for Poppins when Google Fonts is unreachable */
        @font-face { font-family: 'Poppins'; font-weight: 400; src: local('Poppins Regular'), url('assets/fonts/poppins-v8-latin-regular.woff2') format('woff2'); }
        @font-face { font-family: 'Poppins'; font-weight: 600; src: local('Poppins SemiBold'), url('assets/fonts/poppins-v8-latin-600.woff2') format('woff2'); }

        /* =========================================================
           Devfartha companion styles: components for the pages the
           original theme did not have (dashboard, exams, results, admin)
        ========================================================= */
        :root { --blue: #2e21df; --blue-dark: #2318b8; --yellow: #f9cf0e; --ink: #384158; --muted: #76777a; --line: #ebebeb; --soft: #f8f8f8; --navy: #0b2239; --green: #1fb36b; --red: #e5484d; }
        body { color: var(--muted); }
        a:hover { text-decoration: none; }
        .footer { background: var(--navy); }
        .copyright { background: #071827; }
        .copyright_content { height: 60px; }

        /* Layout */
        .dv-section { padding: 70px 0; }
        .dv-section.gray { background: var(--soft); }
        .dv-head { margin-bottom: 36px; }
        .dv-head-row { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
        .dv-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--blue); }
        .dv-title { font-family: 'Montserrat', sans-serif; font-size: 30px; font-weight: 700; color: #000; margin: 6px 0 0; line-height: 1.25; }
        .dv-sub { font-size: 15px; line-height: 1.9; color: var(--muted); margin: 12px 0 0; max-width: 720px; }
        .dv-box { background: #fff; border: 1px solid var(--line); padding: 30px; height: 100%; }
        .dv-box.flat { height: auto; }
        .dv-box-title { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; color: rgba(0,0,0,.85); }
        .dv-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; }
        .mb-30 { margin-bottom: 30px; }
        .text-ink { color: var(--ink) !important; }
        .text-blue { color: var(--blue) !important; }
        .text-green { color: var(--green) !important; }
        .text-red { color: var(--red) !important; }
        .fw-600 { font-weight: 600; }
        .small-caps { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #a5a5a5; }

        /* Buttons & tags (same language as .sidebar_top / .course_mark) */
        .dv-btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 28px; background: var(--blue); color: #fff; border: 2px solid var(--blue); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; cursor: pointer; transition: all 200ms ease; white-space: nowrap; }
        .dv-btn:hover { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
        .dv-btn i { font-size: 14px; margin: 0 10px 0 0; }
        .dv-btn i.fa-arrow-right, .dv-btn i.fa-chevron-right { margin: 0 0 0 10px; }
        .dv-btn.icon { padding: 0 14px; }
        .dv-btn.icon i { margin: 0; }
        .dv-btn.outline { background: transparent; color: var(--blue); }
        .dv-btn.outline:hover { background: var(--blue); color: #fff; }
        .dv-btn.yellow { background: var(--yellow); border-color: var(--yellow); color: #000; }
        .dv-btn.light { background: #f1f1f1; border-color: #f1f1f1; color: #000; }
        .dv-btn.light:hover { background: #e5e5e5; border-color: #e5e5e5; }
        .dv-btn.sm { height: 36px; padding: 0 16px; font-size: 11px; }
        .dv-btn.block { width: 100%; }
        .dv-btn[disabled] { opacity: .45; cursor: not-allowed; }
        .dv-btn + .dv-btn { margin-left: 10px; }
        .dv-tag { display: inline-block; height: 24px; line-height: 24px; padding: 0 10px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; background: var(--blue); white-space: nowrap; }
        .dv-tag.yellow { background: var(--yellow); color: #000; }
        .dv-tag.soft { background: #f1f1f1; color: var(--ink); }
        .dv-tag.green { background: var(--green); }
        .dv-tag.red { background: var(--red); }
        .dv-tag.navy { background: var(--navy); }
        .dv-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

        /* Tabs (same underline as the course tabs) */
        .dv-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
        .dv-tab { padding: 0 0 14px; margin-right: 34px; margin-bottom: -1px; font-size: 13px; font-weight: 500; text-transform: uppercase; color: #000; cursor: pointer; border-bottom: 3px solid transparent; transition: all 200ms ease; }
        .dv-tab:hover, .dv-tab.active { border-color: var(--blue); color: #000; }
        .dv-tab .count { color: #a5a5a5; margin-left: 6px; }

        /* Stats */
        .dv-stat { background: #fff; border: 1px solid var(--line); padding: 26px 26px 22px; height: 100%; display: flex; flex-direction: column; }
        .dv-stat-top { display: flex; align-items: flex-start; justify-content: space-between; }
        .dv-stat-value { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; color: #000; line-height: 1.1; margin-top: 8px; }
        .dv-stat-icon { width: 46px; height: 46px; border-radius: 3px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .dv-stat-icon.yellow { background: var(--yellow); color: #000; }
        .dv-stat-icon.navy { background: var(--navy); }
        .dv-stat-icon.soft { background: #f1f1f1; color: var(--blue); }
        .dv-stat-foot { margin-top: auto; padding-top: 16px; font-size: 13px; }

        /* Progress */
        .dv-bar { height: 6px; background: #f1f1f1; position: relative; overflow: hidden; }
        .dv-bar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); }
        .dv-meter { display: flex; align-items: center; margin-bottom: 18px; font-size: 14px; }
        .dv-meter .label { width: 46%; color: var(--ink); }
        .dv-meter .dv-bar { flex: 1; margin: 0 14px; }
        .dv-meter .val { width: 70px; text-align: right; color: #000; font-weight: 600; }

        /* Tables */
        .dv-table { width: 100%; }
        .dv-table th { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #a5a5a5; padding: 0 16px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .dv-table td { padding: 16px; border-bottom: 1px solid #f1f1f1; font-size: 14px; color: var(--ink); vertical-align: middle; }
        .dv-table tr:last-child td { border-bottom: 0; }
        .dv-table th:first-child, .dv-table td:first-child { padding-left: 0; }
        .dv-table th:last-child, .dv-table td:last-child { padding-right: 0; }
        .dv-person { display: flex; align-items: center; }
        .dv-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 14px; background: #f1f1f1; }
        .dv-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .dv-person .name { color: #000; font-weight: 500; }
        .dv-person .sub { font-size: 12px; color: #a5a5a5; }
        .dv-empty { text-align: center; padding: 50px 0; color: #a5a5a5; }

        /* Forms */
        .dv-label { display: block; font-size: 13px; font-weight: 600; color: #000; margin-bottom: 8px; }
        .dv-input { width: 100%; height: 50px; border: 1px solid #e5e5e5; padding: 0 18px; font-size: 14px; color: var(--ink); outline: none; background: #fff; transition: border-color 200ms ease; border-radius: 0; }
        textarea.dv-input { height: auto; padding: 14px 18px; line-height: 1.8; }
        .dv-input:focus { border-color: var(--blue); }
        .dv-input[readonly] { background: #f8f8f8; }
        .dv-field { margin-bottom: 22px; }
        .dv-alert { padding: 12px 16px; font-size: 13px; margin-bottom: 20px; border-left: 3px solid; line-height: 1.7; }
        .dv-alert.error { background: #fdeeee; border-color: var(--red); color: #a12a2e; }
        .dv-alert.ok { background: #e9f8f0; border-color: var(--green); color: #157a49; }
        .dv-alert.info { background: #f1f0fd; border-color: var(--blue); color: var(--ink); }
        .dv-check { display: flex; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
        .dv-check input { margin-right: 8px; }

        /* Header additions */
        .main_nav li a.active { color: var(--blue); }
        .user { position: relative; overflow: visible !important; }
        .user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .dv-user-menu { position: absolute; right: 0; top: 54px; width: 250px; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.08); text-align: left; display: none; z-index: 200; cursor: default; }
        .dv-user-menu.open { display: block; }
        .dv-user-menu .head { padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .dv-user-menu .head .name { color: #000; font-weight: 600; font-size: 14px; line-height: 1.4; }
        .dv-user-menu .head .sub { font-size: 12px; color: #a5a5a5; line-height: 1.5; }
        .dv-user-menu a { display: block; padding: 10px 20px; font-size: 13px; color: var(--ink); line-height: 1.6; }
        .dv-user-menu a i { width: 22px; color: #a5a5a5; }
        .dv-user-menu a:hover { background: var(--soft); color: var(--blue); }
        .toast-stack { position: fixed; top: 150px; right: 20px; z-index: 3000; width: 340px; max-width: calc(100% - 40px); }
        .toast-item { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--green); box-shadow: 0 10px 30px rgba(0,0,0,.1); padding: 14px 18px; margin-bottom: 10px; font-size: 14px; color: var(--ink); }
        .toast-item.warn { border-left-color: var(--yellow); }
        .toast-item.error { border-left-color: var(--red); }

        /* Hero card (intro) */
        .intro_background { background-size: cover; background-position: center; }
        .intro.short, .intro.short .intro_container { height: 460px; }
        .intro_meta .intro_text { font-size: 14px; color: var(--muted); margin-left: 15px; line-height: 1.6; }
        .intro_actions { margin-top: 24px; }

        /* Catalog & cards */
        .courses { padding-top: 70px; padding-bottom: 70px; }
        .courses .course { padding-bottom: 0; background: #fff; height: 100%; display: flex; flex-direction: column; }
        .courses .course_image img { height: 200px; object-fit: cover; width: 100%; }
        .courses .course_body { flex: 1; }
        .course_text p { font-size: 13px; line-height: 1.9; margin-bottom: 0; }
        .course_col { margin-bottom: 30px; }
        .course_mark.premium { background: var(--yellow); }
        .course_mark.premium a { color: #000; }
        .course_meta_tags { margin-top: 14px; }
        .course_meta_tags span { display: inline-block; font-size: 11px; color: var(--ink); background: #f1f1f1; padding: 3px 8px; border-radius: 3px; margin: 0 4px 4px 0; }
        .module-card { border: 1px solid var(--line); background: #fff; padding: 26px; height: 100%; display: flex; flex-direction: column; transition: border-color 200ms ease; }
        .module-card:hover { border-color: var(--blue); }
        .module-card .dv-stat-icon { margin-bottom: 18px; }
        .module-card .title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 18px; color: #000; }
        .module-card .meta { font-size: 12px; color: #a5a5a5; margin-top: 2px; }
        .module-card p { font-size: 13px; line-height: 1.9; margin: 14px 0 18px; }
        .module-card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
        .module-card.locked { opacity: .65; }
        .feature_text { color: var(--ink); }
        .like_item { cursor: pointer; }

        /* Material article */
        .article h3 { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: rgba(0,0,0,.85); margin: 34px 0 14px; }
        .article p, .article li { font-size: 16px; line-height: 2; color: var(--muted); }
        .article ul { padding-left: 20px; }
        .article li { list-style: disc; }
        .article .tip { background: var(--soft); border-left: 3px solid var(--blue); padding: 18px 22px; color: var(--ink); margin: 24px 0; line-height: 1.9; }

        /* Exam layout */
        body.exam-mode .super_container { padding-top: 70px; overflow: visible; }
        @media (min-width: 992px) { body.exam-split { overflow: hidden; } }
        .exam-bar { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0px 5px 20px rgba(0,0,0,.025); z-index: 1030; display: flex; align-items: center; padding: 0 30px; }
        .exam-bar .logo img { height: 34px; }
        .exam-bar .titles { margin-left: 20px; min-width: 0; }
        .exam-bar .titles .name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; color: #000; line-height: 1.2; }
        .exam-bar .titles .small-caps { line-height: 1.4; }
        .exam-bar .actions { display: flex; align-items: center; }
        .exam-bar .actions .dv-btn { margin-left: 10px; }
        .dv-timer { background: var(--navy); color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: .08em; padding: 0 22px; height: 40px; line-height: 40px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .dv-timer.warn { background: var(--red); }
        .exam-tabs { position: sticky; top: 70px; z-index: 1020; background: #fff; border-bottom: 1px solid var(--line); padding: 16px 30px 0; display: flex; align-items: flex-end; }
        .exam-tabs .dv-tabs { border-bottom: 0; flex-wrap: nowrap; }
        .exam-tabs .dv-tab { white-space: nowrap; }
        .exam-tabs .nav-buttons { display: flex; flex-shrink: 0; padding-left: 12px; }
        .exam-tabs .nav-buttons { margin-left: auto; padding-bottom: 12px; }
        .exam-wrap { max-width: 1320px; margin: 0 auto; padding: 40px 30px 80px; }
        .exam-panel { background: var(--soft); padding: 30px; position: sticky; top: 100px; }
        .q-group { margin-bottom: 40px; }
        .instruction-box { background: var(--soft); border-left: 3px solid var(--blue); padding: 18px 22px; margin-bottom: 24px; }
        .instruction-box .range { font-size: 11px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--blue); }
        .instruction-box .what { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px; color: #000; margin-top: 4px; }
        .instruction-box .note { color: var(--red); font-size: 13px; font-weight: 500; margin: 6px 0 0; line-height: 1.7; }
        .q-num { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 3px; background: #f1f0fd; color: var(--blue); font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 12px; margin-right: 10px; vertical-align: middle; flex-shrink: 0; }
        .q-line { margin-bottom: 14px; line-height: 2.3; color: var(--ink); font-size: 15px; }
        .q-block { margin-bottom: 28px; scroll-margin-top: 120px; }
        .q-block .q-text { font-weight: 500; color: #000; font-size: 15px; padding-top: 3px; }
        .gap-input { border: 0; border-bottom: 2px solid #d9d9d9; outline: 0; width: 160px; padding: 2px 8px; background: var(--soft); color: var(--ink); font-size: 14px; transition: border-color 200ms; }
        .gap-input:focus { border-color: var(--blue); background: #fff; }
        .option { display: flex; align-items: center; padding: 12px 16px; border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; transition: all 200ms ease; font-size: 14px; color: var(--ink); background: #fff; }
        .option:hover { border-color: var(--blue); }
        .option input { position: absolute; opacity: 0; pointer-events: none; }
        .option .letter { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 3px; background: #f1f1f1; color: #000; font-weight: 600; font-size: 12px; margin-right: 14px; flex-shrink: 0; }
        .option.selected { border-color: var(--blue); background: #f5f4fe; color: #000; }
        .option.selected .letter { background: var(--blue); color: #fff; }
        .tf-select { width: auto; min-width: 150px; height: 40px; }
        .words-box { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; background: var(--soft); padding: 18px; margin-bottom: 24px; font-size: 14px; color: var(--ink); }
        .solution-key { display: none; margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--green); background: #e9f8f0; padding: 2px 8px; border-radius: 3px; line-height: 1.6; }
        .show-solution .solution-key { display: inline-block; }
        .nav-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
        .nav-num { height: 34px; border: 1px solid #e5e5e5; background: #fff; font-size: 12px; font-weight: 600; color: var(--ink); padding: 0; cursor: pointer; }
        .nav-num:hover { border-color: var(--blue); color: var(--blue); }
        .nav-num.answered { background: var(--blue); border-color: var(--blue); color: #fff; }
        .exam-drawer { position: fixed; top: 80px; right: 20px; width: 360px; max-width: calc(100% - 40px); z-index: 1040; display: none; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.1); padding: 24px; }
        .exam-drawer.open { display: block; }
        .pane { height: calc(100vh - 70px - 57px); overflow-y: auto; padding: 36px 40px 80px; }
        .pane.passage { background: var(--soft); }
        .pane.passage p { font-size: 15px; line-height: 2; color: var(--ink); text-align: justify; }
        .essay-area { min-height: 420px; resize: vertical; }
        .cue-card { border: 2px dashed var(--blue); padding: 26px; background: #f5f4fe; }
        .cue-card h4 { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: #000; }
        .speak-clock { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 54px; color: #000; line-height: 1; margin: 14px 0 6px; font-variant-numeric: tabular-nums; }
        .speak-q li { font-size: 15px; color: var(--ink); line-height: 1.8; margin-bottom: 8px; list-style: decimal; }

        /* Result */
        .band-box { background: var(--blue); color: #fff; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
        .band-box .val { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; }
        .band-box .lbl { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin-top: 12px; opacity: .85; }
        .band-box.pending { background: var(--navy); }
        .mini-stats { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 24px; }
        .mini-stats > div { flex: 1 1 120px; padding: 20px 20px 0 0; }
        .mini-stats .v { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 24px; color: #000; }
        .dv-chart { position: relative; height: 300px; }
        .dv-chart.sm { height: 220px; }

        /* Auth */
        .auth-visual { position: relative; height: 100%; min-height: 560px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 40px; }
        .auth-visual .card-in { position: relative; background: #fff; border: 1px solid var(--line); padding: 28px 30px; width: 100%; max-width: 430px; }
        .auth-visual .card-in li { font-size: 14px; color: var(--ink); line-height: 2.1; }
        .auth-visual .card-in li i { color: var(--blue); width: 22px; }
        .demo-pick { border: 1px dashed #d9d9d9; padding: 14px 18px; margin-bottom: 26px; display: flex; align-items: center; flex-wrap: wrap; }

        /* Modal theme */
        .modal-content { border-radius: 0; border: 0; }
        .modal-header { border-bottom: 1px solid var(--line); padding: 22px 30px; }
        .modal-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: #000; font-size: 18px; }
        .modal-body { padding: 26px 30px; }
        .modal-footer { border-top: 1px solid var(--line); padding: 18px 30px; }

        @media (max-width: 991px) {
            .pane { height: auto; padding: 26px 20px; }
            .pane.passage { max-height: 60vh; }
            .exam-bar { padding: 0 15px; }
            .exam-bar .titles { display: none; }
            .exam-tabs { padding: 12px 15px 0; overflow-x: auto; }
            .exam-wrap { padding: 26px 15px 60px; }
            .dv-title { font-size: 24px; }
            .intro.short, .intro.short .intro_container { height: auto; min-height: 420px; }
            .dv-tab { margin-right: 22px; }
        }
        @media (max-width: 575px) {
            .exam-bar .actions .hide-xs, .exam-tabs .nav-buttons { display: none; }
            .dv-timer { padding: 0 12px; }
            .intro_content { width: 100%; padding: 24px; }
            .intro_instructors { margin-left: 12px; }
            .dv-section, .courses { padding-top: 46px; padding-bottom: 46px; }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div class="toast-stack" id="toasts"></div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <script>

    const QUIZ = {"test":{"name":"Test 1","duration":"02:00:00","type":"Simulation","source":"ielts_5","publisher":"cambridge_english"},"listening":[{"name":"SECTION 1","recording":"01/Artist - Track 1.mp3","title":null,"instruction":null,"text":null,"begin":1,"end":10,"groups":[{"begin":1,"end":4,"name":"","instruction":"Complete the notes below","question":"Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer","story":false,"items":[{"type":"text","id":1,"number":1,"question":"__________","answer":"by minibus"},{"type":"text","id":2,"number":2,"question":"__________","answer":"15"},{"type":"text","id":3,"number":3,"question":"__________","answer":"April 18th"},{"type":"text","id":4,"number":4,"question":"The __________","answer":"Pallisades"}],"image":"image_tour_information_1.png"},{"begin":5,"end":6,"name":"","instruction":"Choose TWO letters A-E","question":"Which TWO things are included in the price of the hour?","story":false,"items":[{"type":"multi","numbers":[5,6],"question":null,"options":[{"letter":"A","text":"fishing trip","correct":false},{"letter":"B","text":"guided bushwalk","correct":true},{"letter":"C","text":"reptile park entry","correct":false},{"letter":"D","text":"table tennis","correct":true},{"letter":"E","text":"tennis","correct":false}]}]},{"begin":7,"end":10,"name":"","instruction":"Complete the sentences below.","question":"Write NO MORE THAN THREE WORDS AND/OR A NUMBER","story":false,"items":[{"type":"text","id":7,"number":7,"question":"The tour costs $__________","answer":"280"},{"type":"text","id":8,"number":8,"question":"Bookings must be made no later than __________ days in advance.","answer":"14"},{"type":"text","id":9,"number":9,"question":"A __________ deposit is required.","answer":"20%"},{"type":"text","id":10,"number":10,"question":"The customer's reference number is __________","answer":"39745T"}]}]},{"name":"SECTION 2","recording":"01/Artist - Track 2.mp3","title":null,"instruction":null,"text":null,"begin":11,"end":20,"groups":[{"begin":11,"end":19,"name":"","instruction":"Complete the table below.","question":"Write NO MORE THAN THREE WORDS for each answer.","story":false,"items":[{"type":"text","id":11,"number":11,"question":"Easy to __________","answer":"move around"},{"type":"text","id":12,"number":12,"question":"Did not have any __________","answer":"brakes"},{"type":"text","id":13,"number":13,"question":"Babies could trap their __________ in the side bar","answer":"fingers"},{"type":"text","id":14,"number":14,"question":"__________","answer":"satisfactory"},{"type":"text","id":15,"number":15,"question":"Easy to __________","answer":"put it together"},{"type":"text","id":16,"number":16,"question":"Spaces between the bars were __________","answer":"too wide"},{"type":"text","id":17,"number":17,"question":"__________","answer":"dangerous"},{"type":"text","id":18,"number":18,"question":"Did not have any __________","answer":"wheels"},{"type":"text","id":19,"number":19,"question":"__________","answer":"the best"}],"table":{"head":["Brand of Cot","Good Points","Problems","Verdict"],"body":[[[{"t":"Baby Safe"}],[{"q":11}],[{"q":12},{"q":13}],[{"q":14}]],[[{"t":"Choice Cots"}],[{"q":15}],[{"t":"Side did not drop down"},{"q":16}],[{"q":17}]],[[{"t":"Mother's Choice"}],[{"t":"Base of cot could be moved"}],[{"q":18},{"t":"Pictures could be removed easily"}],[{"q":19}]]]}},{"begin":20,"end":20,"name":"","instruction":"Complete the table below.","question":"Write ONE WORD ONLY for the answer.","story":false,"items":[{"type":"text","id":20,"number":20,"question":"Metal should not be rusted or bent <br> Edges of cot should not be __________","answer":"sharp"}]}]},{"name":"SECTION 3","recording":"01/Artist - Track 3.mp3","title":null,"instruction":null,"text":null,"begin":21,"end":30,"groups":[{"begin":21,"end":23,"name":"","instruction":"Choose the correct letter, A, B or C.","question":"","story":false,"items":[{"type":"radio","number":21,"question":"Andrew has worked at the hospital for","options":[{"letter":"A","text":"two years","correct":false},{"letter":"B","text":"three years","correct":true},{"letter":"C","text":"five years","correct":false}]},{"type":"radio","number":22,"question":"During the course Andrew’s employers will pay","options":[{"letter":"A","text":"his fees.","correct":true},{"letter":"B","text":"his living costs.","correct":false},{"letter":"C","text":"his salary.","correct":false}]},{"type":"radio","number":23,"question":"The part-time course lasts for","options":[{"letter":"A","text":"one whole year.","correct":false},{"letter":"B","text":"18 months.","correct":false},{"letter":"C","text":"two years.","correct":true}]}]},{"begin":24,"end":25,"name":"","instruction":"Choose TWO letters A-E.","question":"What TWO types of coursework are required each month on the part-time course?","story":false,"items":[{"type":"multi","numbers":[24,25],"question":null,"options":[{"letter":"A","text":"a case study","correct":false},{"letter":"B","text":"an essay","correct":true},{"letter":"C","text":"a survey","correct":false},{"letter":"D","text":"a short report","correct":true},{"letter":"E","text":"a study diary","correct":false}]}]},{"begin":26,"end":30,"name":"Module Courses","instruction":"Complete the summary below.","question":"Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","story":true,"items":[{"type":"text","id":25,"number":26,"question":"Students study __________ during each module. ","answer":"full-time"},{"type":"text","id":26,"number":27,"question":"A module takes __________ ","answer":"one term"},{"type":"text","id":27,"number":28,"question":"and the work is very __________ ","answer":"intensive"},{"type":"text","id":28,"number":29,"question":"To get a Diploma each students has to study __________ ","answer":"two modules"},{"type":"text","id":29,"number":30,"question":"and the work on __________ in depth.","answer":"a topic"}]}]},{"name":"SECTION 4","recording":"01/Artist - Track 4.mp3","title":null,"instruction":null,"text":null,"begin":31,"end":40,"groups":[{"begin":31,"end":35,"name":"","instruction":"Complete the sentences below.","question":"Write NO MORE THAN THREE WORDS for each answer.","story":false,"items":[{"type":"text","id":30,"number":31,"question":"According to George Bernard Shaw, men are supposed to understand __________ economics and finance.","answer":"politics"},{"type":"text","id":31,"number":32,"question":"However, women are more prepared to __________ and a house.","answer":"learn"},{"type":"text","id":32,"number":33,"question":"Women tend to save for __________ and a house.","answer":"children's education"},{"type":"text","id":33,"number":34,"question":"Men tend to save for __________ and for retirement.","answer":"a car"},{"type":"text","id":34,"number":35,"question":"Women who are left alone any have to pay for __________ when they are old.","answer":"nursing care"}]},{"begin":36,"end":40,"name":"Saving for the future","instruction":"Complete the summary below.","question":"Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.","story":true,"items":[{"type":"text","id":35,"number":36,"question":"Research indicates that many women only think about their financial future when a __________ occurs.","answer":"crisis"},{"type":"text","id":36,"number":37,"question":"This is the worst time to make decisions. It is best for women to start thinking about pensions when they are in their __________ ","answer":"early twenties"},{"type":"text","id":37,"number":38,"question":"A good way for women to develop their __________ ","answer":"confidence"},{"type":"text","id":38,"number":39,"question":"in dealing with financial affairs would be to attend classes in __________ When investing in stocks and shares.","answer":"money management"},{"type":"text","id":39,"number":40,"question":"It is suggested that women should put a high proportion of their savings in __________ In such ways, women can have a comfortable, independent retirement.","answer":"low-risk investments "}]}]}],"reading":[{"name":"READING PASSAGE 1","recording":null,"title":"Johnson's Dictionary","instruction":"You should spend about 20 minutes on Questions 1–13 which are based on Reading Passage 1\r\nbelow.\r\n","text":"For the century before Johnson's Dictionary was published in 1775. there had been concern about the state of the English language. There was no standard way of speaking or writing and no agreement as to the best way of bringing some order to the chaos' of English spelling. Dr Johnson provided the solution.<br><br>\r\nThere had, of course, been dictionaries in the past, the first of these being a little book of some 120 pages, compiled by a certain Robert Cawdray, published in 1604 under the title A Table Alphabetical! ‘of hard usual English wordes’. Like the various dictionaries that came after it during the seventeenth century, Cawdray's tended to concentrate on 'scholarly' words; one function of the dictionary was to enable its student to convey an impression of fine learning. <br><br>\r\nBeyond the practical need to make order out of chaos, the rise of dictionaries is associated with the rise of the English middle class, who were anxious to define and circumscribe the various worlds to conquer - lexical as well as social and commercial. It is highly appropriate that Dr Samuel Johnson, the very model of an eighteenth-century literary man, as famous in his own time as in ours, should have  \r\npublished his dictionary at the very beginning of the heyday of the middle class. <br><br>\r\nJohnson was a poet and critic who raised common sense to the heights of genius. His approach to the problems that had worried writers throughout the late seventeenth and early eighteenth centuries was intensely practical. Up until his time, the task of producing a dictionary on such a large scale had seemed impossible without the establishment of an academy to make decisions about right and wrong usage Johnson decided he did not need an academy to settle arguments about language; he would write a dictionary himself; and he would do it single-handed. Johnson signed the contract for the Dictionary with the bookseller Robert Dosley at a breakfast held at the Golden Anchor Inn near Holbom Bar on 18 June 1764. He was to be paid £ 1.575 in instalments, and from this he took money to rent 17 Gough Square, in which he set up his 'dictionary workshop'. <br><br>\r\nJames Boswell, his biographer described the garret where Johnson worked as ‘fitted up like a counting house' with a long desk running down the middle at which the copying clerks would work standing up. <br><br> \r\nJohnson himself was stationed on a rickety chair at an 'old crazy deal table' surrounded by a chaos of borrowed books. He was also helped by six assistants, two of whom died whilst the Dictionary was still in preparation. <br><br>\r\nThe work was immense; filling about eighty large notebooks (and without a library to hand). Johnson wrote the definitions of over 40,000 words, and illustrated their many meanings with some I 14.000 quotations drawn from English writing on every subject, from the Elizabethans to his own time. He did not expect to achieve complete originality. Working to a deadline, he had to draw on the best of all previous dictionaries, and to make his work one of heroic synthesis. In fact it was very much more. Unlike his predecessors. Johnson treated English very practically, as a living language, with many different shades of meaning. He adopted his definitions on the principle of English common law - according to precedent. After its publication, his Dictionary was not seriously rivalled for over a century. <br><br>\r\nAfter many vicissitudes the Dictionary was finally published on 15 April 1775. It was instantly recognised as a landmark throughout Europe. This very noble work.’ wrote the leading Italian lexicographer; ‘will be a perpetual monument of Fame to  \r\nthe Author, an Honour to his own Country in particular, and a general Benefit to the republic of Letters throughout Europe.' The fact that Johnson had taken on the Academies of Europe and matched them (everyone knew that forty French academics had taken forty years to produce the first French national dictionary) was cause for much English celebration. <br><br>\r\nJohnson had worked for nine years. ‘with little assistance of the learned, and without any patronage of the great; not in the soft obscurities of retirement, or under the shelter of academic bowers, but amidst inconvenience and distraction, in sickness and in sorrow'. For all its faults and eccentricities his two-volume work is a masterpiece and a landmark, in his own words, 'setting the orthography, displaying the analogy, regulating the structures, and ascertaining the significations of English words’. It is the corner-stone of Standard English, an achievement which, in James Boswell’s words, ‘conferred stability on the language of his country'. <br><br>\r\nThe Dictionary, together with his other writing, made Johnson famous and so well esteemed that his friends were able to prevail upon King George III to offer him a pension. From then on, he was to become the Johnson of folklore.\r\n","begin":1,"end":13,"groups":[{"begin":1,"end":3,"name":"","instruction":"Choose THREE letters A-H.","question":"Write your answers in boxes 1-3 on your answer sheet. <br> NB Your answers may be given in any order.","story":false,"items":[{"type":"multi","numbers":[1,2,3],"question":"Which THREE of the following statements are true of Johnson’s Dictionary?","options":[{"letter":"A","text":"It avoided all scholarly words.","correct":false},{"letter":"B","text":"It was the only English dictionary in general use for 200 years.","correct":false},{"letter":"C","text":"It was famous because of the large number of people involved.","correct":false},{"letter":"D","text":"It focused mainly on language from contemporary texts.","correct":true},{"letter":"E","text":"There was a time limit for its completion.","correct":true},{"letter":"F","text":"It ignored work done by previous dictionary writers.","correct":false},{"letter":"G","text":"It took into account subtleties of meaning.","correct":true},{"letter":"H","text":"Its definitions were famous for their originality.","correct":false}]}]},{"begin":4,"end":7,"name":"","instruction":"Complete the summary below.","question":"Write NO MORE THAN TWO WORDS for each answer.","story":true,"items":[{"type":"text","id":41,"number":4,"question":"In 1764 Dr Johnson accepted the contract to produce a dictionary. Having rented a garret, he took on a number of __________ who stood at a long central desk.","answer":"clerks"},{"type":"text","id":42,"number":5,"question":"Johnson did not have a __________ available to him, but eventually produced definitions of in excess of 40,000 words written down in 80 large notebooks. On publication, the Dictionary was immediately hailed in many European countries as a landmark.","answer":"library"},{"type":"text","id":43,"number":6,"question":"On publication, the Dictionary was immediately hailed in many European countries as a landmark. According to his biographer, James Boswell, Johnson’s principal achievement was to bring __________ to the English language.","answer":"stability"},{"type":"text","id":44,"number":7,"question":"As a reward for his hard work, he was granted a __________ by the king.","answer":"pension"}]},{"begin":8,"end":13,"name":"","instruction":"Do the following statements agree with the information given in Reading Passage 1?","question":"In boxes 8-13 on your answer sheet write\r\n<br>TRUE \t\tif the statement agrees with the information\r\n<br>FALSE \tif the statement contradicts the information\r\n<br>NOT GIVEN \tif there is no information on this\r\n","story":false,"items":[{"type":"select","number":8,"question":"The growing importance of the middle classes led to an increased demand for dictionaries.","answer":"TRUE"},{"type":"select","number":9,"question":"Johnson has become more well known since his death.","answer":"FALSE"},{"type":"select","number":10,"question":"Johnson had been planning to write a dictionary for several years.","answer":"NOT GIVEN"},{"type":"select","number":11,"question":"Johnson set up an academy to help with the writing of his Dictionary.","answer":"FALSE"},{"type":"select","number":12,"question":"Johnson only received payment for his Dictionary on its completion.","answer":"FALSE"},{"type":"select","number":13,"question":"Not all of the assistants survived to see the publication of the Dictionary.","answer":"TRUE"}],"choices":["TRUE","FALSE","NOT GIVEN"]}]},{"name":"READING PASSAGE 2","recording":null,"title":"Nature or Nurture?","instruction":"You should spend about 20 minutes on Questions 14-26 which are based on Reading Passage 2\r\nbelow.\n","text":"<b>A</b>  A few years ago, in one of the most fascinating and disturbing experiments in behavioural psychology, Stanley Milgram of Yale University tested 40 subjects from all walks of life for their willingness to obey instructions given by a ‘leader’ in a situation in which the subjects might feel a personal distaste for the actions they were called upon to perform. Specifically, Milgram told each volunteer 'teacher-subject' that the experiment was in the noble cause of education, and was designed to test whether or not punishing pupils for their mistakes would have a positive effect on the pupils' ability to learn.<br>\r\n<b>B</b>  Milgram’s experimental set-up involved placing the teacher-subject before a panel of thirty switches with labels ranging from '15 volts of electricity (slight shock)' to ‘450 volts (danger - severe shock)' in steps of 15 volts each. The teacher-subject was told that whenever the pupil gave the wrong answer to a question, a shock was to be administered, beginning at the lowest level and increasing in severity with each successive wrong answer. The supposed 'pupil' was in reality an actor hired by Milgram to simulate receiving the shocks by emitting a spectrum of groans, screams and writhings together with an assortment of statements and expletives denouncing both the experiment and the experimenter. Milgram told the teacher-subject to ignore the reactions of the pupil, and to administer whatever level of shock was called for. as per the rule governing the experimental situation of the moment.<br>\r\n<b>C</b>  As the experiment unfolded, the pupil would deliberately give the wrong answers to questions posed by the teacher, thereby bringing on various electrical punishments, even up to the danger level of 300 volts and beyond. Many of the teacher-subjects balked at administering the higher levels of punishment, and turned to Milgram with questioning locks and/or complaints about continuing the experiment. In these situations, Milgram calmly explained that the teacher-subject was to ignore the pupil's cries for mercy and carry on with the experiment. If the subject was still reluctant to proceed, Milgram said that it was important for the sake of the experiment that the procedure be followed through to the end. His final argument was, ‘You have no other choice. You must go on.' What Milgram was trying to discover was the number of teacher-subjects who would be willing to administer the highest levels of shock, even in the face of strong persona! and moral revulsion against the rules and conditions of the experiment.<br>\r\n<b>D</b>  Prior to carrying out the experiment, Milgram explained his idea to a group of 39 psychiatrists and asked them to predict the average percentage of people in an ordinary population who would be willing to administer the highest shock level of 450 volts. The overwhelming consensus was that virtually all the teacher-subjects would refuse to obey the experimenter. The psychiatrists felt that 'most subjects would not go beyond 150 volts' and they further anticipated that only four per cent would go up to 300 volts. Furthermore, they thought that only a lunatic fringe of about one in 1.000 would give the highest shock of 450 volts.<br> \r\n<b>E</b> \tWhat were the actual results? Well, over 60 per cent of the teacher-subjects continued to obey Milgram up to the 450-volt limit! In repetitions of the experiment in other countries, the percentage of obedient teacher-subjects was even higher, reaching 85 per cent in one country How can we possibly account for this vast discrepancy between what calm, rational, knowledgeable people predict in the comfort of their study and what pressured, flustered, but cooperative teachers’ actually do in the laboratory of real life?<br>\r\n<b>F</b> \tOne’s first inclination might be to argue that there must be some sort of built-in animal aggression instinct that was activated by the experiment, and that Milgram’s teacher- subjects were just following a genetic need to discharge this pent-up primal urge onto the pupil by administering the electrical shock. A modern hard-core sociobiologist might even go so far as to claim that this aggressive instinct evolved as an advantageous trait, having been of survival value to our ancestors in their struggle against the hardships of life on the plains and in the caves, ultimately finding its way into our genetic make-up as a remnant of our ancient animal ways.<br>\r\n<b>G</b> \tAn alternative to this notion ot genetic programming is to see the teacher-subjects' actions as a result of the social environment under which the experiment was carried out. As Milgram himself pointed out. Most subjects in the experiment see their behaviour in a larger context that is benevolent and useful to society - the pursuit of scientific truth. The psychological laboratory has a strong claim to legitimacy and evokes trust and confidence in those who perform there. An action such as shocking a victim, which in isolation appears evil, acquires a completely different meaning when placed in this setting.’<br>\r\n<b>H</b> \tThus, in this explanation the subject merges his unique personality and personal and moral code with that of larger institutional structures, surrendering individual properties like loyalty, self-sacrifice and discipline to the service of malevolent systems of authority.<br>\r\n<b>I</b> \tHere we have two radically different explanations for why so many teacher-subjects were willing to forgo their sense of personal responsibility for the sake of an institutional authority figure. The problem for biologists, psychologists and anthropologists is to sort out which of these two polar explanations is more plausible. This, in essence, is the problem of modem sociobiology - to discover the degree to which hard-wired genetic programming dictates, or at least strongly biases, the interaction of animals and humans with their environment, that is, their behaviour. Put another way. sociobiology is concerned with elucidating the biological basis of all behaviour.\r\n\n","begin":14,"end":26,"groups":[{"begin":14,"end":19,"name":"","instruction":"Reading Passage 2 has nine paragraphs, A-I.","question":"Which paragraph contains the following information?\r\n<br>Write the correct letter A-I in boxes 14-19 on your answer sheet.\r\n\n","story":false,"items":[{"type":"text","id":51,"number":14,"question":"a biological explanation of the teacher-subjects’ behaviour","answer":"F"},{"type":"text","id":52,"number":15,"question":"the explanation Milgram gave the teacher-subjects for the experiment","answer":"A"},{"type":"text","id":53,"number":16,"question":"the identity of the pupils","answer":"B"},{"type":"text","id":54,"number":17,"question":"the expected statistical outcome","answer":"D"},{"type":"text","id":55,"number":18,"question":"the general aim of sociobiological study","answer":"I"},{"type":"text","id":56,"number":19,"question":"the way Milgram persuaded the teacher-subjects to continue","answer":"C"}]},{"begin":20,"end":22,"name":"","instruction":"Choose the correct letter A, B, C or D.","question":"Write your answers in boxes 20-22 on your answer sheet.\n\n","story":false,"items":[{"type":"radio","number":20,"question":"The teacher-subjects were told that they were testing whether","options":[{"letter":"A","text":"a 450-volt shock was dangerous.","correct":false},{"letter":"B","text":"punishment helps learning.","correct":true},{"letter":"C","text":"the pupils were honest.","correct":false},{"letter":"D","text":"they were suited to teaching.","correct":false}]},{"type":"radio","number":21,"question":"The teacher-subjects were instructed to","options":[{"letter":"A","text":"stop when a pupil asked them to.","correct":false},{"letter":"B","text":"denounce pupils who made mistakes.","correct":false},{"letter":"C","text":"reduce the shock level after a correct answer.","correct":false},{"letter":"D","text":"give punishment according to a rule.","correct":true}]},{"type":"radio","number":22,"question":"Before the experiment took place the psychiatrists","options":[{"letter":"A","text":"believed that a shock of 150 volts was too dangerous.","correct":false},{"letter":"B","text":"failed to agree on how the teacher-subjects would respond to instructions.","correct":false},{"letter":"C","text":"underestimated the teacher-subjects’ willingness to comply with experimental procedure.","correct":true},{"letter":"D","text":"thought that many of the teacher-subjects would administer a shock of 450 volts.","correct":false}]}]},{"begin":23,"end":26,"name":"","instruction":"Do the following statements agree with the information given in Reading Passage 2?","question":"In boxes 23-26 on your answer sheet write<br>\r\n<b>TRUE</b> \t\tif the statement agrees with the information<br>\r\n<b>FALSE</b>\tif the statement contradicts the information<br>\r\n<b>NOT GIVEN</b> \tif there is no information on this\r\n\n\n","story":false,"items":[{"type":"text","id":60,"number":23,"question":"Several of the subjects were psychology students at Yale University.","answer":"NOT GIVEN"},{"type":"text","id":61,"number":24,"question":"Some people may believe that the teacher-subjects’ behaviour could be explained as a positive survival mechanism.","answer":"TRUE"},{"type":"text","id":62,"number":25,"question":"In a sociological explanation, personal values are more powerful than authority.","answer":"FALSE"},{"type":"text","id":63,"number":26,"question":"Milgram’s experiment solves an important question in sociobiology.","answer":"FALSE"}]}]},{"name":"READING PASSAGE 3","recording":null,"title":"The Truth about the Environment","instruction":"You should spend about 20 minutes on Questions 27-40 which are based on Reading Passage 3\r\nbelow.\n","text":"For many environmentalists, the world seems to be getting worse. They have developed a hit-list of our main fears: that natural resources are running out; that the population is ever growing, leaving less and less to eat; that species are becoming extinct in vast numbers, and that the planet's air and water are becoming ever more polluted. <br>\r\nBut a quick look at the facts shows a different picture. First, energy and other natural resources have become more abundant, not less so, since the book The Limits to Growth' was published in 1972 by a group of scientists. Second, more food is now produced per head of the world's population than at any time in history. Fewer people are starving. Third, although species are .indeed becoming extinct, only about 0.7% of them are expected to disappear in the next 50 years, not 25-50%, as has so often been predicted. And finally, most forms of environmental pollution either appear to have been exaggerated, or are transient - associated with the early phases of industrialisation and therefore best cured not by restricting economic growth, but by accelerating it. One form of pollution - the release of greenhouse gases that causes global warming - does appear to be a phenomenon that is going to extend well into our future, but its total impact is unlikely to pose a devastating problem. A bigger problem may well turn out to be an inappropriate response to it.<br>\r\nYet opinion polls suggest that many people nurture the belief that environmental standards are declining and four factors seem to cause this disjunction between perception and reality.<br>\r\nOne is the lopsidedness built into scientific research. Scientific funding goes mainly to areas with many problems. That may be wise policy, but it will also create an impression that many more potential problems exist than is the case.<br>\r\nSecondly, environmental groups need to be noticed by the mass media. They also need to keep the money rolling in. Understandably, perhaps, they sometimes overstate their arguments. In 1997, for example, the World Wide Fund for Nature issued a press release entitled: 'Two thirds of the world's forests lost forever'. The truth turns out to be nearer 20%.<br>\r\nThough these groups are run overwhelmingly by selfless folk, they nevertheless share many of the characteristics of other lobby groups. That would matter less if people applied the same degree of scepticism to environmental lobbying as they do to lobby groups In other fields. A trade organisation arguing for, say, weaker pollution controls is instantly seen as self-interested. Yet a green organisation opposing such a weakening is seen as altruistic, even if an impartial view of the controls in question might suggest they are doing more harm than good.<br>\r\nA third source of confusion is the attitude of the media. People are clearly more curious about bad news than good. Newspapers and broadcasters are there to provide what the public wants. That, however, can lead to significant distortions of perception. An example was America's encounter with El Nino in 1997 and 1998. This climatic phenomenon was accused of wrecking tourism, causing allergies, melting the ski-slopes and causing 22 deaths. However, according to an article in the Bulletin of the American Meteorological Society, the damage it did was estimated at US$4 billion but the benefits amounted to some US$19 billion. These came from higher winter temperatures (which saved an estimated 850 lives, reduced heating costs and diminished spring floods caused by meltwaters).<br>\r\nThe fourth factor is poor individual perception. People worry that the endless rise in the amount of stuff everyone throws away will cause the world to run out of places to dispose of waste. Yet, even if America's trash output continues to rise as it has done in the past, and even if the American population doubles by 2100, all the rubbish America produces through the entire 21st century will still take up only one-12.000th of the area of the entire United States.<br>\r\nSo what of global warming? As we know, carbon dioxide emissions are causing the planet to warm. The best estimates are that the temperatures will rise by 2-3°C in this century, causing considerable problems, at a total cost of US$5,000 billion.<br>\r\nDespite the intuition that something drastic needs to be done about such a costly problem, economic analyses clearly show it will be far more expensive to cut carbon dioxide emissions radically than to pay the costs of adaptation to the increased temperatures. A model by one of the main authors of the United Nations Climate Change Panel shows how an expected temperature increase of 2.1 degrees in 2100 would only be diminished to an increase of 1.9 degrees. Or to put ft another way, the temperature increase that the planet would have experienced in 2094 would be postponed to 2100.<br>\r\nSo this does not prevent global warming, but merely buys the world six years. Yet the cost of reducing carbon dioxide emissions, for the United States alone, will be higher than the cost of solving the world's single, most pressing health problem: providing universal access to clean drinking water and sanitation. Such measures would avoid 2 million deaths every year, and prevent half a billion people from becoming seriously ill.<br>\r\nIt is crucial that we look at the facts if we want to make the best possible decisions for the future. It may be costly to be overly optimistic - but more costly still to be too pessimistic.\r\n\n\n","begin":27,"end":40,"groups":[{"begin":27,"end":32,"name":"","instruction":"Do the following statements agree with the information given in Reading Passage 3?","question":"In boxes 27-32 on your answer sheet write<br>\r\n<b>YES</b> \t\tif the statement agrees with the claims of the writer<br>\r\n<b>NO</b>\t \tif the statement contradicts the claims of the writer<br>\r\n<b>NOT GIVEN</b> \tif it is impossible to say what the writer thinks about this\n","story":false,"items":[{"type":"text","id":64,"number":27,"question":"Environmentalists take a pessimistic view of the world for a number of reasons.","answer":"YES"},{"type":"text","id":65,"number":28,"question":"Data on the Earth’s natural resources has only been collected since 1972.","answer":"NOT GIVEN"},{"type":"text","id":66,"number":29,"question":"The number of starving people in the world has increased in recent years.","answer":"NO"},{"type":"text","id":67,"number":30,"question":"Extinct species are being replaced by new species.","answer":"NOT GIVEN"},{"type":"text","id":68,"number":31,"question":"Some pollution problems have been correctly linked to industrialisation.","answer":"YES"},{"type":"text","id":69,"number":32,"question":"It would be best to attempt to slow down economic growth.","answer":"NO"}]},{"begin":33,"end":37,"name":"","instruction":"Choose the correct letter, A, B, C or D.","question":"Write your answers in boxes 33-37 on your answer sheet.\n","story":false,"items":[{"type":"radio","number":33,"question":"What aspect of scientific research does the writer express concern about in paragraph 4?","options":[{"letter":"A","text":"the need to produce results","correct":false},{"letter":"B","text":"the lack of financial support","correct":false},{"letter":"C","text":"the selection of areas to research","correct":true},{"letter":"D","text":"the desire to solve every research problem","correct":false}]},{"type":"radio","number":34,"question":"The writer quotes from the Worldwide Fund for Nature to illustrate how","options":[{"letter":"A","text":"influential the mass media can be.","correct":false},{"letter":"B","text":"effective environmental groups can be.","correct":false},{"letter":"C","text":"the mass media can help groups raise funds.","correct":false},{"letter":"D","text":"environmental groups can exaggerate their claims.","correct":true}]},{"type":"radio","number":35,"question":"What is the writer’s main point about lobby groups in paragraph 6?","options":[{"letter":"A","text":"Some are more active than others.","correct":false},{"letter":"B","text":"Some are better organised than others.","correct":false},{"letter":"C","text":"Some receive more criticism than others.","correct":true},{"letter":"D","text":"Some support more important issues than others.","correct":false}]},{"type":"radio","number":36,"question":"The writer suggests that newspapers print items that are intended to","options":[{"letter":"A","text":"educate readers.","correct":false},{"letter":"B","text":"meet their readers’ expectations.","correct":true},{"letter":"C","text":"encourage feedback from readers.","correct":false},{"letter":"D","text":"mislead readers.","correct":false}]},{"type":"radio","number":37,"question":"What does the writer say about America’s waste problem?","options":[{"letter":"A","text":"It will increase in tine with population growth.","correct":false},{"letter":"B","text":"It is not as important as we have been led to believe.","correct":true},{"letter":"C","text":"It has been reduced through public awareness of the issues.","correct":false},{"letter":"D","text":"It is only significant in certain areas of the country.","correct":false}]}]},{"begin":38,"end":40,"name":"","instruction":"Complete the summary with the list of words A-I below.","question":"Write the correct letter A-I in bo             try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}

            return QUIZ.users.map(u => ({
                name: u.name, email: u.email, password: u.password, role: /admin/i.test(u.role) ? 'admin' : 'learner',
                avatar: 'member_0.jpg', plan: /premium/i.test(u.role) ? 'Premium' : 'Free', target: 6.5, joined: '2025-11-01', examType: 'Academic',

            return [...byEmail.values()];
        }
        function currentUser() {
            return state.session ? allAccounts().find(u => norm(u.email) === norm(state.session)) || null : null;

        function isAdmin() { const u = currentUser(); return !!u && u.role === 'admin'; }

            const user = currentUser();

            if (idx >= 0) state.users[idx] = merged; else state.users.push(merged);
            save('dv_users', state.users);
        }
        function hasAccess(test) {
            const u = currentUser();
            if (test.plan === 'Free') return true;

        /* =================================================================

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
        function plain(html) { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.replace(/\s+/g, ' ').trim(); }

        function pad(n) { return (n < 10 ? '0' : '') + n; }
        function clock(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s); }

        function rawToBand(module, raw) { return BAND_TABLE[module].find(r => raw >= r[0])[1]; }
        function roundBand(x) { const f = x - Math.floor(x); return Math.floor(x) + (f < 0.25 ? 0 : f < 0.75 ? 0.5 : 1); }

        function attemptStatus(a) { return state.reviews[a.id] ? 'reviewed' : a.status; }
        function attemptBand(a) {
            if (a.raw != null) return rawToBand(a.module, a.raw);
            const c = attemptCriteria(a);
            if (!c) return null;
            const vals = Object.values(c).map(Number);
            return roundBand(vals.reduce((s, v) => s + v, 0) / vals.length);

        function allAttempts() { return SAMPLE_ATTEMPTS.concat(state.attempts).slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)); }

        function latestBySkill(email) {
            const out = {};
            attemptsOf(email).slice().reverse().forEach(a => { const b = attemptBand(a); if (b != null) out[a.module] = b; });
            return out;

        function overallBand(by) {
            const vals = SKILLS.map(m => by[m]).filter(v => v != null);
            return vals.length ? roundBand(vals.reduce((s, v) => s + v, 0) / vals.length) : null;

        // Header search + tab filters narrow `[data-searchable] [data-row]`.
        function bindFilters() {
            const pick = {};
            function apply() {
                const q = norm($('#global-search').val());
                $('[data-searchable] [data-row]').each(function () {
                    const okText = !q || norm(this.textContent).includes(q);
                    const okPick = Object.keys(pick).every(g => pick[g] === 'all' || (this.dataset[g] || '').split(' ').includes(pick[g]));
                    $(this).toggle(okText && okPick);
                });
                $(app).trigger('filtered');
                $('[data-searchable]').each(function () { $(this).find('[data-empty]').toggle($(this).find('[data-row]:visible').length === 0); });
            }
            $('[data-filter-group]').not('[data-filter-group="range"]').each(function () { pick[this.dataset.filterGroup] = String($(this).find('.active').data('filter') || 'all'); });
            $(app).on('input', '#global-search', apply);
            $(app).on('click', '[data-filter-group]:not([data-filter-group="range"]) [data-filter]', function () {
                const group = $(this).closest('[data-filter-group]');
                group.find('[data-filter]').removeClass('active');
                $(this).addClass('active');
                pick[group.data('filterGroup')] = String($(this).data('filter'));

        /* =================================================================

        ================================================================= */
        function itemKey(item) { return item.numbers ? 'm' + item.numbers[0] : 'n' + item.number; }
        function correctLetters(item) { return item.options.filter(o => o.correct).map(o => o.letter); }
        function solution(text) { return `<span class="solution-key">${esc(text)}</span>`; }

        function gapInput(item) {
            const input = `<span class="q-num" id="q-${item.number}">${item.number}</span><input type="text" class="gap-input" data-key="${itemKey(item)}" autocomplete="off" spellcheck="false" aria-label="Answer ${item.number}">${solution(item.answer.split(',').join(' / '))}`;
            return BLANK.test(item.question) ? item.question.replace(BLANK, input) : input.replace('<input', `<span class="mr-2">${item.question}</span><input`);
        }

        function renderOptions(item, multi) {
            return item.options.map(o => `
                <label class="option">
                    <input type="${multi ? 'checkbox' : 'radio'}" name="opt-${itemKey(item)}" data-key="${itemKey(item)}" ${multi ? `data-max="${item.numbers.length}"` : ''} value="${o.letter}">
                    <span class="letter">${o.letter}</span><span>${o.text}</span>
                </label>`).join('');
        }

        function renderItem(item, group) {
            switch (item.type) {
                case 'text': return gapInput(item);
                case 'radio':
                    return `<div class="q-block" id="q-${item.number}">
                        <div class="d-flex align-items-start mb-3"><span class="q-num">${item.number}</span><div class="q-text">${item.question}</div></div>
                        ${renderOptions(item, false)}${solution('Answer: ' + correctLetters(item).join(', '))}</div>`;
                case 'multi':
                    return `<div class="q-block" id="q-${item.numbers[0]}">
                        <div class="d-flex align-items-start mb-3"><span class="q-num">${item.numbers[0]}–${item.numbers[item.numbers.length - 1]}</span>
                        <div><div class="q-text">${item.question && plain(item.question) !== plain(group.question) ? item.question : 'Choose your answers'}</div><div class="small-caps mt-1">Select ${item.numbers.length} options</div></div></div>
                        ${renderOptions(item, true)}${solution('Answer: ' + correctLetters(item).join(', '))}</div>`;
                case 'select':
                    return `<div class="q-line d-flex align-items-center flex-wrap" id="q-${item.number}">
                        <span class="q-num">${item.number}</span><span class="mr-3" style="flex:1 1 300px; line-height:1.7">${item.question}</span>
                        <select class="dv-input tf-select" data-key="${itemKey(item)}"><option value="">Choose…</option>${group.choices.map(c => `<option>${esc(c)}</option>`).join('')}</select>
                        ${solution(item.answer)}</div>`;
            }
            return '';
        }

        function renderTable(group) {
            const byId = {};
            group.items.forEach(i => { byId[i.id] = i; });

        function renderGroup(group) {
            const range = group.begin !== group.end ? `Questions ${group.begin}–${group.end}` : `Question ${group.begin}`;
            const html = [`<div class="q-group"><div class="instruction-box"><div class="range">${range}</div><div class="what">${group.instruction}</div>${group.question ? `<p class="note">${group.question}</p>` : ''}</div>`];

            if (group.name) html.push(`<h4 class="text-center mb-3" style="font-family:Montserrat;font-weight:700;color:#000">${esc(group.name)}</h4>`);
            if (group.table) html.push(renderTable(group));
            else if (group.story) html.push(`<p style="line-height:2.5;color:#384158;font-size:15px">${group.items.map(i => renderItem(i, group)).join(' ')}</p>`);
            else group.items.forEach(i => html.push(i.type === 'text' ? `<div class="q-line">${renderItem(i, group)}</div>` : renderItem(i, group)));

            html.push('</div>');
            return html.join('');

        function quizItems(sections) { return sections.flatMap((s, si) => s.groups.flatMap(g => g.items.map(i => Object.assign({ section: si, group: g }, i)))); }

        function examShell(bar, body) { return `<div class="super_container">${bar}${body}</div>`; }

        function runTimer(seconds, onTimeUp) {
            const started = Date.now();
            let remaining = seconds;
            const paint = () => { $('.js-timer').text(clock(remaining)); $('.dv-timer').toggleClass('warn', remaining <= 300); };
            paint();
            every(1000, () => {
                remaining = Math.max(0, seconds - Math.floor((Date.now() - started) / 1000));
                paint();
                if (remaining === 0) onTimeUp();
            });
            return () => Math.min(seconds, Math.round((Date.now() - started) / 1000));
        }

        function bindExit(testId, isDirty) {
            $(app).on('click', '[data-exit]', e => {
                e.preventDefault();

        function guardAccess(testId) {
            const t = testById(testId);

            return true;

        function startObjectiveExam(module, testId, sections, onSectionChange) {
            const items = quizItems(sections);
            const answers = {};
            const total = questionNumbers(items).length;
            let submitted = false;
            const answeredCount = item => { const v = answers[itemKey(item)]; return Array.isArray(v) ? v.length : v ? 1 : 0; };
            function refresh() {
                $('.nav-num').removeClass('answered');
                let done = 0;
                items.forEach(item => {
                    const k = answeredCount(item);
                    done += k;
                    (item.numbers || [item.number]).slice(0, k).forEach(n => $(`.nav-num[data-goto="${n}"]`).addClass('answered'));
                });
                $('.js-answered').text(done);
                $('.js-progress').css('width', Math.round(done / total * 100) + '%');
                return done;
            }
            const elapsed = runTimer(MODULES[module].seconds, () => { if (!submitted) { alert('Time is up! Your answers will be submitted automatically.'); submit(); } });
            function submit() {
                submitted = true;
                const attempt = gradeAttempt(module, testId, items, answers, elapsed());
                state.attempts.push(attempt);
                save('dv_attempts', state.attempts);
                $('#reviewModal').modal('hide');
                go('/result/' + attempt.id);
            }
            $(app).on('input', 'input.gap-input', function () { answers[this.dataset.key] = this.value.trim(); refresh(); });
            $(app).on('change', 'select[data-key]', function () { answers[this.dataset.key] = this.value; refresh(); });
            $(app).on('change', '.option input', function () {
                const key = this.dataset.key;
                if (this.type === 'checkbox') {
                    const picked = $(`.option input[data-key="${key}"]:checked`).map((_, el) => el.value).get();
                    if (picked.length > Number(this.dataset.max)) { this.checked = false; toast(`Choose only ${this.dataset.max} options for this question.`, 'warn'); return; }
                    answers[key] = picked;
                } else answers[key] = this.value;
                $(`.option input[data-key="${key}"]`).each(function () { $(this).closest('.option').toggleClass('selected', this.checked); });
                refresh();
            });
            $(app).on('click', '[data-goto]', function () {
                const n = Number(this.dataset.goto);
                const item = items.find(i => (i.numbers || [i.number]).includes(n));
                if (onSectionChange) onSectionChange(item.section);
                $('.exam-drawer').removeClass('open');
                const target = document.getElementById('q-' + (item.numbers ? item.numbers[0] : item.number));
                if (!target) return;
                // Split-screen panes scroll on their own; never move the window there.
                const pane = $(target).closest('.pane')[0];
                if (pane && getComputedStyle(pane).overflowY === 'auto') {
                    pane.scrollTo({ top: target.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop - pane.clientHeight / 3, behavior: 'smooth' });
                } else {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                $(target).nextAll('input').first().focus({ preventScroll: true });
            });
            $(app).on('click', '.js-drawer', () => $('.exam-drawer').toggleClass('open'));
            $(app).on('click', '.js-solution', () => { $(app).toggleClass('show-solution'); $('.js-solution').toggleClass('outline', $(app).hasClass('show-solution')); });
            $(app).on('click', '.js-review', () => {
                const missing = questionNumbers(items).filter(n => !$(`.nav-num[data-goto="${n}"]`).first().hasClass('answered'));
                const done = total - missing.length;
                $('#review-body').html(`
                    <div class="d-flex mb-2"><b class="text-ink">${done} of ${total} answered</b><span class="ml-auto">${Math.round(done / total * 100)}%</span></div>
                    <div class="dv-bar mb-4"><span style="width:${done / total * 100}%"></span></div>
                    ${missing.length ? `<p style="font-size:14px">Not answered yet — click a number to jump to it:</p><div class="nav-grid">${missing.map(n => `<button type="button" class="nav-num" data-goto="${n}" data-dismiss="modal">${n}</button>`).join('')}</div>` : '<div class="dv-alert ok mb-0">All questions answered. You are ready to submit.</div>'}`);
                $('.exam-drawer').removeClass('open');
                $('#reviewModal').modal('show');
            });
            $(app).on('click', '.js-submit', function () {
                const missing = total - refresh();
                if (!$(this).closest('.modal').length && missing > 0 && !confirm(`${missing} question${missing > 1 ? 's are' : ' is'} still unanswered. Submit anyway?`)) return;
                submit();
            });
            bindExit(testId, () => refresh() > 0);
            refresh();
        }

        function questionKind(item) {
            if (item.type === 'radio') return 'Multiple choice';
            if (item.type === 'multi') return 'Multiple selection';
            if (item.type === 'select') return 'True / False / Not Given';
            if (item.group.table) return 'Table completion';
            if (/^(TRUE|FALSE|NOT GIVEN|YES|NO)$/.test(item.answer)) return 'Yes / No / Not Given';
            if (/^[A-I]$/.test(item.answer)) return 'Matching';
            if (item.group.story) return 'Summary completion';
            return 'Sentence & note completion';
        }

        function gradeAttempt(module, testId, items, answers, spent) {
            const entries = [];
            items.forEach(item => {
                const v = answers[itemKey(item)];
                const kind = questionKind(item);
                if (item.type === 'text' || item.type === 'select') {
                    const keys = item.answer.split(',');
                    entries.push({ n: item.number, kind, key: keys.join(' / '), user: v || '', ok: !!v && keys.some(k => norm(k) === norm(v)) });
                } else if (item.type === 'radio') {
                    const correct = correctLetters(item);
                    const label = l => { const o = item.options.find(x => x.letter === l); return o ? `${l}. ${plain(o.text)}` : ''; };
                    entries.push({ n: item.number, kind, key: correct.map(label).join(' / '), user: v ? label(v) : '', ok: correct.includes(v) });
                } else if (item.type === 'multi') {
                    const correct = correctLetters(item);
                    const picked = v || [];
                    const hit = picked.filter(l => correct.includes(l));
                    const keys = hit.concat(correct.filter(l => !hit.includes(l)));
                    const users = hit.concat(picked.filter(l => !hit.includes(l)));
                    item.numbers.forEach((n, k) => entries.push({ n, kind, key: keys[k] || '', user: users[k] || '', ok: k < hit.length }));
                }
            });
            entries.sort((a, b) => a.n - b.n);
            return { id: 'a' + Date.now(), email: state.session, test: Number(testId), module, date: todayIso(),
                raw: entries.filter(e => e.ok).length, total: entries.length, spent, duration: MODULES[module].seconds, status: 'auto', entries };
        }

        function silentWav() {
            if (silentWav.url) return silentWav.url;
            const rate = 8000, len = rate * 30, buf = new ArrayBuffer(44 + len), v = new DataView(buf);
            const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            str(0, 'RIFF'); v.setUint32(4, 36 + len, true); str(8, 'WAVE'); str(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
            str(36, 'data'); v.setUint32(40, len, true);
            new Uint8Array(buf, 44).fill(128);
            return (silentWav.url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
        }

        </div>

</div>
${drawer(items)}${reviewModal()}`),

                        state.attempts.push(attempt);

                <div class="dv-box">
                    <div class="dv-box-head"><div class="dv-box-title">Hardest questions</div><span class="small-caps">% correct</span></div>
                    ${hardest.map(h => `
                    <div class="py-3" style="border-bottom:1px solid #f1f1f1">
                        <div class="d-flex align-items-start" style="font-size:13px"><span class="q-num">${h.i.number}</span><span class="text-ink" style="line-height:1.6">${esc((plain(h.i.question).replace(BLANK, '____') || 'Gap fill').slice(0, 60))}</span></div>

                init() {
                    $(app).on('click', '[data-review]', function () { state.openReview = this.dataset.review; go('/admin/submissions'); });
                    const c = chart('chart-attempts', {
                        type: 'line',
                        data: { labels: ADMIN_STATS.months, datasets: [{ label: 'Tests taken', data: ADMIN_STATS.monthly, borderColor: '#2e21df', pointBackgroundColor: '#2e21df', backgroundColor: 'rgba(46,33,223,.08)' }] },
                        options: { scales: axes() },
                    });
                    $(app).on('click', '[data-filter-group="range"] [data-filter]', function () {
                        $(this).siblings().removeClass('active');
                        $(this).addClass('active');

                        c.data.labels = week ? ADMIN_STATS.weeks : ADMIN_STATS.months;
                        c.data.datasets[0].data = week ? ADMIN_STATS.weekly : ADMIN_STATS.monthly;
                        c.update();
                    });
                    chart('chart-bands', {
                        type: 'bar',
                        data: { labels: ADMIN_STATS.bands.labels, datasets: [{ label: 'Learners', data: ADMIN_STATS.bands.data, backgroundColor: '#2e21df', maxBarThickness: 18 }] },
                        options: { scales: axes({ display: false }) },
