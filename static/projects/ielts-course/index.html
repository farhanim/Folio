            };
        }

        function questionBank() {
            const rows = [];
            ['listening', 'reading'].forEach(m => QUIZ[m].forEach(s => s.groups.forEach(g => g.items.forEach(raw => {
                const i = Object.assign({ group: g }, raw);
                let text = plain(i.question).replace(BLANK, '______');
                if (!text || /^(the )?_+$/i.test(text)) text = `${plain(g.instruction)} (gap ${i.number})`;
                rows.push({ no: i.numbers ? i.numbers.join('–') : i.number, module: m, text, type: questionKind(i), section: s.name, key: i.options ? correctLetters(i).join(', ') : i.answer, status: 'Published' });
            }))));
            WRITING_TASKS.forEach(t => rows.push({ no: '—', module: 'writing', text: t.prompt, type: `Essay · ${t.minWords}+ words`, section: t.title.toUpperCase(), key: 'Examiner graded', status: 'Published' }));
            SPEAKING_PARTS.forEach(p => rows.push({ no: '—', module: 'speaking', text: p.cue ? p.cue.topic : p.topics.map(x => x.name).join(' · '), type: p.subtitle, section: p.title.toUpperCase(), key: 'Examiner graded', status: 'Published' }));
            return rows.concat(state.questions);
        }

        function formModal(id, title, body) {
            return `
<div class="modal fade" id="${id}" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <form class="modal-content" novalidate>
      <div class="modal-header"><h5 class="modal-title">${title}</h5><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
      <div class="modal-body">${body}<div class="js-form-error"></div></div>
      <div class="modal-footer"><button type="button" class="dv-btn sm light" data-dismiss="modal">Cancel</button><button type="submit" class="dv-btn sm">Save</button></div>
    </form>
  </div>
</div>`;
        }

        // `onSave` returns an error string to keep the modal open.
        function bindModalForm(id, onSave) {
            $(`#${id} form`).on('submit', function (e) {
                e.preventDefault();
                const missing = $(this).find('[required]').filter((_, el) => !el.value.trim()).length;
                const error = missing ? 'Please fill in the required fields.' : onSave(this);
                if (error) { $(this).find('.js-form-error').html(`<div class="dv-alert error mb-0">${error}</div>`); return; }
                $(`#${id}`).one('hidden.bs.modal', route).modal('hide');
            });
        }

            const rows = questionBank();
            const count = m => rows.filter(r => r.module === m).length;
            return {
                html: page('Questions', ['Admin', 'Question bank'], `
<div class="dv-section">
    <div class="container">
        ${sectionHead('Content', 'Question bank', 'Every question in Cambridge IELTS 5 · Academic Test 1 with its type and answer key.', '<button class="dv-btn" data-toggle="modal" data-target="#addQuestion"><i class="fa fa-plus"></i>Add question</button>')}
        <div class="row">${SKILLS.map((m, i) => stat(MODULES[m].label, count(m), MODULES[m].icon, ['', 'navy', 'yellow', 'soft'][i], m === 'listening' || m === 'reading' ? 'auto-graded items' : 'examiner-graded prompts')).join('')}</div>
        <div class="dv-box flat">
            <div class="mb-4">${tabsFilter('module', [['all', 'All', rows.length]].concat(SKILLS.map(m => [m, MODULES[m].label, count(m)])), 'all')}</div>
            <div class="table-responsive">

                    <tbody data-searchable>${rows.map(r => `
                        <tr data-row data-module="${r.module}">
                            <td><span class="q-num">${r.no}</span></td>
                            <td>${esc(r.text.length > 110 ? r.text.slice(0, 110) + '…' : r.text)}</td>
                            <td>${moduleTag(r.module)}</td>
                            <td style="font-size:13px">${esc(r.type)}</td>

                </table>
            </div>

</div>
${formModal('addQuestion', 'Add question', `

    <div class="row">
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">Module</label><select class="dv-input" name="module">${SKILLS.map(m => `<option value="${m}">${MODULES[m].label}</option>`).join('')}</select></div></div>

    </div>`)}`),
                init() {
                    bindFilters();
                    bindModalForm('addQuestion', f => {
                        state.questions.push({ no: 'new', module: f.module.value, text: f.text.value.trim(), type: f.type.value, section: 'TEST 1', key: f.key.value || '—', status: f.status.value });

        function pageTests() {
            return {
                html: page('Tests', ['Admin', 'Tests'], `
<div class="dv-section">
    <div class="container">
        ${sectionHead('Catalog management', 'Tests', `${TESTS.length} tests · ${TESTS.filter(t => t.status === 'Published').length} published · ${num(TESTS.reduce((s, t) => s + t.takers, 0))} total takers.`, '<a href="#/catalog" class="dv-btn outline">View catalog</a>')}

        function pageSubmissions() {
            const attempts = allAttempts();

            return {
                html: page('Submissions', ['Admin', 'Submissions'], `
<div class="dv-section">
    <div class="container">
        ${sectionHead('Assessment', 'Submissions', 'Every module attempt across all learners. Writing and Speaking need an examiner band before learners can see their result.')}
        <div class="row">
            ${stat('Total attempts', attempts.length, 'fa-files-o', '', 'in this list')}

            ${stat('Reviewed', by('reviewed'), 'fa-check-square-o', 'navy', 'examiner graded')}

            <div class="mb-4">${tabsFilter('status', [['all', 'All', attempts.length], ['pending', 'Awaiting review', by('pending')], ['reviewed', 'Reviewed', by('reviewed')], ['auto', 'Auto-graded', by('auto')]], by('pending') ? 'pending' : 'all')}</div>

</div>
<div class="modal fade" id="reviewSubmission" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document"><form class="modal-content" id="review-form"></form></div>
</div>`),
                init() {
                    bindFilters();
                    $(app).on('click', '[data-review]', function () {
                        const a = allAttempts().find(x => x.id === this.dataset.review);
                        const p = personOf(a.email);
                        const options = v => [4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9].map(b => `<option value="${b}" ${b === v ? 'selected' : ''}>${fmtBand(b)}</option>`).join('');
                        $('#review-form').html(`
                            <div class="modal-header"><div><h5 class="modal-title">${MODULES[a.module].label} review · ${esc(p.name)}</h5><div class="small-caps mt-1">${esc(testById(a.test).subtitle)} · ${fmtDate(a.date)}</div></div><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
                            <div class="modal-body">
                                <div class="row">
                                    <div class="col-md-7" style="max-height:52vh;overflow:auto;font-size:14px">${a.module === 'writing'
                                        ? WRITING_TASKS.map((w, i) => `<div class="small-caps mb-2">${w.title} · ${a.words[i]} words</div><p class="text-ink" style="white-space:pre-line;line-height:1.9">${a.essays ? esc(a.essays[i]) : ''}</p>`).join('')
                                        : SPEAKING_PARTS.map((sp, i) => `<div class="d-flex py-2" style="border-bottom:1px solid #f1f1f1"><span class="text-ink">${sp.title} · ${sp.subtitle}</span><b class="ml-auto text-ink">${clock(a.partSeconds[i] || 0)}</b></div>`).join('') + `<p class="mt-3"><b class="text-ink">Part 2 notes:</b> ${esc(a.notes || '—')}</p><div class="dv-alert info">Audio playback is available in the production build.</div>`}
                                    </div>
                                    <div class="col-md-5">
                                        ${CRITERIA[a.module].map(c => `<div class="mb-2"><label class="dv-label mb-1" style="font-size:12px">${c[1]}</label><select class="dv-input js-criterion" style="height:40px" name="${c[0]}">${options(6)}</select></div>`).join('')}
                                        <div class="text-center my-3"><div class="small-caps">Overall band</div><div class="dv-stat-value text-blue js-band-preview" style="font-size:44px">6.0</div></div>
                                        <textarea class="dv-input" name="comment" rows="3" placeholder="Comment for the learner" required></textarea>
                                    </div>
                                </div>
                                <div class="js-form-error mt-3"></div>
                            </div>
                            <div class="modal-footer"><button type="button" class="dv-btn sm light" data-dismiss="modal">Cancel</button><button type="submit" class="dv-btn sm" data-id="${a.id}">Publish band</button></div>`);
                        $('#reviewSubmission').modal('show');
                    });
                    $(app).on('change', '.js-criterion', function () {
                        const vals = $('.js-criterion').map((_, el) => Number(el.value)).get();
                        $('.js-band-preview').text(fmtBand(roundBand(vals.reduce((s, v) => s + v, 0) / vals.length)));
                    });
                    $(app).on('submit', '#review-form', function (e) {
                        e.preventDefault();
                        if (!this.comment.value.trim()) { $(this).find('.js-form-error').html('<div class="dv-alert error mb-0">Please add a comment for the learner.</div>'); return; }
                        const id = $(this).find('[data-id]').data('id');
                        const criteria = {};
                        $('.js-criterion').each(function () { criteria[this.name] = Number(this.value); });
                        state.reviews[id] = { criteria, comment: this.comment.value.trim() };
                        save('dv_reviews', state.reviews);
                        $('#reviewSubmission').one('hidden.bs.modal', () => { route(); toast('Band published to the learner.'); }).modal('hide');
                    });
                    if (state.openReview) { $(`[data-review="${state.openReview}"]`).first().trigger('click'); state.openReview = null; }
                },
            };
        }

        function pageUsers() {
            const accounts = allAccounts();
            const list = accounts.filter(u => u.role === 'learner').map(u => ({ name: u.name, email: u.email, img: u.avatar, plan: u.plan || 'Free', target: u.target, joined: u.joined || '2026-01-01', tests: attemptsOf(u.email).length, role: 'Learner' }))
                .concat(LEARNERS.map(l => Object.assign({ role: 'Learner' }, l)))
                .concat(accounts.filter(u => u.role === 'admin').map(u => ({ name: u.name, email: u.email, img: u.avatar, plan: 'Staff', target: null, joined: u.joined || '2025-01-10', tests: 0, role: 'Admin' })));
            const planKey = u => u.plan === 'Premium' ? 'premium' : u.plan === 'Staff' ? 'staff' : 'free';
            const count = k => list.filter(u => planKey(u) === k).length;
            return {
                html: page('Users', ['Admin', 'Users'], `
<div class="dv-section">
    <div class="container">
        ${sectionHead('People', 'Users', 'Learner and staff accounts. Premium learners can access every test in the catalog.', '<button class="dv-btn" data-toggle="modal" data-target="#addUser"><i class="fa fa-user-plus"></i>Add user</button>')}
        <div class="row">
            ${stat('Total accounts', list.length, 'fa-users', '', 'in this list')}
            ${stat('Premium', count('premium'), 'fa-diamond', 'yellow', trendUp('4.2%') + ' conversion')}
            ${stat('Free', count('free'), 'fa-user', 'soft', 'learners')}
            ${stat('Staff', count('staff'), 'fa-shield', 'navy', 'administrators')}
        </div>
        <div class="dv-box flat">
            <div class="mb-4">${tabsFilter('plan', [['all', 'All', list.length], ['premium', 'Premium', count('premium')], ['free', 'Free', count('free')], ['staff', 'Staff', count('staff')]], 'all')}</div>
            <div class="table-responsive">
                <table class="dv-table">
                    <thead><tr><th>User</th><th>Role</th><th>Plan</th><th>Target</th><th>Attempts</th><th>Joined</th><th>Status</th></tr></thead>
                    <tbody data-searchable>${list.map(u => `
                        <tr data-row data-plan="${planKey(u)}">
                            <td><div class="dv-person"><div class="dv-avatar"><img src="assets/img/${u.img || 'member_0.jpg'}" alt=""></div><div><div class="name">${esc(u.name)}</div><div class="sub">${esc(u.email)}</div></div></div></td>
                            <td><span class="dv-tag ${u.role === 'Admin' ? 'navy' : 'soft'}">${u.role}</span></td>
                            <td>${u.plan === 'Premium' ? '<i class="fa fa-diamond mr-1" style="color:#c9a400"></i>' : ''}${esc(u.plan)}</td>
                            <td>${fmtBand(u.target)}</td>
                            <td>${u.tests}</td>
                            <td class="text-nowrap">${fmtDate(u.joined)}</td>
                            <td class="text-nowrap"><span class="dv-dot" style="background:#1fb36b"></span>Active</td>
                        </tr>`).join('')}
                        <tr data-empty><td colspan="7" class="dv-empty">No users match.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
${formModal('addUser', 'Add user', `
    <div class="row">
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">Full name</label><input class="dv-input" name="name" required></div></div>
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">E-mail</label><input type="email" class="dv-input" name="email" required></div></div>
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">Temporary password</label><input class="dv-input" name="password" value="welcome123" required></div></div>
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">Role</label><select class="dv-input" name="role"><option value="learner">Learner</option><option value="admin">Admin</option></select></div></div>
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">Plan</label><select class="dv-input" name="plan"><option>Free</option><option>Premium</option></select></div></div>
        <div class="col-md-6"><div class="dv-field"><label class="dv-label">Target band</label><select class="dv-input" name="target">${[6, 6.5, 7, 7.5, 8].map(b => `<option value="${b}">${fmtBand(b)}</option>`).join('')}</select></div></div>
    </div>`)}`),
                init() {
                    bindFilters();
                    bindModalForm('addUser', f => {
                        const email = f.email.value.trim();
                        if (!/^\S+@\S+\.\S+$/.test(email)) return 'Please enter a valid e-mail address.';
                        if (allAccounts().some(u => norm(u.email) === norm(email))) return 'The e-mail has already been taken.';
                        state.users.push({ name: f.name.value.trim(), email, password: f.password.value, role: f.role.value, plan: f.role.value === 'admin' ? 'Staff' : f.plan.value, target: Number(f.target.value), avatar: 'member_9.jpg', joined: todayIso(), examType: 'Academic' });

                        toast(`${esc(f.name.value.trim())} can now sign in with ${esc(email)}.`);
                    });
                },
            };
        }

        /* =================================================================
           Router
        ================================================================= */
        const ROUTES = [
            [/^\/login$/, pageLogin, 'guest'],
            [/^\/register$/, pageRegister, 'guest'],
            [/^\/forgot$/, pageForgot, 'guest'],
            [/^\/home$/, pageHome, 'learner'],
            [/^\/catalog$/, pageCatalog],
            [/^\/test\/(\d+)$/, pageTest],
            [/^\/material$/, pageMaterial],
            [/^\/material\/(\d+)$/, pageMaterialSingle],
            [/^\/exam\/listening\/(\d+)$/, pageListening],
            [/^\/exam\/reading\/(\d+)$/, pageReading],
            [/^\/exam\/writing\/(\d+)$/, pageWriting],
            [/^\/exam\/speaking\/(\d+)$/, pageSpeaking],
            [/^\/result\/(\w+)$/, pageResult],
            [/^\/results$/, pageResults, 'learner'],
            [/^\/profile$/, pageProfile],
            [/^\/admin$/, pageAdmin, 'admin'],
            [/^\/admin\/questions$/, pageQuestions, 'admin'],
            [/^\/admin\/tests$/, pageTests, 'admin'],
            [/^\/admin\/submissions$/, pageSubmissions, 'admin'],
            [/^\/admin\/users$/, pageUsers, 'admin'],
        ];

        function cleanup() {
            state.timers.forEach(clearInterval);
            state.timers = [];
            state.charts.forEach(c => c.destroy());
            state.charts = [];
            $(app).off();
            app.className = '';
            $('.modal').modal('hide');
            $('.modal-backdrop').remove();
            $('body').removeClass('modal-open').css('padding-right', '');
        }

        function route() {
            const path = location.hash.startsWith('#/') ? location.hash.slice(1) : '/login';
            if (path === '/logout') { state.session = null; save('dv_session', null); return go('/login'); }
            const home = isAdmin() ? '/admin' : '/home';
            const match = ROUTES.map(r => [r, r[0].exec(path)]).find(x => x[1]);
            if (!match) return go(state.session ? home : '/login');
            const [[, render, guard], m] = match;
            if (guard === 'guest' && currentUser()) return go(home);
            if (guard !== 'guest' && !currentUser()) return go('/login');
            if (guard === 'learner' && isAdmin()) return go('/admin');
            if (guard === 'admin' && !isAdmin()) return go('/home');

            cleanup();
            const view = render(m[1]);
            if (!view) return;
            document.body.className = (view.layout === 'exam' ? 'exam-mode ' : '') + (view.bodyClass || '');
            app.innerHTML = view.html;
            window.scrollTo(0, 0);
            if (view.layout !== 'exam') bindChrome();
            if (view.init) view.init();
        }

        $(document).on('click', 'a[href="#"]', e => e.preventDefault());
        window.addEventListener('hashchange', () => { if (!location.hash || location.hash.startsWith('#/')) route(); });
        route();
    });
    </script>
</body>

</html>
