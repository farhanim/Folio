                    esriLayer(18).addTo(map);
                    var g = L.featureGroup();
                    L.geoJson(pipelineGeoJson(p.id), { style: { color: MAP_HEX[a.map_status], opacity: 1, weight: 4 } }).addTo(g);
                    [p.from_platform, p.to_platform].forEach(function (pid) {
                        var pl = byId('platforms', pid);
                        if (pl) L.circleMarker([pl.latitude, pl.longitude], { radius: 7, fillColor: '#DA251C', color: '#fff', weight: 3, fillOpacity: 1 })
                            .bindTooltip(pl.name, { permanent: true, direction: 'right', offset: [8, 0], className: 'plat-label' }).addTo(g);
                    });
                    events.forEach(function (e) {
                        L.circleMarker([e.rec.latitude, e.rec.longitude], { radius: 6, fillColor: e.kind === 'Incident' ? '#ffd21f' : '#0ca30c', color: '#fff', weight: 2, fillOpacity: 1 })
                            .bindTooltip(e.kind + ' · ' + fmtDate(e.date), { direction: 'top', className: 'event-label' })
                            .bindPopup(leakPopup(e.rec, e.kind === 'Incident' ? 'incident_leakages' : 'repair_leakages')).addTo(g);
                    });
                    g.addTo(map);
                    map.fitBounds(g.getBounds(), { padding: [40, 40] });

                    Viz.mount('chart-ili', 'bars', {
                        name: 'ILI result', unit: '%', digits: 1, yMax: 60, thresholds: ILI_REFS,
                        data: (a.ili_results || []).map(function (d) {
                            return { label: fmtNum(d.log_distance / 1000, 1) + ' km', value: d.ili_result, tip: 'Log distance ' + fmtNum(d.log_distance, 0) + ' m' };
                        })
                    });
                    Viz.mount('chart-cr', 'line', {
                        name: 'Corrosion rate', unit: 'mpy', digits: 2, thresholds: CR_REFS,
                        data: crs.map(function (x) { return { date: x.timestamp, value: x.corrosion_rate }; }).filter(function (d) { return d.value !== null; })
                    });
                    Viz.mount('chart-pg', 'line', {
                        name: 'Routine pigging', unit: '%', digits: 0, yMax: 100, thresholds: PIG_REFS,
                        data: pgs.map(function (x) { return { date: x.timestamp, value: x.pct_routine_pigging }; }).filter(function (d) { return d.value !== null; })
                    });
                }
            });
        }

        function pagePipelineForm(id, values, errors) {
            var obj = id ? byId('pipelines', id) : null;
            if (id && !obj) { go('/equipments/pipelines'); return; }
            errors = errors || {};
            var v = values || (obj ? {
                pipeline_id: obj.pipeline_id, description: obj.description, from_platform: obj.from_platform, to_platform: obj.to_platform,
                year_of_built: inputVal(obj.year_of_built), operation_status: obj.operation_status, service: obj.service,
                length: inputNum(obj.length), nominal_pipe_od: inputNum(obj.nominal_pipe_od), risk_mgmt_criteria: obj.risk_mgmt_criteria,
                recom_pigging_freq: obj.recom_pigging_freq, recom_pig: obj.recom_pig, chemical_type: obj.chemical_type
            } : {
                pipeline_id: '', description: '', from_platform: '', to_platform: '', year_of_built: '', operation_status: 'On Service',
                service: '', length: '', nominal_pipe_od: '', risk_mgmt_criteria: 'IC-I', recom_pigging_freq: '', recom_pig: '', chemical_type: ''
            });
            var inner =
                section('Identity & route') +
                field({ name: 'pipeline_id', label: 'Pipeline identifier', required: true, maxlength: 128, value: v.pipeline_id, error: errors.pipeline_id, placeholder: 'e.g. PL-SPK-TJ-03' }) +
                field({ name: 'operation_status', label: 'Operation status', type: 'select', required: true, choices: OP_STATUS_CHOICES, value: v.operation_status }) +
                field({ name: 'from_platform', label: 'From platform', type: 'select', required: true, blank: true, blankLabel: 'Select platform…', choices: platformChoices(), value: v.from_platform }) +
                field({ name: 'to_platform', label: 'To platform', type: 'select', required: true, blank: true, blankLabel: 'Select platform…', choices: platformChoices(), value: v.to_platform }) +
                field({ name: 'description', label: 'Description', type: 'textarea', rows: 3, value: v.description, width: 12 }) +
                section('Design') +
                field({ name: 'service', label: 'Service', type: 'select', blank: true, choices: PIPE_SERVICE_CHOICES, value: v.service, width: 4 }) +
                field({ name: 'nominal_pipe_od', label: 'Nominal pipe OD', type: 'number', step: 'any', unit: 'in', value: v.nominal_pipe_od, width: 4 }) +
                field({ name: 'length', label: 'Length', type: 'number', step: 'any', required: true, unit: 'ft', value: v.length, width: 4 }) +
                field({ name: 'year_of_built', label: 'Year built', type: 'number', value: v.year_of_built, width: 4 }) +
                field({ name: 'risk_mgmt_criteria', label: 'Risk management criteria', type: 'select', required: true, choices: RISK_MGMT_CRITERIA_CHOICES, value: v.risk_mgmt_criteria, width: 4 }) +
                field({ name: 'chemical_type', label: 'Chemical type', type: 'select', blank: true, choices: PIPE_CHEMICAL_TYPE_CHOICES, value: v.chemical_type, width: 4 }) +
                section('Maintenance & geometry') +
                field({ name: 'recom_pigging_freq', label: 'Recommended pigging frequency', type: 'select', blank: true, choices: PIGGING_FREQ_CHOICES, value: v.recom_pigging_freq, width: 4 }) +
                field({ name: 'recom_pig', label: 'Recommended pig', type: 'select', blank: true, choices: PIG_CHOICES, value: v.recom_pig, width: 4 }) +
                field({ name: 'kml', label: 'Route KML', type: 'file', accept: '.kml', current: obj && obj.kml, currentUrl: obj && mediaUrl(obj.kml), error: errors.kml, width: 4,
                    help: 'Optional. Try <a href="assets/media/kml/sample_pipeline.kml" download>sample_pipeline.kml</a>.' });
            render(layout({
                title: obj ? 'Edit Pipeline' : 'Add New Pipeline',
                sub: obj ? 'Update the details of ' + esc(obj.pipeline_id) + '.' : 'Register a new pipeline between two platforms.',
                crumbs: [['Equipments', '/equipments/'], ['Pipelines', '/equipments/pipelines'], [obj ? obj.pipeline_id : 'New']]
            }, '<div class="row"><div class="col-xl-9">' + formCard('pipeline-form', 'Pipeline Form', 'mdi-pipe', inner, obj ? '/equipments/pipeline/' + obj.id : '/equipments/pipelines') + '</div></div>'), {
                title: 'Pipeline',
                after: function () {
                    bindForm('#pipeline-form', function (data, files) {
                        var pid = (data.pipeline_id || '').trim();
                        var dup = db.pipelines.some(function (p) { return p.pipeline_id === pid && (!obj || p.id !== obj.id); });
                        if (dup) { pagePipelineForm(id, data, { pipeline_id: 'Pipeline with this Pipeline identifier already exists.' }); return; }
                        var kmlPromise = files.kml ? readText(files.kml) : Promise.resolve(null);
                        kmlPromise.then(function (text) {
                            var coords = text ? parseKml(text) : null;
                            if (files.kml && !coords) { pagePipelineForm(id, data, { kml: 'No LineString coordinates found in this KML file.' }); return; }
                            var target = obj || { id: nextId('pipelines'), created_at: nowIso(), kml: null, kml_coords: null };
                            target.pipeline_id = pid;
                            target.description = data.description || '';
                            target.from_platform = Number(data.from_platform);
                            target.to_platform = Number(data.to_platform);
                            target.year_of_built = toNum(data.year_of_built);
                            target.operation_status = data.operation_status;
                            target.service = data.service || null;
                            target.length = toNum(data.length) || 0;
                            target.nominal_pipe_od = toNum(data.nominal_pipe_od);
                            target.risk_mgmt_criteria = data.risk_mgmt_criteria;
                            target.recom_pigging_freq = data.recom_pigging_freq || null;
                            target.recom_pig = data.recom_pig || null;
                            target.chemical_type = data.chemical_type || null;
                            if (coords) { target.kml = storeUpload('kml', files.kml); target.kml_coords = coords; }
                            else if (data['kml-clear']) { target.kml = null; target.kml_coords = null; }
                            target.updated_at = nowIso();
                            if (!obj) db.pipelines.push(target);
                            saveDb();
                            goWith(obj ? '/equipments/pipeline/' + obj.id : '/equipments/pipelines', obj ? 'Pipeline updated' : 'Pipeline created');
                        });
                    });
                }
            });
        }

        function pagePipelineDelete(id) {
            var p = byId('pipelines', id);
            if (!p) { go('/equipments/pipelines'); return; }
            confirmDelete({ title: 'Delete Pipeline', crumbs: [['Equipments', '/equipments/'], ['Pipelines', '/equipments/pipelines'], [p.pipeline_id, '/equipments/pipeline/' + p.id], ['Delete']] },
                'pipeline', '<b>' + esc(p.pipeline_id) + '</b> with all its ILI, corrosion, pigging and leak records', function () {
                    deletePipelineCascade(p.id);
                    saveDb();
                    goWith('/equipments/pipelines', 'Pipeline deleted');
                });
        }

        /* =====================================================================
         * Pages: user privileges
         * ===================================================================== */
        // Module access per group, as in context_processors.get_navbar_menu()
        var ACCESS = [
            ['Dashboard', { Admin: true, 'IT Dept': true, Viewer: true }],
            ['Pipeline Metrics', { Admin: true, 'IT Dept': false, Viewer: false }],
            ['Equipments', { Admin: true, 'IT Dept': true, Viewer: false }],
            ['User Privileges', { Admin: true, 'IT Dept': false, Viewer: false }],
            ['Edit highlight tasks', { Admin: true, 'IT Dept': false, Viewer: false }]
        ];

        function pageUsers() {
            var users = _.sortBy(db.users, 'full_name');
            var byGroup = _.countBy(users, 'group');
            var rows = users.map(function (u) {
                return '<tr>' +
                    '<td><div class="d-flex align-items-center" style="gap:10px"><span class="avatar sm" style="background:' + (u.group === 'Admin' ? 'var(--brand)' : u.group === 'IT Dept' ? 'var(--accent)' : '#7b8597') + '">' + esc(initials(u.full_name)) + '</span>' +
                    '<div><div class="strong">' + esc(u.full_name) + '</div><div class="sub">@' + esc(u.username) + '</div></div></div></td>' +
                    '<td>' + esc(u.email) + '</td>' +
                    '<td><span class="tag ' + (u.group === 'Admin' ? 'tag-brand' : u.group === 'IT Dept' ? 'tag-accent' : '') + '">' + esc(u.group) + '</span></td>' +
                    '<td>' + (u.is_active ? '<span class="st st-good"><i class="mdi mdi-check-circle"></i>Active</span>' : '<span class="st st-none"><i class="mdi mdi-cancel"></i>Inactive</span>') + '</td>' +
                    '<td data-order="' + u.last_login + '">' + fmtDateTime(u.last_login) + '<div class="sub">' + daysAgo(u.last_login) + '</div></td>' +
                    '<td><div class="actions">' + editDelete('/admin/user', u.id) + '</div></td>' +
                    '</tr>';
            }).join('');
            var groups = ['Admin', 'IT Dept', 'Viewer'];
            var matrix = '<table class="table tablex matrix mb-0"><thead><tr><th>Module</th>' + groups.map(function (g) { return '<th>' + g + '</th>'; }).join('') + '</tr></thead><tbody>' +
                ACCESS.map(function (r) {
                    return '<tr><td>' + r[0] + '</td>' + groups.map(function (g) {
                        return '<td>' + (r[1][g] ? '<i class="mdi mdi-check-circle yes" title="Allowed"></i><span class="sr-only">Allowed</span>' : '<i class="mdi mdi-minus-circle-outline no" title="No access"></i><span class="sr-only">No access</span>') + '</td>';
                    }).join('') + '</tr>';
                }).join('') + '</tbody></table>';
            render(layout({
                title: 'User Privileges',
                sub: 'Manage who can access PIMS and which modules each group can use.',
                crumbs: [['User Privileges']],
                actions: btn('/admin/user/add', 'mdi-account-plus-outline', 'Add User')
            },
                '<div class="row tight">' +
                '<div class="col-sm-6 col-xl-3">' + stat('mdi-account-group-outline', 'accent', 'Users', users.length, users.filter(function (u) { return u.is_active; }).length + ' active') + '</div>' +
                '<div class="col-sm-6 col-xl-3">' + stat('mdi-shield-crown-outline', 'brand', 'Admin', byGroup.Admin || 0, 'full access') + '</div>' +
                '<div class="col-sm-6 col-xl-3">' + stat('mdi-laptop', 'accent', 'IT Dept', byGroup['IT Dept'] || 0, 'dashboard & equipments') + '</div>' +
                '<div class="col-sm-6 col-xl-3">' + stat('mdi-eye-outline', 'accent', 'Viewer', byGroup.Viewer || 0, 'dashboard only') + '</div>' +
                '</div>' +
                '<div class="row tight"><div class="col-xl-8">' +
                tableCard('dataTables', users.length + ' users', '<th>User</th><th>Email</th><th>Group</th><th>Status</th><th>Last login</th><th class="no-sort">Action</th>', rows) +
                '</div><div class="col-xl-4">' + card('Group Access Matrix', 'mdi-shield-key-outline', matrix, { flush: true }) + '</div></div>'
            ), { title: 'User Privileges' });
        }

        function pageUserForm(id, values, errors) {
            var obj = id ? byId('users', id) : null;
            if (id && !obj) { go('/admin'); return; }
            errors = errors || {};
            var v = values || (obj ? { full_name: obj.full_name, username: obj.username, email: obj.email, group: obj.group, is_active: obj.is_active }
                : { full_name: '', username: '', email: '', group: 'Viewer', is_active: true });
            var inner =
                field({ name: 'full_name', label: 'Full name', required: true, value: v.full_name }) +
                field({ name: 'username', label: 'Username', required: true, value: v.username, error: errors.username, help: 'Used to sign in (LDAP account name).' }) +
                field({ name: 'email', label: 'Email', type: 'email', required: true, value: v.email }) +
                field({ name: 'group', label: 'Group', type: 'select', required: true, choices: GROUP_CHOICES, value: v.group, help: 'Determines which modules are visible.' }) +
                field({ name: 'is_active', label: 'Account active', type: 'checkbox', value: v.is_active, width: 12 });
            render(layout({
                title: obj ? 'Edit User' : 'Add User',
                crumbs: [['User Privileges', '/admin'], [obj ? obj.full_name : 'New']]
            }, '<div class="row"><div class="col-xl-8">' + formCard('user-form', 'User Account', 'mdi-account-outline', inner, '/admin') + '</div></div>'), {
                title: 'User',
                after: function () {
                    bindForm('#user-form', function (data) {
                        var uname = (data.username || '').trim();
                        if (db.users.some(function (u) { return u.username === uname && (!obj || u.id !== obj.id); })) {
                            pageUserForm(id, data, { username: 'A user with that username already exists.' });
                            return;
                        }
                        var target = obj || { id: nextId('users'), last_login: null, date_joined: nowIso() };
                        target.full_name = data.full_name;
                        target.username = uname;
                        target.email = data.email;
                        target.group = data.group;
                        target.is_active = !!data.is_active;
                        if (!obj) db.users.push(target);
                        saveDb();
                        goWith('/admin', obj ? 'User updated' : 'User created');
                    });
                }
            });
        }

        function pageUserDelete(id) {
            var u = byId('users', id);
            if (!u) { go('/admin'); return; }
            confirmDelete({ title: 'Delete User', crumbs: [['User Privileges', '/admin'], [u.full_name], ['Delete']] }, 'user', '<b>' + esc(u.full_name) + '</b> (@' + esc(u.username) + ')', function () {
                removeWhere('users', function (x) { return x.id === u.id; });
                saveDb();
                goWith('/admin', 'User deleted');
            });
        }

        /* =====================================================================
         * Boot
         * ===================================================================== */
        // Re-clicking a link to the current page re-renders it, like a server round trip.
        $(document).on('click', 'a[href^="#/"]', function () {
            if (this.getAttribute('href') === location.hash) setTimeout(router, 0);
        });
        $(document).on('click', '[data-action="reset-demo"]', function () {
            if (!window.confirm('Reset all demo data to the original dummy dataset?')) return;
            db = seedDb();
            saveDb();
            goWith('/dashboard/', 'Demo data has been reset');
        });
        window.addEventListener('hashchange', router);
        window.addEventListener('resize', _.debounce(function () {
            if ($.fn.dataTable) $.fn.dataTable.tables({ visible: true, api: true }).columns.adjust();
        }, 150));

        loadDb();
        router();
    })();
    </script>
</body>
</html>
