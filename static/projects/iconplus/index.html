<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICON+ Analytics</title>
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/vendor/mapbox-gl.css">
    <style>
        /* =====================================================================
           FONTS
           ===================================================================== */
        @font-face { font-family: 'Poppins'; font-weight: 400; font-style: normal; src: url('assets/fonts/poppins-400.woff2') format('woff2'); }
        @font-face { font-family: 'Poppins'; font-weight: 500; font-style: normal; src: url('assets/fonts/poppins-500.woff2') format('woff2'); }
        @font-face { font-family: 'Poppins'; font-weight: 600; font-style: normal; src: url('assets/fonts/poppins-600.woff2') format('woff2'); }

        /* =====================================================================
           DESIGN TOKENS (brand colours from the original style.css)
           ===================================================================== */
        :root {
            --bg: #edf2f8;
            --surface: #ffffff;
            --surface-2: #f5f7fb;
            --navy: #292d52;
            --navy-deep: #202445;
            --navy-hover: #252849;
            --navy-line: rgba(255, 255, 255, .08);
            --accent: #ff6661;
            --accent-soft: #ff876b;
            --primary: #2a78d6;
            --primary-hover: #256abf;
            --primary-soft: #e8f1fc;
            --ink: #1d2140;
            --ink-2: #52576f;
            --muted: #868ba3;
            --line: #e3e8f0;
            --grid: #e9ecf2;
            --axis: #c3c7d4;
            --track: #e6edf8;

            /* chart series (validated categorical order) */
            --s1: #2a78d6;
            --s2: #eb6834;
            --s3: #1baf7a;

            /* status (reserved: always shown with icon + label) */
            --good: #0ca30c;
            --good-ink: #006300;
            --warning: #fab219;
            --serious: #ec835a;
            --critical: #d03b3b;

            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 8px rgba(16, 24, 40, .05);
            --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
            --topbar-h: 64px;
            --sidebar-w: 248px;
            --sidebar-w-collapsed: 76px;
        }

        html, body { min-height: 100%; }
        body {
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 14px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6 { color: var(--ink); font-weight: 600; }
        a { color: var(--primary); }
        a:hover { color: var(--primary-hover); text-decoration: none; }
        .tnum { font-variant-numeric: tabular-nums; }
        .text-muted-x { color: var(--muted) !important; }
        .text-ink-2 { color: var(--ink-2) !important; }
        .fw-500 { font-weight: 500; }
        .fw-600 { font-weight: 600; }
        .small-x { font-size: 12.5px; }
        [hidden] { display: none !important; }

        /* Bootstrap overrides for consistency */
        .btn { border-radius: var(--radius-sm); font-weight: 500; font-size: 13.5px; padding: 8px 16px; }
        .btn-sm { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover, .btn-primary:focus { background: var(--primary-hover); border-color: var(--primary-hover); }
        .btn-light-x { background: #fff; border: 1px solid var(--line); color: var(--ink); }
        .btn-light-x:hover { background: var(--surface-2); color: var(--ink); }
        .btn-light-x.active { background: var(--primary-soft); border-color: #bcd6f5; color: var(--primary-hover); }
        .btn-danger-x { background: var(--critical); border-color: var(--critical); color: #fff; }
        .btn-danger-x:hover { background: #b83232; color: #fff; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .form-control, .custom-select { border-radius: var(--radius-sm); border-color: var(--line); font-size: 14px; height: 40px; color: var(--ink); }
        .form-control:focus, .custom-select:focus { border-color: #8fb8ea; box-shadow: 0 0 0 3px rgba(42, 120, 214, .15); }
        .form-control-sm, .custom-select-sm { height: 34px; font-size: 13px; border-radius: 8px; }
        label { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
        .form-text { color: var(--muted); font-size: 12px; }
        .dropdown-menu { border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; font-size: 13.5px; }
        .dropdown-item { border-radius: 8px; padding: 8px 12px; color: var(--ink); }
        .dropdown-item .fa { width: 18px; color: var(--muted); margin-right: 8px; }
        .dropdown-item:hover { background: var(--surface-2); }
        .dropdown-divider { margin: 6px 0; border-color: var(--line); }

        /* =====================================================================
           SHELL: topbar + sidebar + main
           ===================================================================== */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
            background: #fff; z-index: 1030;
            box-shadow: 0 1px 0 var(--line), 2px 0 11px rgba(0, 0, 0, .05);
            display: flex; align-items: center; gap: 16px; padding-right: 20px;
        }
        .topbar-brand { width: var(--sidebar-w); flex: none; display: flex; align-items: center; gap: 10px; padding-left: 16px; transition: width .15s ease; }
        .topbar-brand img { width: 60px; height: 35px; }
        .brand-name { font-weight: 600; font-size: 15px; color: var(--navy); letter-spacing: .01em; white-space: nowrap; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2);
            display: inline-flex; align-items: center; justify-content: center; position: relative; font-size: 16px; cursor: pointer;
        }
        .icon-btn:hover, .icon-btn:focus { background: var(--surface-2); color: var(--ink); outline: none; }
        .dot-badge { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; }
        .topbar-search, .search-box { flex: 1; max-width: 440px; position: relative; }
        .topbar-search .fa, .search-box .fa { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .topbar-search input, .search-box input { padding-left: 38px; background: var(--surface-2); border-color: transparent; }
        .topbar-search input:focus, .search-box input:focus { background: #fff; border-color: #8fb8ea; }
        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
        .data-chip { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; white-space: nowrap; }
        .data-chip .live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
        .user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; }
        .user-chip:hover, .user-chip:focus { background: var(--surface-2); outline: none; }
        .user-chip .who { text-align: left; line-height: 1.2; }
        .user-chip .who b { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
        .user-chip .who span { font-size: 11.5px; color: var(--muted); }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
        .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
        .avatar.lg { width: 56px; height: 56px; font-size: 18px; }
        .notif-menu { width: 340px; padding: 0; }
        .notif-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
        .notif-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--ink); white-space: normal; }
        .notif-item:hover { background: var(--surface-2); color: var(--ink); }
        .notif-item .t { font-size: 13px; line-height: 1.4; }
        .notif-item .when { font-size: 11.5px; color: var(--muted); }

        .sidebar {
            position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w);
            background: var(--navy); color: #dfdfdf; z-index: 1020;
            display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
            transition: width .15s ease, transform .2s ease;
            box-shadow: 2px 0 11px rgba(0, 0, 0, .04);
        }
        .sidebar-section { padding: 20px 24px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .42); white-space: nowrap; }
        .nav-x {
            display: flex; align-items: center; gap: 14px; height: 44px; margin: 2px 12px; padding: 0 12px;
            border-radius: 10px; color: #dfdfdf; font-size: 14px; white-space: nowrap; position: relative;
        }
        .nav-x .fa { width: 20px; text-align: center; font-size: 16px; color: rgba(255, 255, 255, .62); flex: none; }
        .nav-x:hover { background: var(--navy-hover); color: var(--accent); }
        .nav-x:hover .fa { color: var(--accent); }
        .nav-x.active { background: rgba(255, 102, 97, .13); color: #fff; }
        .nav-x.active .fa { color: var(--accent); }
        .nav-x.active::before { content: ''; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
        .nav-badge { margin-left: auto; font-size: 11px; background: rgba(255, 255, 255, .1); color: #fff; padding: 1px 8px; border-radius: 999px; }
        .sidebar-footer { margin-top: auto; padding: 16px 24px; border-top: 1px solid var(--navy-line); font-size: 12px; color: rgba(255, 255, 255, .6); white-space: nowrap; }
        .sidebar-footer .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 8px; }

        .main { margin-left: var(--sidebar-w); padding: calc(var(--topbar-h) + 28px) 32px 28px; min-height: 100vh; transition: margin .15s ease; }

        @media (min-width: 992px) {
            body.sidebar-collapsed .topbar-brand { width: var(--sidebar-w-collapsed); }
            body.sidebar-collapsed .brand-name { display: none; }
            body.sidebar-collapsed .sidebar { width: var(--sidebar-w-collapsed); }
            body.sidebar-collapsed .nav-label,
            body.sidebar-collapsed .nav-badge,
            body.sidebar-collapsed .sidebar-footer .txt { display: none; }
            body.sidebar-collapsed .sidebar-section { font-size: 0; padding: 0; height: 1px; margin: 14px 20px; background: var(--navy-line); }
            body.sidebar-collapsed .nav-x { justify-content: center; padding: 0; }
            body.sidebar-collapsed .sidebar-footer { padding: 16px 0; text-align: center; }
            body.sidebar-collapsed .sidebar-footer .status-dot { margin: 0; }
            body.sidebar-collapsed .main { margin-left: var(--sidebar-w-collapsed); }
        }
        @media (max-width: 991.98px) {
            .topbar-brand { width: auto; }
            .topbar-search, .data-chip, .user-chip .who { display: none !important; }
            .sidebar { transform: translateX(-100%); }
            body.sidebar-open .sidebar { transform: none; }
            body.sidebar-open .backdrop { display: block; }
            .main { margin-left: 0; padding: calc(var(--topbar-h) + 20px) 16px 20px; }
        }
        .backdrop { display: none; position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(16, 20, 45, .4); z-index: 1010; }

        /* =====================================================================
           LAYOUT PRIMITIVES
           ===================================================================== */
        .row-g { display: flex; flex-wrap: wrap; margin: -12px; }
        .row-g > [class*="col"] { padding: 12px; }
        .section { margin-bottom: 24px; }

        .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
        .crumbs a { color: var(--muted); }
        .crumbs a:hover { color: var(--primary); }
        .crumbs .sep { margin: 0 8px; opacity: .6; }
        .page-title { font-size: 24px; font-weight: 600; margin: 0; line-height: 1.3; }
        .page-sub { color: var(--ink-2); margin: 4px 0 0; max-width: 720px; }
        .page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
        .filter-bar .filter { display: flex; align-items: center; gap: 8px; }
        .filter-bar .filter label { margin: 0; font-size: 12.5px; color: var(--muted); }
        .filter-bar .custom-select { width: auto; min-width: 160px; }
        .filter-bar .spacer { flex: 1; }

        .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(16, 24, 40, .04); display: flex; flex-direction: column; }
        .row-g > [class*="col"] > .panel:only-child { height: 100%; }   /* equal-height cards in a row; stacked cards keep their own height */
        .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 0; }
        .panel-title { font-size: 15px; font-weight: 600; margin: 0; }
        .panel-sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
        .panel-body { padding: 16px 20px 20px; flex: 1; }
        .panel-body.flush { padding: 12px 0 0; }
        .panel-foot { padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13px; }

        /* KPI tiles */
        .kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
        .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .kpi-label { font-size: 13px; color: var(--ink-2); }
        .kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); font-size: 15px; }
        .kpi-value { font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
        .kpi-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 4px; min-height: 36px; }
        .kpi-foot .delta-note { display: block; margin-top: 2px; }
        .delta { font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        .delta.good { color: var(--good-ink); }
        .delta.bad { color: var(--critical); }
        .delta.flat { color: var(--ink-2); }
        .delta-note { color: var(--muted); font-weight: 400; }

        /* Stat mini */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-mini { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; }
        .stat-mini .v { font-size: 20px; font-weight: 600; line-height: 1.3; }
        .stat-mini .l { font-size: 12px; color: var(--muted); }

        /* Badges / chips / status */
        .badge-x { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
        .badge-x .dot { width: 7px; height: 7px; border-radius: 50%; }
        .badge-x.blue { background: var(--primary-soft); border-color: #cfe1f7; color: #1c5cab; }
        .badge-x.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
        .chip { border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all .12s; }
        .chip:hover { border-color: #c5cfdd; color: var(--ink); }
        .chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }
        .chip .count { opacity: .6; margin-left: 4px; }
        .tag { display: inline-block; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; margin: 0 4px 4px 0; }
        .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
        .status .fa { font-size: 14px; }
        .status.good .fa { color: var(--good); }
        .status.warning .fa { color: #d99400; }
        .status.serious .fa { color: var(--serious); }
        .status.critical .fa { color: var(--critical); }
        .status.info .fa { color: var(--primary); }

        /* Meter / bars */
        .meter { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; min-width: 80px; }
        .meter > span { display: block; height: 100%; border-radius: 999px; }
        .bar-row { margin-bottom: 14px; }
        .bar-row:last-child { margin-bottom: 0; }
        .bar-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
        .bar-row .top .val { font-weight: 500; font-variant-numeric: tabular-nums; }
        .bar-row .top .val small { color: var(--muted); font-weight: 400; margin-left: 4px; }
        .bar-track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; background: var(--s1); transition: width .3s ease; }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        .table-x { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
        .table-x th { font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; text-align: left; }
        .table-x th.num, .table-x td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .table-x th.sortable { cursor: pointer; user-select: none; }
        .table-x th.sortable:hover { color: var(--ink); }
        .table-x td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .table-x tbody tr:last-child td { border-bottom: 0; }
        .table-x tbody tr:hover { background: #f9fbfe; }
        .table-x tr.clickable { cursor: pointer; }
        .table-x tr.selected { background: var(--primary-soft) !important; }
        .table-x .primary-cell { font-weight: 500; color: var(--ink); }
        .table-x .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

        /* Segmented control + tabs */
        .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex: none; }
        .seg button { border: 0; background: transparent; font-size: 12px; padding: 3px 10px; border-radius: 6px; color: var(--ink-2); cursor: pointer; }
        .seg button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
        .tabs-x { display: flex; gap: 20px; border-bottom: 1px solid var(--line); padding: 0 20px; overflow-x: auto; }
        .tabs-x button { border: 0; background: none; padding: 12px 0; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
        .tabs-x button:hover { color: var(--ink); }
        .tabs-x button.active { color: var(--ink); border-color: var(--accent); }

        /* Lists */
        .list-x { list-style: none; margin: 0; padding: 0; }
        .list-x > li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
        .list-x > li:first-child { padding-top: 0; }
        .list-x > li:last-child { border-bottom: 0; padding-bottom: 0; }
        .soft-icon { width: 34px; height: 34px; border-radius: 10px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
        .dl-x { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; font-size: 13.5px; }
        .dl-x dt { color: var(--muted); font-weight: 400; }
        .dl-x dd { margin: 0; text-align: right; font-weight: 500; }

        /* Charts */
        .chart { position: relative; width: 100%; }
        .chart svg { display: block; overflow: visible; }
        .chart text { font-family: inherit; fill: var(--muted); font-size: 11px; }
        .chart text.lbl { fill: var(--ink-2); font-size: 11.5px; font-weight: 500; }
        .chart text.cat { fill: var(--ink-2); font-size: 12px; }
        .chart .hit { fill: transparent; cursor: crosshair; }
        .chart .hit:focus { outline: none; }
        .chart .bar-hit { fill: transparent; cursor: pointer; }
        .chart .bar.dim { opacity: .35; }
        .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .key-line { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }
        .key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
        .viz-tip { position: fixed; pointer-events: none; z-index: 3000; background: #fff; border: 1px solid rgba(11, 11, 11, .1); box-shadow: 0 8px 24px rgba(16, 24, 40, .14); border-radius: 8px; padding: 8px 12px; font-size: 12px; min-width: 140px; }
        .viz-tip .t-head { color: var(--muted); margin-bottom: 4px; }
        .viz-tip .t-row { display: flex; align-items: center; gap: 8px; line-height: 1.7; }
        .viz-tip .t-row strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
        .viz-tip .t-row span { color: var(--ink-2); }
        .viz-tip .t-key { width: 12px; height: 2px; border-radius: 2px; flex: none; }
        .spark { display: block; }

        /* Story cards */
        .story-card { display: flex; flex-direction: column; height: 100%; overflow: hidden; color: inherit; transition: transform .15s, box-shadow .15s; }
        .story-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); color: inherit; }
        .story-cover { height: 132px; position: relative; overflow: hidden; border-radius: var(--radius) var(--radius) 0 0; }
        .story-cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }

        function viewNotFound(req) {
            renderShell('', 'Page not found', '<div class="panel"><div class="empty"><img src="assets/img/page-list-empty-state.svg" alt=""><h2>We couldn’t find that page</h2><p>The address <code>' + esc(req.path) + '</code> doesn’t match any page in ICON+ Analytics.</p><a class="btn btn-primary" href="#/">Back to dashboard</a></div></div>');

        /* =====================================================================

        function authBrand() {

        function renderAuth(title, inner) {

        function field(o) {
            return '<div class="form-group"><label for="' + o.id + '">' + esc(o.label) + '</label><input type="' + o.type + '" name="' + o.name + '" id="' + o.id + '" class="form-control" placeholder="' + esc(o.placeholder || '') + '"' + (o.value ? ' value="' + esc(o.value) + '"' : '') + (o.autofocus ? ' autofocus' : '') + ' required></div>';

        var views = {
            '/': function (req) { if (loginRequired(req)) viewDashboard(); },

            '/apps/unknown/': function () { redirect('/apps/customer-insight'); },
            '/apps/layers/': function (req) { if (loginRequired(req)) viewLayers(); },
            '/more/': function (req) { if (loginRequired(req)) viewMore(req); },

            '/accounts/login/': function (req) {
                if (currentUser()) return redirect(req.params.next || LOGIN_REDIRECT_URL);
                var next = req.params.next ? '?next=' + encodeURIComponent(req.params.next) : '';
                renderAuth('Sign in', '<h1>Welcome back</h1><p class="sub">Sign in to ICON+ Analytics to continue.</p>' +
                    '<div class="alert-x info"><i class="fa fa-info-circle"></i><span>The demo account is already filled in. Just press <b>Sign in</b>.</span></div>' +
                    '<form data-action="login" data-next="' + esc(req.params.next || '') + '" novalidate><div data-nonfield></div>' +
                    field({id: 'id_login', name: 'login', type: 'email', label: 'E-mail', placeholder: 'name@company.com', value: 'admin@something.com', autofocus: true}) +
                    field({id: 'id_password', name: 'password', type: 'password', label: 'Password', placeholder: 'Your password', value: 'incorrect'}) +
                    '<div class="d-flex justify-content-between align-items-center mb-4"><div class="custom-control custom-checkbox"><input type="checkbox" class="custom-control-input" id="id_remember" name="remember"><label class="custom-control-label mb-0" for="id_remember">Remember me</label></div>' +
                    '<a href="#/accounts/password/reset/" class="small-x">Forgot password?</a></div>' +
                    '<button class="btn btn-primary btn-block" type="submit">Sign in</button></form>' +
                    '<p class="text-center small-x text-ink-2 mt-4 mb-0">New to ICON+ Analytics? <a href="#/accounts/signup/' + next + '">Create an account</a></p>');
            },
            '/accounts/signup/': function (req) {
                if (currentUser()) return redirect(LOGIN_REDIRECT_URL);
                var next = req.params.next ? '?next=' + encodeURIComponent(req.params.next) : '';
                renderAuth('Create account', '<h1>Create your account</h1><p class="sub">Use your work e-mail. Accounts are stored in this browser only.</p>' +
                    '<form data-action="signup" data-next="' + esc(req.params.next || '') + '" novalidate><div data-nonfield></div>' +
                    field({id: 'id_name', name: 'name', type: 'text', label: 'Full name', placeholder: 'e.g. Rina Putri', autofocus: true}) +
                    field({id: 'id_email', name: 'email', type: 'email', label: 'E-mail', placeholder: 'name@company.com'}) +
                    field({id: 'id_password1', name: 'password1', type: 'password', label: 'Password', placeholder: 'At least 8 characters'}) +
                    field({id: 'id_password2', name: 'password2', type: 'password', label: 'Confirm password', placeholder: 'Repeat the password'}) +
                    '<button class="btn btn-primary btn-block" type="submit">Create account</button></form>' +
                    '<p class="text-center small-x text-ink-2 mt-4 mb-0">Already have an account? <a href="#/accounts/login/' + next + '">Sign in</a></p>');
            },
            '/accounts/logout/': function () {
                var cu = currentUser();
                if (!cu) return redirect('/');
                renderAuth('Sign out', '<h1>Sign out?</h1><p class="sub">You are signed in as <b>' + esc(primaryEmail(cu.user)) + '</b>.</p>' +
                    '<form data-action="logout"><div class="d-flex" style="gap:8px"><button class="btn btn-danger-x" type="submit" autofocus>Sign out</button><a class="btn btn-light-x" href="#/">Cancel</a></div></form>');
            },
            '/accounts/password/reset/': function () {
                renderAuth('Reset password', '<h1>Reset your password</h1><p class="sub">Enter your e-mail and we’ll send you a link to reset it.</p>' +
                    '<form data-action="password-reset" novalidate>' + field({id: 'id_email', name: 'email', type: 'email', label: 'E-mail', placeholder: 'name@company.com', autofocus: true}) +
                    '<button class="btn btn-primary btn-block" type="submit">Send reset link</button></form>' +
                    '<p class="text-center small-x mt-4 mb-0"><a href="#/accounts/login/"><i class="fa fa-arrow-left mr-1"></i> Back to sign in</a></p>');
            },
            '/accounts/password/reset/done/': function () {
                renderAuth('Check your e-mail', '<div class="soft-icon mb-3" style="width:48px;height:48px;background:var(--primary-soft);color:var(--primary);font-size:20px"><i class="fa fa-envelope-o"></i></div><h1>Check your e-mail</h1>' +
                    '<p class="sub">We have sent you an e-mail with a reset link. Please contact us if it doesn’t arrive within a few minutes.</p><a class="btn btn-primary btn-block" href="#/accounts/login/">Back to sign in</a>');
            },
            '/accounts/password/change/': function (req) {
                if (!loginRequired(req)) return;
                renderShell('more', 'Change password', pageHeader({crumbs: [{label: 'More', href: '/more'}, {label: 'Account'}], title: 'Change password', sub: 'Use at least 8 characters. Avoid common words and numbers only.'}) +
                    '<div class="row-g"><div class="col-lg-6"><div class="panel"><div class="panel-body"><form data-action="password-change" novalidate>' +
                    field({id: 'id_oldpassword', name: 'oldpassword', type: 'password', label: 'Current password', autofocus: true}) +
                    field({id: 'id_password1', name: 'password1', type: 'password', label: 'New password'}) +
                    field({id: 'id_password2', name: 'password2', type: 'password', label: 'Confirm new password'}) +
                    '<button class="btn btn-primary" type="submit">Update password</button></form></div></div></div></div>');
            },
            '/accounts/email/': function (req) {
                if (!loginRequired(req)) return;
                var u = currentUser().user;
                var rows = u.emails.map(function (e) {
                    return '<tr><td class="primary-cell">' + esc(e.email) + '</td><td>' + (e.verified ? statusHtml('good', 'Verified') : statusHtml('warning', 'Unverified')) + '</td>' +
                        '<td>' + (e.primary ? '<span class="badge-x blue">Primary</span>' : '') + '</td><td class="num"><div class="d-inline-flex" style="gap:6px">' +
                        (e.primary ? '' : '<button class="btn btn-light-x btn-sm" data-email-action="primary" data-email="' + esc(e.email) + '">Make primary</button>') +
                        (e.verified ? '' : '<button class="btn btn-light-x btn-sm" data-email-action="send" data-email="' + esc(e.email) + '">Re-send verification</button>') +
                        (e.primary ? '' : '<button class="btn btn-light-x btn-sm" data-email-action="remove" data-email="' + esc(e.email) + '"><i class="fa fa-trash-o"></i></button>') + '</div></td></tr>';
                }).join('');
                renderShell('more', 'E-mail addresses', pageHeader({crumbs: [{label: 'More', href: '/more'}, {label: 'Account'}], title: 'E-mail addresses', sub: 'The primary address is used for sign-in and notifications.'}) +
                    '<div class="row-g"><div class="col-lg-8"><div class="panel"><div class="panel-head"><h3 class="panel-title">Your addresses</h3></div><div class="panel-body flush"><div class="table-wrap"><table class="table-x"><thead><tr><th>E-mail</th><th>Status</th><th></th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div></div></div>' +
                    '<div class="col-lg-4"><div class="panel"><div class="panel-head"><h3 class="panel-title">Add an address</h3></div><div class="panel-body"><form data-action="email-add" novalidate>' +
                    field({id: 'id_email', name: 'email', type: 'email', label: 'E-mail', placeholder: 'name@company.com'}) + '<button class="btn btn-primary btn-block" type="submit">Add e-mail</button></form></div></div></div></div>');
            }
        };

        /* =====================================================================
           FORM ACTIONS
           ===================================================================== */
        function fieldError($form, name, msg) {
            var $f = $form.find('[name="' + name + '"]');
            $f.closest('.form-group').addClass('has-error');
            var $ul = $f.siblings('.errorlist');
            if (!$ul.length) $ul = $('<ul class="errorlist"></ul>').insertAfter($f);
            $ul.append($('<li>').text(msg));
        }
        function nonFieldError($form, msg) {
            $form.find('[data-nonfield]').html('<div class="alert-x" style="background:#fdecec;color:#9b2525"><i class="fa fa-times-circle"></i><span>' + esc(msg) + '</span></div>');
        }
        function validatePassword(pw, email) {
            var errors = [], local = (email || '').split('@')[0].toLowerCase();
            if (local && pw.toLowerCase().indexOf(local) >= 0) errors.push('The password is too similar to the e-mail address.');
            if (pw.length < 8) errors.push('This password is too short. It must contain at least 8 characters.');
            if (COMMON_PASSWORDS.indexOf(pw.toLowerCase()) >= 0) errors.push('This password is too common.');
            if (/^\d+$/.test(pw)) errors.push('This password is entirely numeric.');
            return errors;
        }
        var actions = {
            login: function ($f) {
                var found = findUserByEmail($f.find('[name=login]').val().trim());
                if (!found || found.user.password !== $f.find('[name=password]').val()) return nonFieldError($f, 'The e-mail address and/or password you specified are not correct.');
                login(found.index, $f.find('[name=remember]').is(':checked'));
                addMessage('Signed in as ' + displayName(found.user) + '.');
                redirect($f.data('next') || LOGIN_REDIRECT_URL);
            },
            signup: function ($f) {
                var name = $f.find('[name=name]').val().trim(), email = $f.find('[name=email]').val().trim();
                var p1 = $f.find('[name=password1]').val(), p2 = $f.find('[name=password2]').val(), ok = true;
                if (!name) { fieldError($f, 'name', 'Please enter your name.'); ok = false; }
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { fieldError($f, 'email', 'Enter a valid e-mail address.'); ok = false; }
                else if (findUserByEmail(email)) { fieldError($f, 'email', 'A user is already registered with this e-mail address.'); ok = false; }
                validatePassword(p1, email).forEach(function (e) { fieldError($f, 'password1', e); ok = false; });
                if (p1 !== p2) { fieldError($f, 'password2', 'You must type the same password each time.'); ok = false; }
                if (!ok) return;
                var users = getUsers();
                users.push({username: email.split('@')[0], name: name, role: 'Analyst', password: p1, emails: [{email: email, verified: false, primary: true}]});
                saveUsers(users);
                login(users.length - 1, false);
                addMessage('Welcome, ' + name + '! Confirmation e-mail sent to ' + email + '.');
                redirect($f.data('next') || LOGIN_REDIRECT_URL);
            },
            logout: function () {
                if (currentUser()) { logout(); dash = null; addMessage('You have signed out.'); }
                redirect('/accounts/login/');
            },
            'password-reset': function ($f) {
                var email = $f.find('[name=email]').val().trim();
                if (!findUserByEmail(email)) return fieldError($f, 'email', 'The e-mail address is not assigned to any user account.');
                redirect('/accounts/password/reset/done/');
            },
            'password-change': function ($f) {
                var cu = currentUser(), p1 = $f.find('[name=password1]').val(), ok = true;
                if ($f.find('[name=oldpassword]').val() !== cu.user.password) { fieldError($f, 'oldpassword', 'Please type your current password.'); ok = false; }
                validatePassword(p1, primaryEmail(cu.user)).forEach(function (e) { fieldError($f, 'password1', e); ok = false; });
                if (p1 !== $f.find('[name=password2]').val()) { fieldError($f, 'password2', 'You must type the same password each time.'); ok = false; }
                if (!ok) return;
                cu.user.password = p1; saveUsers(cu.users);
                addMessage('Password successfully changed.');
                redirect('/more');
            },
            'email-add': function ($f) {
                var email = $f.find('[name=email]').val().trim(), existing = findUserByEmail(email), cu = currentUser();
                if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fieldError($f, 'email', 'Enter a valid e-mail address.');
                if (existing) return fieldError($f, 'email', existing.index === cu.index ? 'This e-mail address is already associated with this account.' : 'This e-mail address is already associated with another account.');
                cu.user.emails.push({email: email, verified: false, primary: cu.user.emails.length === 0});
                saveUsers(cu.users);
                addMessage('Confirmation e-mail sent to ' + email + '.');
                route();
            }
        };
        $(document).on('click', '[data-email-action]', function () {
            var cu = currentUser(), email = $(this).data('email'), act = $(this).data('email-action');
            var target = cu.user.emails.filter(function (e) { return e.email === email; })[0];
            if (!target) return;
            if (act === 'remove') {
                if (!confirm('Remove ' + email + ' from your account?')) return;
                cu.user.emails = cu.user.emails.filter(function (e) { return e !== target; });
                addMessage('Removed e-mail address ' + email + '.');
            } else if (act === 'send') {
                addMessage('Confirmation e-mail sent to ' + email + '.');
            } else {
                var primary = cu.user.emails.filter(function (e) { return e.primary; })[0];
                if (!target.verified && primary && primary.verified) addMessage('Your primary e-mail address must be verified.');
                else { cu.user.emails.forEach(function (e) { e.primary = e === target; }); addMessage('Primary e-mail address set.'); }
            }
            saveUsers(cu.users);
            route();
        });
        $(document).on('submit', 'form[data-action]', function (e) {
            e.preventDefault();
            var $f = $(this);
            $f.find('.errorlist').remove();
            $f.find('.has-error').removeClass('has-error');
            $f.find('[data-nonfield]').empty();
            actions[$f.data('action')]($f);
        });

        /* =====================================================================
           ROUTER
           ===================================================================== */
        function parseQuery(q) {
            var params = {};
            q.split('&').forEach(function (p) {
                var kv = p.split('=');
                if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
            });
            return params;
        }
        function parseHash() {
            var h = location.hash.replace(/^#/, '') || '/', q = h.indexOf('?');
            var path = q >= 0 ? h.slice(0, q) : h;
            if (path.charAt(0) !== '/') path = '/' + path;
            if (path.charAt(path.length - 1) !== '/') path += '/';
            return {path: path, params: q >= 0 ? parseQuery(h.slice(q + 1)) : {}};
        }
        function redirect(path) { if ('#' + path === location.hash) route(); else location.hash = '#' + path; }
        function loginRequired(req) {
            if (currentUser()) return true;
            redirect('/accounts/login/?next=' + encodeURIComponent(req.path));
            return false;
        }
        function route() {
            destroyMap();
            hideTip();
            mounted = [];
            $(document).off('.radius .sites');
            $('body').removeClass('sidebar-open');
            window.scrollTo(0, 0);
            var req = parseHash(), m;
            if (views[req.path]) return views[req.path](req);
            if ((m = req.path.match(/^\/stories\/([\w-]+)\/$/))) { if (loginRequired(req)) viewStory(req, m[1]); return; }
            if ((m = req.path.match(/^\/knowledge-repo\/([\w-]+)\/$/))) { if (loginRequired(req)) viewKnowledgeItem(req, m[1]); return; }
            if (loginRequired(req)) viewNotFound(req);
        }

        // Global shell behaviour
        if (read('localStorage', 'ipa_sidebar_collapsed', false)) $('body').addClass('sidebar-collapsed');
        $(document).on('click', '[data-toggle-sidebar]', function () {
            if (window.innerWidth < 992) { $('body').toggleClass('sidebar-open'); return; }
            $('body').toggleClass('sidebar-collapsed');
            write('localStorage', 'ipa_sidebar_collapsed', $('body').hasClass('sidebar-collapsed'));
            setTimeout(function () { mountCharts(); if (activeMap) activeMap.resize(); }, 180);
        });
        $(document).on('click', '[data-close-sidebar]', function () { $('body').removeClass('sidebar-open'); });
        $(document).on('submit', '[data-search]', function (e) {
            e.preventDefault();
            var q = $(this).find('[name=q]').val().trim();
            kbState.type = 'All';
            redirect('/knowledge-repo?q=' + encodeURIComponent(q));
        });
        $(document).on('click', 'tr[data-href]', function () { redirect($(this).data('href')); });
        $(document).on('click', 'a[href="#"]', function (e) { e.preventDefault(); });

        $(window).on('hashchange', route);
        route();
    })();
    </script>
