      const product=data.products.find(item=>item.id===state.publicProductId);
      if(!product) return `${publicPageHero("Produk","Produk yang Anda cari tidak ditemukan.")}<section class="site-section"><div class="site-container"><button class="site-btn" data-public="products">Kembali ke Produk</button></div></section>`;
      return `${publicPageHero(esc(product.name),esc(sourceName(product.sourceId)+" · "+categoryName(product.categoryId)))}<section class="site-section"><div class="site-container site-detail"><img class="site-detail-image" src="${esc(product.cover)}" alt="${esc(product.name)}"><div><span class="site-eyebrow">${esc(sourceName(product.sourceId))}</span><h2>${esc(product.name)}</h2><div class="site-price">Rp ${currency(product.price)}</div><p>${esc(product.description)}</p><h3>Keuntungan</h3><ul>${(product.advantages||[]).map(item=>`<li>${esc(item)}</li>`).join("")}</ul><button class="site-btn" data-public="contact">Tanya Produk</button><button class="site-btn light" style="margin-left:8px" data-public="products">Kembali</button></div></div></section>`;
    };
    const renderPublic = () => {
      const content={home:publicHome,solutions:publicSolutions,products:publicProducts,promos:publicPromos,contact:publicContact,"product-detail":publicProductDetail}[state.publicPage]||publicHome;
      document.getElementById("root").innerHTML=`<div class="public-site">${siteHeader()}<main>${content()}</main>${siteFooter()}</div>`;
    };
    const goPublic = page => {
      state.surface="public";state.publicPage=["home","solutions","products","promos","contact"].includes(page)?page:"home";
      state.publicMenu=false;state.publicProductId=null;state.publicSourceId=page==="products"?state.publicSourceId:null;state.form=null;state.modal=null;
      render();
    };
    const render = () => {
      if(state.surface==="public") {renderPublic();return;}
      if(state.surface==="login") {
        document.getElementById("root").innerHTML=`<main class="login-page"><div class="login-box"><div class="login-logo"><b>CMS</b> RMP</div><div class="login-card"><p>Sign in to start your session</p><div id="login-error" class="login-error">Please enter an email and password.</div><form id="login-form"><div class="login-field"><input name="email" type="email" aria-label="Email" value="admin@rmp.local" required><span>✉</span></div><div class="login-field"><input name="password" type="password" aria-label="Password" value="password123" required><span>●</span></div><div class="login-row"><button type="button" class="login-hint login-back" data-action="show-site">← Back to website</button><button class="btn btn-primary" type="submit">Sign In</button></div></form><div class="login-hint" style="margin-top:14px;text-align:center">Demo account is prefilled</div></div></div></main>`;
        return;
      }
      const page=labels[state.page]||labels.dashboard;
      const section=state.form?formPage():state.page==="dashboard"?dashboard():listPage();
      const productOpen=["sources","categories","products"].includes(state.page);
      const navHtml=nav.map(item=>{
        if(item.children) return `<div><a class="nav-link ${productOpen?"active":""}" data-action="toggle-product" href="#"><span class="nav-icon">${item.icon}</span><span>${item.name}</span><span class="nav-chevron">⌄</span></a><div class="nav-sub ${productOpen?"visible":""}">${item.children.map(child=>`<a class="nav-link ${state.page===child.id?"active":""}" data-page="${child.id}">${child.name}</a>`).join("")}</div></div>`;
        return `<a class="nav-link ${state.page===item.id?"active":""}" data-page="${item.id}"><span class="nav-icon">${item.icon}</span><span>${item.name}</span></a>`;
      }).join("");
      document.getElementById("root").innerHTML=`<div class="app"><header class="topbar"><a class="brand" href="#" data-page="dashboard"><b>CMS</b>&nbsp;RMP</a><button class="hamburger" data-action="toggle-sidebar" aria-label="Toggle navigation">☰</button><div class="top-actions"><div class="user-menu" id="user-menu"><button class="top-button" data-action="toggle-user">♙&nbsp; Admin &nbsp;⌄</button><div class="user-dropdown"><div style="padding:8px 9px 10px;border-bottom:1px solid #eee"><strong>Admin</strong><br><span class="muted">Administrator</span></div><button data-action="logout">Sign out</button></div></div></div></header>
        <aside class="sidebar ${state.sidebar?"open":""}"><div class="sidebar-label">MAIN NAVIGATION</div>${navHtml}</aside><div class="mobile-shade ${state.sidebar?"visible":""}" data-action="toggle-sidebar"></div>
        <main class="main"><section class="content-header"><h1>${page.title} <small>${page.sub}</small></h1><ol class="breadcrumb"><li>CMS</li><li>${page.crumb}</li></ol></section><section class="content">${section}</section><footer class="footer">© Copyright <strong>PT Royal Mitra Persada</strong>. All Rights Reserved <span>Version 1.0</span></footer></main>${modal()}</div>`;
    };
    const go = page => { state.surface="cms";state.page=labels[page]?page:"dashboard";state.form=null;state.search="";state.modal=null;state.sidebar=false;render(); };
    const addRecord = type => { state.page=type;state.search="";state.form={type,id:null};render(); };
    const editRecord = (type,id) => { state.page=type;state.form={type,id:Number(id)};render(); };
    const deleteRecord = (type,id) => {
      const item=data[type].find(record=>record.id===Number(id));
      if(!item) return;
      if(type==="sources"&&(data.categories.some(record=>record.sourceId===item.id)||data.products.some(record=>record.sourceId===item.id))){notify("This source is in use. Remove its categories and products first.",true);return;}
      if(type==="categories"&&data.products.some(record=>record.categoryId===item.id)){notify("This category is in use by a product. Reassign or delete that product first.",true);return;}
      if(!confirm(`Delete "${item.name||item.title}"? This cannot be undone.`)) return;
      data[type]=data[type].filter(record=>record.id!==Number(id));
      if(persist()){render();notify("Record deleted.");}
    };
    const slugify = value => value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const readImage = file => new Promise((resolve,reject)=>{
      if(file.size>2*1024*1024){reject(new Error("Images must be 2 MB or smaller."));return;}
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error("The selected image could not be read."));
      reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error("The selected file is not a valid image."));image.onload=()=>{const scale=Math.min(1,1000/image.width,800/image.height);const canvas=document.createElement("canvas");canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78));};image.src=reader.result;};
      reader.readAsDataURL(file);
    });
    const saveForm = async form => {
      const type=form.dataset.type,id=Number(form.dataset.id)||null,fd=new FormData(form);
      const record=id?data[type].find(item=>item.id===id):{};
      const values=Object.fromEntries(fd.entries());
      if(type==="products"&&!data.categories.some(item=>item.id===Number(values.categoryId)&&item.sourceId===Number(values.sourceId))){notify("Choose a category belonging to the selected source.",true);return;}
      const updated={...record};
      if(type==="sources") Object.assign(updated,{name:values.name,slug:values.slug||slugify(values.name),description:values.description});
      if(type==="categories") Object.assign(updated,{name:values.name,sourceId:Number(values.sourceId)});
      if(type==="products") Object.assign(updated,{name:values.name,slug:values.slug||slugify(values.name),price:Number(values.price),sourceId:Number(values.sourceId),categoryId:Number(values.categoryId),description:values.description,advantages:fd.getAll("advantages[]").filter(Boolean),features:fd.getAll("features[]").filter(Boolean),characteristics:fd.getAll("characteristics[]").filter(Boolean)});
      if(type==="promos") Object.assign(updated,{name:values.name,description:values.description});
      if(type==="banners") Object.assign(updated,{title:values.title,redirectUrl:values.redirectUrl,description:values.description});
      const upload=form.querySelector('input[type="file"]');
      try {
        if(upload?.files?.[0]) updated.cover=await readImage(upload.files[0]);
        else updated.cover=values.currentCover||updated.cover||"";
      } catch(error) { notify(error.message,true);return; }
      if(!id) updated.id=Math.max(0,...data[type].map(item=>item.id))+1;
      if(id) data[type]=data[type].map(item=>item.id===id?updated:item);
      else data[type].unshift(updated);
      if(persist()){state.form=null;state.search="";render();notify(id?"Record updated.":"Record added.");}
    };
    document.addEventListener("click",event=>{
      const publicLink=event.target.closest("[data-public]");
      if(publicLink){event.preventDefault();goPublic(publicLink.dataset.public);return;}
      const pageLink=event.target.closest("[data-page]");
      if(pageLink){event.preventDefault();go(pageLink.dataset.page);return;}
      const action=event.target.closest("[data-action]");
      if(!action) return;
      const kind=action.dataset.action;
      if(kind==="show-login"){state.surface="login";state.publicMenu=false;render();return;}
      if(kind==="show-site"){goPublic("home");return;}
      if(kind==="toggle-site-menu"){state.publicMenu=!state.publicMenu;render();return;}
      if(kind==="next-slide"){state.slide=(state.slide+1)%Math.max(data.banners.length,1);render();return;}
      if(kind==="prev-slide"){state.slide=(state.slide-1+Math.max(data.banners.length,1))%Math.max(data.banners.length,1);render();return;}
      if(kind==="filter-source"){state.publicSourceId=action.dataset.id?Number(action.dataset.id):null;renderPublic();return;}
      if(kind==="browse-source"){state.publicSourceId=Number(action.dataset.id);state.publicPage="products";renderPublic();return;}
      if(kind==="open-public-product"){state.publicProductId=Number(action.dataset.id);state.publicPage="product-detail";window.scrollTo(0,0);renderPublic();return;}
      if(kind==="toggle-product"){event.preventDefault();action.nextElementSibling?.classList.toggle("visible");}
      if(kind==="toggle-sidebar"){state.sidebar=!state.sidebar;render();}
      if(kind==="toggle-user")document.getElementById("user-menu")?.classList.toggle("open");
      if(kind==="logout"){localStorage.removeItem(SESSION);state.form=null;goPublic("home");}
      if(kind==="add")addRecord(action.dataset.type);
      if(kind==="edit")editRecord(action.dataset.type,action.dataset.id);
      if(kind==="delete")deleteRecord(action.dataset.type,action.dataset.id);
      if(kind==="cancel-form")go(state.page);
      if(kind==="add-repeat"){const box=document.querySelector(`[data-repeater="${action.dataset.name}"]`);if(box){const row=document.createElement("div");row.className="repeater-row";row.innerHTML=`<input class="control" name="${esc(action.dataset.name)}[]" required><button class="btn btn-danger btn-small" type="button" data-action="remove-repeat" aria-label="Remove item">×</button>`;box.append(row);row.querySelector("input").focus();}}
      if(kind==="remove-repeat"){const box=action.closest(".repeater");if(box?.children.length>1)action.closest(".repeater-row").remove();else notify("Keep at least one item.",true);}
      if(kind==="view-contact"){state.modal={id:Number(action.dataset.id)};render();}
      if(kind==="close-modal"&&(event.target===action||action.classList.contains("modal-backdrop"))){state.modal=null;render();}
    });
    document.addEventListener("input",event=>{
      if(event.target.matches("[data-search]")){state.search=event.target.value;const cursor=event.target.selectionStart;render();const search=document.querySelector("[data-search]");search?.focus();search?.setSelectionRange(cursor,cursor);}
    });
    document.addEventListener("change",event=>{
      if(event.target.name==="sourceId"&&state.form?.type==="products"){
        const select=document.getElementById("categoryId");
        const categories=data.categories.filter(item=>item.sourceId===Number(event.target.value));
        select.innerHTML=categories.map(item=>`<option value="${item.id}">${esc(item.name)}</option>`).join("");
        if(!categories.length)select.innerHTML='<option value="">Add a category for this source first</option>';
      }
    });
    document.addEventListener("submit",event=>{
      if(event.target.id==="login-form"){
        event.preventDefault();
        const values=new FormData(event.target);
        if(!values.get("email")||!values.get("password")){document.getElementById("login-error").style.display="block";return;}
        localStorage.setItem(SESSION,"yes");go("dashboard");return;
      }
      if(event.target.id==="public-contact-form"){
        event.preventDefault();
        const values=Object.fromEntries(new FormData(event.target).entries());
        data.contacts.unshift({id:Math.max(0,...data.contacts.map(item=>item.id))+1,name:values.name,company:values.company,email:values.email,phone:values.phone,product:values.product,comment:values.comment,created:new Date().toISOString().slice(0,10)});
        if(persist()){event.target.reset();notify("Request saved locally. Our demo inbox has been updated.");}
        return;
      }
      if(event.target.id==="record-form"){event.preventDefault();saveForm(event.target);}
    });
    render();
  })();
  </script>
</body>
</html>
