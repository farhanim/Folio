        .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.4; }
        .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

        .sp-primary { color: #0471ee; background: #e7f1ff; } .sp-info { color: #0b8fb0; background: #e2f6fb; }
        .sp-warning { color: #b86e00; background: #fff3dc; } .sp-success { color: #138a4b; background: #e3f6ec; }
        .sp-danger { color: #d93a44; background: #fdeced; } .sp-secondary { color: #6c7a91; background: #eef1f6; }

        /* info rows (label / value) */

        .info-value { color: var(--sl-ink); font-weight: 500; font-size: 14px; word-break: break-word; }

        /* stat / KPI cards */
        .stat-row { margin-bottom: 8px; }
        .stat-row > div { margin-bottom: 16px; }

        .stat-card.active { border-color: var(--sl-primary); box-shadow: 0 0 0 3px rgba(4, 113, 238, .12); }

        .kpi-label { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--sl-muted); font-weight: 600; }
        .kpi-value { font-size: 28px; font-weight: 700; color: var(--sl-ink); margin: 8px 0 4px; letter-spacing: -.02em; }
        .kpi-sub { font-size: 12.5px; color: var(--sl-muted); }
        .kpi-sub b { color: #138a4b; }

        /* bars */
        .bar { height: 8px; background: #edf2f8; border-radius: 99px; overflow: hidden; display: flex; }
        .bar > span { display: block; height: 100%; }
        .bar-row { margin-bottom: 16px; } .bar-row:last-child { margin-bottom: 0; }
        .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--sl-ink); }

        .bg-p { background: #0471ee; } .bg-i { background: #22b8d6; } .bg-w { background: #f5a524; } .bg-s { background: #22b46b; } .bg-d { background: #ef5a62; }
        .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--sl-muted); }
        .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }

        /* stepper */
        .stepper { display: flex; align-items: flex-start; overflow-x: auto; padding: 4px 2px 2px; }
        .step { flex: 1; min-width: 104px; text-align: center; position: relative; }
        .step::before { content: ''; position: absolute; top: 15px; left: -50%; width: 100%; height: 2px; background: #e1e8f2; z-index: 0; }
        .step:first-child::before { display: none; }
        .step.done::before, .step.current::before { background: var(--sl-primary); }
        .step.rejected::before { background: #ef5a62; }
        .step-dot { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid #d6e0ec; color: #9aa8bd; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; position: relative; z-index: 1; }

        .step.rejected .step-dot { background: #ef5a62; border-color: #ef5a62; color: #fff; }
        .step-label { font-size: 12px; margin-top: 8px; color: var(--sl-muted); padding: 0 4px; line-height: 1.3; }
        .step.done .step-label, .step.current .step-label { color: var(--sl-ink); font-weight: 600; }

        .tl { list-style: none; margin: 0; padding: 0; }
        .tl-item { position: relative; padding: 0 0 18px 26px; }
        .tl-item::before { content: ''; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: #e6edf6; }
        .tl-item:last-child { padding-bottom: 0; } .tl-item:last-child::before { display: none; }
        .tl-dot { position: absolute; left: 0; top: 3px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #d6e0ec; }
        .tl-dot.sp-primary { background: #0471ee; } .tl-dot.sp-info { background: #22b8d6; } .tl-dot.sp-warning { background: #f5a524; } .tl-dot.sp-success { background: #22b46b; } .tl-dot.sp-danger { background: #ef5a62; } .tl-dot.sp-secondary { background: #9aa8bd; }

        .tl-desc { font-size: 12.5px; color: #4b5a73; margin-top: 3px; background: var(--sl-soft); border-radius: 6px; padding: 6px 9px; }

        /* summary list */
        .sum-list { list-style: none; margin: 0; padding: 0; }
        .sum-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--sl-border); font-size: 13.5px; }

        .sum-list li span:last-child { color: var(--sl-ink); font-weight: 500; text-align: right; }

        /* task / activity list */
        .task-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--sl-border); color: inherit; }
        .task-item:hover { text-decoration: none; background: #fafcff; }
        .task-item:last-child { border-bottom: 0; }
        .task-ic { width: 34px; height: 34px; border-radius: 9px; background: #e7f1ff; color: #0471ee; display: flex; align-items: center; justify-content: center; flex: none; }
        .task-ic svg { width: 16px; height: 16px; }
        .task-main { flex: 1; min-width: 0; }

        .asset-thumb { height: 150px; border-radius: 10px; background: linear-gradient(135deg, #eaf3ff, #f7fbff); border: 1px solid var(--sl-border); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--sl-primary); gap: 10px; }
        .asset-thumb svg { width: 46px; height: 46px; stroke-width: 1.4; }

    const pad = (n, l = 2) => String(n).padStart(l, '0');

    function daysFromNow(n, h = 9) { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h, 0, 0, 0); return toIso(d); }

    // PHP-like date() formatter: d F M Y m H i s
    function fmt(s, f = 'd F Y H:i:s') {
        const d = parseDate(s); if (!d) return '-';

            d: pad(d.getDate()), F: MONTHS[d.getMonth()], M: MONTHS[d.getMonth()].slice(0, 3), Y: d.getFullYear(),

    const sel = (a, b) => (String(a) === String(b) ? 'selected' : '');

    const DB_KEY = 'silma_prototype_db_v2';
    let DB = null;
    function save() { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch (e) { /* storage unavailable: keep in memory */ } }

    const position = (id) => byId(DB.positions, id);
    const me = () => byId(DB.users, DB.session && DB.session.userId);

    // Laravel-like paginator (10 per page) rendered as bootstrap pagination
    function paginate(rows, per = 10) {
        const q = Router.query(); const total = rows.length; const pages = Math.max(1, Math.ceil(total / per));
        const cur = Math.min(Math.max(1, parseInt(q.page || 1, 10)), pages);
        const slice = rows.slice((cur - 1) * per, cur * per);
        let html = '';
        if (pages > 1) {
            const link = (p) => { const qq = Object.assign({}, q, { page: p }); return '#/' + Router.path() + '?' + $.param(qq); };
            html = `<nav><ul class="pagination" role="navigation">
                <li class="page-item ${cur === 1 ? 'disabled' : ''}"><a class="page-link" href="${link(cur - 1)}">&lsaquo;</a></li>
                ${Array.from({ length: pages }, (_, i) => `<li class="page-item ${i + 1 === cur ? 'active' : ''}"><a class="page-link" href="${link(i + 1)}">${i + 1}</a></li>`).join('')}
                <li class="page-item ${cur === pages ? 'disabled' : ''}"><a class="page-link" href="${link(cur + 1)}">&rsaquo;</a></li>
            </ul></nav>`;
        }
        return { rows: slice, html, offset: (cur - 1) * per };
    }

    // same matching rule as dist/js/sidebarmenu.js, but against the hash route
    function markSidebarActive() {
        const path = Router.path();
        $('#sidebarnav a').removeClass('active'); $('#sidebarnav li').removeClass('selected active'); $('#sidebarnav ul').removeClass('in');
        let best = null, bestLen = -1;
        $('#sidebarnav a[href^="#/"]').each(function () {
            const p = this.getAttribute('href').slice(2);
            if ((path === p || path.startsWith(p + '/')) && p.length > bestLen) { best = this; bestLen = p.length; }
        });
        if (!best) return;
        const el = $(best);
        el.parentsUntil('.sidebar-nav').each(function () {
            if ($(this).is('li') && $(this).children('a').length !== 0) {
                $(this).children('a').addClass('active');
                $(this).parent('ul#sidebarnav').length === 0 ? $(this).addClass('active') : $(this).addClass('selected');
            } else if (!$(this).is('ul') && $(this).children('a').length === 0) {
                $(this).addClass('selected');
            } else if ($(this).is('ul')) {
                $(this).addClass('in');
            }
        });
        el.addClass('active');
    }

    // ------------------------------------------------------------------ header + notifications
    function timeSince(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        const steps = [[31536000, 'tahun'], [2592000, 'bulan'], [86400, 'hari'], [3600, 'jam'], [60, 'menit']];
        for (const [sec, label] of steps) { const v = seconds / sec; if (v > 1) return Math.floor(v) + ' ' + label; }
        return Math.max(0, Math.floor(seconds)) + ' detik';
    }

    <script>
    // ===================================================================
    // Request workflows: procurement_plan, direct_procurement, borrowing,
    // displacement + the follow-up requests created from "Daftar Barang"
    // ===================================================================
    const REQ = {
        procurement_plan: { table: 'procurementPlans', name: 'Rencana Pengadaan', prefix: 'RP', dataTitle: 'Data Rencana Pengadaan' },
        direct_procurement: { table: 'directProcurements', name: 'Pengadaan', prefix: 'PL', dataTitle: 'Data Pengadaan' },
        borrowing: { table: 'borrowings', name: 'Peminjaman', prefix: 'PJ', dataTitle: 'Data Peminjaman' },
        displacement: { table: 'displacements', name: 'Perpindahan', prefix: 'PP', dataTitle: 'Data Perpindahan' },
        procurement_complaint: { table: 'complaints', name: 'Komplain Pengadaan', prefix: 'KP', dataTitle: 'Data Komplain Pengadaan' },
        reversion: { table: 'reversions', name: 'Pengembalian', prefix: 'PG', dataTitle: 'Data Pengembalian' },
        lost_report: { table: 'lostReports', name: 'Laporan Kehilangan', prefix: 'LK', dataTitle: 'Data Laporan Kehilangan' },
        item_condition: { table: 'itemConditions', name: 'Perubahan Kondisi Barang', prefix: 'PK', dataTitle: 'Data Perubahan Kondisi Barang' }
    };
    const reqList = (mod) => DB[REQ[mod].table];
    function visibleRequests(mod) {
        const u = me();
        return reqList(mod).filter(r => u.role === ROLE_SA || r.user_id === u.id || r.admin_id === u.id || r.admin_bast_id === u.id)
            .sort((a, b) => b.created_at.localeCompare(a.created_at));
    }
    function applyFilters(rows) {
        const q = Router.query();
        if (q.s) rows = rows.filter(r => String(r.status) === String(q.s));
        if (q.u) rows = rows.filter(r => user(r.user_id).name.toLowerCase().includes(q.u.toLowerCase()));
        return rows;
    }
    function statusFilterForm(placeholder = 'Pencarian Nama Karyawan') {
        const q = Router.query(); const showSearch = isSA() || isAdmin();
        return `<form data-action="filter" class="form-std"><div class="row">
            <div class="col-md-3 col-sm-12 pb-2"><select name="s" class="custom-select"><option value="">Semua Status</option>
                ${STATUS_FILTER.map(([k, v]) => `<option value="${v}" ${sel(q.s, v)}>${k}</option>`).join('')}</select></div>
            ${showSearch ? `<div class="col-md-7 col-sm-12 pb-2 sm-2"><input type="text" class="form-control" name="u" placeholder="${placeholder}" value="${esc(q.u || '')}"></div>` : ''}
            <div class="col-md-2 col-sm-12 text-left pb-2"><button type="submit" class="btn btn-primary btn-w100 px-4">Cari</button></div>
        </div></form>`;
    }
    function rowActions(mod, r) {
        let h = `<a href="#/${mod}/view/${r.id}" class="btn btn-primary btn-sm">Detail</a>`;
        if (me().id === r.user_id && r.status === S.BARU) {
            h += `<a href="#/${mod}/edit/${r.id}" class="btn btn-info btn-sm mx-2"><i class="fa fa-edit"></i></a>
                  <a href="javascript:void(0)" data-confirm="Apakah anda yakin ingin menghapus data ini?" data-run="req.delete" data-mod="${mod}" data-id="${r.id}" class="btn btn-danger btn-sm"><i class="fa fa-trash"></i></a>`;
        }
        return `<td class="d-flex">${h}</td>`;
    }
    function listPage(mod, title, desc, headers, cells) {
        const all = visibleRequests(mod), filtered = applyFilters(all), p = paginate(filtered);
        const createLink = mod in { procurement_plan: 1, direct_procurement: 1, borrowing: 1, displacement: 1 } && !(mod === 'procurement_plan' && role() !== ROLE_UP) && !(mod === 'displacement' && !isAdmin())
            ? `<a href="#/${mod}/create" class="btn btn-primary btn-sm px-3"><i class="fa fa-plus mr-1"></i> Buat Pengajuan</a>` : '';
        return page({
            title, desc, body: statStrip(all) + card(`${sectionHead('list', title, `Menampilkan <b>${filtered.length}</b> dari ${all.length} pengajuan`, createLink)}
            <div class="mt-4">${statusFilterForm()}</div>
            <div class="table-responsive mt-3"><table class="table table-striped bg-gray">
                <thead><tr><th scope="col" style="width:52px">No</th>${headers.map(h => `<th scope="col">${h}</th>`).join('')}<th scope="col">Status</th><th scope="col">Aksi</th></tr></thead>
                <tbody>${p.rows.map((r, i) => `<tr><td class="text-muted">${p.offset + i + 1}</td>${cells(r)}<td>${statusSpan(r.status)}</td>${rowActions(mod, r)}</tr>`).join('') || emptyRow(headers.length + 3, 'Belum ada pengajuan yang sesuai filter')}</tbody>
            </table></div>${p.html}`)
        });
    }
    const descFor = (own, all) => isSA() ? all : own;

    function userDataCard(u) {
        return `<div class="card-header"><span class="font-weight-bold">Data User</span></div>
        <div class="card-body">${infoRow('Nama', esc(u.name))}${infoRow('User', esc(u.username))}${infoRow('NIP', esc(u.nip))}${infoRow('Email', esc(u.email))}
            ${infoRow('No. HP', esc(u.phone))}${infoRow('Layanan', esc((section(u.section_id) || {}).name || ''))}${infoRow('Sub-Layanan', esc((subSection(u.sub_section_id) || {}).name || ''))}</div>`;
    }
    function reasonRows(r) {
        const ok = (t) => `<span class="font-weight-bold">${esc(t)}</span>`, bad = (t) => `<span class="text-danger font-italic">${esc(t)}</span>`, good = (t) => `<span class="text-success font-italic">${esc(t)}</span>`;
        const m = {
            [S.TOLAK]: [['Alasan Ditolak', bad(r.information)]],
            [S.TERIMA]: r.information_superadmin ? [['Alasan Ditolak', ok(r.information)], ['Alasan Penolakan', ok(r.information_superadmin)]] : [['Alasan Diterima', ok(r.information)]],
            [S.TERIMA_PENERIMAAN]: [['Alasan Diterima', ok(r.information)], ['Alasan Penerimaan Diterima', ok(r.information_superadmin)]],
            [S.TOLAK_PENERIMAAN]: [['Alasan Diterima', good(r.information)], ['Alasan Penerimaan Ditolak', bad(r.information_superadmin)]],
            [S.TERIMA_PENOLAKAN]: [['Alasan Ditolak', bad(r.information)], ['Alasan Penolakan Diterima', bad(r.information_superadmin)]],
            [S.TOLAK_PENOLAKAN]: [['Alasan Ditolak', bad(r.information)], ['Alasan Penolakan Ditolak', good(r.information_superadmin)]],
            [S.SELESAI]: r.information_superadmin ? [['Alasan Selesai', `<span class="font-italic">${esc(r.information_superadmin)}</span>`]] : [],
            [S.SELESAI_TOLAK]: r.information_superadmin ? [['Alasan Selesai', `<span class="font-italic">${esc(r.information_superadmin)}</span>`]] : []
        };
        return (m[r.status] || []).map(([l, v]) => infoRow(l, v, 'mb-4')).join('');
    }
    // Buttons + modals that drive the status machine (shared by every request type)
    function workflow(mod, r) {
        const uid = me().id, sa = isSA(), dp = mod === 'direct_procurement';
        let h = '', modals = '';
        const form = (action, btn, extra = '') => `<form data-action="${action}" data-mod="${mod}" data-id="${r.id}" ${extra}>${btn}</form>`;
        if (sa && r.status === S.BARU && !r.admin_id) {
            h += `<div class="mb-4"><a href="#/${mod}/appoint_staff/${r.id}" class="btn btn-success btn-action"><i class="fa fa-hand-pointer fa-fw"></i> Tunjuk Admin</a></div>`;
        }
        if (uid === r.admin_id && r.status === S.TUNJUK_STAF) {
            h += `<div class="mb-4">${form('req.process', `<button type="submit" class="btn btn-success btn-action"><i class="fa fa-cogs fa-fw"></i> Proses</button>`)}</div>`;
        }
        if (uid === r.admin_id && r.status === S.PROSES) {
            h += `<div class="mb-4"><div class="row"><div class="col-sm-6">
                <button type="button" class="btn btn-success btn-action" data-toggle="modal" data-target="#successModal"><i class="fa fa-check fa-fw"></i> Terima</button>
                <button type="button" class="btn btn-danger btn-action" data-toggle="modal" data-target="#rejectModal"><i class="fa fa-times fa-fw"></i> Tolak</button>
            </div></div></div>`;
            modals += reasonModal('rejectModal', 'Alasan Penolakan', 'Alasan Ditolak:', `req.reject`, r.id) + reasonModal('successModal', 'Alasan Penerimaan', 'Alasan Diterima:', `req.accept`, r.id);
        }
        if (sa && r.status === S.TERIMA && !dp) {
            h += `<div class="mb-4"><div class="row"><div class="col-sm-6">
                <button type="button" class="btn btn-success btn-action" data-toggle="modal" data-target="#successAcceptedModal"><i class="fa fa-check fa-fw"></i> Terima Penerimaan</button>
                <button type="button" class="btn btn-danger btn-action" data-toggle="modal" data-target="#declineAcceptModal"><i class="fa fa-times fa-fw"></i> Tolak Penerimaan</button>
            </div></div></div>`;
            modals += reasonModal('successAcceptedModal', 'Alasan Penerimaan Diterima', 'Alasan Diterima:', 'req.success_accept', r.id) + reasonModal('declineAcceptModal', 'Alasan Tolak Penerimaan', 'Alasan Ditolak:', 'req.decline_accept', r.id);
        }
        if (sa && r.status === S.TOLAK) {
            h += `<div class="mb-4"><div class="row"><div class="col-sm-6">
                <button type="button" class="btn btn-success btn-action" data-toggle="modal" data-target="#successRejectModal"><i class="fa fa-check fa-fw"></i> Terima Penolakan</button>
                <button type="button" class="btn btn-danger btn-action" data-toggle="modal" data-target="#declineRejectModal"><i class="fa fa-times fa-fw"></i> Tolak Penolakan</button>
            </div></div></div>`;
            modals += reasonModal('successRejectModal', 'Alasan Terima Penolakan', 'Alasan Diterima:', 'req.success_reject', r.id) + reasonModal('declineRejectModal', 'Alasan Tolak Penolakan', 'Alasan ditolak:', 'req.decline_reject', r.id);
        }
        if (sa && [S.TERIMA_PENERIMAAN, S.TOLAK_PENOLAKAN].includes(r.status)) {
            h += form('req.done', `<button type="submit" class="btn btn-info btn-action mb-3"><i class="fa fa-check fa-fw"></i> Selesai</button>`);
        }
        if (sa && [S.TERIMA_PENOLAKAN, S.TOLAK_PENERIMAAN].includes(r.status)) {
            h += form('req.done_reject', `<button type="submit" class="btn btn-info btn-action"><i class="fa fa-check fa-fw"></i> Selesai Ditolak</button>`);
        }
        if (dp) { const b = bastSection(r); h += b.html; modals += b.modals; }
        // forms modals carry data-mod so the action knows which table to touch
        modals = modals.replace(/data-action="(req\.[a-z_]+|dp\.[a-z_]+)"/g, `data-action="$1" data-mod="${mod}"`);
        return { html: h, modals };
    }

            h += `<div class="mb-4">

                <button type="button" class="btn btn-danger btn-action" data-toggle="modal" data-target="#doneRejectModal"><i class="fa fa-times fa-fw"></i> Selesai Ditolak</button>
            </div></div></div>`;
            modals += reasonModal('doneAcceptedModal', 'Alasan Pengadaan Selesai', 'Alasan Diterima:', 'dp.done', r.id) + reasonModal('doneRejectModal', 'Alasan Pengadaan Selesai Ditolak:', 'Alasan Ditolak:', 'dp.done_reject', r.id);

    function listAssetPage() {
        const q = Router.query();
        let rows = DB.directProcurements.filter(r => isSA() || isAdmin() || r.user_id === me().id).sort((a, b) => b.datetime.localeCompare(a.datetime));
        if (q.tanggal_awal) rows = rows.filter(r => r.datetime.slice(0, 10) >= q.tanggal_awal);
        if (q.tanggal_akhir) rows = rows.filter(r => r.datetime.slice(0, 10) <= q.tanggal_akhir);
        if (q.no) rows = rows.filter(r => r.number.toLowerCase().includes(q.no.toLowerCase()));
        const open = (kind, r) => { const f = r.followups && r.followups[kind]; const rec = f && byId(reqList(kind), f); return rec && ![S.SELESAI, S.SELESAI_TOLAK].includes(rec.status) ? rec : null; };
        const btn = (kind, r, cls, icon, label, busyBadge) => {
            const rec = open(kind, r);
            if (rec) return `<a href="#/${kind}/view/${rec.id}" class="btn btn-sm ${cls} sm-2 btn-w100 btn-action mr-1" data-toggle="tooltip" data-placement="bottom" title="${label}"><i class="fa ${icon} fa-fw"></i> ${label}</a>`;
            const blocked = r.status !== S.SELESAI || r.user_id !== me().id || Object.keys(REQ).some(k => open(k, r));
            return blocked ? `<a href="javascript:void(0)" class="btn btn-sm btn-light sm-2 btn-w100 btn-action disabled mr-1" title="${label}"><i class="fa ${icon} fa-fw"></i> ${label}</a>`
                : `<a href="#/direct_procurement/${kind}/${r.id}" class="btn btn-sm ${cls} sm-2 btn-w100 btn-action mr-1" data-toggle="tooltip" data-placement="bottom" title="${label}"><i class="fa ${icon} fa-fw"></i> ${label}</a>`;
        };
        const badges = (r) => [['procurement_complaint', 'warning', 'Dalam Proses Komplain'], ['lost_report', 'danger', 'Dalam Proses Kehilangan'], ['reversion', 'primary', 'Dalam Proses Pengembalian'], ['item_condition', 'success', 'Dalam Proses Perubahan Kondisi']]
            .filter(([k]) => open(k, r)).map(([, c, t]) => `<h6 class="float-right m-2"><span class="badge badge-${c}">${t}</span></h6>`).join('');
        const cards = rows.map(r => { const a = asset(r.items[0].asset_id) || {}; return `<div class="card text-left">
            <div class="card-header">${fmt(r.datetime, 'd F Y')}</div>
            <div class="row no-gutters"><div class="col-md-3 p-4">${assetThumb(a)}</div>
                <div class="col-md-9"><div class="card-body">${badges(r)}
                    <h6 class="card-title">${esc(r.items[0].item_brand || a.MEREK_TIPE)}</h6>
                    <p class="card-subtitle mb-2 text-muted">Jenis Barang : ${esc(a.ur_baru)}</p>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Nomor Pengajuan : ${r.number}</li>
                        <li class="list-group-item">Nama Pengajuan : ${esc(user(r.user_id).name)}</li>
                        <li class="list-group-item">Jenis Pengajuan : Pengadaan</li>
                        <li class="list-group-item">Status Pengajuan : ${statusSpan(r.status)}</li>
                    </ul>
                    <div class="mt-3">
                        ${btn('procurement_complaint', r, 'btn-warning', 'fa-hand-paper', 'Komplain Pengadaan')}
                        ${btn('lost_report', r, 'btn-danger', 'fa-exclamation-triangle', 'Lapor Kehilangan')}
                        ${btn('reversion', r, 'btn-primary', 'fa-reply', 'Pengembalian')}
                        ${btn('item_condition', r, 'btn-success', 'fa-cube', 'Perubahan Kondisi')}
                    </div>
                </div></div></div>
            <div class="card-footer card-link text-right py-3"><a href="#/direct_procurement/view/${r.id}">Lihat detail pengadaan &nbsp; <i class="fa fa-chevron-right"></i></a></div>
        </div><br>`; }).join('');

                    if (t > now) t = new Date(now.getTime() - (path.length - i) * 47 * 60000);
                    const actor = st === 1 ? r.user_id : [3, 4, 5].includes(st) ? r.admin_id : st === 6 ? r.admin_bast_id : 1;
                    const desc = {
                        1: `${uname(r.user_id)} mengajukan ${name.toLowerCase()}`, 2: `Super Admin menunjuk ${uname(r.admin_id)} sebagai pelaksana`, 3: `${uname(r.admin_id)} mulai mengerjakan pengajuan`,
                        4: r.information || 'Pengajuan diterima', 5: r.information || 'Pengajuan ditolak', 9: `Menunjuk ${uname(r.admin_bast_id)} untuk proses BAST-PPK & BAST-User`, 6: 'BAST-PPK dan BAST-User telah diunggah',
                        10: r.information_superadmin, 11: r.information_superadmin, 12: r.information_superadmin, 13: r.information_superadmin, 8: r.information_superadmin || 'Pengajuan dinyatakan selesai', 14: r.information_superadmin || 'Pengajuan ditutup'
                    }[st];
                    logs.push({ id: 0, submission_type: name, submission_number: r.number, action: STEP_LABEL[st], status: st, description: desc || STATUS_VIEW[st][1], user_id: actor || 1, created_at: toIso(t) });
                });
            });
        });
        db.kibField.filter(k => k.status === S.SELESAI).forEach(k => logs.push({ id: 0, submission_type: 'KIB', submission_number: k.number, action: 'Isi KIB', status: 8, description: 'Pengisian kartu identitas barang', user_id: k.admin_id, created_at: k.tanggal_proses }));
        db.pspField.filter(k => k.status === S.SELESAI).forEach(k => logs.push({ id: 0, submission_type: 'PSP', submission_number: k.number, action: 'Pengajuan PSP', status: 8, description: `Pengajuan PSP untuk ${k.asset_ids.length} barang`, user_id: k.admin_id, created_at: k.tanggal_pengerjaan }));
        db.wasdal.filter(w => w.status === S.SELESAI).forEach(w => logs.push({ id: 0, submission_type: 'Wasdal', submission_number: w.number, action: 'Unggah Dokumen', status: 8, description: w.instruction, user_id: w.uploader_id, created_at: addDays(w.created_at, 2) }));
        logs.sort((a, b) => b.created_at.localeCompare(a.created_at)).forEach((l, i) => { l.id = i + 1; });
        return logs;
    }
    const ACTION_COLOR = { 'Proses': 'warning', 'Baru': 'primary', 'Tunjuk Staf': 'info', 'Diterima': 'success', 'Ditolak': 'danger', 'Selesai': 'success', 'Selesai Ditolak': 'secondary' };
    function logColor(l) {
        if (l.status && STATUS_VIEW[l.status]) return l.status === 1 ? 'primary' : STATUS_VIEW[l.status][0];
        const v = Object.values(STATUS_VIEW).find(x => x[1] === l.action);
        return ACTION_COLOR[l.action] || (v ? v[0] : 'primary');
    }
    function timeline(number) {
        const logs = DB.logActivity.filter(l => l.submission_number === number).sort((a, b) => a.created_at.localeCompare(b.created_at));
        if (!logs.length) return emptyState('Belum ada riwayat proses', 'clock');
        return `<ul class="tl">${logs.map(l => `<li class="tl-item"><span class="tl-dot sp-${logColor(l)}"></span>
            <div class="tl-title">${esc(l.action)}</div><div class="tl-meta">${esc(user(l.user_id).name)} · ${fmt(l.created_at, 'd M Y, H:i')}</div>
            ${l.description ? `<div class="tl-desc">${esc(l.description)}</div>` : ''}</li>`).join('')}</ul>`;
    }
    function stepper(mod, r) {
        const path = statusPath(mod, r.status), last = path[path.length - 1];
        const dp = mod === 'direct_procurement', rejected = path.includes(S.TOLAK);
        const nominal = dp ? (rejected ? [1, 2, 3, 5, 14] : [1, 2, 3, 4, 9, 6, 8]) : (rejected ? [1, 2, 3, 5, 12, 14] : [1, 2, 3, 4, 10, 8]);
        const idx = nominal.indexOf(last);
        const rest = [S.SELESAI, S.SELESAI_TOLAK].includes(last) ? [] : idx >= 0 ? nominal.slice(idx + 1) : ([11, 12].includes(last) ? [14] : [8]);
        const final = [S.SELESAI, S.SELESAI_TOLAK].includes(last);
        const steps = path.map((s, i) => ({ s, state: i < path.length - 1 || final ? 'done' : 'current' })).concat(rest.map(s => ({ s, state: 'todo' })));
        return `<div class="stepper">${steps.map((x, i) => {
            const bad = x.state !== 'todo' && [5, 11, 14].includes(x.s);
            return `<div class="step ${bad ? 'rejected' : x.state}"><span class="step-dot">${x.state === 'done' ? (bad ? '<i data-feather="x"></i>' : '<i data-feather="check"></i>') : i + 1}</span><div class="step-label">${STEP_LABEL[x.s]}</div></div>`;
        }).join('')}</div>`;
    }
    function requestSummary(mod, r) {
        const logs = DB.logActivity.filter(l => l.submission_number === r.number).sort((a, b) => b.created_at.localeCompare(a.created_at));
        const days = Math.max(0, Math.round((new Date() - parseDate(r.created_at)) / 86400000));

    const statCard = (icon, color, value, label, href, active) => `<div class="col-6 col-md"><${href ? `a href="${href}"` : 'div'} class="stat-card ${active ? 'active' : ''}">

        'instr.save'(d, $f) {
            const id = $f.data('id'), patch = { admin_id: +d.admin_id, description: d.description, items: arr(d.ids).map(Number) };
            if (id) Object.assign(byId(DB.instructions, id), patch); else DB.instructions.push(Object.assign({ id: nextId(DB.instructions), user_id: me().id, status: S.BARU, created_at: nowIso() }, patch));
            notify(patch.admin_id, 'Instruksi', 'Anda mendapat instruksi baru', '#/instruction'); save(); flash('Instruksi berhasil disimpan'); Router.go('instruction');
        },
        'instr.status'(d, $f) { const r = byId(DB.instructions, $f.data('id')); r.status = +$f.data('status'); logActivity('Instruksi', 'INS-' + pad(r.id, 4), STATUS_VIEW[r.status][1], r.description); notify(r.user_id, 'Instruksi', `Instruksi ${STATUS_VIEW[r.status][1].toLowerCase()} oleh ${me().name}`, `#/instruction/view/${r.id}`); save(); flash('Status instruksi diperbarui'); Router.go('instruction/view/' + r.id); },

        // ---- Master asset
        'asset.create'(d) {
            const kd = d.KDBRG_BASE;
            if (DB.assets.some(a => a.KDBRG === kd && String(a.NUP) === String(d.NUP))) return toastr.error('Kode barang dan NUP sudah terdaftar');
            const rm = room(d.kd_ruang);
            DB.assets.push({ id: nextId(DB.assets), KDBRG: kd, NUP: +d.NUP, NAMA_BRNG: d.NAMA_BRNG, MEREK_TIPE: d.MEREK_TIPE, TGL_OLEH: d.TGL_OLEH, KOND: +d.KOND, MASA_MANFAAT: +d.MM, kd_ruang: rm.kd_ruang, pengguna_id: rm.pengguna_id, kib_id: null, psp_id: null, NA: +d.NA, ur_baru: d.NAMA_BRNG });
            save(); flash('Data barang berhasil ditambahkan'); Router.go('master-asset/asset');
        },
        'settings.save'(d) { DB.settings = { start_month: d.start_month, end_month: d.end_month }; save(); flash('Pengaturan berhasil disimpan'); render(); },
        'settingApp.save'(d) { Object.assign(DB.settingApp, d); save(); flash('Pengaturan berhasil disimpan'); render(); }
    };
    function userPatch(d) {
        return { name: d.name, username: `${d.user}.${d.abbreviation}`, email: d.email, phone: d.phone, nip: d.nip, role: d.role, section_id: +d.section_id, sub_section_id: +d.sub_section_id || null, position_id: +d.position || null };
    }
    function normDT(v) { return v && v.length <= 16 ? v.replace('T', ' ') + ':00' : v; }
    function fileName($f, name) { const el = $f.find(`[name=${name}]`)[0]; return el && el.files && el.files[0] ? el.files[0].name : name + '.pdf'; }
    function archivePatch(d, $f) { return { letter_no: d.letter_no, letter_date: d.letter_date, bantex_code: d.bantex_code, order: d.order, doc: fileName($f, 'doc'), uploader_id: me().id, status: S.SELESAI }; }
    function saveRequest(mod, id, patch) {
        const list = reqList(mod);
        if (id) { Object.assign(byId(list, id), patch); save(); flash('Pengajuan berhasil diperbarui'); return Router.go(`${mod}/view/${id}`); }
        const r = Object.assign({ id: nextId(list), number: regNumber(REQ[mod].prefix, list), user_id: me().id, status: S.BARU, admin_id: null, created_at: nowIso() }, patch);
        list.push(r);
        logActivity(REQ[mod].name, r.number, 'Baru', `Pengajuan ${REQ[mod].name.toLowerCase()} ${r.number}`);
        notify(superAdmins(), REQ[mod].name, `Pengajuan ${REQ[mod].name.toLowerCase()} baru ${r.number} dari ${me().name}`, `#/${mod}/view/${r.id}`);
        save(); flash('Pengajuan berhasil dikirim'); Router.go(mod);
    }

    // click handlers for links/buttons (data-run)
    const RUN = {
        'req.delete'($e) { const mod = $e.data('mod'); DB[REQ[mod].table] = reqList(mod).filter(r => String(r.id) !== String($e.data('id'))); save(); flash('Data berhasil dihapus'); Router.go(mod); },
        'itb.delete'($e) { DB.itemToBorrow = DB.itemToBorrow.filter(r => String(r.id) !== String($e.data('id'))); save(); flash('Data berhasil dihapus'); Router.go('item_to_borrow'); },
        'instr.delete'($e) { DB.instructions = DB.instructions.filter(r => String(r.id) !== String($e.data('id'))); save(); flash('Data berhasil dihapus'); Router.go('instruction'); },
        'user.delete'($e) { DB.users = DB.users.filter(u => String(u.id) !== String($e.data('id'))); save(); flash('Pengguna berhasil dihapus'); Router.go('user'); },
        'user.activate'($e) { const u = byId(DB.users, $e.data('id')); u.active = true; save(); flash(`Pengguna ${u.name} berhasil diaktifkan`); render(); },
        'asset.delete'($e) { DB.assets = DB.assets.filter(a => String(a.id) !== String($e.data('id'))); save(); flash('Data barang berhasil dihapus'); render(); },
        file($e) { fileDoc($e.data('name')); },
        'dp.print'($e) { printBast(byId(DB.directProcurements, $e.data('id')), $e.data('doc')); },
        'ds.dbr'($e) { printDbr(byId(DB.displacements, $e.data('id')), String($e.data('n'))); },
        'kib.pdf'($e) { kibDoc($e.data('id')); },
        'psp.doc'($e) { pspDoc(byId(DB.pspField, $e.data('id')), $e.data('doc')); },
        'bast.print'($e) { printBastPenghapusan(byId(DB.penghapusanBast, $e.data('id'))); },
        'print.assets'($e) { openDoc($e.data('title'), `<h3>${esc($e.data('title')).toUpperCase()}</h3>${assetTableDoc(DB.assets.map(a => a.id))}`); },
        'print.list'($e) { const t = $($e.data('target')).clone(); t.find('a,button').remove(); openDoc($e.data('title'), `<h3>${esc($e.data('title')).toUpperCase()}</h3>` + t.removeClass().prop('outerHTML')); },
        'log.export'() {
            const rows = [['No', 'Jenis Pengajuan', 'Nomor Pengajuan', 'Aksi', 'Deskripsi', 'User', 'Tanggal']].concat(logRows().map((l, i) => [i + 1, l.submission_type, l.submission_number, l.action, l.description, user(l.user_id).name, l.created_at]));
            const blob = new Blob([rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'log_activity.csv'; a.click();
        }
    };

    // ===================================================================
    // Global event wiring
    // ===================================================================
    $(document).on('submit', 'form[data-action]', function (e) {
        e.preventDefault();
        const $f = $(this), fn = ACTIONS[$f.data('action')];
        if (!fn) return;
        if (this.checkValidity && !this.checkValidity()) { this.reportValidity(); return; }
        startLoading();
        setTimeout(() => { try { fn(formData($f), $f, e); } finally { setTimeout(stopLoading, 200); } }, 150);
    });
    $(document).on('click', '[data-run]', function (e) {
        e.preventDefault();
        const $e = $(this), msg = $e.data('confirm');
        if (msg && !confirm(msg)) return;
        RUN[$e.data('run')] && RUN[$e.data('run')]($e);
    });
    $(document).on('change', '.custom-file-input', function () { $(this).next('.custom-file-label').html(this.value.split('\\').pop() || 'Pilih file'); });
    $(document).on('change', '.js-section', function () {
        const subs = DB.subSections.filter(s => String(s.section_id) === this.value);
        $('#sub_section_id').prop('disabled', false).html('<option value="" selected disabled>Pilih Sub-Layanan</option>' + subs.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join(''));
    });
    $(document).on('change', '.js-pengguna', function () { $('#nip').val($(this).find(':selected').data('nip') || ''); });
    $(document).on('change', '.js-select-all', function () { $(this).closest('table').find('tbody input[type=checkbox]:visible').prop('checked', this.checked); });
    $(document).on('keyup', '.js-table-search', function () { const v = this.value.toLowerCase(); $($(this).data('target')).find('tbody tr').each(function () { $(this).toggle($(this).text().toLowerCase().includes(v)); }); });
    // direct procurement form: plan number vs nota dinas
    $(document).on('change', 'input[name=type_direct]', function () {
        const plan = this.value === '1';
        $('.show-nomor, #add-item').toggleClass('d-none', !plan); $('#show-nota, #add-item2').toggleClass('d-none', plan);
        $('.spesific, .peruntukan').prop('readonly', plan); if (!plan) $('.peruntukan').val(me().name);
    });
    $(document).on('change', '.procurement_plan', function () {
        const p = byId(DB.procurementPlans, this.value); if (!p) return; const a = asset(p.items[0].asset_id);
        $('#kode_barang').text(a.KDBRG); $('#nama_barang').text(a.NAMA_BRNG); $('#item_year_1').val(p.items[0].item_year);
        $('.peruntukan').val(p.allotment); $('.spesific').val(p.minimal_spec);
    });
    $(document).on('input change', '#item_year_1, #item_year_2', function () { $('input[name=item_year]').val(this.value); });
    $(document).on('change', '.js-from-room', function () { $('#ds-items tbody').html(dsItemRows(this.value)); $('#room-items').removeClass('d-none'); });
    $(document).on('click', '#CreateRoom', function () { if (!$('#ds-items tbody input:checked').length) return toastr.error('Pilih barang yang akan dipindahkan'); $('#room-target').removeClass('d-none'); });
    $(document).on('click', '#add-multiple-image', function (e) { e.preventDefault(); $('#add-image').append('<input type="file" name="image[]" class="form-control-file mt-2">'); });
    $(document).on('change', '.js-del-stage', function () { Router.go(Router.path() + '?instruction=' + encodeURIComponent(this.value)); });
    $(document).on('change', '.js-sto-floor', function () { Router.go('inventory/stock-opname/create?floor=' + this.value); });
    $(document).on('change', '.js-found', function () { $('.kib-found').toggle(this.value === 'found'); });
    $(document).on('change', '.js-subkel', function () { $('#kd-sub-kelompok').val(this.value); $('#nama-barang').val($(this).find(':selected').data('name')); });
    $(document).on('click', '.sample-code', function () {
        const code = $(this).data('code'); $('#scanModal').modal('hide');
        if (Router.path().startsWith('inventory/stock-opname/opname')) {
            const a = findByCode(code), sel_ = a && $(`select[name=st_${a.id}]`);
            if (sel_ && sel_.length) { sel_.val('1'); toastr.success(`${a.NAMA_BRNG} (${code}) ditemukan`); } else toastr.error('Barang tidak terdaftar pada ruangan ini');
        } else Router.go('inventory/scan?u=' + encodeURIComponent(code));
    });
    $(document).on('click', '#putar_video', function () { $('#video_content').html('Video Tidak Tersedia'); });
    $(document).on('click', '.close_video', function (e) { e.preventDefault(); $('#video_content').empty(); $('#onboarding').modal('hide'); });
    // sidebar accordion (behaviour of dist/js/sidebarmenu.js on dynamic markup)
    $(document).on('click', '#sidebarnav a', function (e) {
        const $a = $(this);
        if ($a.hasClass('has-arrow')) e.preventDefault();
        if (!$a.hasClass('active')) {
            $('ul', $a.parents('ul:first')).removeClass('in'); $('a', $a.parents('ul:first')).removeClass('active');
            $a.next('ul').addClass('in'); $a.addClass('active');
        } else if ($a.hasClass('has-arrow')) {
            $a.removeClass('active'); $a.parents('ul:first').removeClass('active'); $a.next('ul').removeClass('in');
        }
    });

    // ===================================================================
    // Public helpers + boot
    // ===================================================================
    window.App = {
        switchUser(id) { DB.session = { userId: id }; save(); flash(`Masuk sebagai ${user(id).name} (${user(id).role})`); Router.go('dashboard'); },
        resetDemo() { if (!confirm('Kembalikan semua data demo ke kondisi awal?')) return; const s = DB.session; DB = seed(); DB.session = s; save(); flash('Data demo berhasil direset'); render(); },
        fillLogin(id) { const u = user(id); $('#inlineFormInputGroup').val(u.email); $('#id_password').val('password'); },
        readNotif(id) { const n = byId(DB.notifications, id); n.notif_status = 3; save(); if (n.link) location.hash = n.link; else renderNotifications(); }
    };
    window.startLoading = startLoading; window.stopLoading = stopLoading;

    DB = load() || seed(); save();
    window.addEventListener('hashchange', render);
    $(function () {
        toastr.options = { positionClass: 'toast-top-center' };
        $('.message-center, .scroll-sidebar').perfectScrollbar({ wheelPropagation: true });
        $('.nav-toggler').on('click', function () { $('#main-wrapper').toggleClass('show-sidebar'); $('.nav-toggler i').toggleClass('ti-menu'); });
        render();
    });
    </script>
</body>

</html>
